<script>
// 在页面绘制前套用保存的深浅色和字号，避免深色模式下先闪一下浅色。
(function () {
  var root = document.documentElement;
  try {
    var prefs = JSON.parse(localStorage.getItem('g1-preferences') || '{}') || {};
    var theme = prefs.theme === 'light' || prefs.theme === 'dark' ? prefs.theme : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    root.setAttribute('data-theme', theme);
    if (prefs.font === 'large') root.setAttribute('data-font', 'large');
  } catch (e) { root.setAttribute('data-theme', 'light'); }
})();
</script>
