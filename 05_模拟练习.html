stion_zh":"哪一种信号表示行人「不得」开始过街？","options":[{"en":"A white walking symbol","zh":"白色行走人形图案"},{"en":"A flashing or steady orange hand symbol","zh":"闪烁或常亮的橙色手形图案"},{"en":"A white vertical bar on a dark background","zh":"深色底上的白色竖条"},{"en":"A steady green light where there are no pedestrian signals","zh":"在没有行人信号的路口，常亮的绿灯"}],"answer_index":1,"explanation_zh":"行人通行信号是白色行走人形图案；闪烁或常亮的橙色手形图案表示行人不得开始过街。","explanation_en":"A flashing or steady orange hand means pedestrians must not begin to cross.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/pedestrian-signals","source_title":"MTO 手册 · Pedestrian signals","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"SD-26","group":"SD","section":"signs","topic_zh":"行人过街规则","question_en":"At an intersection with traffic lights but no pedestrian signals, when may a pedestrian start to cross?","question_zh":"在有交通信号灯但没有行人信号的路口，行人什么时候可以开始过街？","options":[{"en":"When facing a flashing green light","zh":"面对闪烁绿灯时"},{"en":"When facing a left-turn green arrow","zh":"面对左转绿色箭头时"},{"en":"When facing a steady green light","zh":"面对常亮的绿灯时"},{"en":"When facing a yellow light, if no cars are close","zh":"面对黄灯且附近没有车辆时"}],"answer_index":2,"explanation_zh":"没有行人信号时，面对绿灯的行人可以过街；但不能在闪烁绿灯或左转绿色箭头时过街。","explanation_en":"Without pedestrian signals, pedestrians may cross on a green light, but not on a flashing green or a left-turn green arrow.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/pedestrian-signals","source_title":"MTO 手册 · Pedestrian signals","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SD-27","group":"SD","section":"signs","topic_zh":"行人按钮","question_en":"At a crossing equipped with pedestrian push-buttons, how does a pedestrian get the walk signal?","question_zh":"在设有行人按钮的过街处，行人怎样才能获得通行信号？","options":[{"en":"By pressing the push-button","zh":"按下行人按钮"},{"en":"By waiting, because the walk signal comes on automatically every cycle","zh":"等待即可，每个周期都会自动亮起通行信号"},{"en":"By stepping into the crosswalk to trigger a sensor","zh":"踏入人行横道触发感应器"},{"en":"By waving to approaching drivers","zh":"向驶来的司机挥手示意"}],"answer_index":0,"explanation_zh":"有行人按钮的地方，行人必须按按钮才会出现通行信号。","explanation_en":"Where push-buttons exist, pedestrians must use them to bring on the walk signal.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/pedestrian-signals","source_title":"MTO 手册 · Pedestrian signals","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"SD-28","group":"SD","section":"signs","topic_zh":"路口行人信号灯","question_en":"At an intersection pedestrian signal on a busy main road, how is traffic on the smaller, less busy crossroad controlled?","question_zh":"在繁忙主路上的路口行人信号灯（intersection pedestrian signal）处，较小、较不繁忙的横向道路上的交通由什么控制？","options":[{"en":"By its own full set of traffic lights","zh":"由自己的一整套交通信号灯控制"},{"en":"By yield signs","zh":"由让行标志控制"},{"en":"By a flashing yellow beacon","zh":"由闪烁黄色信标控制"},{"en":"By stop signs","zh":"由停车标志控制"}],"answer_index":3,"explanation_zh":"路口行人信号灯只在主路上设交通信号灯，并配有人行横道、行人通行/禁行信号和按钮；较小的横向道路由停车标志控制。","explanation_en":"An intersection pedestrian signal has traffic lights on the main road only; stop signs control the smaller crossroad.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/pedestrian-signals","source_title":"MTO 手册 · Pedestrian signals","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"SD-29","group":"SD","section":"signs","topic_zh":"黄线与白线","question_en":"In this diagram of a four-lane road, what do the yellow lines on the pavement separate?","question_zh":"在这张四车道道路示意图中，路面上的黄色线用来分隔什么？","options":[{"en":"Traffic travelling in the same direction","zh":"同向行驶的车流"},{"en":"Traffic travelling in opposite directions","zh":"相向行驶的车流"},{"en":"Parking areas from travel lanes","zh":"停车区与行车道"},{"en":"Bicycle lanes from vehicle lanes","zh":"自行车道与机动车道"}],"answer_index":1,"explanation_zh":"黄色线分隔相向行驶的车流，白色线分隔同向行驶的车流。","explanation_en":"Yellow lines separate traffic travelling in opposite directions; white lines separate same-direction traffic.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/pavement-markings","source_title":"MTO 手册 · Pavement markings","image_url":"https://files.ontario.ca/3-1.jpg","sign_desc_en":"A diagram of a four-lane road marked with double solid yellow lines and white broken lines.","sign_desc_zh":"四车道道路示意图，路面上画有双黄实线和白色虚线。","difficulty":"easy"},{"id":"SD-30","group":"SD","section":"signs","topic_zh":"实线与虚线","question_en":"There is a solid line at the left of your lane, as in this diagram. What does it mean?","question_zh":"如图所示，你车道左侧是一条实线。这表示什么？","options":[{"en":"You may pass if the way is clear.","zh":"道路畅通时可以超车。"},{"en":"Your lane is about to end.","zh":"你的车道即将结束。"},{"en":"You may cross it only to pass slow trucks.","zh":"只有超越慢速卡车时才可以越线。"},{"en":"It is unsafe to pass.","zh":"超车不安全，不应超车。"}],"answer_index":3,"explanation_zh":"车道左侧是实线，表示超车不安全，不应超车。","explanation_en":"A solid line at the left of your lane means it is unsafe to pass.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/pavement-markings","source_title":"MTO 手册 · Pavement markings","image_url":"https://files.ontario.ca/3-2.jpg","sign_desc_en":"Vehicles travelling beside a solid yellow line.","sign_desc_zh":"车辆在一条黄色实线旁行驶。","difficulty":"easy"},{"id":"SD-31","group":"SD","section":"signs","topic_zh":"实线与虚线","question_en":"There is a broken line at the left of your lane. When may you pass?","question_zh":"你车道左侧是虚线。什么时候可以超车？","options":[{"en":"At any time, since a broken line means passing is always allowed there.","zh":"任何时候都可以，因为虚线处总是允许超车。"},{"en":"Only when the vehicle ahead is travelling below the posted speed limit.","zh":"只有前车低于标示限速行驶时才可以。"},{"en":"Never, because a broken yellow line means passing is not permitted.","zh":"不可以，因为黄色虚线表示禁止超车。"},{"en":"If the way is clear and enough broken line remains to pass safely.","zh":"道路畅通，且前方虚线段足够让你安全完成超车时。"}],"answer_index":3,"explanation_zh":"车道左侧是虚线时，道路畅通即可超车；但前方必须有足够长的虚线，让你能安全完成超车。","explanation_en":"You may pass at a broken line if the way is clear and enough broken line remains ahead to complete the pass safely.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/pavement-markings","source_title":"MTO 手册 · Pavement markings","image_url":"https://files.ontario.ca/3-3a.jpg","sign_desc_en":"Vehicles travelling beside broken yellow lines.","sign_desc_zh":"车辆在黄色虚线旁行驶。","difficulty":"medium"},{"id":"SD-32","group":"SD","section":"signs","topic_zh":"延续线","question_en":"Continuity lines are broken lines that are wider and closer together than regular broken lines. What does it usually mean when they are on the LEFT side of your lane?","question_zh":"延续线（continuity lines）是比普通虚线更宽、更密的虚线。如果它们在你车道的「左侧」，通常表示什么？","options":[{"en":"Your lane will continue past the ramp without being affected.","zh":"你的车道会越过匝道继续延伸，不受影响。"},{"en":"Your lane is ending or exiting; change lanes to keep your direction.","zh":"你的车道即将结束或驶出，要继续原方向须变道。"},{"en":"Passing is prohibited until the lines end.","zh":"在延续线结束前禁止超车。"},{"en":"A high-occupancy vehicle (HOV) lane begins here.","zh":"高乘载车道（HOV）从这里开始。"}],"answer_index":1,"explanation_zh":"左侧出现延续线，一般表示你所在车道即将结束或驶出，想继续原方向行驶就要变道；延续线在右侧则表示你的车道继续延伸、不受影响。","explanation_en":"Continuity lines on your left usually mean your lane is ending or exiting and you must change lanes to continue.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/pavement-markings","source_title":"MTO 手册 · Pavement markings","image_url":"https://files.ontario.ca/3-4.jpg","sign_desc_en":"Examples of continuity lines at on-ramps and off-ramps.","sign_desc_zh":"入口匝道和出口匝道处延续线的示例。","difficulty":"medium"},{"id":"SD-33","group":"SD","section":"signs","topic_zh":"延续线","question_en":"Near an on-ramp or off-ramp, you see continuity lines on the RIGHT side of your lane. What does this mean?","question_zh":"在入口或出口匝道附近，你看到延续线位于你车道的「右侧」。这表示什么？","options":[{"en":"Your lane will continue unaffected.","zh":"你的车道继续延伸，不受影响。"},{"en":"Your lane is ending, so you must merge left.","zh":"你的车道即将结束，必须向左并线。"},{"en":"You must take the next exit.","zh":"你必须从下一个出口驶出。"},{"en":"You must stop before reaching the ramp.","zh":"你必须在到达匝道前停车。"}],"answer_index":0,"explanation_zh":"延续线在你车道右侧，表示你的车道会继续延伸，不受影响；在左侧才表示车道即将结束或驶出。","explanation_en":"Continuity lines on your right mean your lane continues unaffected.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/pavement-markings","source_title":"MTO 手册 · Pavement markings","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SD-34","group":"SD","section":"signs","topic_zh":"停车线","question_en":"How is a stop line marked at an intersection?","question_zh":"路口的停车线是怎样标示的？","options":[{"en":"Two parallel white lines painted across the road","zh":"横跨道路的两条平行白线"},{"en":"A single white line painted across the road","zh":"横跨道路的一条白线"},{"en":"Two white double parallel lines with an X in each approaching lane","zh":"两组白色双平行线，驶近的每条车道内各有一个 X"},{"en":"A solid yellow line painted across the road","zh":"横跨道路的一条黄色实线"}],"answer_index":1,"explanation_zh":"停车线是横画在路口的一条白线，表示必须在此停车；两条平行白线是人行横道，带 X 的白色双平行线是行人过街设施（pedestrian crossover）。","explanation_en":"A stop line is a single white line across the road showing where you must stop.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/pavement-markings","source_title":"MTO 手册 · Pavement markings","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SD-35","group":"SD","section":"signs","topic_zh":"停车线","question_en":"You must stop for a red light at an intersection that has both a stop line and a crosswalk ahead of it. Where do you stop?","question_zh":"你在路口遇到红灯必须停车，路口既有停车线，前方又有人行横道。你应该停在哪里？","options":[{"en":"At the stop line","zh":"停车线处"},{"en":"At the crosswalk","zh":"人行横道前"},{"en":"At the edge of the sidewalk","zh":"人行道边缘"},{"en":"At the edge of the intersection","zh":"路口边缘"}],"answer_index":0,"explanation_zh":"停车线表示必须停车的位置。路面有停车线就停在停车线处；只有没有停车线时，才依次停在人行横道前、人行道边缘或路口边缘。","explanation_en":"If a stop line is marked, you stop at the stop line.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/pavement-markings","source_title":"MTO 手册 · Pavement markings","image_url":"https://files.ontario.ca/3-5.jpg","sign_desc_en":"A diagram of a stop line at an intersection.","sign_desc_zh":"路口停车线示意图。","difficulty":"easy"},{"id":"SD-36","group":"SD","section":"signs","topic_zh":"停车位置","question_en":"You are stopping at an intersection. There is no stop line and no crosswalk, but there is a sidewalk. Where must you stop?","question_zh":"你要在路口停车。路口没有停车线，也没有人行横道，但有人行道。你必须停在哪里？","options":[{"en":"At the edge of the intersection","zh":"路口边缘"},{"en":"At the edge of the sidewalk","zh":"人行道边缘"},{"en":"Next to the stop sign or signal pole","zh":"停车标志或信号灯杆旁"},{"en":"Wherever you get a clear view of cross traffic","zh":"能看清横向来车的任何位置"}],"answer_index":1,"explanation_zh":"没有停车线时停在人行横道前；没有人行横道时停在人行道边缘；连人行道也没有时，停在路口边缘。","explanation_en":"With no stop line or crosswalk, stop at the edge of the sidewalk.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/pavement-markings","source_title":"MTO 手册 · Pavement markings","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SD-37","group":"SD","section":"signs","topic_zh":"人行横道","question_en":"Are crosswalks at intersections always marked with painted lines like the one shown?","question_zh":"路口的人行横道是否都像图中这样画有标线？","options":[{"en":"Yes; pedestrians may cross only where lines are painted.","zh":"是的，行人只能在画线处过街。"},{"en":"Yes; every intersection with traffic lights has painted crosswalk lines.","zh":"是的，凡有信号灯的路口都画有人行横道线。"},{"en":"No; crosswalks are marked only in school zones.","zh":"不是，只有学校区域才画人行横道线。"},{"en":"No; crosswalks at intersections are not always marked.","zh":"不是，路口的人行横道并不总是有标线。"}],"answer_index":3,"explanation_zh":"有标线的人行横道由横跨道路的两条平行白线标示，但路口的人行横道并不总是有标线；没有停车线时，无论人行横道有没有标线，都要停在人行横道前。","explanation_en":"Crosswalks at intersections are not always marked; when there is no stop line, you stop at the crosswalk whether it is marked or not.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/pavement-markings","source_title":"MTO 手册 · Pavement markings","image_url":"https://files.ontario.ca/3-6.jpg","sign_desc_en":"A marked crosswalk at an intersection.","sign_desc_zh":"路口一处画有标线的人行横道。","difficulty":"medium"},{"id":"SD-38","group":"SD","section":"signs","topic_zh":"车道箭头","question_en":"A white arrow painted on your lane points to the left. What does it mean?","question_zh":"你所在车道上画有一个指向左方的白色箭头。这是什么意思？","options":[{"en":"It is only a suggestion; you may still go straight.","zh":"只是建议，你仍可以直行。"},{"en":"Traffic from the left lane will merge into yours.","zh":"左侧车道的车辆将并入你的车道。"},{"en":"You may move only in the direction of the arrow.","zh":"你只能按箭头方向行驶。"},{"en":"The road ahead becomes one-way to the left.","zh":"前方道路变为向左的单行道。"}],"answer_index":2,"explanation_zh":"车道上画的白色箭头表示该车道只能按箭头方向行驶。","explanation_en":"A white lane arrow means you may move only in the direction it points.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/pavement-markings","source_title":"MTO 手册 · Pavement markings","image_url":"https://files.ontario.ca/3-7.jpg","sign_desc_en":"White directional arrows painted in lanes at an intersection.","sign_desc_zh":"路口车道上画有白色方向箭头。","difficulty":"easy"},{"id":"SD-39","group":"SD","section":"signs","topic_zh":"行人过街设施","question_en":"Which pavement marking identifies a pedestrian crossover?","question_zh":"哪种路面标线表示行人过街设施（pedestrian crossover）？","options":[{"en":"Two white double parallel lines across the road, with an X in each approaching lane","zh":"横跨道路的两组白色双平行线，驶近的每条车道内各有一个 X"},{"en":"A single white line painted across the road just before the intersection","zh":"在路口前横跨道路画的一条白线"},{"en":"Two single parallel white lines across the road, with no other markings","zh":"横跨道路的两条平行白线，没有其他标记"},{"en":"A painted box in the lane, with a white bicycle symbol inside it","zh":"车道内画的方框，框内有白色自行车图案"}],"answer_index":0,"explanation_zh":"行人过街设施由专用标志、上方的黄色信号灯和路面标线标示：横跨道路的两组白色双平行线，驶近的每条车道内各有一个 X。","explanation_en":"Pedestrian crossovers are marked by two white double parallel lines with an X in each approaching lane.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/pavement-markings","source_title":"MTO 手册 · Pavement markings","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SD-40","group":"SD","section":"signs","topic_zh":"行人过街设施","question_en":"At a pedestrian crossover like this one, you have stopped for a pedestrian, who has now passed your lane and is on the far half of the road. When may you proceed?","question_zh":"在这样的行人过街设施处，你已停车让行，行人现已走过你的车道，正在道路的另一半。你什么时候可以继续行驶？","options":[{"en":"Now, since the pedestrian is no longer in your lane","zh":"现在就可以，因为行人已经不在你的车道上"},{"en":"After the pedestrian has completely crossed and cleared the roadway","zh":"等行人完全走过并离开车行道之后"},{"en":"As soon as the pedestrian passes the centre line","zh":"行人一越过中线即可"},{"en":"After you have been stopped for three seconds","zh":"停车满三秒后即可"}],"answer_index":1,"explanation_zh":"在行人过街设施处，驾驶员和骑自行车的人必须在线前停车，并一直让行，直到行人完全走过、离开车行道。","explanation_en":"At a crossover, drivers and cyclists must stop and yield until pedestrians have completely crossed and cleared the roadway.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/pavement-markings","source_title":"MTO 手册 · Pavement markings","image_url":"https://files.ontario.ca/2-23.jpg","sign_desc_en":"A pedestrian crossover on a road.","sign_desc_zh":"道路上的行人过街设施。","difficulty":"medium"},{"id":"SD-41","group":"SD","section":"signs","topic_zh":"障碍物标线","question_en":"Two solid lines are painted on the pavement around a bridge pier, and the pier itself has yellow and black markings. What are these markings for?","question_zh":"桥墩周围的路面上画有两条实线，桥墩本身涂有黄黑相间的标记。这些标记的作用是什么？","options":[{"en":"To guide traffic away from the fixed object and warn drivers of it","zh":"引导车辆避开这个固定物体，并对驾驶员发出警示"},{"en":"To mark a pedestrian refuge island where vehicles must stop","zh":"标出车辆必须停车的行人安全岛"},{"en":"To show a zone where passing on either side is permitted","zh":"标出可以从两侧超车的区域"},{"en":"To mark an area reserved for emergency stopping only","zh":"标出仅供紧急停车的区域"}],"answer_index":0,"explanation_zh":"两条实线引导车辆避开桥墩、混凝土安全岛等固定物体；物体本身也涂有黄黑标记作为警示。","explanation_en":"These lines guide traffic away from fixed objects, and the yellow-and-black markings warn of them.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/pavement-markings","source_title":"MTO 手册 · Pavement markings","image_url":"https://files.ontario.ca/3-9.jpg","sign_desc_en":"Solid lines painted around an object in the road, with yellow and black markings on objects.","sign_desc_zh":"道路中物体周围画有实线，物体上涂有黄黑相间的标记。","difficulty":"easy"},{"id":"SD-42","group":"SD","section":"signs","topic_zh":"双向左转车道","question_en":"The centre lane of a road is marked as a two-way left-turn lane. Which use of this lane is NOT allowed?","question_zh":"某道路的中间车道被标为双向左转车道。下列哪种用法是「不」允许的？","options":[{"en":"Moving into it shortly before your turn after signalling","zh":"打灯后在转弯前不久驶入该车道"},{"en":"Waiting in it for a gap to turn left into a driveway","zh":"在该车道内等待空档，左转进入私人车道"},{"en":"Using it to pass slower vehicles","zh":"利用该车道超越慢车"},{"en":"Sharing it with drivers turning left from the opposite direction","zh":"与对向左转车辆共同使用该车道"}],"answer_index":2,"explanation_zh":"双向左转车道供两个方向的左转车辆等待转弯，应在转弯前不久打灯驶入；这种车道不得用于超车。","explanation_en":"Two-way left-turn lanes are for left-turning vehicles from both directions and must not be used for passing.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SD-43","group":"SD","section":"signs","topic_zh":"路面标线","question_en":"In this diagram of a four-lane road, a broken white line separates your lane from the lane next to it. What does the white line tell you?","question_zh":"在这张四车道道路示意图中，你的车道和旁边车道之间是一条白色虚线。这条白线说明了什么？","options":[{"en":"Traffic in that lane is travelling in the opposite direction","zh":"旁边车道的车辆与你相向行驶"},{"en":"Traffic in that lane is travelling in the same direction as you","zh":"旁边车道的车辆与你同向行驶"},{"en":"That lane is reserved for buses and taxis","zh":"旁边车道是公交车和出租车专用车道"},{"en":"You may never change lanes across it","zh":"任何情况下都不得越过这条线变道"}],"answer_index":1,"explanation_zh":"白线分隔同向行驶的车流，黄线分隔相向行驶的车流。图中道路中间的双黄实线分隔对向交通，车道之间的白色虚线分隔同向车流；车道左侧是虚线时，在安全的情况下可以超车。","explanation_en":"White lines separate traffic travelling in the same direction, while yellow lines separate traffic travelling in opposite directions.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/pavement-markings","source_title":"MTO 手册 · Pavement markings","image_url":"https://files.ontario.ca/3-1.jpg","sign_desc_en":"Diagram of a four-lane road with double solid yellow centre lines and broken white lines between lanes","sign_desc_zh":"四车道道路示意图：道路中间为双黄实线，车道之间为白色虚线","difficulty":"easy"},{"id":"SD-44","group":"SD","section":"signs","topic_zh":"闪烁红色信号灯","question_en":"You approach an intersection with a single flashing red light like this one hanging above it. No other vehicles or pedestrians are in sight. What must you do?","question_zh":"你驶近一个路口，路口上方悬挂着像这样的单个闪烁红灯。周围看不到其他车辆或行人。你必须怎么做？","options":[{"en":"Slow down and drive through, since no one else is there","zh":"减速通过，因为周围没有其他人"},{"en":"Slow almost to a stop, then roll through if the way is clear","zh":"减速到几乎停住，路况安全就缓慢滑行通过"},{"en":"Come to a complete stop, then go through only when it is safe","zh":"完全停车，确认安全后才能通过"},{"en":"Stop and wait until the light changes to green","zh":"停车并等待信号变为绿灯"}],"answer_index":2,"explanation_zh":"悬挂在路口或停车标志上方的闪烁红色信号灯（traffic beacon）要求你完全停车，即使周围没有车辆或行人，也不能只减速或滑行通过。确认安全后才能通过路口。","explanation_en":"A flashing red beacon above an intersection means you must come to a complete stop, even with no other traffic, and move through only when it is safe.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"https://files.ontario.ca/3-2-16.jpg","sign_desc_en":"A single flashing red traffic beacon","sign_desc_zh":"单个闪烁的红色交通信号灯（beacon）","difficulty":"easy"},{"id":"SD-45","group":"SD","section":"signs","topic_zh":"行人与提前绿灯","question_en":"A pedestrian is waiting at an intersection. The traffic light they face shows a flashing green (advance green), but the pedestrian signal they face shows a white walking symbol. What may the pedestrian do?","question_zh":"一名行人在路口等待过街。他面对的交通信号灯是闪烁绿灯（提前绿灯），但他面对的行人信号灯显示白色行人行走图案。这名行人可以怎么做？","options":[{"en":"Cross in the direction of the walk signal","zh":"按行人通行信号所指的方向过街"},{"en":"Wait, because pedestrians may never cross on a flashing green light","zh":"等待，因为闪烁绿灯时行人一律不得过街"},{"en":"Wait until the traffic light changes to a steady green","zh":"等交通信号灯变为常亮绿灯后再过街"},{"en":"Cross, but give the right-of-way to any turning vehicles","zh":"可以过街，但要把先行权让给转弯车辆"}],"answer_index":0,"explanation_zh":"行人不得在闪烁绿灯（提前绿灯）时过街，除非行人信号灯允许。面对白色行人通行信号的行人可以按信号方向过街，过街时对所有车辆享有先行权。","explanation_en":"Pedestrians must not cross on a flashing green unless a pedestrian signal tells them to, and a pedestrian facing a walk signal may cross in its direction.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SD-46","group":"SD","section":"signs","topic_zh":"人行横道标线","question_en":"At an intersection with no stop line, two parallel white lines are painted across the road just ahead of you. What do they mark, and where do you stop for a red light?","question_zh":"某路口没有停车线，你前方的路面上横画着两条平行白线。它们标示的是什么？遇到红灯时你应在哪里停车？","options":[{"en":"A crosswalk; stop just before it","zh":"人行横道；在人行横道前停车"},{"en":"A pedestrian crossover; stop only if someone is crossing in your lane","zh":"行人过街设施（pedestrian crossover）；只有你的车道内有人过街时才需要停车"},{"en":"A stop line; stop with your front wheels between the two lines","zh":"停车线；停车时让前轮位于两条线之间"},{"en":"A bike box; stop with your vehicle inside the painted area","zh":"自行车等候区（bike box）；把车停在画线区域内"}],"answer_index":0,"explanation_zh":"横跨道路的两条平行白线标示人行横道；没有停车线时，应在人行横道处停车。停车线是单条白线，行人过街设施则是两组白色双平行线，每条驶近车道内还画有X。","explanation_en":"Two parallel white lines across the road mark a crosswalk, and where there is no stop line you stop at the crosswalk.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/pavement-markings","source_title":"MTO 手册 · Pavement markings","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SD-47","group":"SD","section":"signs","topic_zh":"公交优先信号灯","question_en":"How can you recognize a transit priority signal?","question_zh":"如何识别公交优先信号灯（transit priority signal）？","options":[{"en":"A round signal on top of a regular traffic signal, showing a white vertical bar on a dark background","zh":"装在普通交通信号灯顶上的圆形信号灯，在深色背景上显示一条白色竖条"},{"en":"A square signal beside a regular traffic signal, showing a white diamond on a dark background","zh":"装在普通交通信号灯旁边的方形信号灯，在深色背景上显示白色菱形"},{"en":"A green arrow pointing straight up, shown below the red light of a regular traffic signal","zh":"显示在普通交通信号灯红灯下方、指向正前方的绿色箭头"},{"en":"A flashing blue light mounted on top of a regular traffic signal, lit only when a bus is approaching","zh":"装在普通交通信号灯顶上的蓝色闪光灯，只在公交车驶近时亮起"}],"answer_index":0,"explanation_zh":"公交优先信号灯是装在普通交通信号灯顶上的圆形信号灯，在深色背景上显示白色竖条。它让公共交通车辆直行或左右转，此时所有冲突方向的交通面对红灯，其他车辆和行人都必须给公交车让行。","explanation_en":"A transit priority signal is a round signal on top of a regular traffic light that shows a white vertical bar on a dark background.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SD-48","group":"SD","section":"signs","topic_zh":"行人信号灯","question_en":"At an intersection with pedestrian signals, which symbol tells pedestrians they may walk?","question_zh":"在设有行人信号灯的路口，哪种图案表示行人可以过街？","options":[{"en":"A steady orange hand symbol","zh":"常亮的橙色手掌图案"},{"en":"A white walking-person symbol","zh":"白色的行人行走图案"},{"en":"A green walking-person symbol","zh":"绿色的行人行走图案"},{"en":"A flashing yellow light above the crosswalk","zh":"人行横道上方的闪烁黄灯"}],"answer_index":1,"explanation_zh":"行人通行信号是白色的行人行走图案，面对它的行人可以按信号方向过街；闪烁或常亮的橙色手掌图案表示行人不得开始过街。","explanation_en":"The walk signal is a white walking symbol, while a flashing or steady orange hand means pedestrians must not start crossing.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/pedestrian-signals","source_title":"MTO 手册 · Pedestrian signals","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"SD-49","group":"SD","section":"signs","topic_zh":"行人过街设施停车位置","question_en":"You approach a pedestrian crossover marked with white double parallel lines and an X in your lane, and a pedestrian is crossing. Where must you stop?","question_zh":"你驶近一处行人过街设施（pedestrian crossover），路面画有白色双平行线，你的车道内画有X，此时有行人正在过街。你必须在哪里停车？","options":[{"en":"Before the line, with no part of your vehicle on or past it","zh":"在线前停车，车身任何部分都不能压线或越线"},{"en":"With your front wheels resting on the first white line","zh":"让前轮停在第一条白线上"},{"en":"Between the two sets of white double lines","zh":"停在两组白色双线之间"},{"en":"Just past the line, as long as you leave the pedestrian's path clear","zh":"略微越线停车，只要不挡住行人的路线即可"}],"answer_index":0,"explanation_zh":"在行人过街设施处，驾驶员和骑自行车者必须在线前停车并让行，直到行人完全走过马路、离开车行道后才能继续行驶。","explanation_en":"At a pedestrian crossover, drivers and cyclists must stop before the line and yield until pedestrians have completely crossed and cleared the roadway.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/pavement-markings","source_title":"MTO 手册 · Pavement markings","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SD-50","group":"SD","section":"signs","topic_zh":"路口行人信号","question_en":"On a busy main road, how does an intersection pedestrian signal help people cross safely?","question_zh":"在繁忙的主干道上，路口行人信号（intersection pedestrian signal）如何帮助行人安全过街？","options":[{"en":"It uses traffic lights to signal main-road traffic to stop","zh":"用交通信号灯让主干道上的车辆停车"},{"en":"It puts stop signs on the main road at the crossing","zh":"在主干道的过街处设置停车标志"},{"en":"It gives buses and streetcars priority through the intersection","zh":"让公交车和有轨电车优先通过路口"},{"en":"It flashes overhead yellow lights to warn drivers to slow down","zh":"用上方的闪烁黄灯提醒驾驶员减速"}],"answer_index":0,"explanation_zh":"路口行人信号通过信号灯让主干道车辆停车，帮助行人安全穿过繁忙的主干道。它包括人行横道、行人通行/禁行信号、行人按钮，以及只设在主干道上的交通信号灯；较小的交叉道路由停车标志控制。","explanation_en":"An intersection pedestrian signal helps people cross a busy main road by signalling traffic to stop, using traffic lights on the main road only.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/pedestrian-signals","source_title":"MTO 手册 · Pedestrian signals","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SD-51","group":"SD","section":"signs","topic_zh":"行人信号灯","question_en":"Compared with regular traffic lights, what does the handbook say pedestrian signals give pedestrians?","question_zh":"与普通交通信号灯相比，手册说行人信号灯给行人带来什么？","options":[{"en":"More time to cross the road","zh":"更多的过街时间"},{"en":"Less time to cross, so that traffic keeps moving","zh":"更少的过街时间，以保持车流通畅"},{"en":"Permission to cross at any point along the block","zh":"可以在整个街段的任意位置过街"},{"en":"The same crossing time, but with a countdown display","zh":"过街时间相同，但增加倒计时显示"}],"answer_index":0,"explanation_zh":"手册指出，行人信号灯比普通交通信号灯给行人更多的过街时间。设有行人按钮的地方，行人必须按下按钮才能获得通行信号。","exp   function renderSettings() {
    setHeader('偏好设置','让练习更合习惯，让记录好好保存。');
    view.innerHTML=`<div class="settings-grid"><section class="panel"><div class="section-head"><h3>阅读与外观</h3>${icon('sun')}</div><div class="setting-row"><div><strong>页面主题</strong><p class="muted">选择让眼睛更舒服的背景。</p></div><div class="segmented" role="group" aria-label="主题">${[['light','浅色'],['dark','深色'],['system','跟随系统']].map(([v,l])=>`<button type="button" data-action="theme" data-value="${v}" aria-pressed="${prefs.theme===v}">${l}</button>`).join('')}</div></div><div class="setting-row"><div><strong>题目字号</strong><p class="muted">放大题干、选项和解析。</p></div><div class="segmented" role="group" aria-label="题目字号">${[['normal','标准'],['large','大字号']].map(([v,l])=>`<button type="button" data-action="font" data-value="${v}" aria-pressed="${prefs.font===v}">${l}</button>`).join('')}</div></div><div class="setting-row"><div><strong>专注模式</strong><p class="muted">答题时收起导航和侧边答题卡。</p></div><label class="switch"><input type="checkbox" id="settings-focus" ${prefs.focus?'checked':''}><span aria-hidden="true"></span><span class="sr-only">启用专注模式</span></label></div><div class="setting-row"><div><strong>默认题目语言</strong><p class="muted">题目、选项和解析同步切换。</p></div><div class="segmented" role="group" aria-label="默认语言">${[['both','中英'],['zh','中文'],['en','EN']].map(([v,l])=>`<button type="button" data-action="language" data-value="${v}" aria-pressed="${lang===v}">${l}</button>`).join('')}</div></div></section><section class="panel"><div class="section-head"><h3>每日学习目标</h3>${icon('target')}</div><p class="muted">给自己一个轻松完成的小目标，按实际作答次数累计。</p><label class="goal-input" for="settings-goal"><input id="settings-goal" type="number" min="5" max="200" step="5" value="${prefs.goal}"><span>题 / 天</span></label><div class="goal-presets">${[10,20,40,60].map(v=>`<button type="button" class="btn ghost small ${prefs.goal===v?'active':''}" data-action="goal" data-value="${v}">${v} 题</button>`).join('')}</div><p class="footnote">调整目标会立即保存，不会更改已经记录的练习量。</p></section><section class="panel"><div class="section-head"><h3>备份你的学习记录</h3>${icon('download')}</div><p class="muted">练习成绩、错题、收藏、笔记和未完成进度保存在当前浏览器。导出一份备份，方便换设备时继续学习。</p><div class="row">${btn('export',`${icon('download')} 导出记录`,'secondary')}${btn('import',`${icon('upload')} 导入记录`,'ghost')}</div><input type="file" id="import-file" accept="application/json,.json" hidden><p class="footnote">导入前会显示备份内容并要求确认；确认后替换当前学习记录。</p></section><section class="panel danger-zone"><div class="section-head"><h3>重新开始</h3>${icon('repeat')}</div><p class="muted">清空答题成绩、错题本、每日统计、练习历史和未完成进度。收藏与笔记会保留。</p>${btn('reset','清空练习记录','danger')}<p class="footnote">建议先导出备份。此操作需要再次确认。</p></section></div>`;
  }

  function confirmDialog(title,message,confirmText='确认',danger=false) {
    if(confirmPending) return Promise.resolve(false);
    const previous=document.activeElement;
    const overlay=document.createElement('div');overlay.className='modal-backdrop';overlay.innerHTML=`<section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message"><span class="modal-icon">${icon(danger?'warning':'note')}</span><h2 id="confirm-title">${esc(title)}</h2><p id="confirm-message">${esc(message)}</p><div class="modal-actions"><button type="button" class="btn ghost" data-modal-cancel>取消</button><button type="button" class="btn ${danger?'danger':'primary'}" data-modal-confirm>${esc(confirmText)}</button></div></section>`;
    document.body.appendChild(overlay);
    return new Promise(resolve=>{const done=result=>{document.removeEventListener('keydown',onKey,true);overlay.remove();confirmPending=null;previous?.focus({preventScroll:true});resolve(result);};const onKey=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();done(false);}else if(e.key==='Tab'){const controls=[...overlay.querySelectorAll('button')],first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}};confirmPending=done;overlay.querySelector('[data-modal-cancel]').onclick=()=>done(false);overlay.querySelector('[data-modal-confirm]').onclick=()=>done(true);overlay.addEventListener('click',e=>{if(e.target===overlay)done(false);});document.addEventListener('keydown',onKey,true);overlay.querySelector('[data-modal-cancel]').focus();});
  }
  function exportRecords() {pauseSession();const backup={app:'ontario-g1',version:2,exportedAt:new Date().toISOString(),hist,wrong,bookmarks,notes,activity,sessions,preferences:prefs,session:session&&!session.finished?{...session,startedAt:null}:null,language:lang};const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Ontario-G1-学习备份-${dateKey()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('备份已导出，请妥善保存。');}
  async function importRecords(file) {
    if(!file)return;if(file.size>8*1024*1024){toast('备份文件过大，请选择 8 MB 以下的 G1 备份。');return;}
    try {
      const b=JSON.parse(await file.text());if(!b||b.app!=='ontario-g1'||![1,2].includes(b.version)||!b.hist||typeof b.hist!=='object'||Array.isArray(b.hist))throw new Error('format');
      const nextHist=cleanHist(b.hist),nextWrong=cleanWrong(b.wrong),nextBookmarks=cleanBookmarks(b.bookmarks),nextNotes=cleanNotes(b.notes),nextSession=validateSession(b.session);
      const yes=await confirmDialog('导入这份学习备份？',`备份包含 ${Object.keys(nextHist).length} 道题的练习记录、${Object.keys(nextWrong).length} 道错题、${Object.keys(nextBookmarks).length} 道收藏及 ${Object.keys(nextNotes).length} 条笔记${nextSession?'，并有一份未完成的练习':''}。确认后会替换当前学习记录，建议先导出当前记录。`,'确认导入');if(!yes)return;
      // 学习记录整体替换；旧版备份里没有的外观设置和语言保留当前值。
      hist=nextHist;wrong=nextWrong;bookmarks=nextBookmarks;notes=nextNotes;activity=cleanActivity(b.activity);sessions=cleanSessions(b.sessions);session=nextSession;prefs=b.preferences&&typeof b.preferences==='object'?cleanPrefs(b.preferences):prefs;lang=cleanLang(b.language,lang);
      storage.set('g1-hist',hist);storage.set('g1-wrong',wrong);storage.set('g1-bookmarks',bookmarks);storage.set('g1-notes',notes);storage.set('g1-activity',activity);storage.set('g1-sessions',sessions);storage.set('g1-session',session);storage.set('g1-preferences',prefs);storage.set('g1-lang',lang);page='home';render();toast('学习记录已导入。');
    } catch(_) {toast('无法读取这份备份，请选择由 G1 练习导出的 JSON 文件。');}
  }
  async function resetRecords() {const yes=await confirmDialog('清空全部练习记录？','将删除累计答题成绩、错题本、每日统计、练习历史，以及未完成的练习进度。收藏、笔记和阅读设置会保留。此操作不能撤销。','确认清空',true);if(!yes)return;hist={};wrong={};activity={};sessions=[];session=null;['g1-hist','g1-wrong','g1-activity'].forEach(k=>storage.set(k,{}));storage.set('g1-sessions',[]);storage.set('g1-session',null);render();toast('练习记录已清空，收藏和笔记已保留。');}
  function toggleBookmark(id) {if(!byId[id])return;const added=!bookmarks[id];if(added)bookmarks[id]=true;else delete bookmarks[id];storage.set('g1-bookmarks',bookmarks);render(true);toast(added?'已加入收藏。':'已取消收藏。');}
  function setLanguage(value) {if(!['both','en','zh'].includes(value))return;lang=value;storage.set('g1-lang',lang);render(true);}
  function jumpBy(predicate) {const n=session.items.length;for(let offset=1;offset<=n;offset++){const i=(session.i+offset)%n;if(predicate(session.items[i]))return moveTo(i);}toast('没有符合条件的题目。');}

  view.addEventListener('click',event=>{
    const target=event.target.closest('[data-action]');if(!target||target.disabled)return;const action=target.dataset.action,value=target.dataset.value;
    if(action==='navigate')return navigate(target.dataset.pageTarget);
    if(action==='quick')return startQuick();if(action==='smart')return startSmart();if(action==='weak-group')return startSmart(target.dataset.group);
    if(action==='resume'){if(!session||session.finished)return;session.startedAt=Date.now();page='quiz';render();saveSession();return;}
    if(action==='start-practice')return startPractice();if(action==='start-exam')return startExam();
    if(action==='category-section'){categorySection=value;render(true);return;}if(action==='clear-category-search'){categorySearch='';render();return;}
    if(action==='select-all'||action==='select-none'){GROUPS.filter(g=>categorySection==='all'||g.section===categorySection).forEach(g=>action==='select-all'?selectedGroups.add(g.id):selectedGroups.delete(g.id));storage.set('g1-groups',[...selectedGroups]);render(true);return;}
    if(action==='practice-count'){practiceCount=value==='all'?'all':Number(value);storage.set('g1-count',practiceCount);render(true);return;}
    if(action==='choose')return choose(Number(target.dataset.option));if(action==='bookmark')return toggleBookmark(session.items[session.i].id);if(action==='bookmark-id')return toggleBookmark(target.dataset.id);
    if(action==='flag'){const item=session.items[session.i];item.flagged=!item.flagged;saveSession();render(true);return;}
    if(action==='previous')return moveTo(session.i-1);if(action==='next'||action==='skip')return nextQuestion();if(action==='jump')return moveTo(Number(target.dataset.index));if(action==='finish')return finishSession();if(action==='pause'){pauseSession();page='home';render();toast('进度已保存，下次可继续。');return;}
    if(action==='jump-unanswered')return jumpBy(it=>it.pick===null);if(action==='jump-flagged')return jumpBy(it=>it.flagged);
    if(action==='sheet-prev'||action==='sheet-next'){sheetPage+=action==='sheet-next'?1:-1;$('#answer-sheet-content').innerHTML=answerGrid();return;}
    if(action==='retry-image'){const box=target.closest('.signbox'),img=box?.querySelector('img');if(img){brokenImages.delete(img.dataset.src);img.hidden=false;box.querySelector('.sign-fallback').hidden=true;watchImage(img);img.removeAttribute('src');img.src=img.dataset.src;}return;}
    if(action==='retry-result'){const ids=session.items.filter(it=>it.pick!==byId[it.id].answer_index).map(it=>it.id);return beginSession(ids,'wrong');}
    if(action==='review-prev'||action==='review-next'){reviewPage+=action==='review-next'?1:-1;render();return;}
    if(action==='start-collection')return beginSession(shuffle(collectionIds()),page==='wrong'?'wrong':'bookmarks');if(action==='practice-one')return beginSession([target.dataset.id],page==='wrong'?'wrong':'practice');
    if(action==='collection-prev'||action==='collection-next'){collectionPage+=action==='collection-next'?1:-1;render();return;}if(action==='clear-collection-search'){collectionSearch='';collectionGroup='all';render();return;}
    if(action==='theme'){prefs.theme=value;render(true);return;}if(action==='font'){prefs.font=value;render(true);return;}if(action==='language')return setLanguage(value);if(action==='goal'){prefs.goal=Number(value);render(true);return;}
    if(action==='export')return exportRecords();if(action==='import')return $('#import-file').click();if(action==='reset')return resetRecords();
  });
  // 拼音等输入法组字期间不重绘（重绘会打断组字），组字结束后再筛选。
  view.addEventListener('compositionend',event=>{const el=event.target;if(el.id==='category-search'||el.id==='collection-search')el.dispatchEvent(new Event('input',{bubbles:true}));});
  view.addEventListener('toggle',event=>{const el=event.target;if(el.dataset?.review)el.open?openReviews.add(el.dataset.review):openReviews.delete(el.dataset.review);else if(el.classList?.contains('notes-box')&&page==='quiz'&&session)notesOpenFor=el.open?session.items[session.i].id:null;},true);
  view.addEventListener('input',event=>{const el=event.target;if(event.isComposing)return;if(el.id==='category-search'){categorySearch=el.value;render(true);}else if(el.id==='collection-search'){collectionSearch=el.value;collectionPage=0;render(true);}else if(el.id==='question-note'&&session){const id=session.items[session.i].id;if(el.value.trim())notes[id]=el.value;else delete notes[id];storage.set('g1-notes',notes);}});
  view.addEventListener('change',event=>{const el=event.target;if(el.dataset.groupSelect){el.checked?selectedGroups.add(el.dataset.groupSelect):selectedGroups.delete(el.dataset.groupSelect);storage.set('g1-groups',[...selectedGroups]);render(true);}else if(el.id==='practice-difficulty'){practiceDifficulty=el.value;render(true);}else if(el.id==='practice-random'){randomOrder=el.checked;storage.set('g1-random',randomOrder);}else if(el.id==='practice-unmastered'){unmasteredOnly=el.checked;storage.set('g1-unseen',unmasteredOnly);render(true);}else if(el.id==='collection-group'){collectionGroup=el.value;collectionPage=0;render(true);}else if(el.id==='settings-focus'){prefs.focus=el.checked;applyPreferences();}else if(el.id==='settings-goal'){prefs.goal=Math.min(200,Math.max(5,Math.round(Number(el.value)||20)));render(true);}else if(el.id==='import-file'){const file=el.files?.[0];el.value='';importRecords(file);}});
  document.querySelectorAll('#sidebar [data-page]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
  document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.lang)));
  $('#theme-toggle')?.addEventListener('click',()=>{prefs.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';render(true);toast(prefs.theme==='dark'?'已切换深色模式。':'已切换浅色模式。');});
  $('#font-toggle')?.addEventListener('click',()=>{prefs.font=prefs.font==='large'?'normal':'large';render(true);toast(prefs.font==='large'?'已开启大字号。':'已恢复标准字号。');});
  $('#focus-toggle')?.addEventListener('click',()=>{prefs.focus=!prefs.focus;applyPreferences();toast(prefs.focus?'答题时将使用专注模式。':'已退出专注模式。');});
  $('#mobile-menu')?.addEventListener('click',()=>{const open=document.body.classList.toggle('sidebar-open');$('#mobile-menu').setAttribute('aria-expanded',String(open));});$('#sidebar-overlay')?.addEventListener('click',closeMobile);
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&document.body.classList.contains('sidebar-open')&&!confirmPending){closeMobile();$('#mobile-menu')?.focus();return;}
    if(confirmPending||page!=='quiz'||!session||session.finished||event.ctrlKey||event.metaKey||event.altKey||event.repeat)return;
    // 正在输入笔记或搜索时不触发；焦点停在按钮上（比如刚点过选项）时快捷键照常可用。
    const target=event.target;if(target.closest('input,textarea,select,[contenteditable="true"]'))return;
    const key=event.key.toUpperCase();if(key==='B'&&event.shiftKey){event.preventDefault();toggleBookmark(session.items[session.i].id);return;}
    const index=Math.max(['1','2','3','4'].indexOf(key),KEYS.indexOf(key));if(index>=0){event.preventDefault();choose(session.items[session.i].order[index]);return;}
    // 焦点在其他按钮、链接上时 Enter 交给它本身；焦点在已选中的选项上时 Enter 进入下一题。
    if(event.key==='Enter'&&(!target.closest('button,a,summary')||target.closest('.opt[aria-pressed="true"]'))){event.preventDefault();nextQuestion();}
  });
  window.addEventListener('beforeunload',saveSession);window.addEventListener('pagehide',saveSession);
  // 页面切到后台（换标签页、手机锁屏）时暂停计时，回来后继续。
  document.addEventListener('visibilitychange',()=>{if(document.hidden){if(page==='quiz')pauseSession();else saveSession();}else if(page==='quiz'&&session&&!session.finished&&!session.startedAt)session.startedAt=Date.now();});
  // 另一个窗口改了学习记录时重新读取，避免这个窗口用旧数据把它覆盖掉。答题中的这一组练习不受影响。
  window.addEventListener('storage',event=>{
    if(event.storageArea!==localStorage||(event.key&&!event.key.startsWith('g1-')))return;
    hist=cleanHist(storage.get('g1-hist',{}));wrong=cleanWrong(storage.get('g1-wrong',{}));bookmarks=cleanBookmarks(storage.get('g1-bookmarks',{}));notes=cleanNotes(storage.get('g1-notes',{}));activity=cleanActivity(storage.get('g1-activity',{}));sessions=cleanSessions(storage.get('g1-sessions',[]));prefs=cleanPrefs(storage.get('g1-preferences',{}));lang=cleanLang(storage.get('g1-lang','both'),lang);
    if(page==='quiz'||page==='result'){applyPreferences(false);document.querySelectorAll('[data-count="wrong"]').forEach(el=>el.textContent=Object.keys(wrong).length);document.querySelectorAll('[data-count="bookmarks"]').forEach(el=>el.textContent=Object.keys(bookmarks).length);return;}
    session=validateSession(storage.get('g1-session',null));render(true);
  });
  setInterval(()=>{if(page==='quiz'&&session&&!session.finished&&session.startedAt){const timer=$('#session-timer');if(timer)timer.textContent=timeLabel(elapsed());}},1000);
  setInterval(()=>{if(page==='quiz')saveSession();},15000);
  if(window.matchMedia){const media=window.matchMedia('(prefers-color-scheme: dark)');media.addEventListener?.('change',()=>{if(prefs.theme==='system')applyPreferences();});}
  if($('#foot'))$('#foot').innerHTML=`${esc(META.footer)} <a href="${esc(META.handbook_url)}" target="_blank" rel="noopener noreferrer">官方手册 ${icon('external')}</a>`;
  render();
})();

</script>
