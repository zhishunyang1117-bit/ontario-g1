ft of the centre line is NOT permitted within how many metres of a bridge, viaduct or tunnel?","question_zh":"在距桥梁、高架桥或隧道多少米以内「不得」越过中心线从左侧超车？","options":[{"en":"30 metres","zh":"30 米"},{"en":"60 metres","zh":"60 米"},{"en":"100 metres","zh":"100 米"},{"en":"150 metres","zh":"150 米"}],"answer_index":0,"explanation_zh":"距桥梁、高架桥或隧道 30 米以内不得越过中心线从左侧超车（与行人过街设施 30 米内禁止超车的距离相同）。","explanation_en":"Passing left of the centre line is prohibited within 30 metres of a bridge, viaduct or tunnel.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-positions","source_title":"MTO 手册 · Changing positions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-64","group":"RC","section":"rules","topic_zh":"超车","question_en":"A motorcyclist ahead moves to the left side of the lane to avoid a pothole. You want to pass. What should you do?","question_zh":"前方摩托车手为避开坑洼移到车道左侧。你想超车，应该怎么做？","options":[{"en":"Pass in the same lane, using the space beside the motorcycle","zh":"在同一车道内利用摩托车旁边的空间超过去"},{"en":"Flash your headlights so the rider moves over further","zh":"闪大灯让骑手再让开一些"},{"en":"Follow closely until the rider returns to the centre","zh":"紧跟其后，直到骑手回到车道中间"},{"en":"Pass only by changing lanes, when it is safe","zh":"只能在安全时通过变换车道来超车"}],"answer_index":3,"explanation_zh":"摩托车、自行车等常为避开危险路况或让别人看到而靠向车道一侧，这不代表你可以在同一车道内超越；要超车必须变换车道。","explanation_en":"A rider moving to one side of the lane is not an invitation to pass in that lane; pass only by changing lanes.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-positions","source_title":"MTO 手册 · Changing positions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-65","group":"RC","section":"rules","topic_zh":"被超车","question_en":"On a high-speed road with three or more lanes each way, trucks are not allowed in the far left lane. You are in the lane next to it, and a truck behind you wants to pass. What should you do?","question_zh":"在每个方向有三条或以上车道的高速道路上，卡车不得使用最左侧车道。你在紧邻它的车道上行驶，后方有卡车想超车。你应该怎么做？","options":[{"en":"Stay in your lane; trucks may also pass in the far left lane","zh":"留在本车道，卡车也可以从最左侧车道超车"},{"en":"Move into the right-hand lane as soon as you can","zh":"尽快并入右侧车道"},{"en":"Speed up to stay ahead of the truck","zh":"加速保持在卡车前面"},{"en":"Move into the far left lane to let it go by","zh":"并入最左侧车道让它通过"}],"answer_index":1,"explanation_zh":"在这类道路上，与最左侧车道相邻的车道就是卡车超车道；如果你在这条车道上而卡车想超车，应尽快并入右侧车道。","explanation_en":"The lane next to the far left lane is the truck passing lane, so move to the right-hand lane as soon as you can.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-positions","source_title":"MTO 手册 · Changing positions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RC-66","group":"RC","section":"rules","topic_zh":"夜间超车","question_en":"When passing another vehicle at night, when should you switch on your high beams?","question_zh":"夜间超车时，应在什么时候打开远光灯？","options":[{"en":"While you approach the vehicle from behind","zh":"从后方接近该车辆时"},{"en":"Before you signal and pull out","zh":"打灯驶出之前"},{"en":"As you move alongside the vehicle you are passing","zh":"与被超车辆并行时"},{"en":"Only after you have returned to your lane","zh":"只有回到原车道之后"}],"answer_index":2,"explanation_zh":"夜间从后方接近车辆时用近光灯；驶出超车、与被超车辆并行时再开远光灯以看清前方；在后视镜中看到被超车辆整个车头后打灯并回右侧车道。","explanation_en":"Use low beams while approaching from behind and switch to high beams as you move alongside.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-positions","source_title":"MTO 手册 · Changing positions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-67","group":"RC","section":"rules","topic_zh":"路肩超车","question_en":"When may you drive on the shoulder to pass another vehicle?","question_zh":"什么情况下可以驶上路肩超车？","options":[{"en":"On the left shoulder, if it is paved and the lane ahead is blocked","zh":"左侧路肩，只要已铺装且前方车道受阻"},{"en":"On either shoulder, when traffic ahead has come to a stop","zh":"前方车辆停下时，左右路肩都可以"},{"en":"On the right shoulder, paved or not, whenever traffic is moving slowly","zh":"交通缓慢时可用右侧路肩，无论是否铺装"},{"en":"Only on a paved right shoulder, to pass a left-turning vehicle","zh":"只能在已铺装的右侧路肩上，用于超越正在左转的车辆"}],"answer_index":3,"explanation_zh":"只有在超越正在左转的车辆、且右侧路肩已铺装时，才可以驶上右侧路肩；任何情况下都不得利用左侧路肩超车，无论是否铺装。","explanation_en":"Use only a paved right shoulder, and only to pass a left-turning vehicle; never the left shoulder.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-positions","source_title":"MTO 手册 · Changing positions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-68","group":"RC","section":"rules","topic_zh":"右侧超车","question_en":"In which situation are you allowed to pass on the right?","question_zh":"以下哪种情况允许从右侧超车？","options":[{"en":"When overtaking a streetcar","zh":"超越有轨电车时"},{"en":"On a two-lane road, using the gravel shoulder","zh":"在双车道道路上利用碎石路肩"},{"en":"Whenever the vehicle ahead is under the speed limit","zh":"只要前车低于限速行驶"},{"en":"When passing a vehicle that is signalling a right turn","zh":"超越正打右转向灯的车辆时"}],"answer_index":0,"explanation_zh":"大多数超车从左侧进行；在多车道或单行道路上，或超越有轨电车、正在左转的车辆时，可以从右侧超车。","explanation_en":"You may pass on the right on multi-lane or one-way roads, or when overtaking a streetcar or a left-turning vehicle.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-positions","source_title":"MTO 手册 · Changing positions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-69","group":"RC","section":"rules","topic_zh":"有轨电车","question_en":"A streetcar has stopped and passengers are getting on and off from the road; there is no area set aside for them. Where must you stop?","question_zh":"一辆有轨电车停站，乘客直接在路面上下车，那里没有专设的乘客区域。你必须停在哪里？","options":[{"en":"At least 5 metres behind the front doors","zh":"前门后方至少 5 米处"},{"en":"At least 2 metres behind the rear doors","zh":"后门后方至少 2 米处"},{"en":"Beside the rear doors, if you go slowly","zh":"在后门旁边，只要慢速通过"},{"en":"At least 20 metres behind the streetcar","zh":"有轨电车后方至少 20 米处"}],"answer_index":1,"explanation_zh":"在有轨电车站，乘客上下车时应停在其后门后方至少 2 米处；设有专门乘客区域的车站不适用此规定，但应以合理车速通过，并提防行人突然移动。","explanation_en":"Stay at least two metres behind the rear doors where streetcar passengers are getting on or off.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-positions","source_title":"MTO 手册 · Changing positions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-70","group":"RC","section":"rules","topic_zh":"有轨电车","question_en":"You must pass streetcars on the right EXCEPT in which situation?","question_zh":"超越有轨电车必须从右侧，「除了」以下哪种情况？","options":[{"en":"The streetcar is stopped","zh":"有轨电车已停下"},{"en":"It is after dark","zh":"天黑以后"},{"en":"You are on a one-way road","zh":"你在单行道上行驶"},{"en":"The right lane is busy","zh":"右侧车道车多"}],"answer_index":2,"explanation_zh":"超越有轨电车必须从右侧，只有在单行道上行驶时例外。","explanation_en":"Streetcars must be passed on the right unless you are on a one-way road.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-positions","source_title":"MTO 手册 · Changing positions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RC-71","group":"RC","section":"rules","topic_zh":"相向左转","question_en":"Two vehicles coming from opposite directions are both waiting in an intersection to turn left. How should they turn?","question_zh":"两辆相向而来的车都停在路口内等待左转。它们应如何转弯？","options":[{"en":"Only one may turn at a time, and the vehicle that arrived first goes first","zh":"一次只能一辆转弯，先到的车先转"},{"en":"The vehicle on the right side of the intersection turns first, then the other","zh":"位于路口右侧的车先转，另一辆再转"},{"en":"Each yields to pedestrians and oncoming traffic, then turns to the left of the other","zh":"先让行人和对向来车，然后两车各自从对方的左侧转过"},{"en":"Both turn immediately, because pedestrians must wait for turning vehicles to clear","zh":"两车立即转弯，因为行人必须等转弯车辆先通过"}],"answer_index":2,"explanation_zh":"两辆相向的左转车在路口内相遇时，应先让行人和对向来车，然后各自从对方的左侧完成左转。","explanation_en":"When opposite left-turning vehicles meet in an intersection, each turns to the left of the other after yielding to pedestrians and oncoming traffic.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-72","group":"RC","section":"rules","topic_zh":"单行道左转入双向道","question_en":"You are turning left from a one-way road onto a two-way road. Which lanes should you use?","question_zh":"你要从单行道左转进入双向道路。应使用哪些车道？","options":[{"en":"From the left curb lane into the left curb lane","zh":"从左侧路缘车道转入左侧路缘车道"},{"en":"From the right curb lane into the right curb lane","zh":"从右侧路缘车道转入右侧路缘车道"},{"en":"From the left curb lane directly into the far right curb lane","zh":"从左侧路缘车道直接转入最右侧的路缘车道"},{"en":"From the left curb lane into the lane just right of the centre line","zh":"从左侧路缘车道转入紧靠中心线右侧的车道"}],"answer_index":3,"explanation_zh":"从单行道左转进入双向道路：从左侧路缘车道转入紧靠中心线右侧的车道，之后在可以时再并入右侧路缘车道。","explanation_en":"From a one-way road onto a two-way road, turn from the left curb lane into the lane just right of the centre line, then move to the right curb lane when you can.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-73","group":"RC","section":"rules","topic_zh":"踏板操作","question_en":"In a vehicle with an automatic transmission, which foot should you use for the brake and gas pedals?","question_zh":"驾驶自动挡车辆时，刹车踏板和油门踏板应该用哪只脚踩？","options":[{"en":"Your right foot for both pedals","zh":"两个踏板都用右脚"},{"en":"Left foot for the brake, right foot for the gas","zh":"左脚踩刹车，右脚踩油门"},{"en":"Right foot for the gas, left foot resting on the brake","zh":"右脚踩油门，左脚放在刹车上随时准备"},{"en":"Whichever foot is closer at the moment","zh":"当时哪只脚近就用哪只"}],"answer_index":0,"explanation_zh":"刹车和油门都用右脚操作，这样不会同时踩下两个踏板，也不会无谓地点亮刹车灯。","explanation_en":"Using your right foot for both pedals prevents pressing both at once or turning on your brake lights needlessly.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/stopping","source_title":"MTO 手册 · Stopping","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-74","group":"RC","section":"rules","topic_zh":"转向技巧","question_en":"How should you turn the steering wheel for a sharp turn?","question_zh":"急转弯时应如何转动方向盘？","options":[{"en":"Push it around using the flat palm of one hand","zh":"用一只手的掌心贴着方向盘推着转"},{"en":"Hand over hand, crossing one hand over the other","zh":"交叉手转向：一只手越过另一只手继续转"},{"en":"Spin it quickly with one finger hooked on the rim","zh":"用一根手指勾住方向盘边缘快速转动"},{"en":"Keep both hands fixed at 9 and 3 o'clock throughout","zh":"双手始终固定在 9 点和 3 点位置不动"}],"answer_index":1,"explanation_zh":"急转弯应采用交叉手转向法（hand over hand）：一只手转动方向盘，另一只手越过它抓住另一侧继续转。不要用一根手指或掌心转动方向盘。","explanation_en":"For a sharp turn use hand-over-hand steering, never one finger or the flat of your palm.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-75","group":"RC","section":"rules","topic_zh":"转向技巧","question_en":"You have completed a sharp turn. How should you return the steering wheel to the straight-ahead position?","question_zh":"你已完成一个急转弯。应如何让方向盘回到直行位置？","options":[{"en":"Let go of the wheel completely and let it spin back on its own","zh":"完全松开方向盘，让它自己转回去"},{"en":"Push it back quickly using the flat of your palm on the rim","zh":"用掌心贴着方向盘边缘迅速推回去"},{"en":"Relax your grip and let it slip or feed through your hands","zh":"放松握力，让方向盘在手中滑回，或两手轻轻递送回正"},{"en":"Brake firmly at the same time as you turn the wheel back","zh":"一边用力踩刹车一边把方向盘转回"}],"answer_index":2,"explanation_zh":"完成转弯后，放松握力，让方向盘在手中滑动或轻轻递送回正，同时逐渐加速。尽量不要同时刹车和转向，否则容易失控打滑。","explanation_en":"After a turn, relax your grip and let the wheel slip or feed it back through your hands; try not to brake and steer at the same time.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-76","group":"RC","section":"rules","topic_zh":"铁路道口","question_en":"Which of these should you avoid doing while driving across railway tracks?","question_zh":"驾车穿越铁路轨道时，应避免做下列哪件事？","options":[{"en":"Shifting gears while on the tracks","zh":"在轨道上换挡"},{"en":"Slowing down as you approach the crossing","zh":"接近道口时减速"},{"en":"Looking and listening in both directions","zh":"向两侧观察并留意听声音"},{"en":"Checking there is room to clear the tracks","zh":"确认对面有足够空间完全驶离轨道"}],"answer_index":0,"explanation_zh":"通过铁路道口时应避免换挡，也绝不要与火车抢行。减速、观察倾听和确认对面有空间都是应该做的。","explanation_en":"Avoid shifting gears while crossing railway tracks.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/stopping","source_title":"MTO 手册 · Stopping","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-77","group":"RC","section":"rules","topic_zh":"铁路道口：公共车辆","question_en":"You are following a city bus toward a railway crossing that has no gates, signal lights or stop sign. What should you expect?","question_zh":"你跟在一辆城市公交车后面，驶向一个没有栏杆、信号灯或停车标志的铁路道口。你应该预料到什么？","options":[{"en":"The bus will cross without stopping because there are no signals","zh":"公交车会直接通过，因为没有信号"},{"en":"The bus will likely stop at the crossing, so be ready to stop behind it","zh":"公交车很可能在道口停车，要准备在它后面停下"},{"en":"The bus will switch on red flashing lights and a stop arm","zh":"公交车会打开红色闪灯并伸出停车臂"},{"en":"The bus will pull onto the shoulder to let you pass first","zh":"公交车会驶上路肩让你先过"}],"answer_index":1,"explanation_zh":"大多数公交车和其他公共车辆必须在没有栏杆、信号灯或停车标志保护的铁路道口停车，跟在后面要准备停车。","explanation_en":"Most buses and public vehicles must stop at railway crossings not protected by gates, signal lights or a stop sign, so be ready to stop behind them.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/stopping","source_title":"MTO 手册 · Stopping","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-78","group":"RC","section":"rules","topic_zh":"下坡挡位","question_en":"You are driving a manual-transmission vehicle and are about to go down a long, steep hill. When should you shift into a lower gear?","question_zh":"你驾驶手动挡车辆，即将驶下一段又长又陡的下坡。应在什么时候换入低挡？","options":[{"en":"Halfway down, once you have picked up speed","zh":"下到一半、车速上来之后"},{"en":"Only if your brakes start to fade","zh":"只在刹车开始失效时"},{"en":"Before you start down the hill","zh":"在开始下坡之前"},{"en":"Never; shift into neutral and use the brakes","zh":"不用换挡，挂空挡靠刹车"}],"answer_index":2,"explanation_zh":"手动挡车辆下长陡坡应换低挡来控制车速，并且要在开始下坡前降挡，因为下坡途中可能已无法降挡。","explanation_en":"Shift down before starting down a long, steep hill, because it may not be possible once you are going downhill.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/stopping","source_title":"MTO 手册 · Stopping","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-79","group":"RC","section":"rules","topic_zh":"下坡挡位","question_en":"In a manual-transmission vehicle, which gear does the handbook suggest as a guide for going down a steep hill?","question_zh":"驾驶手动挡车辆下陡坡时，手册建议参考使用哪个挡位？","options":[{"en":"One gear higher than you would use going up","zh":"比上坡时高一挡"},{"en":"The highest gear, to save fuel","zh":"最高挡，以节省燃油"},{"en":"Neutral, letting the brakes control your speed","zh":"空挡，靠刹车控制车速"},{"en":"The same gear you would use going up the hill","zh":"与上坡时相同的挡位"}],"answer_index":3,"explanation_zh":"作为参考，下坡时应使用与上坡时相同的挡位，这样有助于控制车速，不必猛踩刹车。","explanation_en":"As a guide, use the same gear going downhill as you would going uphill.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/stopping","source_title":"MTO 手册 · Stopping","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-80","group":"RC","section":"rules","topic_zh":"环岛","question_en":"Once you are inside a roundabout, when may you stop?","question_zh":"进入环岛后，什么情况下可以停车？","options":[{"en":"Only to avoid a collision","zh":"只有为了避免碰撞时"},{"en":"To let a vehicle waiting at an entrance come in","zh":"为了让在入口等候的车辆进入"},{"en":"Whenever you are unsure which exit to take","zh":"每当不确定该走哪个出口时"},{"en":"Before changing into the other lane","zh":"在变换到另一条车道之前"}],"answer_index":0,"explanation_zh":"在环岛内不要停车，除非为了避免碰撞；你对正在进入的车辆享有先行权。在环岛内也不要变换车道。","explanation_en":"Inside a roundabout, do not stop except to avoid a collision, and do not change lanes.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-81","group":"RC","section":"rules","topic_zh":"环岛","question_en":"Why should you avoid entering a roundabout directly beside a vehicle that is already circulating?","question_zh":"为什么不应紧挨着一辆已在环岛内行驶的车辆并排驶入环岛？","options":[{"en":"It must yield to you once you are inside","zh":"你一进入，它就必须给你让行"},{"en":"It may be leaving at the next exit","zh":"它可能会从下一个出口驶出"},{"en":"Two vehicles may never travel side by side in a roundabout","zh":"两辆车在环岛内绝不允许并排行驶"},{"en":"It will have to change lanes to make room for you","zh":"它必须变道给你让出空间"}],"answer_index":1,"explanation_zh":"进入环岛要等循环车流中出现足够的空当。不要紧挨着已在环岛内的车辆驶入，因为它可能会从下一个出口驶出。","explanation_en":"Don't enter directly beside a circulating vehicle, because it may be exiting at the next exit.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-82","group":"RC","section":"rules","topic_zh":"右转位置","question_en":"Unless signs or pavement markings say otherwise, how should you position your vehicle for a right turn?","question_zh":"除非标志或路面标线另有指示，右转时应如何选择车辆位置？","options":[{"en":"Swing out to the left first to widen the turn","zh":"先向左摆出，以加大转弯半径"},{"en":"Start in the right lane and finish in any open lane","zh":"从右侧车道开始，转入任何空着的车道"},{"en":"Begin and end it close to the right side of the road","zh":"转弯开始和结束时都靠近道路右侧"},{"en":"Begin near the centre line and end in the left lane","zh":"从中心线附近开始，转入左侧车道"}],"answer_index":2,"explanation_zh":"右转应在靠近道路右侧处开始和结束；若右侧车道没有标线，就尽量靠右，并转入所进入道路的右侧车道。","explanation_en":"Begin and end a right turn close to the right side of the road, finishing in the right-hand lane of the road you enter.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-83","group":"RC","section":"rules","topic_zh":"超车限制","question_en":"You are behind a slow vehicle on a two-lane road and are approaching the crest of a hill. What should you do?","question_zh":"你在一条双车道道路上跟在一辆慢车后面，正驶近坡顶。应该怎么做？","options":[{"en":"Speed up and pass quickly before you reach the top","zh":"加速，在到达坡顶前迅速超车"},{"en":"Sound your horn to warn others, then pass","zh":"按喇叭提醒他人后超车"},{"en":"Pass on the paved right shoulder instead","zh":"改从铺砌的右侧路肩超车"},{"en":"Wait to pass until you can see clear road ahead","zh":"等能看清前方有足够的安全距离后再超车"}],"answer_index":3,"explanation_zh":"接近坡顶或在视线被遮挡的弯道上，看不到对向来车，也没有足够的安全距离，不要超车。右侧路肩只能用于超越正在左转的车辆。","explanation_en":"Do not pass near the crest of a hill or on a curve where you cannot see oncoming traffic and lack clear distance; the paved right shoulder may be used only to pass a left-turning vehicle.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-positions","source_title":"MTO 手册 · Changing positions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-84","group":"RC","section":"rules","topic_zh":"右侧超车","question_en":"You are in the far left lane of a multi-lane road with a slower vehicle ahead of you. What does the handbook advise?","question_zh":"你在多车道道路的最左侧车道行驶，前方有一辆较慢的车。手册建议怎么做？","options":[{"en":"Wait for it to move over to the right","zh":"等它向右让开"},{"en":"Change lanes quickly and pass it on the right","zh":"迅速变道，从右侧超过它"},{"en":"Flash your high beams until the driver moves over","zh":"连续闪远光灯，直到对方让开"},{"en":"Follow closely so that the driver notices you","zh":"紧跟在后面，让对方注意到你"}],"answer_index":0,"explanation_zh":"从右侧超车比从左侧更危险。在最左侧车道遇到慢车时，应等它向右让开；如果突然从右侧超车，前车可能恰好同时向右变道。","explanation_en":"Passing on the right is riskier, so wait for the slower vehicle to move right rather than suddenly passing on its right.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-positions","source_title":"MTO 手册 · Changing positions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-85","group":"RC","section":"rules","topic_zh":"左转车道选择","question_en":"This diagram shows a left turn from a one-way road onto a two-way road. Which lanes should you use?","question_zh":"这张示意图显示从单行道左转进入双向道路。你应该使用哪些车道？","options":[{"en":"From the left curb lane into the left curb lane of the two-way road","zh":"从左侧路缘车道转入双向道路的左侧路缘车道"},{"en":"From the left curb lane into the lane just right of the centre line, then to the right curb lane when you can","zh":"从左侧路缘车道转入紧靠中心线右侧的车道，之后在可以时并入右侧路缘车道"},{"en":"From the right curb lane into the lane just right of the centre line, staying there","zh":"从右侧路缘车道转入紧靠中心线右侧的车道，并一直留在该车道"},{"en":"From the left curb lane straight across into the right curb lane in one wide sweeping turn","zh":"从左侧路缘车道大幅转弯，一次直接进入右侧路缘车道"}],"answer_index":1,"explanation_zh":"从单行道左转进入双向道路时，应从左侧路缘车道转入紧靠中心线右侧的车道，之后在可以时再并入右侧路缘车道。","explanation_en":"Turn from the left curb lane into the lane just right of the centre line, then move to the right curb lane when you can.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"https://files.ontario.ca/2-27.jpg","sign_desc_en":"Diagram of a vehicle turning left from a one-way road onto a two-way road","sign_desc_zh":"车辆从单行道左转进入双向道路的示意图","difficulty":"medium"},{"id":"RC-86","group":"RC","section":"rules","topic_zh":"左转专用车道","question_en":"At this intersection, left-turn lanes are marked on the pavement, and you are in one of them. How should you make your left turn?","question_zh":"在这个路口，路面上标有左转车道，你正位于其中一条。你应该如何左转？","options":[{"en":"Move to the far left lane first, since every left turn must start there","zh":"先换到最左侧车道，因为所有左转都必须从那里开始"},{"en":"Turn into whichever lane of the new road has the least traffic","zh":"转入新道路上车流最少的车道"},{"en":"Turn from your marked lane and keep the same lane position on the new road","zh":"从你所在的标线车道转弯，并在新道路上保持相同的车道位置"},{"en":"Always finish the turn in the right curb lane of the new road","zh":"转弯后一律进入新道路的右侧路缘车道"}],"answer_index":2,"explanation_zh":"路面标有左转车道时，应从所标示的车道转弯，转入另一条道路时保持这一车道位置。“从最左侧车道开始左转”只适用于没有标志或路面标线另作规定的情况。","explanation_en":"Where left-turn lanes are marked, turn from the marked lane and keep that lane position as you turn onto the other road.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"https://files.ontario.ca/2-29.jpg","sign_desc_en":"Diagram of an intersection with left-turn lanes marked on the pavement","sign_desc_zh":"路面标有左转车道的路口示意图","difficulty":"medium"},{"id":"RC-87","group":"RC","section":"rules","topic_zh":"倒车","question_en":"You need to reverse to the left, as in this diagram. How should you look behind you?","question_zh":"你需要像图中那样向左倒车。你应该怎样观察后方？","options":[{"en":"Turn your body and head to the right and look back over your right shoulder only","zh":"向右转身转头，只从右肩上方向后看"},{"en":"Turn left, look over your left shoulder, and also check the opposite shoulder","zh":"向左转身转头，从左肩上方向后看，同时也查看另一侧肩后"},{"en":"Look over your left shoulder only; the right side does not need to be checked","zh":"只从左肩上方向后看，右侧无需查看"},{"en":"Face forward and rely on your inside mirror and left side mirror","zh":"面向前方，依靠车内后视镜和左侧后视镜观察"}],"answer_index":1,"explanation_zh":"向左倒车时，应向左转身转头，从左肩上方向后看，并且始终也要查看另一侧肩后。直线倒车或向右倒车时，才是向右转身、从右肩上方向后看。","explanation_en":"When reversing to the left, turn your body and head left, look over your left shoulder, and always check the opposite shoulder as well.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"https://files.ontario.ca/2-33.jpg","sign_desc_en":"Diagram showing a driver's body position while reversing a vehicle","sign_desc_zh":"驾驶员倒车时身体姿势的示意图","difficulty":"medium"},{"id":"RC-88","group":"RC","section":"rules","topic_zh":"倒车","question_en":"You are backing up and turning the steering wheel at the same time. What extra check does the handbook tell you to make?","question_zh":"你在倒车的同时转动方向盘。手册要求你额外检查什么？","options":[{"en":"That the front end of your vehicle does not hit anything","zh":"车头不会撞到任何物体"},{"en":"That your seatbelt stays fastened throughout the move","zh":"整个过程中安全带始终系好"},{"en":"That your hazard lights are flashing before you move","zh":"移动前已打开危险警示灯"},{"en":"That you have sounded your horn twice before moving","zh":"移动前已鸣喇叭两次"}],"answer_index":0,"explanation_zh":"倒车时如果同时转弯，要检查车头不会撞到任何物体。倒车时可以为便于转身观察而解开安全带，但向前行驶前必须重新系好。","explanation_en":"If you turn while reversing, check that the front end of your vehicle does not hit anything.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-89","group":"RC","section":"rules","topic_zh":"三点掉头","question_en":"This diagram shows a three-point turn. In which of these places should you NOT make one?","question_zh":"这张示意图显示的是三点掉头。在下列哪个地方不应该做三点掉头？","options":[{"en":"On a narrow road with a clear view in both directions","zh":"双向视线都很清楚的狭窄道路上"},{"en":"On a straight, level road with no traffic in sight","zh":"视野内没有车辆的笔直平坦道路上"},{"en":"Partway along a straight block, away from hills and bridges","zh":"笔直街段的中间，远离坡道和桥梁的地方"},{"en":"On a curve in the road","zh":"道路弯道上"}],"answer_index":3,"explanation_zh":"不要在弯道上、铁路道口上或附近、坡顶上或附近，或会遮挡视线的桥梁、隧道附近做三点掉头。三点掉头应从道路最右侧开始。","explanation_en":"Do not make a three-point turn on a curve, on or near a railway crossing or hilltop, or near a bridge or tunnel that blocks your view.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"https://files.ontario.ca/2-34.jpg","sign_desc_en":"Diagram showing the steps of a three-point turn","sign_desc_zh":"三点掉头步骤示意图","difficulty":"medium"},{"id":"RD-01","group":"RD","section":"rules","topic_zh":"禁止停车位置","question_en":"When you park near a fire hydrant, what is the minimum distance you must keep from it?","question_zh":"在消防栓附近停车时，车辆至少要与消防栓保持多远的距离？","options":[{"en":"1.5 metres","zh":"1.5 米"},{"en":"3 metres","zh":"3 米"},{"en":"6 metres","zh":"6 米"},{"en":"9 metres","zh":"9 米"}],"answer_index":1,"explanation_zh":"不得在消防栓 3 米以内停车。6 米是酒店、剧院等场所开放期间其公共入口的禁停距离，9 米是无信号灯路口的禁停距离。","explanation_en":"You may not park within 3 metres of a fire hydrant.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/parking-along-roadways","source_title":"MTO 手册 · Parking along roadways","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RD-02","group":"RD","section":"rules","topic_zh":"禁止停车位置","question_en":"You want to park near an intersection controlled by traffic lights. What is the minimum distance you must keep from the intersection?","question_zh":"你想在一个由交通信号灯控制的路口附近停车。车辆至少要离路口多远？","options":[{"en":"6 metres","zh":"6 米"},{"en":"9 metres","zh":"9 米"},{"en":"30 metres","zh":"30 米"},{"en":"15 metres","zh":"15 米"}],"answer_index":3,"explanation_zh":"由交通信号灯控制的路口，不得在 15 米以内停车；没有信号灯的路口，禁停范围是 9 米以内。","explanation_en":"Near a signal-controlled intersection you may not park within 15 metres.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/parking-along-roadways","source_title":"MTO 手册 · Parking along roadways","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-03","group":"RD","section":"rules","topic_zh":"禁止停车位置","question_en":"If no signs or other restrictions apply, which of these parking spots is allowed?","question_zh":"如果没有标志或其他限制，下列哪个停车位置是允许的？","options":[{"en":"10 metres from an intersection that has no traffic lights","zh":"距离无信号灯路口 10 米处"},{"en":"12 metres from an intersection controlled by traffic lights","zh":"距离由交通信号灯控制的路口 12 米处"},{"en":"2 metres from a fire hydrant","zh":"距离消防栓 2 米处"},{"en":"10 metres from the nearest rail of a level railway crossing","zh":"距离铁路平交道口最近铁轨 10 米处"}],"answer_index":0,"explanation_zh":"无信号灯路口的禁停范围是 9 米以内，所以 10 米处可以停。有信号灯的路口要离开 15 米以上，消防栓要离开 3 米以上，铁路平交道口要离最近铁轨 15 米以上。","explanation_en":"Without traffic lights the no-parking zone is 9 metres, so 10 metres away is allowed; the other spots are too close.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/parking-along-roadways","source_title":"MTO 手册 · Parking along roadways","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-04","group":"RD","section":"rules","topic_zh":"禁止停车位置","question_en":"You must not park within what distance of the nearest rail of a level railway crossing?","question_zh":"在铁路平交道口附近，不得在距最近铁轨多远的范围内停车？","options":[{"en":"5 metres","zh":"5 米"},{"en":"9 metres","zh":"9 米"},{"en":"15 metres","zh":"15 米"},{"en":"30 metres","zh":"30 米"}],"answer_index":2,"explanation_zh":"不得在距铁路平交道口最近铁轨 15 米以内停车。","explanation_en":"Do not park within 15 metres of the nearest rail of a level railway crossing.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/parking-along-roadways","source_title":"MTO 手册 · Parking along roadways","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-05","group":"RD","section":"rules","topic_zh":"禁止停车位置","question_en":"What parking restriction does the handbook set for bridges?","question_zh":"关于在桥梁处停车，手册有什么规定？","options":[{"en":"No parking on the bridge or within 15 metres of it","zh":"不得在桥上或距桥 15 米以内停车"},{"en":"No parking on the bridge or within 50 metres of it","zh":"不得在桥上或距桥 50 米以内停车"},{"en":"No parking on the bridge or within 150 metres of it","zh":"不得在桥上或距桥 150 米以内停车"},{"en":"No parking on the bridge or within 100 metres of it","zh":"不得在桥上或距桥 100 米以内停车"}],"answer_index":3,"explanation_zh":"不得在桥上或距桥 100 米以内停车。150 米是跟随出警消防车时必须保持的距离，不要混淆。","explanation_en":"You may not park on a bridge or within 100 metres of one.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/parking-along-roadways","source_title":"MTO 手册 · Parking along roadways","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RD-06","group":"RD","section":"rules","topic_zh":"禁止停车位置","question_en":"When a hotel, theatre or public hall is open to the public, you must not park within what distance of its public entrance?","question_zh":"酒店、剧院或公共会堂对公众开放期间，不得在其公共入口多远范围内停车？","options":[{"en":"9 metres","zh":"9 米"},{"en":"3 metres","zh":"3 米"},{"en":"6 metres","zh":"6 米"},{"en":"15 metres","zh":"15 米"}],"answer_index":2,"explanation_zh":"这类场所对公众开放期间，不得在其公共入口 6 米以内停车。3 米是消防栓的禁停距离，9 米是无信号灯路口的禁停距离。","explanation_en":"Keep at least 6 metres from the public entrance of an open hotel, theatre or public hall.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/parking-along-roadways","source_title":"MTO 手册 · Parking along roadways","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RD-07","group":"RD","section":"rules","topic_zh":"禁止停车位置","question_en":"Besides avoiding curves and hills, you should park only where you can see clearly in both directions for at least:","question_zh":"除了不在弯道和坡道上停车外，停车处还必须能向前、向后都清楚看到至少多远？","options":[{"en":"100 metres","zh":"100 米"},{"en":"125 metres","zh":"125 米"},{"en":"60 metres","zh":"60 米"},{"en":"150 metres","zh":"150 米"}],"answer_index":1,"explanation_zh":"停车处前后两个方向都要有至少 125 米的清晰视距，所以不能停在弯道、坡道等视线受阻的地方。","explanation_en":"You need a clear view of at least 125 metres in both directions to park.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/parking-along-roadways","source_title":"MTO 手册 · Parking along roadways","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-08","group":"RD","section":"rules","topic_zh":"开车门安全","question_en":"What is the 'Dutch reach' method for opening the driver's door of a parked vehicle?","question_zh":"什么是开驾驶座车门的「荷兰式开门法」（Dutch reach）？","options":[{"en":"Opening the door with your left hand while watching the side mirror","zh":"用左手开门，同时盯着该侧车外后视镜"},{"en":"Opening the door in two short stages so cyclists can notice it","zh":"分两小段开门，让骑车人有时间注意到车门"},{"en":"Opening the door with your right hand, which turns you for a shoulder check","zh":"用右手开门，身体随之转动，顺势转头查看盲区"},{"en":"Switching on the hazard lights before swinging the door open","zh":"先打开双闪灯，再推开车门"}],"answer_index":2,"explanation_zh":"荷兰式开门法是用右手开驾驶座车门，身体会随之转动，同时完成转头查看盲区（shoulder check），避免车门撞上贴近停放车辆骑行的骑车人。","explanation_en":"The Dutch reach means opening the driver's door with your right hand, which forces a shoulder check.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/parking-along-roadways","source_title":"MTO 手册 · Parking along roadways","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-09","group":"RD","section":"rules","topic_zh":"无障碍停车许可证","question_en":"Your father holds an Accessible Parking Permit. You borrow his car to go shopping alone, and his permit is in the car. May you park in a space reserved for people with disabilities?","question_zh":"你父亲持有无障碍停车许可证（Accessible Parking Permit）。你借他的车独自去购物，许可证就在车上。你可以停在残障人士专用车位吗？","options":[{"en":"Yes, as long as the permit is displayed on the dashboard","zh":"可以，只要把许可证放在仪表台上展示"},{"en":"Yes, because the permit is issued to the vehicle","zh":"可以，因为许可证是发给这辆车的"},{"en":"Yes, but only for a short stop of under 15 minutes","zh":"可以，但只限 15 分钟以内的短暂停留"},{"en":"No, because the permit holder is not travelling with you","zh":"不可以，因为持证人没有和你同车"}],"answer_index":3,"explanation_zh":"无障碍停车许可证发给持证人本人，不是发给车辆。车辆驶入及驶离指定车位时，持证人须为司机或乘客。你独自借车购物、持证人并未同行，不能凭其许可证使用无障碍车位。","explanation_en":"An Accessible Parking Permit is issued to a person, not a vehicle. The permit holder must be the driver or a passenger when the vehicle moves to and from the designated parking space. Borrowing the car and permit for your own solo trip does not entitle you to accessible parking.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/parking-along-roadways","source_title":"MTO 手册 · Parking along roadways","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-10","group":"RD","section":"rules","topic_zh":"无障碍停车许可证","question_en":"A regular Accessible Parking Permit, issued to people with permanent disabilities, has which colour and validity period?","question_zh":"发给永久性残障人士的普通（regular）无障碍停车许可证是什么颜色？有效期多久？","options":[{"en":"Blue, valid for five years","zh":"蓝色，有效期五年"},{"en":"Red, valid for five years","zh":"红色，有效期五年"},{"en":"Blue, valid for one year","zh":"蓝色，有效期一年"},{"en":"Green, valid for two years","zh":"绿色，有效期两年"}],"answer_index":0,"explanation_zh":"普通许可证为蓝色，发给永久性残障人士，有效期五年。红色是临时许可证，紫色是旅行者许可证（最长一年），绿色是机构许可证（最长五年）。","explanation_en":"The regular permit is blue and valid for five years.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/parking-along-roadways","source_title":"MTO 手册 · Parking along roadways","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-11","group":"RD","section":"rules","topic_zh":"无障碍停车许可证","question_en":"What is the maximum validity period of a temporary Accessible Parking Permit in Ontario?","question_zh":"安大略省的临时无障碍停车许可证，最长有效期是多少？","options":[{"en":"Six months","zh":"六个月"},{"en":"Twelve months","zh":"十二个月"},{"en":"Five years","zh":"五年"},{"en":"Two weeks","zh":"两周"}],"answer_index":1,"explanation_zh":"临时无障碍停车许可证最长有效期为十二个月；需要续办时，须由受监管医疗专业人员重新证明你的健康状况。","explanation_en":"A temporary Accessible Parking Permit is valid for up to 12 months. To renew it, a regulated healthcare practitioner must re-certify your health condition.","source_url":"https://www.ontario.ca/page/get-accessible-parking-permit","source_title":"ServiceOntario · Accessible parking permits","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RD-12","group":"RD","section":"rules","topic_zh":"无障碍停车许可证","question_en":"A permit holder is flying from an Ontario airport and leaving their car in the airport lot. Which permit is meant to stay on the parked car while the regular permit goes with the traveller?","question_zh":"持证人要从安大略省的机场乘机出行，把车留在机场停车场。哪种许可证是用来留在停放的车上、让普通许可证随人带走的？","options":[{"en":"A traveller permit (purple)","zh":"旅行者许可证（紫色）"},{"en":"A company permit (green)","zh":"机构许可证（绿色）"},{"en":"A temporary permit (red)","zh":"临时许可证（红色）"},{"en":"A photocopy of the regular permit","zh":"普通许可证的复印件"}],"answer_index":0,"explanation_zh":"旅行者许可证（紫色）发给持有有效许可证、并计划从安大略省机场乘机的人，有效期最长一年；离车时放在仪表台或遮阳板上，普通许可证随人带走。","explanation_en":"The purple traveller permit stays on the car parked at the airport and is valid for up to one year.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/parking-along-roadways","source_title":"MTO 手册 · Parking along roadways","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-13","group":"RD","section":"rules","topic_zh":"侧方停车","question_en":"When parallel parking, how long a space should you look for?","question_zh":"侧方停车（parallel parking）时，应该找多长的车位？","options":[{"en":"About the same as your vehicle's length","zh":"与本车长度相当"},{"en":"About 2 times your vehicle's length","zh":"约为本车长度的 2 倍"},{"en":"About 1.5 times your vehicle's length","zh":"约为本车长度的 1.5 倍"},{"en":"About 3 times your vehicle's length","zh":"约为本车长度的 3 倍"}],"answer_index":2,"explanation_zh":"侧方停车应找约为本车长度 1.5 倍的空位。准备时与空位前方的车并排、相隔约 1 米，本车后保险杠与该车对齐后停住。","explanation_en":"Look for a space about one and a half times your vehicle's length.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/parking-along-roadways","source_title":"MTO 手册 · Parking along roadways","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RD-14","group":"RD","section":"rules","topic_zh":"侧方停车","question_en":"You have stopped about a metre beside the car ahead of an empty space, with your rear bumper in line with that car. As you begin to reverse slowly into the space, what should you do with the steering wheel?","question_zh":"你已停在空车位前方那辆车旁边，相距约 1 米，本车后保险杠与它对齐。开始慢慢倒车进位时，方向盘应该怎么打？","options":[{"en":"Turn it fully toward the curb","zh":"向路缘一侧打满"},{"en":"Turn it fully toward the road","zh":"向道路一侧打满"},{"en":"Keep it straight until your rear wheel reaches the curb","zh":"保持回正，直到后轮靠近路缘"},{"en":"Turn it halfway toward the road","zh":"向道路一侧打半圈"}],"answer_index":0,"explanation_zh":"步骤是：先向路缘一侧打满，慢慢倒车；看到空位前方那辆车的外侧后角时，回正车轮继续倒；再把方向盘向道路一侧打满，使车身与路缘平行。","explanation_en":"Reverse slowly with the steering wheel turned fully toward the curb.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/parking-along-roadways","source_title":"MTO 手册 · Parking along roadways","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-15","group":"RD","section":"rules","topic_zh":"侧方停车","question_en":"On a one-way road where parking is allowed and no signs say otherwise, where may you parallel park?","question_zh":"在允许停车、也没有标志另作规定的单行道上，可以在哪一侧侧方停车？","options":[{"en":"Only on the right side","zh":"只能在右侧"},{"en":"On either side of the road","zh":"道路两侧都可以"},{"en":"Only on the left side","zh":"只能在左侧"},{"en":"Nowhere, unless angle parking is marked","zh":"不能停，除非标有斜向停车"}],"answer_index":1,"explanation_zh":"一般道路应按行驶方向停在右侧；但单行道上若无标志另作规定，两侧都可以侧方停车。","explanation_en":"Unless signs say otherwise, you may parallel park on both sides of a one-way road.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/parking-along-roadways","source_title":"MTO 手册 · Parking along roadways","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-16","group":"RD","section":"rules","topic_zh":"坡道停车","question_en":"You are parking facing downhill. Which way should you turn your front wheels?","question_zh":"你在坡道上停车，车头朝下坡。前轮应该朝哪个方向？","options":[{"en":"Straight ahead, relying on the parking brake","zh":"保持正直，依靠驻车制动"},{"en":"Toward the road, away from the curb","zh":"朝向道路，远离路缘"},{"en":"Toward the curb or right shoulder","zh":"朝向路缘或右侧路肩"},{"en":"Either way, as long as the engine is off","zh":"哪个方向都行，只要熄火即可"}],"answer_index":2,"explanation_zh":"车头朝下坡时，前轮应朝向路缘或右侧路肩；万一制动松脱，车会靠向路边，而不会溜进车流。","explanation_en":"Facing downhill, turn your front wheels toward the curb or right shoulder.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/parking-along-roadways","source_title":"MTO 手册 · Parking along roadways","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-17","group":"RD","section":"rules","topic_zh":"坡道停车","question_en":"You are parking facing uphill beside a curb. How should you set your front wheels?","question_zh":"你在有路缘的路段停车，车头朝上坡。前轮应该怎样摆？","options":[{"en":"Turn the steering wheel sharply right, toward the curb","zh":"方向盘向右打到底，使前轮朝向路缘"},{"en":"Keep the wheels straight and rely on the parking brake","zh":"前轮保持正直，依靠驻车制动"},{"en":"Turn the steering wheel slightly right","zh":"方向盘稍微向右打"},{"en":"Turn the steering wheel left, toward the road","zh":"方向盘向左打，使前轮朝向道路"}],"answer_index":3,"explanation_zh":"上坡且有路缘时，方向盘向左打，让前轮朝向道路；车辆向后溜时，轮胎会抵住路缘。","explanation_en":"Facing uphill with a curb, turn the wheels left so the tires catch the curb if the car rolls back.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/parking-along-roadways","source_title":"MTO 手册 · Parking along roadways","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-18","group":"RD","section":"rules","topic_zh":"坡道停车","question_en":"You are parking facing uphill on a road with no curb. Which way should you turn your wheels?","question_zh":"你在没有路缘的路段停车，车头朝上坡。车轮应向哪边打？","options":[{"en":"Sharply to the left","zh":"向左打到底"},{"en":"Sharply to the right","zh":"向右打到底"},{"en":"Straight ahead","zh":"保持正直"},{"en":"Slightly to the left","zh":"稍微向左"}],"answer_index":1,"explanation_zh":"上坡无路缘时，车轮要向右打到底；万一溜车，车会滑离路面，而不是滑进车流。","explanation_en":"Uphill without a curb, turn the wheels sharply right so the car would roll off the road.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/parking-along-roadways","source_title":"MTO 手册 · Parking along roadways","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-19","group":"RD","section":"rules","topic_zh":"路边临时停车","question_en":"When you make a short roadside stop, you should stop parallel to the curb or edge of the road and no more than about how far from it?","question_zh":"在路边短暂停车时，车身应与路缘或路边平行，并且离路缘不超过约多少？","options":[{"en":"30 centimetres","zh":"30 厘米"},{"en":"1 metre","zh":"1 米"},{"en":"60 centimetres","zh":"60 厘米"},{"en":"10 centimetres","zh":"10 厘米"}],"answer_index":0,"explanation_zh":"路边停车时要逐渐减速、与路缘平行，离路缘不超过约 30 厘米，并且不要挡住出入口或其他车辆。","explanation_en":"Stop parallel to the curb, no more than about 30 cm from it.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/parking-along-roadways","source_title":"MTO 手册 · Parking along roadways","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-20","group":"RD","section":"rules","topic_zh":"路边临时停车","question_en":"You plan to pull over at the roadside, but a car is waiting to enter the road from a driveway between you and the spot where you will stop. When should you turn on your signal?","question_zh":"你打算在路边停车，但在你和停车点之间，有一辆车正等着从私家车道（driveway）驶入道路。你应该什么时候打转向灯？","options":[{"en":"Right away, before you start to slow down","zh":"立即打，在开始减速之前"},{"en":"Only after you have come to a full stop","zh":"完全停稳之后才打"},{"en":"After you have passed the driveway","zh":"驶过那个私家车道口之后"},{"en":"Not at all; use your hazard lights instead","zh":"不打转向灯，改开双闪灯"}],"answer_index":2,"explanation_zh":"通常应在减速前打灯；但如果你和停车点之间有车辆等着从支路或私家车道驶入，应等驶过这些路口再打灯，以免对方误以为你要在那里转弯。","explanation_en":"Wait until you pass the driveway so the waiting driver does not think you are turning into it.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/parking-along-roadways","source_title":"MTO 手册 · Parking along roadways","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RD-21","group":"RD","section":"rules","topic_zh":"路边临时停车","question_en":"You are ready to pull back into traffic from a roadside stop. Which step is correct?","question_zh":"路边停车后准备重新驶入车流，下列哪个步骤是正确的？","options":[{"en":"Keep the hazard lights on until you reach the speed of traffic","zh":"一直开着双闪灯，直到达到车流速度"},{"en":"Turn off the hazard lights, signal left, then check mirrors and blind spot","zh":"关闭双闪灯，打左转向灯，再检查后视镜和盲区"},{"en":"Signal right, then pull out slowly and merge into the lane","zh":"打右转向灯，然后慢慢驶出并入车道"},{"en":"Flash your high beams twice to warn approaching traffic","zh":"闪两下远光灯，提醒后方来车"}],"answer_index":1,"explanation_zh":"重新驶出时：松开驻车制动并挂挡，关闭双闪灯、打左转向灯，起步前检查后视镜和盲区，回到车流后关掉转向灯。","explanation_en":"Turn off the hazard lights, signal left and check mirrors and blind spot before pulling out.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/parking-along-roadways","source_title":"MTO 手册 · Parking along roadways","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-22","group":"RD","section":"rules","topic_zh":"驶入高速公路","question_en":"What is the purpose of the acceleration lane at a freeway entrance?","question_zh":"高速公路入口处的加速车道有什么作用？","options":[{"en":"To stop and wait until a large gap appears in freeway traffic","zh":"停下来等高速车流中出现大空档"},{"en":"To slow down before joining the freeway","zh":"并入高速前先减速"},{"en":"To pass slower vehicles on the ramp","zh":"超越匝道上较慢的车辆"},{"en":"To match your speed to freeway traffic before merging","zh":"并入前把车速提高到与高速车流一致"}],"answer_index":3,"explanation_zh":"高速公路入口一般分为入口匝道和加速车道两部分。在加速车道上要打灯并加速到与主线车流相同的速度，再平顺并入。","explanation_en":"In the acceleration lane you speed up to match freeway traffic, then merge.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/freeway-driving","source_title":"MTO 手册 · Freeway driving","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RD-23","group":"RD","section":"rules","topic_zh":"驶入高速公路","question_en":"You are driving in the right lane of a freeway as vehicles merge from an entrance ramp. What should you do, if it is safe?","question_zh":"你在高速公路最右侧车道行驶，入口匝道上有车辆正在并入。在安全的前提下，你应该怎么做？","options":[{"en":"Speed up so they must merge behind you","zh":"加速，让它们只能并到你后面"},{"en":"Move over a lane to leave room for them","zh":"换到旁边车道，给它们留出空间"},{"en":"Brake hard to let them in","zh":"急刹车让它们进来"},{"en":"Sound your horn to warn them off","zh":"按喇叭警告它们"}],"answer_index":1,"explanation_zh":"主线上的司机在安全时应换到旁边车道，为并入车辆留出空间；任何车辆变道或并入时，都不得强行插到其他车辆前面。","explanation_en":"Freeway drivers should move over, if safe, to make room for merging vehicles.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/freeway-driving","source_title":"MTO 手册 · Freeway driving","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RD-24","group":"RD","section":"rules","topic_zh":"高速公路行驶","question_en":"When driving at freeway speeds, how far ahead should you look?","question_zh":"在高速公路上以较高车速行驶时，应向前看多远？","options":[{"en":"To where you will be in 3 to 5 seconds","zh":"约 3～5 秒后你将到达的位置"},{"en":"To where you will be in 8 to 10 seconds","zh":"约 8～10 秒后你将到达的位置"},{"en":"To where you will be in 15 to 20 seconds","zh":"约 15～20 秒后你将到达的位置"},{"en":"Only to the vehicle directly in front","zh":"只看正前方那辆车"}],"answer_index":2,"explanation_zh":"高速行驶时应观察 15～20 秒后将到达的位置，或尽可能远的地方，并持续扫视、经常查看后视镜。","explanation_en":"Look ahead to where you will be in the next 15 to 20 seconds.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/freeway-driving","source_title":"MTO 手册 · Freeway driving","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-25","group":"RD","section":"rules","topic_zh":"高速公路车道使用","question_en":"On a multi-lane freeway, how should you use the far left lane?","question_zh":"在多车道高速公路上，最左侧车道应该怎么用？","options":[{"en":"As your normal driving lane once you reach the speed limit","zh":"达到限速后作为日常行驶车道"},{"en":"Only when you are preparing to exit the freeway","zh":"只在准备驶出高速公路时使用"},{"en":"Only when the right-hand lanes are occupied by large trucks","zh":"只有右侧车道被大型卡车占用时才用"},{"en":"To pass traffic going slower than the limit, then return right","zh":"用于超越低于限速行驶的车辆，超完回到右侧"}],"answer_index":3,"explanation_zh":"最左侧车道用于超越低于限速行驶的车辆，但不要一直占用；能靠右就靠右行驶，把其他车道留给超车。","explanation_en":"Use the far left lane to pass slower traffic, then move back to the right.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/freeway-driving","source_title":"MTO 手册 · Freeway driving","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RD-26","group":"RD","section":"rules","topic_zh":"高速公路车道使用","question_en":"On many freeways with three or more lanes in each direction, what restriction applies to large trucks?","question_zh":"在许多单向三车道或以上的高速公路上，大型卡车受到什么限制？","options":[{"en":"They must stay in the far right lane at all times, even to pass","zh":"必须一直在最右侧车道行驶，超车也不例外"},{"en":"They may not use the far left lane and pass using the lane to its right","zh":"不得使用最左侧车道，超车须用其右侧的车道"},{"en":"They must travel in the HOV lane whenever they carry a passenger","zh":"只要载有乘客，就必须在 HOV 车道行驶"},{"en":"They may not pass other vehicles at all on these freeways","zh":"在这类高速公路上完全不得超车"}],"answer_index":1,"explanation_zh":"在许多单向三车道或以上的高速公路上，大型卡车不能在最左侧车道行驶，超车须使用其右侧的车道；大型卡车也不得使用 HOV 车道。","explanation_en":"On many freeways with 3+ lanes each way, large trucks may not use the far left lane.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/freeway-driving","source_title":"MTO 手册 · Freeway driving","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RD-27","group":"RD","section":"rules","topic_zh":"驶出高速公路","question_en":"You are leaving a freeway. When should you start to reduce your speed?","question_zh":"你准备驶出高速公路。应该从什么时候开始减速？","options":[{"en":"While still in the through lane, before signalling","zh":"仍在主线车道上、打灯之前"},{"en":"As soon as you see the first exit sign","zh":"一看到第一块出口预告标志就减速"},{"en":"Once you are in the deceleration lane","zh":"进入减速车道之后"},{"en":"Only when you reach the end of the exit ramp","zh":"到达出口匝道尽头时才减速"}],"answer_index":2,"explanation_zh":"驶出时先打灯进入减速车道，在主线上不要减速；进入减速车道后再逐渐降到出口匝道标示的速度，并准备在匝道尽头停车。","explanation_en":"Signal and move into the deceleration lane without slowing, then reduce speed there.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/freeway-driving","source_title":"MTO 手册 · Freeway driving","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-28","group":"RD","section":"rules","topic_zh":"驶出高速公路","question_en":"After a long stretch of high-speed freeway driving, you may feel you are going slower than you really are. What is this called?","question_zh":"长时间在高速公路上高速行驶后，你可能会觉得车速比实际慢。这种现象叫什么？","options":[{"en":"Highway hypnosis","zh":"公路催眠"},{"en":"Tunnel vision","zh":"隧道视野"},{"en":"Overdriving your headlights","zh":"车速超出前灯照明范围"},{"en":"Speed adaptation (velocitization)","zh":"速度适应（velocitization）"}],"answer_index":3,"explanation_zh":"这叫速度适应（velocitization），即判断车速的能力下降。驶出高速时尤其危险，所以要查看车速表，确认已降到出口匝道的标示速度。","explanation_en":"Losing your sense of speed after freeway driving is called speed adaptation or velocitization.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/freeway-driving","source_title":"MTO 手册 · Freeway driving","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-29","group":"RD","section":"rules","topic_zh":"驶出高速公路","question_en":"You have just missed your freeway exit. What should you do?","question_zh":"你刚刚错过了高速公路出口。应该怎么做？","options":[{"en":"Stop on the shoulder and reverse to the exit","zh":"停在路肩上，倒车回到出口"},{"en":"Continue to the next exit","zh":"继续行驶，从下一个出口驶出"},{"en":"Brake sharply and cut across to the ramp","zh":"急刹车并横穿到匝道"},{"en":"Make a U-turn through the median","zh":"从中央隔离带掉头"}],"answer_index":1,"explanation_zh":"错过出口时，不得在高速公路上停车或倒车，应从下一个出口驶出。出口预告标志设置得足够早，便于提前安全变道。","explanation_en":"Never stop or back up on a freeway; take the next exit.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/freeway-driving","source_title":"MTO 手册 · Freeway driving","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RD-30","group":"RD","section":"rules","topic_zh":"高乘载车道 HOV","question_en":"To use an HOV lane on a provincial highway, an ordinary passenger car must carry at least how many people?","question_zh":"在省级公路上，普通乘用车要使用高乘载车道（HOV），车上至少需要几个人？","options":[{"en":"Two","zh":"两人"},{"en":"One (the driver)","zh":"一人（司机本人）"},{"en":"Three","zh":"三人"},{"en":"Four","zh":"四人"}],"answer_index":0,"explanation_zh":"高乘载车道供至少载有两人的车辆使用；此外还包括公交车、持牌出租车、绿色车牌车辆、机场豪华轿车、摩托车、HOT 许可持有者（准许时）和应急车辆。","explanation_en":"Ordinary vehicles need at least two people on board to use an HOV lane.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/freeway-driving","source_title":"MTO 手册 · Freeway driving","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RD-31","group":"RD","section":"rules","topic_zh":"高乘载车道 HOV","question_en":"A large truck with three people on board wants to use an HOV lane. Is this allowed?","question_zh":"一辆载有三人的大型卡车想使用高乘载车道（HOV）。这是否允许？","options":[{"en":"Yes, because it carries at least two people","zh":"可以，因为车上至少有两人"},{"en":"Yes, but only outside rush hours","zh":"可以，但只限非高峰时段"},{"en":"No, large trucks are never permitted in HOV lanes","zh":"不可以，大型卡车一律不得使用 HOV 车道"},{"en":"Yes, if it is shorter than 10 metres","zh":"可以，只要车长不足 10 米"}],"answer_index":2,"explanation_zh":"无论载有多少人，大型卡车都不得使用 HOV 车道。商用车须载两人或以上、且总长不足 6.5 米才可使用。","explanation_en":"Large trucks are banned from HOV lanes regardless of the number of occupants.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/freeway-driving","source_title":"MTO 手册 · Freeway driving","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-32","group":"RD","section":"rules","topic_zh":"高乘载车道 HOV","question_en":"A commercial motor vehicle may use an HOV lane only if it has two or more people on board and a total length of less than:","question_zh":"商用机动车要使用高乘载车道（HOV），除车上须有两人或以上外，车辆总长度还必须小于：","options":[{"en":"6.5 metres","zh":"6.5 米"},{"en":"5 metres","zh":"5 米"},{"en":"8 metres","zh":"8 米"},{"en":"12.5 metres","zh":"12.5 米"}],"answer_index":0,"explanation_zh":"商用车使用 HOV 车道须同时满足两个条件：车上两人或以上，且车辆总长不足 6.5 米。","explanation_en":"Commercial vehicles need two or more occupants and a total length under 6.5 metres.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/freeway-driving","source_title":"MTO 手册 · Freeway driving","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RD-33","group":"RD","section":"rules","topic_zh":"高乘载车道 HOV","question_en":"Which of these vehicles may use an HOV lane with only the driver on board?","question_zh":"下列哪种车辆只有司机一人时也可以使用高乘载车道（HOV）？","options":[{"en":"A commercial motor vehicle under 6.5 metres long","zh":"车长不足 6.5 米的商用机动车"},{"en":"A large truck","zh":"大型卡车"},{"en":"A car with out-of-province licence plates","zh":"挂外省车牌的轿车"},{"en":"A vehicle with green licence plates","zh":"挂绿色车牌的车辆"}],"answer_index":3,"explanation_zh":"挂绿色车牌（发给符合条件的插电式混合动力车和纯电动车）的车辆，不论车上几人都可以使用 HOV 车道。商用车须载两人或以上且总长不足 6.5 米，大型卡车则一律不得使用。","explanation_en":"Green-plate vehicles may use HOV lanes with any number of occupants.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/freeway-driving","source_title":"MTO 手册 · Freeway driving","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-34","group":"RD","section":"rules","topic_zh":"高乘载车道 HOV","question_en":"On provincial highways, an HOV lane is separated from the general lanes by a striped buffer zone. What is the rule about crossing it?","question_zh":"在省级公路上，高乘载车道（HOV）与普通车道之间用斜线缓冲区隔开。关于跨越这个缓冲区，规定是什么？","options":[{"en":"You may cross it when traffic is light","zh":"车少时可以跨越"},{"en":"You may cross it to pass a slower vehicle","zh":"为超越慢车可以跨越"},{"en":"Crossing it is illegal and unsafe","zh":"跨越缓冲区既违法又不安全"},{"en":"Only motorcycles may cross it","zh":"只有摩托车可以跨越"}],"answer_index":2,"explanation_zh":"HOV 车道与普通车道之间的斜线缓冲区标线不得跨越，跨越既违法也不安全；违规使用 HOV 车道的人须在下一个进出区（entry/exit zone）回到普通车道。","explanation_en":"It is illegal and unsafe to cross the striped HOV buffer markings.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/freeway-driving","source_title":"MTO 手册 · Freeway driving","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-35","group":"RD","section":"rules","topic_zh":"高乘载车道 HOV","question_en":"A police officer stops you for driving alone in an HOV lane in an ordinary car. Besides being ticketed, what are you required to do?","question_zh":"你独自驾驶普通轿车使用高乘载车道（HOV），被警察拦下。除了被开罚单外，你还必须怎么做？","options":[{"en":"Cross the striped buffer into the general lanes right away","zh":"立即跨过斜线缓冲区回到普通车道"},{"en":"Re-enter the general lanes at the next entry/exit zone","zh":"在下一个进出区回到普通车道"},{"en":"Leave the freeway completely at the next exit","zh":"从下一个出口完全驶离高速公路"},{"en":"Stay in the HOV lane until your own exit","zh":"留在 HOV 车道，直到自己的出口"}],"answer_index":1,"explanation_zh":"违规使用 HOV 车道会被警察拦停并开罚单，并须在下一个进出区回到普通车道；不能直接跨越斜线缓冲区。","explanation_en":"You must return to the general lanes at the next entry/exit zone.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/freeway-driving","source_title":"MTO 手册 · Freeway driving","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-36","group":"RD","section":"rules","topic_zh":"高乘载车道 HOV","question_en":"When do the HOV lane rules on provincial highways apply?","question_zh":"省级公路上的高乘载车道（HOV）规定在什么时间生效？","options":[{"en":"24 hours a day, seven days a week","zh":"每天 24 小时、每周 7 天"},{"en":"Weekday rush hours only","zh":"只在工作日高峰时段"},{"en":"6 a.m. to 7 p.m., Monday to Friday","zh":"周一至周五早 6 点至晚 7 点"},{"en":"Only when overhead signs are flashing","zh":"只在头顶标志闪烁时"}],"answer_index":0,"explanation_zh":"省级公路的 HOV 车道全天 24 小时、每周 7 天开放，相关限制始终有效。","explanation_en":"Provincial HOV lanes operate 24 hours a day, seven days a week.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/freeway-driving","source_title":"MTO 手册 · Freeway driving","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RD-37","group":"RD","section":"rules","topic_zh":"路怒","question_en":"You believe an angry driver is following you. What should you do?","question_zh":"你认为有一名愤怒的司机在跟踪你。应该怎么做？","options":[{"en":"Drive straight home and go inside","zh":"直接开回家进屋"},{"en":"Pull over and talk it out with the driver","zh":"靠边停车，和对方当面讲清楚"},{"en":"Brake suddenly to make the driver back off","zh":"突然刹车，逼对方后退"},{"en":"Drive to a police station or a busy public place","zh":"开到警察局或人多的公共场所"}],"answer_index":3,"explanation_zh":"如果怀疑被跟踪，不要开回家，应开到警察局或人多的公共场所。","explanation_en":"If you are being followed, drive to a police station or busy public place, not home.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RD-38","group":"RD","section":"rules","topic_zh":"路怒","question_en":"Another driver is acting in a threatening way toward you in traffic. What does the handbook recommend?","question_zh":"车流中另一名司机对你做出威胁举动。手册建议怎么做？","options":[{"en":"Stay in your locked vehicle and call police if you can","zh":"留在车内锁好车门，能报警就报警"},{"en":"Get out and calmly discuss it with the driver","zh":"下车和对方心平气和地谈"},{"en":"Make eye contact and gesture back so they know you're not afraid","zh":"与对方对视并回敬手势，表明你不怕"},{"en":"Follow the driver to record their licence plate","zh":"跟着对方记下车牌"}],"answer_index":0,"explanation_zh":"感到受威胁时，应留在车内并锁门，有手机就报警，可用喇叭和转向灯等信号引起他人注意；不要回敬对方，也不要与其对视。","explanation_en":"Stay in your locked car, call police, and use your horn and signals to attract attention.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RD-39","group":"RD","section":"rules","topic_zh":"飙车","question_en":"Besides the danger to everyone on the road, what legal risk do street racers face?","question_zh":"除了危及所有道路使用者，街头飙车者还面临什么法律风险？","options":[{"en":"Only a small municipal by-law fine","zh":"只有市政条例的小额罚款"},{"en":"Being charged under the Criminal Code of Canada","zh":"可能被依据《加拿大刑法典》起诉"},{"en":"No penalty unless a collision occurs","zh":"除非发生碰撞，否则不受处罚"},{"en":"A warning letter for a first offence","zh":"初犯只收到警告信"}],"answer_index":1,"explanation_zh":"街头飙车是最严重、最鲁莽的攻击性驾驶之一，飙车者可能被依据《加拿大刑法典》起诉。","explanation_en":"Street racers risk being charged under the Criminal Code of Canada.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-40","group":"RD","section":"rules","topic_zh":"疲劳驾驶","question_en":"Studies show that collisions involving drowsy drivers tend to happen most often during which periods?","question_zh":"研究显示，与疲劳驾驶有关的碰撞最常发生在哪些时段？","options":[{"en":"6 to 9 a.m. and 5 to 7 p.m.","zh":"早上 6～9 点和傍晚 5～7 点"},{"en":"10 p.m. to midnight and 11 a.m. to 1 p.m.","zh":"晚上 10 点至午夜和上午 11 点至下午 1 点"},{"en":"2 to 6 a.m. and 2 to 4 p.m.","zh":"凌晨 2～6 点和下午 2～4 点"},{"en":"Midnight to 2 a.m. only","zh":"只在午夜至凌晨 2 点"}],"answer_index":2,"explanation_zh":"疲劳相关碰撞多发生在深夜至清晨（凌晨 2～6 点）和下午（2～4 点）。轮班工作者、睡眠障碍未确诊或未治疗者和商用车司机风险更高。","explanation_en":"Drowsy-driving crashes peak from 2 to 6 a.m. and from 2 to 4 p.m.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-41","group":"RD","section":"rules","topic_zh":"疲劳驾驶","question_en":"You keep yawning, your mind wanders, and your car drifts toward the next lane. What should you do?","question_zh":"你不停打哈欠、注意力涣散，车还往旁边车道漂移。应该怎么做？","options":[{"en":"Open the window and turn up the radio to stay alert","zh":"打开车窗、调大收音机音量来提神"},{"en":"Drink a strong coffee and keep driving to your destination","zh":"喝杯浓咖啡，继续开到目的地"},{"en":"Speed up to get home sooner","zh":"加速早点到家"},{"en":"Pull off to a safe, secure place, lock the doors and nap","zh":"驶离道路，到安全的地方停车，锁好车门小睡"}],"answer_index":3,"explanation_zh":"出现疲劳警示信号就应驶离道路，在安全、明亮的休息区停车，锁门关窗小睡。兴奋剂不能代替睡眠，咖啡、开窗、调大音量的作用很快就会消失。","explanation_en":"Only sleep helps; pull off to a safe place and take a nap.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RD-42","group":"RD","section":"rules","topic_zh":"疲劳驾驶","question_en":"Which of these is a warning sign that you are drowsy enough to be at risk?","question_zh":"下列哪一项是疲劳已经严重到足以构成危险的警示信号？","options":[{"en":"Feeling hungry because you skipped a meal","zh":"因为没吃饭而感到饥饿"},{"en":"Noticing heavy traffic building up ahead of you","zh":"注意到前方交通越来越拥堵"},{"en":"Feeling a little cold inside the vehicle","zh":"觉得车内有点冷"},{"en":"Not remembering the last few kilometres you drove","zh":"想不起刚开过的几公里路的情况"}],"answer_index":3,"explanation_zh":"手册列出八个疲劳警示信号，包括难以睁眼、频繁打哈欠、想不起刚开过的几公里、错过信号灯、车辆漂移到邻道等。出现任何一项都应停车休息。","explanation_en":"Being unable to recall the last few kilometres is a drowsiness warning sign.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-43","group":"RD","section":"rules","topic_zh":"施工区","question_en":"While driving through a construction zone, what should you do?","question_zh":"驶过施工区时，你应该怎么做？","options":[{"en":"Change lanes often to get past slow vehicles","zh":"频繁变道超过慢车"},{"en":"Avoid changing lanes and be ready for sudden stops","zh":"不要变道，并随时准备突然停车"},{"en":"Speed up so you spend less time in the zone","zh":"加速，尽量缩短在施工区内的时间"},{"en":"Follow construction vehicles closely to keep traffic moving","zh":"紧跟施工车辆，保持车流顺畅"}],"answer_index":1,"explanation_zh":"在施工区内要按路况小心驾驶、不要变道、随时准备突然停车，并留意工人和施工车辆、设备；施工区常设较低的限速。","explanation_en":"In a construction zone, do not change lanes and be ready to stop suddenly.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RD-44","group":"RD","section":"rules","topic_zh":"施工区","question_en":"What happens to the fines for speeding in a construction zone when workers are present?","question_zh":"在有工人作业的施工区超速，罚款会怎样？","options":[{"en":"They are doubled","zh":"加倍"},{"en":"They are the same as elsewhere","zh":"与其他地方相同"},{"en":"They are tripled","zh":"变为三倍"},{"en":"They are replaced by a warning","zh":"改为警告"}],"answer_index":0,"explanation_zh":"根据《公路交通法》（Highway Traffic Act）的修订，在有工人作业的施工区超速，罚款加倍。","explanation_en":"Speeding fines are doubled in construction zones when workers are present.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RD-45","group":"RD","section":"rules","topic_zh":"施工区","question_en":"Road work blocks your lane and no one is directing traffic. What should you do?","question_zh":"道路施工堵住了你的车道，而且没有人指挥交通。你应该怎么做？","options":[{"en":"Yield to oncoming drivers, then go slowly around it","zh":"先让对向来车，再慢慢绕过障碍"},{"en":"Go first, because your lane is the blocked one","zh":"先走，因为被堵的是你的车道"},{"en":"Sound your horn and drive around right away","zh":"按喇叭后立即绕过去"},{"en":"Wait for a worker to arrive and direct you","zh":"等工人来指挥"}],"answer_index":0,"explanation_zh":"车道被堵且无人指挥时，应让对向驶来的车辆先行，确认安全后再慢慢、小心地绕过障碍。","explanation_en":"Yield to oncoming traffic, then move carefully around the obstacle.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-46","group":"RD","section":"rules","topic_zh":"施工区","question_en":"In a work zone, a traffic-control person holds up a SLOW sign. Which statement is correct?","question_zh":"施工区内，交通指挥人员举着 SLOW（慢行）牌。下列哪种说法正确？","options":[{"en":"It is only advice; you may keep your speed","zh":"那只是建议，可以保持原速"},{"en":"You must come to a full stop","zh":"必须完全停车"},{"en":"Only trucks need to obey it","zh":"只有卡车需要遵守"},{"en":"You must obey it; disobeying is an offence","zh":"必须服从，不服从属于违法"}],"answer_index":3,"explanation_zh":"不服从交通指挥人员或消防员出示的 STOP（停车）或 SLOW（慢行）牌属于违法行为。SLOW 牌要求减速慢行通过，而不是完全停车。","explanation_en":"Disobeying a traffic-control person's STOP or SLOW sign is an offence.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RD-47","group":"RD","section":"rules","topic_zh":"道路作业人员","question_en":"Ahead of you, a roadside-assistance worker is helping a disabled vehicle at the side of a road with two lanes in your direction. What should you do?","question_zh":"前方路边，一名道路救援人员正在处理一辆故障车；你所在方向有两条车道。你应该怎么做？","options":[{"en":"Keep your speed, since they are beside the road and not in your lane","zh":"保持车速，因为他们在路边，不在你的车道上"},{"en":"Slow down, pass with caution and, if safe, move over a lane","zh":"减速、小心通过，安全时换到远离他们的车道"},{"en":"Stop beside them in your lane and offer to help","zh":"在本车道停在他们旁边，提出帮忙"},{"en":"Sound your horn as you pass","zh":"经过时按喇叭提醒"}],"answer_index":1,"explanation_zh":"遇到道路救援人员、故障车辆、测量或养护人员等，应减速小心通过；安全时换到另一条车道，拉开与危险的距离。","explanation_en":"Slow down, pass with caution and move over a lane if it is safe.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-48","group":"RD","section":"rules","topic_zh":"道路上的动物","question_en":"Driving on a rural road at night, you see shining eyes at the roadside. What should you do?","question_zh":"夜间在乡村道路上行驶，你看到路边有发光的眼睛。应该怎么做？","options":[{"en":"Slow down and be ready to stop","zh":"减速并准备停车"},{"en":"Speed up to get past before the animal moves","zh":"加速，在动物动起来之前通过"},{"en":"Switch to low beams and keep your speed","zh":"换成近光灯并保持车速"},{"en":"Swerve into the opposite lane right away","zh":"立即转向对向车道"}],"answer_index":0,"explanation_zh":"看到路边有发光的眼睛，应减速并准备停车。在安全时尽量使用远光灯并扫视道路两侧；黄昏到黎明是野生动物最活跃的时段。","explanation_en":"If you see shining eyes at the roadside, slow down and be ready to stop.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RD-49","group":"RD","section":"rules","topic_zh":"道路上的动物","question_en":"You see a deer near the road ahead. What should you do?","question_zh":"你看到前方路边有一只鹿。应该怎么做？","options":[{"en":"Keep your speed and steer around the deer quickly","zh":"保持车速，迅速从鹿旁边绕过"},{"en":"Flash your high beams and accelerate past it before it moves","zh":"闪远光灯，趁它还没动加速驶过"},{"en":"Slow down, sound your horn and watch for other animals","zh":"减速、按喇叭，并留意是否还有其他动物"},{"en":"Stop and get out to chase it off the road","zh":"停车下去把它赶走"}],"answer_index":2,"explanation_zh":"看到动物应减速并按喇叭，留意可能同行的其他动物；不要试图绕过它，因为动物的行动难以预测；也不要下车。","explanation_en":"Slow down, sound your horn and watch for other animals; do not try to drive around it.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-50","group":"RD","section":"rules","topic_zh":"道路上的动物","question_en":"You would like to stop and watch a moose near the highway. What is the safest way to do this?","question_zh":"你想停车观看公路边的一头驼鹿。最安全的做法是什么？","options":[{"en":"Stop on the shoulder with your hazard lights on and watch from your car","zh":"停在路肩上打开双闪灯，在车里观看"},{"en":"Slow to a crawl in your lane","zh":"在本车道缓慢蠕行"},{"en":"Park on the shoulder and get out to take a photo from a distance","zh":"停在路肩上，下车远远地拍照"},{"en":"Pull completely off the road at a safe spot, park and stay inside","zh":"在安全处把车完全驶离道路停好，并留在车内"}],"answer_index":3,"explanation_zh":"想观看动物时，应找安全的地方把车完全驶离道路停好；不要停在路肩上，因为其他司机可能被动物吸引而撞上你；也应留在车内。","explanation_en":"Pull completely off the road, not onto the shoulder, and stay in your vehicle.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-51","group":"RD","section":"rules","topic_zh":"道路上的动物","question_en":"You hit a deer with your vehicle. To whom should you report it?","question_zh":"你的车撞到了一只鹿。应该向谁报告？","options":[{"en":"The local police service or the Ministry of Natural Resources","zh":"当地警察部门或自然资源部（Ministry of Natural Resources）"},{"en":"The Ministry of Transportation or a ServiceOntario centre","zh":"交通部（Ministry of Transportation）或 ServiceOntario 服务中心"},{"en":"Only your insurance company; police need not be told","zh":"只需告知保险公司，无须报警"},{"en":"No one, as long as the vehicle can still be driven safely","zh":"只要车还能安全行驶，就不用报告"}],"answer_index":0,"explanation_zh":"撞到鹿或驼鹿后，应报告当地警察部门或自然资源部；不要试图移动受伤的动物。","explanation_en":"Report it to local police or the Ministry of Natural Resources, and do not move the injured animal.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-52","group":"RD","section":"rules","topic_zh":"分心驾驶","question_en":"You are stopped at a red light. May you hold your phone to read and reply to a text?","question_zh":"你在红灯前停车等候。可以手持手机阅读并回复短信吗？","options":[{"en":"Yes, since your vehicle is not moving and the brake is on","zh":"可以，因为车没有在动，而且踩着刹车"},{"en":"Yes, if you put it down before the light changes","zh":"可以，只要变灯前放下"},{"en":"No, the law applies even while stopped at a red light","zh":"不可以，即使在红灯前停车，法规同样适用"},{"en":"Yes, but only on residential streets","zh":"可以，但只限住宅区街道"}],"answer_index":2,"explanation_zh":"驾驶期间（包括在车流中停住或等红灯时），手持手机或其他无线通讯设备发短信、拨号都是违法的，唯一例外是紧急情况下拨打 911。","explanation_en":"Hand-held device rules apply even when stopped in traffic or at a red light.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RD-53","group":"RD","section":"rules","topic_zh":"分心驾驶","question_en":"When may you use a hand-held phone to dial while driving?","question_zh":"驾驶时，什么情况下可以手持手机拨号？","options":[{"en":"To call a tow truck after a breakdown","zh":"车坏了叫清障车时"},{"en":"To call 911 in an emergency","zh":"紧急情况下拨打 911"},{"en":"When you are stopped in slow traffic","zh":"在缓慢车流中停住时"},{"en":"When the call will last under a minute","zh":"通话不超过一分钟时"}],"answer_index":1,"explanation_zh":"驾驶时用手持设备发短信或拨号属违法，唯一例外是紧急情况下拨打 911。可以使用耳机、领夹式或蓝牙等免提设备。","explanation_en":"The only exception for dialling on a hand-held phone is calling 911 in an emergency.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RD-54","group":"RD","section":"rules","topic_zh":"分心驾驶","question_en":"Which use of a GPS device is legal while driving?","question_zh":"驾驶时，下列哪种使用 GPS 导航设备的方式是合法的？","options":[{"en":"Typing in a new address while stopped at a red light","zh":"等红灯时手动输入新地址"},{"en":"Holding the device in your hand to read the map","zh":"手持设备看地图"},{"en":"Programming it by voice command","zh":"用语音指令设置导航"},{"en":"Watching a video on its screen","zh":"用它的屏幕看视频"}],"answer_index":2,"explanation_zh":"驾驶时只能用语音指令设置 GPS；导航屏幕必须内置于仪表台或牢固安装，才可以查看。观看与驾驶无关的视频属违法。","explanation_en":"You may program a GPS only by voice; its screen must be built in or securely mounted.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-55","group":"RD","section":"rules","topic_zh":"分心驾驶","question_en":"A driver is eating a burger while driving. Which statement is correct?","question_zh":"一名司机边开车边吃汉堡。下列哪种说法正确？","options":[{"en":"It falls under the distracted driving law, with the same penalty as texting","zh":"属于分心驾驶法规的范围，处罚与发短信相同"},{"en":"It is outside the distracted driving law, but can lead to a careless driving charge","zh":"不在分心驾驶法规范围内，但仍可能被控疏忽驾驶（careless driving）"},{"en":"It is always legal because no device is involved","zh":"因为不涉及电子设备，所以总是合法"},{"en":"It is illegal only on freeways","zh":"只有在高速公路上才违法"}],"answer_index":1,"explanation_zh":"吃喝、整理仪容、吸烟、阅读、伸手拿东西等不属于安大略省分心驾驶法规的范围，但仍可能被控疏忽驾驶或危险驾驶。","explanation_en":"Eating is not covered by the distracted driving law, but can still bring a careless driving charge.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-56","group":"RD","section":"rules","topic_zh":"分心驾驶","question_en":"You are talking on a hands-free Bluetooth device, and the distraction causes you to endanger other people. Which statement is true?","question_zh":"你在用蓝牙免提设备通话，分心导致你危及他人。下列哪种说法正确？","options":[{"en":"You cannot be charged, because hands-free use is allowed","zh":"不会被起诉，因为允许使用免提"},{"en":"You can be charged only if you hold a G1 licence","zh":"只有持 G1 驾照才会被起诉"},{"en":"You can be charged only if a collision results","zh":"只有发生碰撞才会被起诉"},{"en":"You can be charged with careless driving","zh":"你可能被控疏忽驾驶（careless driving）"}],"answer_index":3,"explanation_zh":"任何形式的分心（包括手持和免提设备）只要危及他人，都可能被控疏忽驾驶；情节严重还可能被控危险驾驶，这是刑事罪，可判长期监禁。","explanation_en":"Distraction from any device, even hands-free, can lead to a careless driving charge.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-57","group":"RD","section":"rules","topic_zh":"分心驾驶","question_en":"According to the handbook, texting or browsing on your phone while driving increases your risk of crashing by about how many times?","question_zh":"根据手册，开车时用手机发短信或浏览，撞车风险大约会提高到原来的几倍？","options":[{"en":"2 times","zh":"2 倍"},{"en":"4 times","zh":"4 倍"},{"en":"10 times","zh":"10 倍"},{"en":"20 times","zh":"20 倍"}],"answer_index":2,"explanation_zh":"发短信或浏览手机会让视线离开道路，使撞车风险提高到约 10 倍；研究还发现，这类司机对危险作出反应前要多行驶 28 米。","explanation_en":"Texting or browsing raises your crash risk about 10 times.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-58","group":"RD","section":"rules","topic_zh":"应急车辆","question_en":"On a road with one lane in each direction, an ambulance with flashing lights and siren is coming up behind you. What are you required to do?","question_zh":"在双向两车道（每个方向一条车道）的道路上，一辆闪着警灯、鸣着警笛的救护车从后方驶来。你必须怎么做？","options":[{"en":"Speed up to stay ahead of it until you reach a wide spot","zh":"加速保持在它前面，直到路面变宽"},{"en":"Pull fully onto the shoulder and stop there until it passes"
