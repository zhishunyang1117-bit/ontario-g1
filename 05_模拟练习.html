,"zh":"完全驶上路肩，停在那里等它通过"},{"en":"Stop at once in the middle of your lane","zh":"立刻在车道中间停车"},{"en":"Stop as close as practical to the right edge, clear of intersections","zh":"尽量靠近右侧路边停车，并避开路口"}],"answer_index":3,"explanation_zh":"应急车辆闪红灯（或红蓝灯）、鸣笛或响铃驶来时，必须立即停车，并尽可能靠近右侧路缘或路边，车身与道路平行、避开路口（包括高速匝道）。不要驶上或停在路肩上，因为应急车辆可能从路肩通行。","explanation_en":"Stop as near as practical to the right edge, clear of intersections, but not on the shoulder.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-59","group":"RD","section":"rules","topic_zh":"应急车辆","question_en":"On an undivided road, a fire truck with its siren sounding is approaching from the opposite direction. What must you do?","question_zh":"在没有中央分隔的道路上，一辆鸣着警笛的消防车从对向驶来。你必须怎么做？","options":[{"en":"Nothing, since it is travelling in the opposite lane","zh":"什么都不用做，因为它在对向车道行驶"},{"en":"Pull to the right edge and stop","zh":"靠右侧路边停车"},{"en":"Slow down and keep moving, but you do not need to stop","zh":"减速并继续行驶，但不用停车"},{"en":"Move into the left lane to give it room","zh":"驶入左侧车道给它让路"}],"answer_index":1,"explanation_zh":"应急车辆从任何方向驶来，并闪红灯或红蓝灯、鸣笛或响铃时，都必须立即停车，尽量靠近右侧路缘或路边；对向驶来也不例外。","explanation_en":"You must pull right and stop for an emergency vehicle approaching from any direction.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-60","group":"RD","section":"rules","topic_zh":"应急车辆","question_en":"You are in the far left lane of a divided highway with three lanes in your direction when an emergency vehicle with its siren on approaches. Where should you stop?","question_zh":"你在同向三车道的分隔式公路上，行驶在最左侧车道，这时一辆鸣笛的应急车辆驶近。你应该停在哪里？","options":[{"en":"At the left edge of the roadway, not on the shoulder","zh":"停在左侧路边，但不要驶上路肩"},{"en":"Across all the lanes, at the right edge of the roadway","zh":"横穿所有车道，停到右侧路边"},{"en":"On the left shoulder, out of the traffic lanes","zh":"停在左侧路肩上，离开行车道"},{"en":"In the middle lane, after moving over one lane","zh":"先换到中间车道，再停在那里"}],"answer_index":0,"explanation_zh":"在单行道或超过两条车道的分隔式公路上，应驶向最近的路缘或路边停车，不一定要靠右；同时不要驶上或停在路肩上，因为应急车辆可能借用路肩。","explanation_en":"On a one-way road or divided highway with more than two lanes, move to the closest edge, not onto the shoulder.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RD-61","group":"RD","section":"rules","topic_zh":"应急车辆","question_en":"You are in an intersection, about to turn left, when a fire truck with its siren on approaches. What should you do?","question_zh":"你已进入路口准备左转，这时一辆鸣笛的消防车驶近。你应该怎么做？","options":[{"en":"Complete your left turn as quickly as possible, then pull over","zh":"尽快完成左转，然后靠边"},{"en":"Stop where you are in the middle of the intersection","zh":"在路口中间原地停车"},{"en":"Back up out of the intersection to the stop line","zh":"倒车退出路口，回到停止线"},{"en":"Abandon the turn, go straight when safe, then pull right and stop","zh":"放弃转弯，安全时直行通过路口，然后靠右停车"}],"answer_index":3,"explanation_zh":"在路口准备转弯时遇到应急车辆，应放弃转弯，安全时直行驶出路口，再靠右停车；这样可以腾空路口，避免应急车辆从你原本要转向的一侧超车时发生碰撞。","explanation_en":"Abandon the turn, clear the intersection by going straight, then pull right and stop.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-62","group":"RD","section":"rules","topic_zh":"应急车辆","question_en":"A private car coming toward you shows a flashing green light. What does this usually indicate, and what should you do?","question_zh":"一辆私家车朝你驶来，车上闪着绿灯。这通常表示什么？你该怎么做？","options":[{"en":"A firefighter or volunteer medical responder; yield to them","zh":"消防员或志愿医疗急救人员正赶赴紧急情况；应让行"},{"en":"A funeral procession; let it pass as a group","zh":"送葬车队；让整个车队通过"},{"en":"A slow farm vehicle; pass it with care","zh":"慢速农用车；小心超车"},{"en":"A driving-school car; give it extra space","zh":"驾校教练车；多留些空间"}],"answer_index":0,"explanation_zh":"部分消防员和志愿医疗急救人员驾驶私家车赶赴火警或医疗急救时，会显示闪烁的绿灯，应让其先行。","explanation_en":"A flashing green light marks a firefighter or volunteer medical responder using their own vehicle; yield to them.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-63","group":"RD","section":"rules","topic_zh":"被警察示意停车","question_en":"A police car behind you turns on its flashing lights to pull you over. Where should you stop, if possible?","question_zh":"后方一辆警车打开警灯示意你靠边停车。如有可能，你应该停在哪里？","options":[{"en":"Right away in your traffic lane, as near the right edge as practical","zh":"立即停在所在车道上，尽量靠近右侧路边"},{"en":"In the left lane next to the median","zh":"停在靠近中央分隔带的左侧车道"},{"en":"Out of the traffic lanes on the shoulder, or on a nearby quiet side street","zh":"驶离行车道停在路肩上，或转入附近车少的小街"},{"en":"At the next gas station, even if it is several kilometres away","zh":"开到下一个加油站，哪怕在几公里外"}],"answer_index":2,"explanation_zh":"被警察示意靠边时，与为应急车辆让路不同：如有可能，应停在行车道之外的路肩上，或就近转入车少的小街停车；警察指定地点时按其指示。","explanation_en":"When pulled over, stop outside the traffic lanes on the shoulder or a nearby quiet side street.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-64","group":"RD","section":"rules","topic_zh":"扣分制度","question_en":"For a first offence of failing to stop or clear the way for an emergency vehicle, how many demerit points can you receive in addition to a fine?","question_zh":"初次不为应急车辆停车或让路，除罚款外还可能被扣几分？","options":[{"en":"6","zh":"6 分"},{"en":"4","zh":"4 分"},{"en":"3","zh":"3 分"},{"en":"2","zh":"2 分"}],"answer_index":2,"explanation_zh":"初犯可被罚款并扣 3 分；再犯罚款更高，还可能被判最长 6 个月监禁。这些处罚同样适用于未对停在路上、闪琥珀色灯的清障车减速避让的情况。","explanation_en":"A first offence brings a fine and 3 demerit points; repeat offences can mean up to 6 months in jail.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-65","group":"RD","section":"rules","topic_zh":"应急车辆识别","question_en":"Besides flashing red or blue lights and a siren or bell, which signal can identify an emergency vehicle such as a police car or ambulance?","question_zh":"除了闪烁的红灯或蓝灯以及警笛或警铃之外，下列哪种信号也可用来识别警车、救护车等应急车辆？","options":[{"en":"A flashing amber light mounted on its roof","zh":"车顶闪烁的琥珀色灯"},{"en":"All four hazard lights flashing at the same time","zh":"四个危险警示灯同时闪烁"},{"en":"Alternating white flashes from its high beams","zh":"远光前照灯交替闪烁白光"},{"en":"Low-beam headlights left on during daylight","zh":"白天一直开着近光灯"}],"answer_index":2,"explanation_zh":"应急车辆（警察、消防、救护和特种公用事业车辆）可通过闪烁的红灯或蓝灯、警笛或警铃，或远光前照灯交替闪烁的白光来识别。琥珀色闪灯通常属于拖车等车辆，不是应急车辆的标志。","explanation_en":"Emergency vehicles can be identified by flashing red or blue lights, a siren or bell, or alternating white flashes from their high-beam headlamps.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-66","group":"RD","section":"rules","topic_zh":"应急车辆：处罚","question_en":"A driver is convicted a second time of failing to stop or clear the way for an emergency vehicle. Besides a higher fine, what penalty is possible?","question_zh":"某司机第二次因未给应急车辆停车或让路被定罪。除了更高的罚款，还可能面临什么处罚？","options":[{"en":"A lifetime driving ban","zh":"终身禁驾"},{"en":"Up to two years in jail","zh":"最高两年监禁"},{"en":"A 45-day vehicle impoundment","zh":"车辆被扣押 45 天"},{"en":"Up to six months in jail","zh":"最高六个月监禁"}],"answer_index":3,"explanation_zh":"未给应急车辆让路：初犯罚款并扣 3 分；再犯罚款更高，还可能被判最高六个月监禁。对停在公路上、闪着琥珀色灯的拖车未减速或未变道，也适用同样的处罚。","explanation_en":"For repeat offences of failing to respond to an emergency vehicle, fines increase and you could be jailed for up to six months.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-67","group":"RD","section":"rules","topic_zh":"HOV车道","question_en":"An airport limousine with only the driver on board wants to use an HOV lane on a provincial highway. Is this allowed?","question_zh":"一辆只有司机一人的机场豪华轿车（airport limousine）想使用省级公路上的高乘载车道（HOV）。可以吗？","options":[{"en":"Yes, even with only the driver on board","zh":"可以，即使车上只有司机一人"},{"en":"No, every vehicle must have at least two people on board","zh":"不可以，所有车辆都至少要载两人"},{"en":"Only if it is displaying green licence plates","zh":"只有挂绿色车牌时才可以"},{"en":"Only during off-peak hours, such as midnight to 5 a.m.","zh":"只在非高峰时段（如午夜至凌晨 5 点）可以"}],"answer_index":0,"explanation_zh":"持牌出租车和机场豪华轿车即使只有司机一人也可以使用 HOV 车道；绿牌车也不受人数限制。HOV 车道规定全天 24 小时、每周 7 天有效。","explanation_en":"Licensed taxis and airport limousines may use HOV lanes even with a single occupant, and HOV rules apply 24 hours a day, seven days a week.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/freeway-driving","source_title":"MTO 手册 · Freeway driving","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-68","group":"RD","section":"rules","topic_zh":"HOV车道","question_en":"A bus with only the driver on board approaches an HOV lane. May it use the lane?","question_zh":"一辆公共汽车上只有司机一人，驶近HOV车道（高承载车道）。它可以使用该车道吗？","options":[{"en":"No, buses are banned from HOV lanes like large trucks","zh":"不可以，公共汽车和大型货车一样禁止使用"},{"en":"Yes, buses may use HOV lanes regardless of occupants","zh":"可以，公共汽车无论载多少人都可使用"},{"en":"Only if it is shorter than 6.5 metres","zh":"只有车长不足6.5米时才可以"},{"en":"No, it needs at least two people on board","zh":"不可以，车上至少要有两人"}],"answer_index":1,"explanation_zh":"公共汽车任何时候都可以使用HOV车道，不论车上人数。两人以上且车长不足6.5米的要求针对的是商用车辆；大型货车则一律不准使用。","explanation_en":"Buses may use HOV lanes at any time, regardless of how many people are on board.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/freeway-driving","source_title":"MTO 手册 · Freeway driving","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-69","group":"RD","section":"rules","topic_zh":"无障碍停车许可证","question_en":"Which statement about Accessible Parking Permits is correct?","question_zh":"关于无障碍停车许可证（Accessible Parking Permit），下列哪项说法正确？","options":[{"en":"A temporary permit renews automatically without healthcare recertification","zh":"临时许可证到期后可自动续期，无须医疗专业人员重新认证"},{"en":"A traveller (purple) permit is valid for up to five years","zh":"旅行者（紫色）许可证有效期最长五年"},{"en":"Permits are issued free of charge to people who qualify","zh":"符合资格的人可免费获得许可证"},{"en":"Misuse should be reported to the permit holder's doctor","zh":"滥用许可证应向持证人的医生举报"}],"answer_index":2,"explanation_zh":"符合资格者申请、续期或补领无障碍停车许可证均不收费。临时许可证最长有效期为十二个月，可以续办，但须由受监管医疗专业人员重新认证健康状况。旅行者许可证最长为十二个月，且不超过原许可证的剩余有效期。","explanation_en":"Accessible Parking Permits are free to obtain, renew or replace. A temporary permit is valid for up to 12 months and can be renewed after healthcare recertification.","source_url":"https://www.ontario.ca/page/get-accessible-parking-permit","source_title":"ServiceOntario · Accessible parking permits","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RD-70","group":"RD","section":"rules","topic_zh":"停车规则","question_en":"You are driving on a rural road that has a shoulder, and you need to stop and park for a while. Where should you stop?","question_zh":"你在一条有路肩的乡村道路上行驶，需要停车一段时间。应该停在哪里？","options":[{"en":"In the right lane, with your hazard lights on","zh":"停在右侧车道上，并打开危险警示灯"},{"en":"Just past the top of a hill, where traffic can see you","zh":"刚过坡顶处，这样来车能看到你"},{"en":"On a curve, where the road is widest","zh":"停在弯道上路面最宽的地方"},{"en":"Off the travelled part of the road, on the shoulder","zh":"驶离行车道，停在路肩上"}],"answer_index":3,"explanation_zh":"绝不要停在道路的行车部分；如需停车，应驶离道路停到路肩上。也不要停在弯道、坡上或两个方向视距不足125米的地方。","explanation_en":"Never park on the travelled part of a road; pull off onto the shoulder if you must stop.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/parking-along-roadways","source_title":"MTO 手册 · Parking along roadways","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RD-71","group":"RD","section":"rules","topic_zh":"停车规则","question_en":"After parking your vehicle, what does the handbook tell you to do?","question_zh":"停好车后，手册要求你做什么？","options":[{"en":"Turn off the ignition and lights, remove the key and lock the door","zh":"关闭点火开关和车灯，拔下钥匙并锁好车门"},{"en":"Leave the engine running if a child or pet stays inside for a few minutes","zh":"如果孩子或宠物在车内待几分钟，可让发动机保持运转"},{"en":"Leave the key in the ignition in case someone needs to move the car","zh":"把钥匙留在点火开关上，以便有人需要挪车"},{"en":"Leave the parking lights on so others can see the car","zh":"开着停车灯，让别人看到你的车"}],"answer_index":0,"explanation_zh":"停车后要关闭点火开关和车灯、拔下钥匙并锁门以防盗；不要把儿童或动物留在车内。","explanation_en":"After parking, turn off the ignition and lights, remove the key and lock the door, and don't leave children or animals inside.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/parking-along-roadways","source_title":"MTO 手册 · Parking along roadways","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RD-72","group":"RD","section":"rules","topic_zh":"疲劳驾驶","question_en":"You feel sleepy while driving. Which statement is correct?","question_zh":"你开车时感到困倦。下列哪项说法正确？","options":[{"en":"A strong coffee will keep you safely alert for the rest of the trip","zh":"喝一杯浓咖啡就能让你在剩下的路程中安全地保持清醒"},{"en":"Caffeine, a louder radio or an open window can't replace sleep","zh":"咖啡因、调大音量或打开车窗都不能代替睡眠"},{"en":"Opening the window and turning up the radio is a safe fix","zh":"打开车窗、调大收音机是安全的解决办法"},{"en":"You will always notice before you fall asleep","zh":"你在睡着之前总会察觉到"}],"answer_index":1,"explanation_zh":"提神饮品、调大音量或开窗都不能代替睡眠，对缺觉的人效果很快就会消失；人可能在毫无察觉的情况下睡着。应停到安全的地方小睡。","explanation_en":"Caffeine, a louder radio or an open window are not substitutes for sleep.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RD-73","group":"RD","section":"rules","topic_zh":"疲劳驾驶","question_en":"How does the handbook compare a tired driver with a drunk driver?","question_zh":"手册如何比较疲劳驾驶的司机与醉酒司机？","options":[{"en":"A tired driver is only slightly affected if they stay awake","zh":"疲劳司机只要没睡着，受影响就很小"},{"en":"A tired driver is about half as impaired","zh":"疲劳司机的受损程度约为醉酒司机的一半"},{"en":"A tired driver can be as impaired as a drunk driver","zh":"疲劳司机的受损程度可能与醉酒司机一样"},{"en":"Fatigue only matters after 24 hours without sleep","zh":"只有连续24小时不睡觉时疲劳才有影响"}],"answer_index":2,"explanation_zh":"疲劳司机的受损程度可能与醉酒司机相当：反应变慢、警觉性下降。轮班工作者、有未确诊或未治疗睡眠障碍的人和商用车司机风险更高。","explanation_en":"Tired drivers can be as impaired as drunk drivers.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RD-74","group":"RD","section":"rules","topic_zh":"道路上的动物","question_en":"A moose is standing on the road ahead of you. Should you try to steer around it?","question_zh":"前方道路上站着一头驼鹿。你应该尝试绕过它吗？","options":[{"en":"Yes, pass quickly while it is standing still","zh":"应该，趁它站着不动时快速绕过"},{"en":"Yes, if you flash your high beams first","zh":"应该，只要先闪一下远光灯"},{"en":"No, because steering around animals is allowed only on divided highways","zh":"不应该，因为只有在分隔式公路上才允许绕过动物"},{"en":"No, because an animal's movements are unpredictable","zh":"不应该，因为动物的动作难以预测"}],"answer_index":3,"explanation_zh":"看到动物应减速并鸣喇叭，留意附近是否还有其他动物；不要试图绕过动物，因为它的动作难以预测。","explanation_en":"Don't try to drive around an animal, because its movements are unpredictable.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RD-75","group":"RD","section":"rules","topic_zh":"道路上的动物","question_en":"When are wild animals most active, calling for extra care near animal-crossing signs?","question_zh":"野生动物在什么时段最活跃，需要在动物出没警告标志附近格外小心？","options":[{"en":"From dusk to dawn","zh":"黄昏到黎明"},{"en":"Between 2 p.m. and 4 p.m.","zh":"下午2点到4点"},{"en":"Around midday","zh":"中午前后"},{"en":"Only during the winter months","zh":"只在冬季月份"}],"answer_index":0,"explanation_zh":"黄昏到黎明是野生动物最活跃的时段。此时要格外小心，在可能且安全时使用远光灯，并从一侧路肩到另一侧路肩扫视路面。","explanation_en":"Wild animals are most active from dusk to dawn.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RE-01","group":"RE","section":"rules","topic_zh":"远光灯与近光灯","question_en":"At night you are using high beams and a vehicle is approaching from the opposite direction. Within what distance of that vehicle must you switch to low beams?","question_zh":"夜间你开着远光灯行驶，对向有车驶来。与对向来车相距多少米以内时必须改用近光灯？","options":[{"en":"60 metres","zh":"60 米"},{"en":"150 metres","zh":"150 米"},{"en":"300 metres","zh":"300 米"},{"en":"100 metres","zh":"100 米"}],"answer_index":1,"explanation_zh":"手册规定：与对向来车相距 150 米以内必须使用近光灯，以免远光灯晃到对方驾驶员。（跟车 60 米以内也要用近光灯。）","explanation_en":"Use low beams within 150 m of an oncoming vehicle.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RE-02","group":"RE","section":"rules","topic_zh":"远光灯与近光灯","question_en":"On a dark country road at night, you are using high beams as you approach a hilltop. What does the handbook advise?","question_zh":"夜间在漆黑的乡村道路上开着远光灯行驶，前方快到坡顶。手册建议怎么做？","options":[{"en":"Keep the high beams on so you can see farther past the crest","zh":"保持远光灯，以便看清坡顶另一侧更远的地方"},{"en":"Flash the high beams on and off to warn any hidden drivers","zh":"反复闪烁远光灯，提醒坡后看不见的来车"},{"en":"Turn on your emergency flashers until you are over the top","zh":"打开危险警示灯（双闪），直到越过坡顶"},{"en":"Switch to low beams as you come to the hilltop","zh":"接近坡顶时切换为近光灯"}],"answer_index":3,"explanation_zh":"在乡村道路上遇到弯道或坡顶时应切换为近光灯，这样能看清对向车灯，也不会晃到对向驾驶员；确认没有来车灯光后再切回远光灯。","explanation_en":"Switch to low beams at curves and hilltops so you can see oncoming lights and avoid blinding drivers.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-03","group":"RE","section":"rules","topic_zh":"夜间行车","question_en":"What does it mean to 'overdrive your headlights'?","question_zh":"什么叫“超出车灯照明范围驾驶”（overdriving your headlights）？","options":[{"en":"Driving so fast that you cannot stop within the distance your headlights light up","zh":"车速快到无法在车灯照亮的距离内停下"},{"en":"Leaving your high beams on when another vehicle is only a short distance ahead","zh":"前方近处有车时仍然开着远光灯"},{"en":"Driving with your headlights aimed higher than the factory setting","zh":"车灯照射角度调得比出厂设置更高"},{"en":"Driving after dark with only your parking lights switched on","zh":"天黑后只开着停车灯（小灯）行驶"}],"answer_index":0,"explanation_zh":"当车速快到停车距离超过车灯能照亮的距离时，就是超出车灯照明范围驾驶，遇到障碍可能来不及安全停车。反光路标也会让人误以为看得更远，夜间应减速。","explanation_en":"Overdriving means your stopping distance exceeds how far your headlights let you see.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-04","group":"RE","section":"rules","topic_zh":"眩光","question_en":"At night, an oncoming vehicle has very bright headlights. Where should you look?","question_zh":"夜间对向来车的车灯非常刺眼，你应该把视线放在哪里？","options":[{"en":"Straight at the oncoming lights so you can judge their distance","zh":"直视对向车灯，以便判断它的距离"},{"en":"Slightly to the left, along the centre line","zh":"稍微偏左，沿着道路中线看"},{"en":"Up, beyond and slightly to the right of the oncoming lights","zh":"向上、向远处，并稍偏向对向车灯的右侧"},{"en":"Down at the pavement just in front of your hood","zh":"向下看自己车头正前方的路面"}],"answer_index":2,"explanation_zh":"夜间会车遇到强光时，应向上、向远处并稍偏右看，避开对向车灯的直射眩光，同时保持对道路的观察。","explanation_en":"Look up, beyond and slightly right of oncoming bright lights.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RE-05","group":"RE","section":"rules","topic_zh":"眩光","question_en":"You are wearing sunglasses and are about to enter a tunnel on a bright, sunny day. What should you do?","question_zh":"晴天你戴着墨镜行驶，即将驶入隧道。应该怎么做？","options":[{"en":"Keep your sunglasses on and speed up to get through quickly","zh":"继续戴着墨镜，并加速尽快驶出隧道"},{"en":"Slow down, take off your sunglasses and turn on your headlights","zh":"减速，摘下墨镜，打开前大灯"},{"en":"Turn on your emergency flashers and keep your speed","zh":"打开危险警示灯，保持原有车速"},{"en":"Switch on your high beams and close up behind the vehicle ahead","zh":"打开远光灯，并缩短与前车的距离"}],"answer_index":1,"explanation_zh":"晴天进入隧道时光线骤暗，应减速让眼睛适应，同时摘下墨镜并打开前大灯。","explanation_en":"Slow down, remove sunglasses and turn on headlights when entering a tunnel on a bright day.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RE-06","group":"RE","section":"rules","topic_zh":"雾天驾驶","question_en":"You are caught driving in fog. Which lights should you use?","question_zh":"行驶途中遇到大雾，应该使用哪种灯光？","options":[{"en":"High beams, so you can see as far ahead as possible","zh":"远光灯，以便尽量看得远"},{"en":"Parking lights only, to cut down reflection from the fog","zh":"只开停车灯（小灯），以减少雾气反光"},{"en":"Emergency flashers only, while driving at normal speed","zh":"只开危险警示灯，并以正常车速行驶"},{"en":"Low beams, plus fog lights if your vehicle has them","zh":"近光灯；如车上有雾灯，同时打开雾灯"}],"answer_index":3,"explanation_zh":"雾中应打开车辆全部照明系统并使用近光灯，有雾灯可同时使用。远光灯会被雾中的水滴反射回来，反而更看不清。","explanation_en":"In fog use low beams (and fog lights if equipped); high beams reflect off the moisture.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RE-07","group":"RE","section":"rules","topic_zh":"雾天驾驶","question_en":"When driving in fog, what should you use as your main guide for lane position?","question_zh":"在雾中行驶时，应以什么作为保持车道位置的主要参照？","options":[{"en":"The right edge of the road","zh":"道路右侧边缘"},{"en":"The centre line of the road","zh":"道路中线"},{"en":"The tail lights of a vehicle you follow closely","zh":"紧跟前车，以它的尾灯为参照"},{"en":"The left shoulder of the road","zh":"道路左侧路肩"}],"answer_index":0,"explanation_zh":"雾中应借助路面标线，并以道路右侧边缘而不是中线作为参照；同时要加大跟车距离，不能紧跟前车。","explanation_en":"In fog, use the right edge of the road as a guide, not the centre line.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-08","group":"RE","section":"rules","topic_zh":"雾天驾驶","question_en":"The fog becomes so dense that you cannot safely continue. What should you do?","question_zh":"雾越来越浓，你已无法安全继续行驶。应该怎么做？","options":[{"en":"Stop in your own lane with your flashers on and wait for the fog to lift","zh":"在本车道内停车，打开危险警示灯，等雾散去"},{"en":"Switch to high beams and keep creeping forward until the fog clears","zh":"改用远光灯，慢慢往前挪，直到雾散"},{"en":"Pull completely off the road to a safe area; use flashers and low beams","zh":"把车完全驶离道路，停到安全地点，打开危险警示灯并保持近光灯"},{"en":"Speed up so you get out of the fog bank as quickly as possible","zh":"加速，尽快驶出雾区"}],"answer_index":2,"explanation_zh":"不要停在行车道上，否则可能成为连环追尾的第一辆车。应把车完全驶离道路，最好停到安全的停车区，打开危险警示灯，同时保持近光灯。","explanation_en":"Pull completely off the road to a safe area and use flashers with low beams; never stop in a travel lane.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-09","group":"RE","section":"rules","topic_zh":"吹雪与白化天气","question_en":"You are driving in heavy blowing snow. Why should you use low beams rather than high beams?","question_zh":"在大风吹雪中行驶时，为什么要用近光灯而不用远光灯？","options":[{"en":"High beams drain the battery too quickly in cold weather","zh":"冷天开远光灯耗电太快"},{"en":"High beams reflect off the ice particles in the snow","zh":"远光灯会被雪中的冰粒反射回来"},{"en":"Low beams shine farther than high beams when it snows","zh":"下雪时近光灯比远光灯照得更远"},{"en":"High beams are not allowed during the winter months","zh":"冬季月份不允许使用远光灯"}],"answer_index":1,"explanation_zh":"在吹雪或白化（whiteout）天气中，远光灯会被雪中的冰粒反射，使视线更差；应打开全部灯光并用近光灯，有雾灯可同时使用。","explanation_en":"High beams reflect off ice particles in blowing snow; use low beams.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-10","group":"RE","section":"rules","topic_zh":"雨天驾驶","question_en":"According to the handbook, when does rain make the road surface especially slippery?","question_zh":"根据手册，下雨时路面在什么时候特别滑？","options":[{"en":"Just after the rain stops, as the road begins to dry","zh":"雨刚停、路面开始变干的时候"},{"en":"After about an hour, once the rain has washed the road clean","zh":"下了约一个小时、雨水把路面冲刷干净之后"},{"en":"Only at night, once the pavement has cooled down","zh":"只在夜间路面变凉之后"},{"en":"As the first drops begin to fall","zh":"刚开始下雨、头几滴雨落下时"}],"answer_index":3,"explanation_zh":"手册指出，雨水会使路面湿滑，尤其是刚开始下雨时；雨越大，轮胎与路面的接触越少。","explanation_en":"Roads are especially slippery when rain first starts to fall.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RE-11","group":"RE","section":"rules","topic_zh":"水滑现象","question_en":"What is hydroplaning?","question_zh":"什么是水滑现象（hydroplaning）？","options":[{"en":"Rain hitting the windshield faster than the wipers can clear it","zh":"雨水打到挡风玻璃上的速度超过雨刷的清除速度"},{"en":"Brakes pulling to one side after driving through deep water","zh":"驶过深水后，刹车时车辆跑偏"},{"en":"Tires riding on a layer of water instead of gripping the road","zh":"轮胎浮在一层水上，而不是抓住路面"},{"en":"Water being drawn into the engine and making it stall","zh":"发动机进水导致熄火"}],"answer_index":2,"explanation_zh":"水太多或车速太快时，轮胎会像滑水板一样浮在水面上，车辆很难控制，这就是水滑现象。预防方法是使用胎纹深的好轮胎，并在湿滑路面上减速。","explanation_en":"Hydroplaning is when tires ride on top of water like water skis, making control very difficult.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-12","group":"RE","section":"rules","topic_zh":"积水路面","question_en":"After driving through a flooded stretch of road, you should test your brakes, when it is safe, by stopping quickly and firmly at what speed?","question_zh":"驶过一段被水淹的路面后，应在安全时以什么车速快速、有力地刹车，来测试刹车并让刹车变干？","options":[{"en":"50 km/h","zh":"50 km/h"},{"en":"30 km/h","zh":"30 km/h"},{"en":"80 km/h","zh":"80 km/h"},{"en":"20 km/h","zh":"20 km/h"}],"answer_index":0,"explanation_zh":"涉水后刹车可能失效。应在安全时以 50 km/h 快速有力地刹停：车辆应直线停下，踏板应结实不发软。刹车干了以后仍跑偏或踏板发软，应立即送修。","explanation_en":"Test brakes after a flooded road by stopping quickly and firmly at 50 km/h.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RE-13","group":"RE","section":"rules","topic_zh":"侧滑","question_en":"What causes most skids?","question_zh":"大多数侧滑是由什么引起的？","options":[{"en":"Worn windshield wiper blades","zh":"雨刷片磨损"},{"en":"Driving too fast for road conditions","zh":"车速对当时路况来说过快"},{"en":"Driving with low beams on in the daytime","zh":"白天开着近光灯行驶"},{"en":"Using all-weather tires in the summer","zh":"夏天使用全天候轮胎"}],"answer_index":1,"explanation_zh":"手册指出，大多数侧滑是因为车速对路况来说太快；急刹车、过猛的转向或加速也会引起侧滑。","explanation_en":"Most skids result from driving too fast for road conditions.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RE-14","group":"RE","section":"rules","topic_zh":"侧滑","question_en":"On an icy road, the rear of your car starts to slide sideways. What should you do?","question_zh":"在结冰的路面上，你的车尾开始向一侧滑动。应该怎么做？","options":[{"en":"Brake hard and hold the steering wheel perfectly straight","zh":"用力踩刹车，方向盘保持正直"},{"en":"Press the gas pedal firmly to help the tires regain traction","zh":"用力踩油门，帮助轮胎恢复抓地力"},{"en":"Pull the parking brake to stop the rear from sliding","zh":"拉手刹，制止车尾继续侧滑"},{"en":"Ease off the gas or brake and steer where you want to go","zh":"松开油门或刹车，朝你想去的方向转向"}],"answer_index":3,"explanation_zh":"侧滑时不要慌：松开油门或刹车，在非常滑的路面上如有可能挂入空挡，继续朝想去的方向转向，注意不要转向过度；恢复控制后再轻柔地刹车。","explanation_en":"In a skid, ease off the gas or brake and steer in the direction you want to go without oversteering.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-15","group":"RE","section":"rules","topic_zh":"防抱死制动（ABS）","question_en":"Which statement about anti-lock braking systems (ABS) is correct?","question_zh":"关于防抱死制动系统（ABS），下列哪种说法是正确的？","options":[{"en":"ABS lets you stop in a shorter distance on every type of road surface","zh":"ABS 能让你在任何路面上都以更短的距离停车"},{"en":"With ABS, you should pump the brake pedal rapidly in an emergency","zh":"装有 ABS 的车紧急制动时应快速反复踩放刹车踏板（点刹）"},{"en":"ABS helps prevent wheel lock-up, but don't count on shorter stops","zh":"ABS 有助于防止车轮抱死，但别指望它缩短停车距离"},{"en":"ABS works only on dry pavement and switches off when roads are slippery","zh":"ABS 只在干燥路面上起作用，路面湿滑时会自动关闭"}],"answer_index":2,"explanation_zh":"ABS 会感知车轮转速，在车轮即将抱死时减小该轮制动力，从而保持转向控制；但手册明确指出不应指望它缩短停车距离。","explanation_en":"ABS helps prevent wheel lock-up and preserve steering control, but you should not expect it to shorten your stopping distance.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-16","group":"RE","section":"rules","topic_zh":"防抱死制动（ABS）","question_en":"During a hard emergency stop in a vehicle with ABS, you feel the brake pedal pulsing under your foot. What should you do?","question_zh":"在装有 ABS 的车上紧急刹车时，你感到刹车踏板在脚下震动。应该怎么做？","options":[{"en":"Keep firm pressure on the pedal and let the ABS do its job","zh":"持续用力踩住踏板，让 ABS 发挥作用"},{"en":"Release the pedal, because the pulsing means the brakes are failing","zh":"松开踏板，因为震动说明刹车出了故障"},{"en":"Pump the pedal quickly so the system can work properly","zh":"快速反复踩放踏板（点刹），让系统正常工作"},{"en":"Let go of the foot brake and use the parking brake instead","zh":"松开脚刹，改用手刹"}],"answer_index":0,"explanation_zh":"ABS 工作时踏板震动是正常现象。紧急制动时应持续用力踩住踏板，让系统自动防止车轮抱死，不要因震动而松开或反复踩放踏板。","explanation_en":"Pedal pulsation is normal with ABS; keep pressing hard and let the system work.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-17","group":"RE","section":"rules","topic_zh":"临界制动","question_en":"In a vehicle without ABS, how should you perform threshold braking?","question_zh":"在没有 ABS 的车上，“临界制动”（threshold braking）应该怎么做？","options":[{"en":"Pump the brake pedal quickly and repeatedly until the vehicle stops","zh":"快速反复地踩放刹车踏板，直到车停下"},{"en":"Lock all the wheels on purpose, then steer around the hazard","zh":"故意让车轮全部抱死，再转向绕开障碍"},{"en":"Pull the parking brake hard first, then finish with the foot brake","zh":"先用力拉手刹，再用脚刹把车停住"},{"en":"Brake hard until a wheel starts to lock, ease off slightly, then reapply","zh":"用力刹车直到有车轮开始抱死，稍稍松开，再重新踩下"}],"answer_index":3,"explanation_zh":"临界制动是在不让车轮抱死的前提下尽量用力刹车：一旦感到有车轮开始抱死，就稍松踏板再重新踩下，不要反复点刹，直到减到所需车速。装有 ABS 的车则直接用力踩住踏板即可。","explanation_en":"Threshold braking: brake hard to just short of lock-up, ease slightly if a wheel locks, reapply; don't pump.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RE-18","group":"RE","section":"rules","topic_zh":"冬季被困","question_en":"Your vehicle becomes stuck during a severe snowstorm. What is the recommended thing to do?","question_zh":"在严重暴风雪中你的车被困住了。推荐的做法是什么？","options":[{"en":"Leave the vehicle right away and walk to the nearest building for help","zh":"立即离开车辆，步行到最近的建筑物求助"},{"en":"Keep the engine running nonstop with every window tightly shut for warmth","zh":"为了保暖，一直开着发动机，并把车窗全部关紧"},{"en":"Stay with the vehicle, open a window slightly and run the engine sparingly","zh":"留在车内，把车窗开一条缝，节制地运行发动机"},{"en":"Turn off all lights, including the flashers, to save the battery","zh":"关掉所有灯，包括危险警示灯，以节省电瓶电量"}],"answer_index":2,"explanation_zh":"在恶劣天气中被困时，应留在车内保暖、等待救援；把车窗开一条缝通风，节制地运行发动机，并打开危险警示灯。最好随车携带冬季求生包（保暖衣物、不易变质的高能量食品、手电筒、铲子、毯子）。","explanation_en":"If stranded, stay with the vehicle, open a window slightly, run the motor sparingly and use flashers.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-19","group":"RE","section":"rules","topic_zh":"结冰路面","question_en":"As temperatures fall below freezing, which parts of the road usually ice up first?","question_zh":"气温降到冰点以下时，哪些路段通常最先结冰？","options":[{"en":"Shaded areas, bridges and overpasses","zh":"背阴路段、桥梁和立交桥"},{"en":"Long straight stretches in full sun","zh":"阳光直射的长直路段"},{"en":"Freshly paved, dark asphalt in the sun","zh":"阳光下新铺的深色沥青路面"},{"en":"Roads in town that were salted earlier in the day","zh":"当天早些时候撒过盐的城镇道路"}],"answer_index":0,"explanation_zh":"气温降到冰点以下时，背阴路段以及桥梁、立交桥上的路面最先结冰，应提前减速并预判结冰。","explanation_en":"Shaded areas, bridges and overpasses freeze first.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-20","group":"RE","section":"rules","topic_zh":"黑冰","question_en":"On a winter day most of the road looks grey-white, but a stretch ahead looks black and shiny. What should you suspect?","question_zh":"冬天大部分路面呈灰白色，但前方有一段路看起来又黑又亮。你应该怀疑什么？","options":[{"en":"Freshly paved, dry asphalt with extra grip","zh":"新铺的干燥沥青，抓地力更好"},{"en":"A section that has just been salted and is now safe","zh":"刚撒过盐、已经安全的路段"},{"en":"Wet pavement that is safe at the posted speed limit","zh":"只是潮湿路面，按限速行驶很安全"},{"en":"A thin layer of black ice","zh":"一层薄薄的黑冰"}],"answer_index":3,"explanation_zh":"冬季柏油路面一般应呈灰白色；如果前方路面看起来又黑又亮，可能覆盖着一层薄冰，即“黑冰”，应减速并小心驾驶。","explanation_en":"Black, shiny pavement in winter may be black ice; slow down.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-21","group":"RE","section":"rules","topic_zh":"扫雪车","question_en":"How are snow-removal vehicles on public roads marked, and from how far can the marking be seen?","question_zh":"公共道路上的扫雪车用什么灯光标示？从多远能看到？","options":[{"en":"Flashing amber lights, visible from 150 m","zh":"闪烁的琥珀色灯，150 米外可见"},{"en":"Flashing blue lights, visible from 150 m","zh":"闪烁的蓝色灯，150 米外可见"},{"en":"Flashing blue lights, visible from 60 m","zh":"闪烁的蓝色灯，60 米外可见"},{"en":"Flashing red lights, visible from 300 m","zh":"闪烁的红色灯，300 米外可见"}],"answer_index":1,"explanation_zh":"公共道路上的扫雪车装有闪烁蓝灯，150 米外即可看到，提醒你前方是又宽又慢的车辆。","explanation_en":"Snow plows use flashing blue lights visible from 150 m.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RE-22","group":"RE","section":"rules","topic_zh":"扫雪车","question_en":"Some snow plows have a side wing. How far to the right of the plow can it extend?","question_zh":"有些扫雪车装有侧翼铲板，它最多可伸出到车辆右侧多远？","options":[{"en":"Up to 1 metre","zh":"最多 1 米"},{"en":"Up to 5 metres","zh":"最多 5 米"},{"en":"Up to 3 metres","zh":"最多 3 米"},{"en":"Up to half a metre","zh":"最多半米"}],"answer_index":2,"explanation_zh":"有些扫雪车的侧翼可伸出到车辆右侧多达 3 米，闪烁蓝灯就是提醒你前方是又宽又慢的车辆，靠近时要格外小心。","explanation_en":"A plow's wing can extend up to 3 m to the right.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RE-23","group":"RE","section":"rules","topic_zh":"刹车失灵","question_en":"Your brakes suddenly fail while you are driving. What does the handbook recommend?","question_zh":"行驶中刹车突然失灵。手册建议怎么做？","options":[{"en":"Pump the brake pedal, then if needed apply the parking brake gently but firmly","zh":"先反复踩放刹车踏板；若无效，再轻缓而稳固地拉起手刹"},{"en":"Yank the parking brake as hard and as fast as you can, then try pumping the brake pedal","zh":"立即用最大力气猛拉手刹，然后再试着反复踩放刹车踏板"},{"en":"Shift into park immediately, then turn off the ignition and steer to the shoulder","zh":"立即挂入 P 挡，然后关闭点火开关，把车转向路肩"},{"en":"Turn off the ignition first, then keep steady pressure on the brake pedal","zh":"先关闭点火开关，然后持续踩住刹车踏板"}],"answer_index":0,"explanation_zh":"先反复踩放刹车踏板，暂时恢复液压制动压力；若无效，按住手刹的释放按钮，轻缓而稳固地拉起手刹。即使成功停下，也不要再开走，应打电话求助。","explanation_en":"Pump the brakes to restore pressure; if that fails, apply the parking brake gently but firmly while holding the release button.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-emergencies","source_title":"MTO 手册 · Dealing with emergencies","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-24","group":"RE","section":"rules","topic_zh":"油门卡住","question_en":"Your gas pedal sticks. You tried to lift it by slipping your foot under it, but it is still stuck. What should you do next?","question_zh":"你的油门踏板卡住了。你已试着把脚伸到踏板下面把它勾起来，但仍然卡着。接下来应该怎么做？","options":[{"en":"Reach down with one hand to free the pedal while steering with the other","zh":"一只手伸下去把踏板拉起来，另一只手控制方向"},{"en":"Turn on your hazard lights, shift to neutral and stop off the road when safe","zh":"打开危险警示灯，挂入空挡，在安全时把车停到路外"},{"en":"Shift into reverse so that the car slows down as quickly as possible","zh":"挂入倒挡，让车尽快减速"},{"en":"Keep driving at a steady speed to the nearest garage","zh":"保持车速，开到最近的修车厂"}],"answer_index":1,"explanation_zh":"油门卡住时先用脚把踏板勾起来，行驶中不要用手去够。不行就打开危险警示灯、挂入空挡，尽快安全停车（最好停在路外），然后关闭点火，不要再开走，打电话求助。","explanation_en":"If lifting with your foot fails, use hazard lights, shift to neutral and stop safely off the road; never reach down by hand.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-emergencies","source_title":"MTO 手册 · Dealing with emergencies","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-25","group":"RE","section":"rules","topic_zh":"车灯失灵","question_en":"Your headlights go out while you are driving at night. Checking the switch does not bring them back. What should you do?","question_zh":"夜间行驶时前大灯突然熄灭，检查开关后仍然不亮。应该怎么做？","options":[{"en":"Continue to your destination slowly using your parking lights","zh":"开着停车灯（小灯）慢慢开到目的地"},{"en":"Follow closely behind another vehicle and use its lights","zh":"紧跟前车，借助它的灯光行驶"},{"en":"Turn on your hazard lights and stop safely off the road","zh":"打开危险警示灯，把车安全地停到路外"},{"en":"Stop right in your lane and wait there for help","zh":"就在本车道停下，在原地等待救援"}],"answer_index":2,"explanation_zh":"车灯熄灭时应立即检查开关；仍不亮就打开危险警示灯，把车安全停到路外并求助。夜间不开灯行驶既危险又违法。","explanation_en":"If headlights stay out, turn on hazard lights and stop safely off the road; driving at night without lights is illegal.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-emergencies","source_title":"MTO 手册 · Dealing with emergencies","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RE-26","group":"RE","section":"rules","topic_zh":"高速公路故障","question_en":"Your car starts showing signs of mechanical trouble on a freeway. What should you do?","question_zh":"在高速公路上，你的车开始出现机械故障的迹象。应该怎么做？","options":[{"en":"Keep going until the car stalls, then stop wherever it ends up","zh":"继续开，直到车熄火，在哪儿停住就停在哪儿"},{"en":"Stop in the right-hand driving lane with your hazard lights on","zh":"打开危险警示灯，停在最右侧的行车道上"},{"en":"Stay in your lane and slow to 40 km/h until you reach an exit","zh":"留在本车道，减速到 40 km/h，一直开到出口"},{"en":"Use your hazard lights and pull onto the nearest shoulder at once","zh":"打开危险警示灯，立即驶到最近的路肩"}],"answer_index":3,"explanation_zh":"在高速公路上一发现故障就要开始靠边：查看后视镜、打开危险警示灯、松开油门，尽快驶到最近的路肩。不要等车熄火，也绝不能停在行车道上。","explanation_en":"At the first sign of trouble, pull onto the nearest shoulder; never stop in a driving lane.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-emergencies","source_title":"MTO 手册 · Dealing with emergencies","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-27","group":"RE","section":"rules","topic_zh":"高速公路故障","question_en":"Your car has broken down and is on the shoulder of a 400-series freeway. What should you do while waiting for help?","question_zh":"你的车在 400 系列高速公路上抛锚，已停在路肩上。等待救援时应该怎么做？","options":[{"en":"Stay inside the vehicle with the doors locked","zh":"留在车内，锁好车门"},{"en":"Raise the hood so passing drivers know you need help","zh":"掀起发动机盖，让过往车辆知道你需要帮助"},{"en":"Stand behind your car and wave traffic around it","zh":"站在车后，挥手示意车辆绕行"},{"en":"Walk along the shoulder to the nearest exit for help","zh":"沿路肩步行到最近的出口求助"}],"answer_index":0,"explanation_zh":"手册要求等待救援时留在车内并锁好车门，并明确说不要掀起发动机盖；下车时尽量从远离车流一侧的车门下。QEW 和 400 系列高速有安大略省警察（OPP）巡逻，留在车旁，救援很快会到。","explanation_en":"Stay in the vehicle with doors locked; do not raise the hood.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-emergencies","source_title":"MTO 手册 · Dealing with emergencies","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RE-28","group":"RE","section":"rules","topic_zh":"车轮驶出路面","question_en":"Your right wheels drift off the pavement onto the gravel shoulder. What should you do?","question_zh":"你的右侧车轮偏出了铺装路面，驶上砂石路肩。应该怎么做？","options":[{"en":"Brake hard right away so you stop on the shoulder","zh":"立即用力刹车，在路肩上停下"},{"en":"Ease off the gas, avoid hard braking, and steer back once in control","zh":"松开油门，避免急刹，车辆受控后再转回路面"},{"en":"Jerk the steering wheel sharply to get back on the pavement at once","zh":"猛打方向盘，立刻回到路面上"},{"en":"Press the gas so the tires have the power to climb back up","zh":"踩油门，让轮胎有足够动力爬回路面"}],"answer_index":1,"explanation_zh":"车轮驶出路面时不要慌：握紧方向盘，松开油门减速，避免急刹车；车辆受控后再转向回到路面，车轮完全回到路面后再修正方向并提速。","explanation_en":"Grip the wheel, ease off the gas, avoid heavy braking, and steer back once under control.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-emergencies","source_title":"MTO 手册 · Dealing with emergencies","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-29","group":"RE","section":"rules","topic_zh":"爆胎","question_en":"A tire blows out and the steering wheel starts to shake hard. What should you do?","question_zh":"一个轮胎突然爆裂，方向盘剧烈抖动。应该怎么做？","options":[{"en":"Brake hard at once and stop right where you are in your lane","zh":"立即急刹车，就在本车道内停下"},{"en":"Loosen your grip on the wheel so the car can straighten itself out","zh":"放松握方向盘的手，让车自己回正"},{"en":"Lift off the gas, steer firmly, then stop off the road","zh":"松开油门，牢牢把稳方向，然后把车停到路外"},{"en":"Speed up to keep the car stable, then drive on to the next exit","zh":"加速保持车身稳定，然后继续开到下一个出口"}],"answer_index":2,"explanation_zh":"爆胎会引起方向盘和车轮剧烈抖动，但不要惊慌：松开油门减速，牢牢把住方向盘朝你要去的方向行驶，然后把车停到路外。","explanation_en":"After a blowout, take your foot off the gas, steer firmly and stop off the road.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-emergencies","source_title":"MTO 手册 · Dealing with emergencies","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-30","group":"RE","section":"rules","topic_zh":"交通事故处理","question_en":"You are involved in a collision. What does the law require of you?","question_zh":"你卷入了一起交通事故。法律对你有什么要求？","options":[{"en":"You may drive away as long as nobody appears to be hurt","zh":"只要看起来没人受伤，就可以开车离开"},{"en":"Leave a note on the other vehicle and report the collision later","zh":"在对方车上留张纸条，以后再报告事故"},{"en":"You may leave once you have phoned your insurance company","zh":"打电话通知保险公司后就可以离开"},{"en":"Stay at or return at once to the scene and give all possible help","zh":"留在现场或立即返回现场，并尽一切可能提供帮助"}],"answer_index":3,"explanation_zh":"所有卷入事故的驾驶人都必须留在现场或立即返回现场，并提供一切可能的帮助。没有卷入事故的路过驾驶人，如警察等尚未到达，也应停车提供帮助。","explanation_en":"Every driver involved in a collision must stay at or return to the scene and give all possible help.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-emergencies","source_title":"MTO 手册 · Dealing with emergencies","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RE-31","group":"RE","section":"rules","topic_zh":"事故报警","question_en":"By law, you must report a collision to police if anyone is injured or if damage to vehicles or other property is more than:","question_zh":"依法，事故中如有人受伤，或车辆或其他财产的损失超过多少，必须向警方报告？","options":[{"en":"$5,000","zh":"5,000 加元"},{"en":"$1,000","zh":"1,000 加元"},{"en":"$2,000","zh":"2,000 加元"},{"en":"$10,000","zh":"10,000 加元"}],"answer_index":0,"explanation_zh":"法律规定：事故有人受伤，或车辆、财产损失超过 5,000 加元时，必须向警方报告；无人受伤且损失低于 5,000 加元的事故不必报警，但仍须与车辆受损的一方交换信息。","explanation_en":"Report to police if there are injuries or damage over $5,000.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-emergencies","source_title":"MTO 手册 · Dealing with emergencies","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RE-32","group":"RE","section":"rules","topic_zh":"事故报警","question_en":"You have a minor collision. No one is hurt and the total damage is clearly less than $5,000. What are you legally required to do?","question_zh":"你发生了一起轻微事故，无人受伤，总损失明显低于 5,000 加元。法律要求你做什么？","options":[{"en":"Report it to police within 24 hours; exchanging information is optional","zh":"24 小时内报警；是否交换信息可自行决定"},{"en":"Exchange information with the other party; a police report is not required","zh":"与对方交换信息；不必向警方报告"},{"en":"Nothing, because the damage is small","zh":"什么都不用做，因为损失很小"},{"en":"Wait at the scene until police arrive to investigate","zh":"在现场等候警察到来调查"}],"answer_index":1,"explanation_zh":"损失低于 5,000 加元且无人受伤时，事故不必向警方报告，但法律仍要求你与车辆受损的一方交换信息。","explanation_en":"Under $5,000 with no injuries, you must still exchange information but need not report to police.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-emergencies","source_title":"MTO 手册 · Dealing with emergencies","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-33","group":"RE","section":"rules","topic_zh":"交通事故处理","question_en":"On a busy road you have a minor collision. No one is hurt and both vehicles can still be driven. What should you do with the vehicles?","question_zh":"在繁忙道路上发生了轻微事故，无人受伤，两辆车都还能开。应该怎样处理车辆？","options":[{"en":"Leave them exactly where they stopped until police arrive","zh":"保持原位不动，等警察到来"},{"en":"Leave them in the lane, but turn off the engines and lock them","zh":"留在车道上，但熄火并锁好车"},{"en":"Move them as far off the road as possible","zh":"尽量把车移到远离道路的地方"},{"en":"Move only the vehicle that caused the collision; the other stays put","zh":"只移动造成事故一方的车辆，另一辆留在原位"}],"answer_index":2,"explanation_zh":"无人受伤的小事故，如果车辆还能开，应遵循“Steer it, Clear it”（能开就移开）原则，尽量把车移离道路，这不会影响警方调查，在繁忙或高速道路上尤其重要。车辆无法移动时，要在足够远处设置警示标志或信号弹。","explanation_en":"In a minor no-injury collision, Steer it, Clear it: move drivable vehicles off the road.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-emergencies","source_title":"MTO 手册 · Dealing with emergencies","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-34","group":"RE","section":"rules","topic_zh":"事故伤员救助","question_en":"At a collision scene, a person is injured inside a car. There is no danger of fire or explosion. What should you do?","question_zh":"在事故现场，有人在车内受伤，没有起火或爆炸的危险。应该怎么做？","options":[{"en":"Pull the person out of the car and lay them flat beside the road","zh":"把伤者从车里拉出来，平放在路边"},{"en":"Put the person in your own car and drive them to the nearest hospital","zh":"把伤者扶上自己的车，送往最近的医院"},{"en":"Give the person something to drink and help them walk around","zh":"给伤者喝点东西，并扶他走动"},{"en":"Leave them where they are until trained medical help arrives","zh":"让伤者留在原处，直到受过训练的医护人员到达"}],"answer_index":3,"explanation_zh":"若没有起火或爆炸危险，应让伤者留在原处，等专业医护人员到达，并陪伴伤者直到救援到来。车辆起火时，应尽快让人员脱离危险并远离车辆。","explanation_en":"With no fire or explosion risk, leave injured people where they are until medical help arrives.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-emergencies","source_title":"MTO 手册 · Dealing with emergencies","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-35","group":"RE","section":"rules","topic_zh":"事故现场安全","question_en":"You stop at a collision where fuel may be leaking. Which action is correct?","question_zh":"你在一起可能有燃油泄漏的事故现场停车帮忙。下列哪种做法是正确的？","options":[{"en":"Make sure no one smokes or lights a match near the vehicles","zh":"确保没人在车辆附近吸烟或点火柴"},{"en":"Put lit flares right beside the damaged vehicles so they are easy to see","zh":"把点燃的信号弹放在受损车辆旁边，便于被看到"},{"en":"Restart the engines and move the cars away from the leak","zh":"重新发动引擎，把车开离泄漏处"},{"en":"Keep everyone inside their vehicles, even if one catches fire","zh":"让所有人留在车内，即使有车起火也一样"}],"answer_index":0,"explanation_zh":"应关闭所有发动机并打开危险警示灯；为防燃油泄漏，不许任何人在车辆附近吸烟、点火柴或放置信号弹。如有车辆起火，要把人救出并远离现场。","explanation_en":"With a possible fuel leak, don't let anyone smoke, light matches or put flares near the vehicles.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-emergencies","source_title":"MTO 手册 · Dealing with emergencies","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-36","group":"RE","section":"rules","topic_zh":"事故伤员救助","question_en":"You have no first-aid training. A person injured in a collision seems to be going into shock. What can you do?","question_zh":"你没受过急救培训。一名事故伤者似乎出现了休克。你可以怎么做？","options":[{"en":"Give the person an alcoholic drink to warm them up","zh":"给伤者喝点酒暖暖身子"},{"en":"Cover the person with a jacket or blanket","zh":"用外套或毯子盖住伤者"},{"en":"Get the person to stand up and walk to stay alert","zh":"让伤者站起来走动以保持清醒"},{"en":"Splash cold water on the person's face","zh":"往伤者脸上泼冷水"}],"answer_index":1,"explanation_zh":"事故中受伤的人常会休克。没受过急救训练也可以凭常识帮忙：用外套或毯子盖住伤者，减轻休克的影响，并陪伴伤者直到救援到达。","explanation_en":"Cover a person in shock with a jacket or blanket.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-emergencies","source_title":"MTO 手册 · Dealing with emergencies","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RE-37","group":"RE","section":"rules","topic_zh":"节能驾驶","question_en":"To save fuel and cut emissions, the handbook says to turn off your engine if you will be parked for more than:","question_zh":"为了省油减排，手册建议停车超过多长时间就应关闭发动机？","options":[{"en":"30 seconds","zh":"30 秒"},{"en":"1 minute","zh":"1 分钟"},{"en":"10 seconds","zh":"10 秒"},{"en":"5 minutes","zh":"5 分钟"}],"answer_index":2,"explanation_zh":"手册建议停车超过 10 秒就熄火；即使在寒冷天气，发动机 30 秒内也能暖好，不必长时间怠速。","explanation_en":"Turn off the engine if parked more than 10 seconds.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-efficiently","source_title":"MTO 手册 · Driving efficiently","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RE-38","group":"RE","section":"rules","topic_zh":"节能驾驶","question_en":"According to the handbook, how long does a vehicle engine take to warm up, even in cold weather?","question_zh":"根据手册，即使在寒冷天气，车辆发动机大约多长时间就能暖好？","options":[{"en":"About 5 minutes","zh":"大约 5 分钟"},{"en":"About 10 minutes","zh":"大约 10 分钟"},{"en":"At least 2 minutes","zh":"至少 2 分钟"},{"en":"Within 30 seconds","zh":"30 秒以内"}],"answer_index":3,"explanation_zh":"手册指出，即使在冷天，发动机也会在 30 秒内暖好，所以不需要长时间原地怠速暖车。另外，冷车启动时会排放大量污染物，应避免不必要的启动。","explanation_en":"Even in cold weather, engines warm up within 30 seconds.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-efficiently","source_title":"MTO 手册 · Driving efficiently","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-39","group":"RE","section":"rules","topic_zh":"节能驾驶","question_en":"You are driving at highway speed on a hot day. Which choice is usually more fuel-efficient?","question_zh":"炎热天气在高速公路上行驶时，哪种做法通常更省油？","options":[{"en":"Using the vents or air conditioning instead of opening the windows","zh":"使用通风口或空调，而不是打开车窗"},{"en":"Opening all the windows wide and switching the air conditioning off","zh":"把所有车窗开大，并关掉空调"},{"en":"Shifting to a lower gear to ease the load on the engine","zh":"换到低挡，减轻发动机负荷"},{"en":"Opening the sunroof and closing all the vents to keep heat out","zh":"打开天窗并关闭所有通风口以挡住热气"}],"answer_index":0,"explanation_zh":"高速时开窗会破坏车辆的空气动力性，用通风口或空调通常更省油；在市区走走停停时则宜用车窗和通风口。高速公路上使用超速挡（overdrive）和定速巡航也能提高燃油效率。","explanation_en":"At high speeds, vents or A/C are usually more fuel-efficient than open windows.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-efficiently","source_title":"MTO 手册 · Driving efficiently","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-40","group":"RE","section":"rules","topic_zh":"节能与环保","question_en":"Why should you avoid 'topping off' your fuel tank when refuelling?","question_zh":"加油时为什么不要在油枪自动跳停后继续补加（top-off）？","options":[{"en":"It cancels your vehicle's warranty","zh":"会使车辆保修失效"},{"en":"Spilled fuel releases harmful vapours","zh":"溢出的燃油会释放有害蒸气"},{"en":"It is illegal at self-serve stations","zh":"在自助加油站这样做违法"},{"en":"It lowers the octane rating of the fuel","zh":"会降低燃油的辛烷值"}],"answer_index":1,"explanation_zh":"手册提醒加油时不要在跳停后继续补加，因为洒出来的燃油会释放有害蒸气，污染环境。","explanation_en":"Don't top off the tank; spilled fuel releases harmful vapours.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-efficiently","source_title":"MTO 手册 · Driving efficiently","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RE-41","group":"RE","section":"rules","topic_zh":"车辆保养与油耗","question_en":"Which of these can substantially increase your vehicle's fuel consumption?","question_zh":"下列哪一项会使车辆油耗大幅增加？","options":[{"en":"Keeping the tires inflated to the recommended pressure","zh":"保持轮胎气压符合推荐值"},{"en":"Using the overdrive gear on the freeway","zh":"在高速公路上使用超速挡"},{"en":"Taking off an empty roof rack","zh":"拆掉空着不用的车顶行李架"},{"en":"Worn spark plugs or dragging brakes","zh":"火花塞磨损或刹车拖滞"}],"answer_index":3,"explanation_zh":"火花塞磨损、刹车拖滞、变速箱油不足或变速箱进不了高挡，都会大幅增加油耗。保持正确胎压、高速用超速挡、拆掉不用的车顶架则有助于省油。","explanation_en":"Worn spark plugs and dragging brakes can substantially increase fuel use.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-efficiently","source_title":"MTO 手册 · Driving efficiently","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-42","group":"RE","section":"rules","topic_zh":"车辆安全检查","question_en":"Who may examine your vehicle, its equipment and any trailer attached to it, and when?","question_zh":"谁可以检查你的车辆、车上设备以及挂接的拖车？什么时候可以检查？","options":[{"en":"Only a licensed mechanic, and only during a yearly safety inspection","zh":"只有持牌技师，而且只能在每年的安全检查时"},{"en":"A police officer, but only after your vehicle has been in a collision","zh":"警察，但只能在你的车发生事故之后"},{"en":"A police officer or Ministry of Transportation inspector, at any time","zh":"警察或交通部（MTO）检查员，任何时候都可以"},{"en":"Only a Ministry of Transportation inspector, and only with your consent","zh":"只有交通部检查员，而且须经你同意"}],"answer_index":2,"explanation_zh":"警察或交通部检查员可随时检查你的车辆、设备和拖车；如发现车辆不安全，可令其停止上路直到修好。驾驶处于危险状态的车辆是违法的。","explanation_en":"Police or MTO inspectors can examine your vehicle and trailer at any time.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/maintaining-your-vehicle","source_title":"MTO 手册 · Maintaining your vehicle","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-43","group":"RE","section":"rules","topic_zh":"轮胎","question_en":"According to the handbook, tires should not be older than how many years, even if they have seen little use?","question_zh":"根据手册，轮胎即使很少使用，也不应超过多少年？","options":[{"en":"5 years","zh":"5 年"},{"en":"7 years","zh":"7 年"},{"en":"15 years","zh":"15 年"},{"en":"10 years","zh":"10 年"}],"answer_index":3,"explanation_zh":"轮胎即使不使用也会随时间老化，抓地力下降、容易开裂，可能在使用中突然失效。手册建议轮胎不应超过 10 年。","explanation_en":"Tires should not be older than 10 years.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/maintaining-your-vehicle","source_title":"MTO 手册 · Maintaining your vehicle","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-44","group":"RE","section":"rules","topic_zh":"轮胎","question_en":"You should replace your car's tires when the tread depth is less than:","question_zh":"当胎纹深度低于多少时，应更换你的小汽车轮胎？","options":[{"en":"1.5 mm","zh":"1.5 毫米"},{"en":"3 mm","zh":"3 毫米"},{"en":"1 mm","zh":"1 毫米"},{"en":"2.5 mm","zh":"2.5 毫米"}],"answer_index":0,"explanation_zh":"胎纹深度不足 1.5 毫米，或胎纹磨损指示块已接触路面时，应更换轮胎。重量超过 4,500 公斤的车辆，前轮胎纹不足 3 毫米就必须更换。","explanation_en":"Replace tires when tread is under 1.5 mm or wear indicators touch the road.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/maintaining-your-vehicle","source_title":"MTO 手册 · Maintaining your vehicle","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RE-45","group":"RE","section":"rules","topic_zh":"轮胎","question_en":"A vehicle that weighs more than 4,500 kg must have its front tires replaced when the tread depth is less than:","question_zh":"重量超过 4,500 公斤的车辆，前轮胎纹深度低于多少时必须更换？","options":[{"en":"1.5 mm","zh":"1.5 毫米"},{"en":"3 mm","zh":"3 毫米"},{"en":"2 mm","zh":"2 毫米"},{"en":"5 mm","zh":"5 毫米"}],"answer_index":1,"explanation_zh":"重量超过 4,500 公斤的车辆，前轮胎纹深度不足 3 毫米时必须更换；一般车辆的标准是 1.5 毫米。","explanation_en":"Vehicles over 4,500 kg must replace front tires with tread under 3 mm.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/maintaining-your-vehicle","source_title":"MTO 手册 · Maintaining your vehicle","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RE-46","group":"RE","section":"rules","topic_zh":"冬季轮胎","question_en":"For the best traction in winter, what does the handbook recommend?","question_zh":"为了在冬季获得最好的抓地力，手册建议怎么做？","options":[{"en":"Winter tires on the drive wheels only, with regular tires on the others","zh":"只在驱动轮上装冬季轮胎，其余车轮用普通轮胎"},{"en":"Winter tires on the front and summer tires on the back","zh":"前轮装冬季轮胎，后轮装夏季轮胎"},{"en":"Four winter or all-weather tires with the same tread pattern","zh":"四条胎纹相同的冬季轮胎或全天候轮胎"},{"en":"Four winter tires that mix different tread patterns","zh":"四条冬季轮胎，但胎纹各不相同"}],"answer_index":2,"explanation_zh":"手册建议冬季装四条胎纹相同的冬季轮胎或全天候轮胎，以获得最好的牵引力；四个车轮应使用相似的轮胎。","explanation_en":"Use four winter or all-weather tires with the same tread pattern.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/maintaining-your-vehicle","source_title":"MTO 手册 · Maintaining your vehicle","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-47","group":"RE","section":"rules","topic_zh":"冬季轮胎","question_en":"According to the handbook, who may legally use studded tires in Ontario?","question_zh":"根据手册，在安大略省谁可以合法使用防滑钉轮胎（studded tires）？","options":[{"en":"Any driver, from November to April","zh":"任何驾驶人，在 11 月至次年 4 月期间"},{"en":"People who live in northern Ontario","zh":"居住在安大略省北部的人"},{"en":"Nobody; they are banned everywhere in Ontario","zh":"没有人，全省禁止"},{"en":"Only commercial trucks over 4,500 kg","zh":"只有 4,500 公斤以上的商用卡车"}],"answer_index":1,"explanation_zh":"手册说明，居住在安大略省北部的人可以合法在车上使用防滑钉轮胎。","explanation_en":"Residents of northern Ontario may legally use studded tires.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/maintaining-your-vehicle","source_title":"MTO 手册 · Maintaining your vehicle","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RE-48","group":"RE","section":"rules","topic_zh":"冬季车辆保养","question_en":"Why is a faulty exhaust system especially dangerous in winter?","question_zh":"为什么排气系统有故障在冬季尤其危险？","options":[{"en":"Drivers are more likely to keep windows and vents closed","zh":"驾驶人更可能紧闭车窗和通风口"},{"en":"Cold air can make the exhaust pipe explode","zh":"冷空气会让排气管爆炸"},{"en":"Road salt blocks the exhaust and shuts the engine off","zh":"道路盐会堵住排气管，使发动机熄火"},{"en":"A noisy exhaust drains the battery faster in the cold","zh":"排气噪音大会让电瓶在寒冷中更快耗尽"}],"answer_index":0,"explanation_zh":"冬季驾驶人常常紧闭车窗和通风口，排气系统有故障时废气难以散出，因此尤其危险。排气声音变大或有异响时应及时检查。","explanation_en":"In winter, windows and vents are usually closed, so a faulty exhaust is especially dangerous.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/maintaining-your-vehicle","source_title":"MTO 手册 · Maintaining your vehicle","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-49","group":"RE","section":"rules","topic_zh":"冬季应急用品","question_en":"Besides a shovel and a blanket, which items does the handbook list as winter emergency supplies to carry?","question_zh":"除了铲子和毯子，手册还建议冬季在车上携带哪些应急用品？","options":[{"en":"A spare licence plate, a roof rack and a set of summer tires","zh":"备用车牌、车顶行李架和一套夏季轮胎"},{"en":"Extra engine oil, a waterproof car cover and a picnic cooler","zh":"额外的机油、防水车罩和野餐冷藏箱"},{"en":"Booster cables, flares or warning lights, and a towing chain","zh":"跨接电缆（搭电线）、信号弹或警示灯，以及拖链"},{"en":"A radar detector, sunglasses and a tire-pressure sticker","zh":"雷达测速探测器、太阳镜和胎压贴纸"}],"answer_index":2,"explanation_zh":"冬季应急用品包括：铲子、跨接电缆、应急信号弹或警示灯、毯子和拖链；冬季还应多带挡风玻璃清洗液，并及时加满。","explanation_en":"Winter supplies: shovel, booster cables, flares or warning lights, blanket and a towing chain.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/maintaining-your-vehicle","source_title":"MTO 手册 · Maintaining your vehicle","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RE-50","group":"RE","section":"rules","topic_zh":"牵引拖车","question_en":"With a valid Class G1, G2 or G licence, you may tow a trailer with a gross vehicle weight of up to:","question_zh":"持有有效的 G1、G2 或 G 类驾照，可以牵引总重最多多少的拖车？","options":[{"en":"1,360 kg","zh":"1,360 公斤"},{"en":"4,500 kg","zh":"4,500 公斤"},{"en":"2,000 kg","zh":"2,000 公斤"},{"en":"4,600 kg","zh":"4,600 公斤"}],"answer_index":3,"explanation_zh":"持有效 G1、G2 或 G 类（或更高级别）驾照，可牵引总重不超过 4,600 公斤的拖车；超过规定尺寸或重量，可能需要更高级别驾照或超限车辆许可。","explanation_en":"Class G1, G2 or G drivers may tow trailers up to 4,600 kg gross weight.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/towing","source_title":"MTO 手册 · Towing","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-51","group":"RE","section":"rules","topic_zh":"牵引拖车","question_en":"How many trailers may you legally tow behind a non-commercial vehicle, such as a family car or pickup truck?","question_zh":"非商用车辆（如家用轿车或皮卡）后面最多可以合法牵引几辆拖车？","options":[{"en":"One","zh":"一辆"},{"en":"Two, if their combined weight is under 4,600 kg","zh":"两辆，只要总重低于 4,600 公斤"},{"en":"Two, with an oversize vehicle permit","zh":"两辆，但须有超限车辆许可"},{"en":"Three, if the last one is empty","zh":"三辆，只要最后一辆是空的"}],"answer_index":0,"explanation_zh":"法律禁止在非商用车辆后面牵引一辆以上的拖车。","explanation_en":"It is illegal to tow more than one trailer behind a non-commercial vehicle.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/towing","source_title":"MTO 手册 · Towing","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-52","group":"RE","section":"rules","topic_zh":"拖车登记","question_en":"You have just bought a utility trailer. What must you do before towing it on a public road?","question_zh":"你刚买了一辆小型拖车。在公共道路上牵引它之前必须做什么？","options":[{"en":"Nothing, because the towing vehicle's own licence plate already covers it","zh":"什么都不用做，牵引车自己的车牌已经涵盖了拖车"},{"en":"Register it at ServiceOntario for a one-time fee and mount its plate on the back","zh":"到 ServiceOntario 登记并缴纳一次性费用，把拖车车牌装在拖车尾部"},{"en":"Register it every year at ServiceOntario and display a yearly validation sticker","zh":"每年到 ServiceOntario 登记一次，并贴年度有效标签"},{"en":"Move the towing vehicle's rear licence plate onto the back of the trailer","zh":"把牵引车的后车牌移装到拖车尾部"}],"answer_index":1,"explanation_zh":"拖车被视为一辆独立车辆，上路前须到 ServiceOntario 登记并缴纳一次性登记费，取得车牌和车辆许可证；车牌装在拖车尾部清晰可见处，并随身携带许可证（或副本）以备警察查验。","explanation_en":"Register a trailer at ServiceOntario (one-time fee) and mount its plate on the back.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/towing","source_title":"MTO 手册 · Towing","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-53","group":"RE","section":"rules","topic_zh":"拖车制动","question_en":"A trailer must have its own brakes, strong enough to stop and hold it, once the trailer and its load weigh at least:","question_zh":"拖车连同装载物的总重至少达到多少时，拖车必须配备足以使其停住并保持静止的刹车？","options":[{"en":"900 kg","zh":"900 公斤"},{"en":"2,000 kg","zh":"2,000 公斤"},{"en":"1,360 kg","zh":"1,360 公斤"},{"en":"4,600 kg","zh":"4,600 公斤"}],"answer_index":2,"explanation_zh":"拖车（连同装载）总重达到 1,360 公斤或以上时，必须配备足以使拖车停住并保持静止的刹车。","explanation_en":"Trailers of 1,360 kg or more gross weight must have their own brakes.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/towing","source_title":"MTO 手册 · Towing","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-54","group":"RE","section":"rules","topic_zh":"拖车灯光","question_en":"Which lighting equipment must every trailer have at the rear?","question_zh":"每辆拖车尾部必须具备哪些灯光装置？","options":[{"en":"Two yellow clearance lights and a single white tail light","zh":"两盏黄色示廓灯和一盏白色尾灯"},{"en":"A white licence plate light, a red tail light and two red reflectors","zh":"一盏白色车牌灯、一盏红色尾灯和两个红色反光器"},{"en":"A flashing amber beacon on top and a single red reflector","zh":"顶部一盏闪烁的琥珀色信标灯和一个红色反光器"},{"en":"A red licence plate light, a white tail light and two white reflectors","zh":"一盏红色车牌灯、一盏白色尾灯和两个白色反光器"}],"answer_index":1,"explanation_zh":"所有拖车都必须有：白色车牌灯、红色尾灯，以及尾部两个尽量分开安装的红色反光器。","explanation_en":"Every trailer needs a white plate light, a red tail light and two red rear reflectors.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/towing","source_title":"MTO 手册 · Towing","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-55","group":"RE","section":"rules","topic_zh":"拖车灯光","question_en":"Your trailer is 2.3 metres wide. In addition to the lights every trailer needs, what must it have?","question_zh":"你的拖车宽 2.3 米。除了所有拖车都必须有的灯光外，它还必须配备什么？","options":[{"en":"Nothing more; extra lights are only needed on trailers wider than 2.6 m","zh":"不需要别的，只有宽于 2.6 米的拖车才需要额外灯光"},{"en":"Two red clearance lights at the front and two yellow clearance lights or reflectors at the rear","zh":"前部两盏红色示廓灯，后部两盏黄色示廓灯或反光器"},{"en":"A flashing amber light on the roof of the trailer, visible from both ends","zh":"在拖车顶部装一盏前后都能看到的闪烁琥珀色灯"},{"en":"Two yellow clearance lights at the front and two red clearance lights or reflectors at the rear","zh":"前部两盏黄色示廓灯，后部两盏红色示廓灯或反光器"}],"answer_index":3,"explanation_zh":"拖车宽度超过 2.05 米时，必须在前部两侧装两盏黄色示廓灯、后部两侧装两盏红色示廓灯或反光器，并尽量分开安装，让前后车辆知道拖车的宽度。","explanation_en":"Trailers wider than 2.05 m need two yellow front and two red rear clearance lights (or rear reflectors).","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/towing","source_title":"MTO 手册 · Towing","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RE-56","group":"RE","section":"rules","topic_zh":"拖车后视镜","question_en":"The load in your trailer blocks your view to the rear. What is required?","question_zh":"拖车上的货物挡住了你向后的视线。法律有什么要求？","options":[{"en":"A passenger who watches the traffic behind you and calls it out","zh":"有一名乘客帮你观察后方交通并随时提醒"},{"en":"Driving with your emergency flashers on the whole time","zh":"全程开着危险警示灯"},{"en":"Additional mirrors that give a clear view of the road behind","zh":"加装能清楚看到后方道路的额外后视镜"},{"en":"Nothing, as long as you check over your shoulder often","zh":"不需要，只要经常回头观察就行"}],"answer_index":2,"explanation_zh":"如果拖车上的货物挡住了后方视线，必须加装能清楚看到后方道路的额外后视镜；装货时还要固定好，防止行驶中松脱或掉落。","explanation_en":"If the trailer load blocks your rear view, you must have additional mirrors.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/towing","source_title":"MTO 手册 · Towing","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-57","group":"RE","section":"rules","topic_zh":"拖车连接","question_en":"Safety chains are used as the second way of attaching your trailer. How must they be arranged?","question_zh":"用安全链作为拖车的第二套连接装置时，安全链必须怎样安装？","options":[{"en":"Crossed under the trailer tongue","zh":"在拖车牵引杆下方交叉"},{"en":"Hanging straight down, parallel to each other","zh":"笔直下垂、彼此平行"},{"en":"Wrapped around the hitch ball","zh":"缠绕在挂钩球上"},{"en":"Attached only to the rear bumper","zh":"只挂在后保险杠上"}],"answer_index":0,"explanation_zh":"拖车必须有两套独立的连接方式，一套失效时拖车仍能挂住。使用安全链时必须在牵引杆下方交叉，这样主挂钩意外脱开时牵引杆不会掉到路面上；链钩须有锁扣，不会意外脱落。","explanation_en":"Safety chains must be crossed under the tongue so it won't drop to the road if the hitch disconnects.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/towing","source_title":"MTO 手册 · Towing","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-58","group":"RE","section":"rules","topic_zh":"拖车载人","question_en":"You are towing a house trailer. May anyone ride inside it while it is being towed?","question_zh":"你正在牵引一辆房车拖车（house trailer）。牵引途中可以有人坐在拖车里吗？","options":[{"en":"Yes, as long as each person wears a seatbelt","zh":"可以，只要每个人都系好安全带"},{"en":"Yes, as long as you stay under 50 km/h","zh":"可以，只要车速低于 50 km/h"},{"en":"Yes, but only adults, not children","zh":"可以，但只限成年人，儿童不行"},{"en":"No, nobody may ride in a trailer being towed","zh":"不可以，任何正在被牵引的拖车都不得载人"}],"answer_index":3,"explanation_zh":"法律规定，任何正在被牵引的拖车（包括房车拖车和船拖车）都不得载人。","explanation_en":"No one may ride in any trailer, including a house or boat trailer, while it is towed.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/towing","source_title":"MTO 手册 · Towing","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RE-59","group":"RE","section":"rules","topic_zh":"拖车装载","question_en":"About what share of a trailer's total weight should rest on the hitch?","question_zh":"拖车总重量中，大约应有多大比例压在挂钩上？","options":[{"en":"About 1 to 2 per cent","zh":"大约 1%～2%"},{"en":"About 5 to 10 per cent","zh":"大约 5%～10%"},{"en":"About 20 to 25 per cent","zh":"大约 20%～25%"},{"en":"About 40 to 50 per cent","zh":"大约 40%～50%"}],"answer_index":1,"explanation_zh":"大约 5%～10% 的拖车总重应由挂钩承担（不超过挂钩标注的限值），因此装货时车轴前方的重量一般应多于后方。重量分布不当会使拖车摇摆甩尾；后部过重时，挂钩球与挂钩还可能脱开。","explanation_en":"About 5 to 10 per cent of the trailer's total weight should be on the hitch.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/towing","source_title":"MTO 手册 · Towing","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RE-60","group":"RE","section":"rules","topic_zh":"拖车装载","question_en":"A heavy, badly placed trailer load is pulling down the rear of your vehicle. What can this lead to?","question_zh":"拖车装载过重且位置不当，把你的车尾压低了。这可能导致什么？","options":[{"en":"Better steering, because the front tires press harder against the road","zh":"转向更好，因为前轮压地更紧"},{"en":"Headlights aim lower, which only shortens how far you can see ahead","zh":"大灯照得更低，只会缩短你能看到的距离"},{"en":"The front lifts, steering suffers and low beams may dazzle oncoming drivers","zh":"车头抬起，转向受影响，近光灯可能晃到对向驾驶员"},{"en":"No real effect, as long as the trailer has its own working brakes","zh":"没什么影响，只要拖车有自己的有效刹车"}],"answer_index":2,"explanation_zh":"过重或位置不当的货物会压低车尾、抬起车头，影响转向（湿滑时尤甚），还会改变大灯照射角度，使近光灯晃到对向驾驶员，后视镜的角度也会受影响。","explanation_en":"A sagging rear lifts the front, affects steering and can make low beams blind oncoming drivers.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/towing","source_title":"MTO 手册 · Towing","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-61","group":"RE","section":"rules","topic_zh":"牵引拖车行驶","question_en":"While you are towing a trailer, a large truck passes you and the wind behind it pushes your trailer sideways. What should you do?","question_zh":"你在牵引拖车时，一辆大卡车从旁超过，车后的气流把你的拖车推向一侧。应该怎么做？","options":[{"en":"Brake firmly so the trailer straightens out behind you","zh":"用力刹车，让拖车在后面回正"},{"en":"Steer sharply away from the truck to get more room","zh":"猛打方向盘远离卡车，留出更多空间"},{"en":"Shift into neutral and coast to a stop on the shoulder","zh":"挂空挡，滑行到路肩停车"},{"en":"Avoid braking; steer carefully back into position","zh":"不要刹车；小心地把车和拖车转回原位"}],"answer_index":3,"explanation_zh":"大型卡车或客车超车时，后面的强气流可能把拖车甩向一侧。此时不要刹车，要小心地把车和拖车转回原位，稍微加一点速度可能有帮助。","explanation_en":"If a passing truck's wind pushes your trailer, don't brake; steer back carefully, perhaps speeding up slightly.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/towing","source_title":"MTO 手册 · Towing","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-62","group":"RE","section":"rules","topic_zh":"拖车倒车","question_en":"You are reversing with a trailer and want the back of the trailer to go to the right. Which way should you steer?","question_zh":"你牵引拖车倒车，想让拖车尾部向右走。方向盘应该往哪边打？","options":[{"en":"To the left","zh":"向左打"},{"en":"To the right","zh":"向右打"},{"en":"Keep it straight and reverse faster","zh":"保持方向盘正直，加快倒车速度"},{"en":"Fully right, then quickly fully left","zh":"先向右打到底，再迅速向左打到底"}],"answer_index":0,"explanation_zh":"牵引拖车倒车时，想让拖车往右就向左打方向：拖车前端向左，尾部向右；反之亦然。应非常缓慢地倒车，以多次小幅转向调整，最好有人在车外指挥。","explanation_en":"To back a trailer to the right, steer to the left.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/towing","source_title":"MTO 手册 · Towing","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RE-63","group":"RE","section":"rules","topic_zh":"牵引拖车行驶","question_en":"To avoid having to make sudden stops while towing a trailer, what should you do?","question_zh":"牵引拖车时，为避免不得不急刹车，应该怎么做？","options":[{"en":"Leave extra following distance and keep out of the fast lanes","zh":"加大跟车距离，不要走快车道"},{"en":"Follow larger vehicles closely so you can match their speed","zh":"紧跟大型车辆，以便跟上它们的车速"},{"en":"Use the fast lane, where traffic seldom has to stop","zh":"走快车道，那里的车流很少需要停车"},{"en":"Apply the parking brake along with the foot brake every time you slow down","zh":"每次减速都同时使用手刹和脚刹"}],"answer_index":0,"explanation_zh":"牵引拖车时急刹车可能导致拖车与车身折成 V 字形（jackknife，俗称“折刀”）、侧滑或货物移位。应加大与前车的距离，远离快车道，并保持能随时平稳减速停车的车速。","explanation_en":"Increase following distance and stay out of fast lanes to avoid sudden stops that can jackknife a trailer.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/towing","source_title":"MTO 手册 · Towing","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-64","group":"RE","section":"rules","topic_zh":"拖带故障车","question_en":"You must use another car (not a tow truck) to tow a disabled vehicle with a tow cable. Which of these is required?","question_zh":"你不得不用另一辆普通汽车（而不是清障车）用拖绳牵引一辆故障车。下列哪项是必须做到的？","options":[{"en":"The disabled vehicle must be left empty so that it weighs less","zh":"故障车里不能坐人，以减轻重量"},{"en":"You should first try to start the disabled vehicle by towing it","zh":"应先尝试通过拖拽把故障车发动起来"},{"en":"Hazard lights must stay off so other drivers aren't confused","zh":"必须关闭危险警示灯，以免让其他驾驶人困惑"},{"en":"A person must sit in the towed car and brake to keep the cable tight","zh":"必须有人坐在被拖的故障车里，用刹车使拖绳保持绷紧"}],"answer_index":3,"explanation_zh":"车辆抛锚时最好叫清障车（tow truck）。如必须用另一辆车牵引，要使用警示标志或危险警示灯并把两车牢固连接，而且必须有人坐在故障车里用刹车让拖绳保持绷紧。用拖拽的方式发动故障车很危险，可能损坏两辆车。","explanation_en":"Someone must sit in the towed vehicle and brake to keep the tow cable tight.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/towing","source_title":"MTO 手册 · Towing","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-65","group":"RE","section":"rules","topic_zh":"拖带故障车","question_en":"A broken-down car has power steering and power brakes, and its engine will not run. Should you tow it behind another car with a cable?","question_zh":"一辆抛锚的车装有助力转向和助力刹车，发动机无法运转。你应该用拖绳把它挂在另一辆车后面拖走吗？","options":[{"en":"No; braking and steering are difficult without the engine","zh":"不应该；发动机不转时刹车和转向都很困难"},{"en":"Yes; towing it along may get the engine running again on its own","zh":
