前方学校区域，适用较低限速"}],"answer_index":2,"explanation_zh":"该警告标志提醒你注意行人，并做好与行人共用道路的准备。","explanation_en":"Watch for pedestrians and be ready to share the road with them.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-68a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"easy"},{"id":"SB-40","group":"SB","section":"signs","topic_zh":"路面状况警告","question_en":"What does this warning sign mean?","question_zh":"这个警告标志是什么意思？","options":[{"en":"Watch for fallen rock; be ready to avoid a collision","zh":"注意落石，随时准备避让以免碰撞"},{"en":"Gravel road ahead; reduce speed and keep control","zh":"前方砂石路，减速并控制好车辆"},{"en":"Steep hill ahead; you may need a lower gear","zh":"前方陡坡，可能需要换用低速挡"},{"en":"Bump or uneven pavement ahead; slow down","zh":"前方路面有凸起或不平，减速"}],"answer_index":0,"explanation_zh":"该标志提示前方可能有落石，应注意观察，并随时准备避让，以免发生碰撞。","explanation_en":"Watch for fallen rock and be ready to avoid it.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-69a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"easy"},{"id":"SB-41","group":"SB","section":"signs","topic_zh":"路面状况警告","question_en":"What does this warning sign mean?","question_zh":"这个警告标志是什么意思？","options":[{"en":"Pavement is slippery when wet","zh":"路面湿时易滑"},{"en":"The bridge ahead lifts to let boats pass","zh":"前方桥梁会升起，让船只通过"},{"en":"Boat launch ahead","zh":"前方有船只下水坡道"},{"en":"Water may be flowing over the road","zh":"路面可能有水流漫过"}],"answer_index":3,"explanation_zh":"该标志表示前方路面可能有水流漫过。","explanation_en":"Water may be flowing over the road ahead.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-70a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"medium"},{"id":"SB-42","group":"SB","section":"signs","topic_zh":"校车","question_en":"What does this sign warn you about?","question_zh":"这个标志提醒你注意什么？","options":[{"en":"A school bus loading lane; only buses may enter","zh":"校车上下客专用车道，仅限校车驶入"},{"en":"A hidden school bus stop ahead","zh":"前方有隐蔽的校车站"},{"en":"A school bus depot entrance ahead","zh":"前方有校车停车场出入口"},{"en":"School zone; the speed limit is reduced","zh":"学校区域，限速降低"}],"answer_index":1,"explanation_zh":"该标志表示前方有隐蔽的校车站（hidden school bus stop），即视线受阻、不易提前看到的校车停靠点。","explanation_en":"It warns of a hidden school bus stop ahead.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-71a2.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"medium"},{"id":"SB-43","group":"SB","section":"signs","topic_zh":"校车","question_en":"You pass a warning sign for a hidden school bus stop ahead. What should you do?","question_zh":"你经过一个“前方有隐蔽校车站”的警告标志，应该怎么做？","options":[{"en":"Keep your speed; you only need to stop if you see the bus","zh":"保持车速，只有看到校车时才需停车"},{"en":"Sound your horn so that any children nearby know you are coming","zh":"鸣喇叭，让附近的儿童知道你来了"},{"en":"Speed up so you pass the stop before the school bus gets there","zh":"加速，赶在校车到达之前驶过站点"},{"en":"Slow down and watch for children and a bus with flashing red lights","zh":"减速慢行，留意儿童和闪着红灯的校车"}],"answer_index":3,"explanation_zh":"看到隐蔽校车站警告标志时，应减速、格外小心驾驶，留意儿童以及正在闪红灯的校车。","explanation_en":"Slow down, take extra care, and watch for children and a school bus with flashing red lights.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SB-44","group":"SB","section":"signs","topic_zh":"车辆出入口","question_en":"What does this warning sign mean?","question_zh":"这个警告标志是什么意思？","options":[{"en":"Bus lane ahead; only buses may use the right lane","zh":"前方公交专用道，右侧车道仅限公交车使用"},{"en":"Bus entrance on the right ahead; be ready to yield to buses","zh":"前方右侧有公交车出入口，准备让行公交车"},{"en":"Bus stop ahead; you must stop whenever the bus stops","zh":"前方公交车站，公交车停下时你必须停车"},{"en":"School bus loading zone; passing is not allowed","zh":"校车上下客区，禁止超车"}],"answer_index":1,"explanation_zh":"该标志表示前方右侧有公交车出入口，应准备让行正在驶入道路的公交车。","explanation_en":"Be ready to yield to buses entering the road from the right.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-71a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"medium"},{"id":"SB-45","group":"SB","section":"signs","topic_zh":"车辆出入口","question_en":"What does this warning sign mean?","question_zh":"这个警告标志是什么意思？","options":[{"en":"Fire route ahead; no stopping or parking at any time","zh":"前方消防通道，任何时候禁止停靠和停车"},{"en":"Emergency lane; only emergency vehicles may use it","zh":"应急车道，仅限应急车辆使用"},{"en":"Fire truck entrance on the right ahead; be ready to yield","zh":"前方右侧有消防车出入口，准备让行消防车"},{"en":"Fire station ahead; you must come to a full stop at this sign","zh":"前方有消防站，必须在此标志处完全停车"}],"answer_index":2,"explanation_zh":"该标志表示前方右侧有消防车出入口，应准备让行正在驶入道路的消防车。","explanation_en":"Be ready to yield to fire trucks entering the road from the right.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-71b2.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"medium"},{"id":"SB-46","group":"SB","section":"signs","topic_zh":"学校过街","question_en":"What should you do when you see these signs?","question_zh":"看到这些标志时，你应该怎么做？","options":[{"en":"Watch for children; follow the crossing guard's directions","zh":"注意儿童，听从过街护导员的指挥"},{"en":"Sound your horn to warn children before you reach the crossing","zh":"在到达过街处之前鸣喇叭提醒儿童"},{"en":"Slow down only if a school bus has its red lights flashing","zh":"只有校车闪红灯时才需减速"},{"en":"Keep a steady speed; children must wait for a gap in traffic","zh":"保持车速，儿童必须等车流出现空档再过街"}],"answer_index":0,"explanation_zh":"这组标志警告前方是学校过街处：要注意儿童，并听从过街护导员（crossing guard）或学校安全巡逻员（school safety patroller）的指挥。","explanation_en":"Watch for children and follow the directions of the crossing guard or school safety patroller.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-72.jpg","sign_desc_en":"A set of warning signs (see official image).","sign_desc_zh":"一组警告标志（见官方图片）。","difficulty":"easy"},{"id":"SC-01","group":"SC","section":"signs","topic_zh":"临时状况标志","question_en":"Temporary condition signs, such as those used around road work, are usually:","question_zh":"临时状况标志（例如道路施工路段使用的标志）通常是什么样子？","options":[{"en":"Rectangular with a green background and white letters","zh":"长方形，绿底白字"},{"en":"Diamond-shaped with a yellow background and black letters or symbols","zh":"菱形，黄底，黑色文字或图案"},{"en":"Diamond-shaped with an orange background and black letters or symbols","zh":"菱形，橙底，黑色文字或图案"},{"en":"Rectangular with a white background and black letters","zh":"长方形，白底黑字"}],"answer_index":2,"explanation_zh":"手册说明，临时状况标志通常为菱形、橙底、黑色文字或图案。黄底菱形是警告标志，绿底长方形是信息与指路标志。","explanation_en":"Temporary condition signs are usually orange diamonds with black letters or symbols.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"SC-02","group":"SC","section":"signs","topic_zh":"施工标志","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"Construction work one kilometre ahead","zh":"前方 1 公里处有施工"},{"en":"The construction zone ends in one kilometre","zh":"施工区在 1 公里后结束"},{"en":"A one-kilometre detour begins here","zh":"此处开始一段 1 公里的绕行路线"},{"en":"Stay at least one kilometre behind construction vehicles","zh":"与施工车辆保持至少 1 公里的距离"}],"answer_index":0,"explanation_zh":"这是临时状况标志，表示前方 1 公里处有施工，应提前做好准备、谨慎驾驶。","explanation_en":"This sign warns of construction work one kilometre ahead.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-73.jpg","sign_desc_en":"A sign from the temporary condition category, which the handbook says is usually orange with black letters or symbols.","sign_desc_zh":"临时状况类标志（手册称此类标志通常为橙底，配黑色文字或图案）。","difficulty":"easy"},{"id":"SC-03","group":"SC","section":"signs","topic_zh":"施工标志","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"Traffic control person ahead","zh":"前方有交通指挥员"},{"en":"Road work ahead","zh":"前方道路施工"},{"en":"Pedestrian crossover ahead","zh":"前方有行人过街设施（pedestrian crossover）"},{"en":"The construction zone has ended","zh":"施工区已结束"}],"answer_index":1,"explanation_zh":"这个临时状况标志表示前方道路施工，应格外小心，留意路上的工人以及施工车辆和设备。","explanation_en":"This temporary condition sign means road work ahead.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-74.jpg","sign_desc_en":"A sign from the temporary condition category, which the handbook says is usually orange with black letters or symbols.","sign_desc_zh":"临时状况类标志（手册称此类标志通常为橙底，配黑色文字或图案）。","difficulty":"easy"},{"id":"SC-04","group":"SC","section":"signs","topic_zh":"施工标志","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"A speed enforcement camera is ahead","zh":"前方有测速执法摄像头"},{"en":"The road is closed for surveying; follow the detour","zh":"道路因测量而封闭，请按绕行路线行驶"},{"en":"A survey crew is working on the road ahead","zh":"前方路上有测量人员在作业"},{"en":"Road work has ended; resume your normal speed","zh":"道路施工已结束，可恢复正常车速"}],"answer_index":2,"explanation_zh":"这个临时状况标志表示前方路上有测量人员在作业，应减速并小心通过。","explanation_en":"This sign warns that a survey crew is working on the road ahead.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-75.jpg","sign_desc_en":"A sign from the temporary condition category, which the handbook says is usually orange with black letters or symbols.","sign_desc_zh":"临时状况类标志（手册称此类标志通常为橙底，配黑色文字或图案）。","difficulty":"medium"},{"id":"SC-05","group":"SC","section":"signs","topic_zh":"交通指挥员","question_en":"What should you do when you see this sign?","question_zh":"看到这个标志时应该怎么做？","options":[{"en":"Speed up so you spend less time in the work area","zh":"加速，以缩短在施工区停留的时间"},{"en":"Stop and wait until a police officer arrives to wave you through","zh":"停车，等警察到场挥手放行"},{"en":"Watch for school children; a crossing guard is ahead","zh":"注意学童，前方有学童过街管理员"},{"en":"Drive slowly and watch for instructions from the person ahead","zh":"慢速行驶，留意前方人员给出的指示"}],"answer_index":3,"explanation_zh":"该标志表示前方有交通指挥员（traffic control person），应慢速行驶，留意并服从其指示。","explanation_en":"A traffic control person is ahead, so drive slowly and watch for instructions.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-76.jpg","sign_desc_en":"A sign from the temporary condition category, which the handbook says is usually orange with black letters or symbols.","sign_desc_zh":"临时状况类标志（手册称此类标志通常为橙底，配黑色文字或图案）。","difficulty":"easy"},{"id":"SC-06","group":"SC","section":"signs","topic_zh":"施工区","question_en":"What does this sign tell you?","question_zh":"这个标志告诉你什么？","options":[{"en":"You are entering a construction zone; be prepared for a lower speed limit","zh":"你正在进入施工区，要做好限速降低的准备"},{"en":"You are leaving a construction zone; you may resume normal speed","zh":"你正在离开施工区，可以恢复正常车速"},{"en":"Only construction vehicles may use this road","zh":"此路仅限施工车辆通行"},{"en":"The road ahead is closed; turn around","zh":"前方道路封闭，请掉头"}],"answer_index":0,"explanation_zh":"该标志表示你正在进入施工区，应格外谨慎驾驶，并做好限速降低的准备。","explanation_en":"You are entering a construction zone, so drive with extra caution and expect a lower speed limit.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-77.jpg","sign_desc_en":"A sign from the temporary condition category, which the handbook says is usually orange with black letters or symbols.","sign_desc_zh":"临时状况类标志（手册称此类标志通常为橙底，配黑色文字或图案）。","difficulty":"medium"},{"id":"SC-07","group":"SC","section":"signs","topic_zh":"绕行","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"The road is permanently closed with no way through","zh":"道路永久封闭，无法通行"},{"en":"An exit ramp is ahead","zh":"前方有出口匝道"},{"en":"A temporary detour from the normal traffic route","zh":"临时绕行，偏离正常行车路线"},{"en":"Truck route; cars are not permitted","zh":"货车专用路线，小汽车禁止通行"}],"answer_index":2,"explanation_zh":"该临时状况标志表示交通临时偏离正常路线，需要按绕行路线行驶。","explanation_en":"This sign marks a temporary detour from the normal traffic route.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-78.jpg","sign_desc_en":"A sign from the temporary condition category, which the handbook says is usually orange with black letters or symbols.","sign_desc_zh":"临时状况类标志（手册称此类标志通常为橙底，配黑色文字或图案）。","difficulty":"easy"},{"id":"SC-08","group":"SC","section":"signs","topic_zh":"闪灯箭头标志","question_en":"On a sign like this, what do the flashing lights on the arrows tell you?","question_zh":"在这样的标志上，箭头上闪烁的灯光表示什么？","options":[{"en":"Stop and wait until the lights stop flashing","zh":"停车，等灯光停止闪烁后再走"},{"en":"The direction you should follow","zh":"你应当行驶的方向"},{"en":"An emergency vehicle is approaching from behind","zh":"有应急车辆从后方驶来"},{"en":"Police are conducting a spot check ahead","zh":"前方警察正在进行抽查"}],"answer_index":1,"explanation_zh":"手册说明，箭头上的闪灯指示你应行驶的方向，应按箭头所指方向行驶。","explanation_en":"The flashing lights on the arrows show the direction to follow.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-79.jpg","sign_desc_en":"A temporary condition sign with arrows that have flashing lights.","sign_desc_zh":"临时状况类标志，箭头上带有闪灯。","difficulty":"medium"},{"id":"SC-09","group":"SC","section":"signs","topic_zh":"施工路面","question_en":"What does this sign warn you about?","question_zh":"这个标志在提醒你注意什么？","options":[{"en":"Milled or grooved pavement that may affect your stopping ability","zh":"路面经过铣刨或刻槽，可能影响你的制动停车能力"},{"en":"A bridge deck that may freeze before the rest of the road","zh":"桥面可能比其他路面先结冰"},{"en":"Rumble strips along the shoulder of the road ahead","zh":"前方路肩设有振动带"},{"en":"Loose gravel that trucks may throw onto your windshield","zh":"货车可能把碎石溅到你的挡风玻璃上"}],"answer_index":0,"explanation_zh":"该标志表示路面已被铣刨或刻槽，车辆的制动停车能力可能受影响，应遵守限速并格外小心。","explanation_en":"Milled or grooved pavement may affect stopping, so obey the speed limit and use extra caution.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-80.jpg","sign_desc_en":"A sign from the temporary condition category, which the handbook says is usually orange with black letters or symbols.","sign_desc_zh":"临时状况类标志（手册称此类标志通常为橙底，配黑色文字或图案）。","difficulty":"medium"},{"id":"SC-10","group":"SC","section":"signs","topic_zh":"施工路面","question_en":"A sign warns that the pavement ahead has been milled or grooved. Which road users does the handbook specifically say may experience reduced traction on this surface?","question_zh":"标志提示前方路面经过铣刨或刻槽。手册特别指出，哪类道路使用者在这种路面上抓地力可能下降？","options":[{"en":"Drivers of heavy trucks","zh":"重型货车司机"},{"en":"Drivers of vehicles with winter tires","zh":"装有冬季轮胎的车辆司机"},{"en":"Bus drivers","zh":"公交车司机"},{"en":"Motorcyclists","zh":"摩托车驾驶者"}],"answer_index":3,"explanation_zh":"手册特别指出，摩托车驾驶者在铣刨或刻槽路面上抓地力可能下降；所有驾驶者都应遵守限速、格外小心。","explanation_en":"Motorcyclists may have reduced traction on milled or grooved pavement.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SC-11","group":"SC","section":"signs","topic_zh":"车道封闭","question_en":"What should you do when you see this sign?","question_zh":"看到这个标志时应该怎么做？","options":[{"en":"Speed up and pass as many vehicles as possible before the lane ends","zh":"加速，在车道结束前尽量多超几辆车"},{"en":"Use the paved shoulder to drive past the closed lane","zh":"利用铺装路肩绕过封闭车道"},{"en":"Obey the speed limit and merge with traffic in the open lane","zh":"遵守限速，并入开放车道的车流"},{"en":"Stop and wait for a traffic control person to wave you through","zh":"停车等待交通指挥员挥手放行"}],"answer_index":2,"explanation_zh":"该标志表示前方车道因施工封闭，应遵守限速，并安全并入开放车道的车流。","explanation_en":"The lane ahead is closed for roadwork, so obey the speed limit and merge into the open lane.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-81.jpg","sign_desc_en":"A sign from the temporary condition category, which the handbook says is usually orange with black letters or symbols.","sign_desc_zh":"临时状况类标志（手册称此类标志通常为橙底，配黑色文字或图案）。","difficulty":"medium"},{"id":"SC-12","group":"SC","section":"signs","topic_zh":"车道封闭","question_en":"This closed-lane sign has an arrow. What does the arrow show you?","question_zh":"这个车道封闭标志上有一个箭头。箭头表示什么？","options":[{"en":"The lane you should merge into","zh":"你应并入的车道"},{"en":"The lane reserved for construction vehicles","zh":"施工车辆专用的车道"},{"en":"The direction of a detour off the highway","zh":"驶离公路的绕行方向"},{"en":"The direction of the nearest exit","zh":"最近出口的方向"}],"answer_index":0,"explanation_zh":"车道封闭时，应调整车速，并入箭头所指车道的车流。","explanation_en":"Adjust your speed and merge with traffic in the lane the arrow indicates.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-82.jpg","sign_desc_en":"A temporary condition sign about a closed lane, with an arrow.","sign_desc_zh":"关于车道封闭的临时状况标志，带有箭头。","difficulty":"medium"},{"id":"SC-13","group":"SC","section":"signs","topic_zh":"引导车","question_en":"The vehicle ahead of you displays this sign. What does it mean?","question_zh":"你前方的车辆上带有这个标志。它是什么意思？","options":[{"en":"Pass this vehicle as soon as it is safe, because it is slow","zh":"该车行驶缓慢，安全时应尽快超车"},{"en":"Do not pass this vehicle","zh":"不得超越这辆车"},{"en":"Stop and wait until this vehicle leaves the road","zh":"停车，等这辆车驶离道路"},{"en":"This vehicle is carrying dangerous goods","zh":"该车运载危险品"}],"answer_index":1,"explanation_zh":"带有此标志的是引导车或领航车（pilot vehicle / pace vehicle），不得超越。","explanation_en":"Do not pass a pilot or pace vehicle bearing this sign.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-83.jpg","sign_desc_en":"A temporary condition sign displayed on a vehicle.","sign_desc_zh":"挂在车辆上的临时状况类标志。","difficulty":"medium"},{"id":"SC-14","group":"SC","section":"signs","topic_zh":"施工标志","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"Come to a complete stop, then go when the way is clear","zh":"完全停下，确认安全后再走"},{"en":"The road ahead is closed; turn back","zh":"前方道路封闭，请返回"},{"en":"The construction zone ends; resume normal speed","zh":"施工区结束，可恢复正常车速"},{"en":"Reduce speed and be prepared to stop","zh":"减速，并做好停车准备"}],"answer_index":3,"explanation_zh":"该临时状况标志要求减速并做好停车准备，而不是要求立即全停。","explanation_en":"This sign means reduce speed and be prepared to stop.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-84.jpg","sign_desc_en":"A sign from the temporary condition category, which the handbook says is usually orange with black letters or symbols.","sign_desc_zh":"临时状况类标志（手册称此类标志通常为橙底，配黑色文字或图案）。","difficulty":"easy"},{"id":"SC-15","group":"SC","section":"signs","topic_zh":"绕行","question_en":"What should you do when you see this marker?","question_zh":"看到这种标志牌时应该怎么做？","options":[{"en":"Leave the road at the next exit and find your own way","zh":"从下一个出口驶出，自行寻找路线"},{"en":"Take this route only if you are driving a truck","zh":"只有驾驶货车时才走这条路线"},{"en":"Keep following these markers until you are back on your regular route","zh":"一直沿着这种标志牌行驶，直到回到原来的路线"},{"en":"Nothing; it shows the detour is over and you are back on your route","zh":"无需做什么，它表示绕行已结束、你已回到原路线"}],"answer_index":2,"explanation_zh":"这是绕行标志牌，应一直沿着它行驶，直到回到原来的常规路线。","explanation_en":"Follow detour markers until you return to your regular route.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-85.jpg","sign_desc_en":"A sign from the temporary condition category, which the handbook says is usually orange with black letters or symbols.","sign_desc_zh":"临时状况类标志（手册称此类标志通常为橙底，配黑色文字或图案）。","difficulty":"easy"},{"id":"SC-16","group":"SC","section":"signs","topic_zh":"施工区罚款","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"Speeding fines are doubled in this construction zone when workers are present","zh":"有工人在场时，在本施工区超速罚款加倍"},{"en":"Speeding fines are tripled in this construction zone when workers are present","zh":"有工人在场时，在本施工区超速罚款变为三倍"},{"en":"Demerit points for speeding are doubled in this construction zone","zh":"在本施工区超速，扣分加倍"},{"en":"The speed limit is cut in half in this zone while workers are present","zh":"有工人在场时，本区域限速减半"}],"answer_index":0,"explanation_zh":"该标志执行《公路交通法》（HTA）的规定：在指定施工区内有工人在场时，超速罚款加倍。加倍的是罚款（不是三倍），也不是扣分或限速。","explanation_en":"It enforces doubled HTA speeding fines in a designated construction zone when workers are present.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-86.jpg","sign_desc_en":"A sign from the temporary condition category, which the handbook says is usually orange with black letters or symbols.","sign_desc_zh":"临时状况类标志（手册称此类标志通常为橙底，配黑色文字或图案）。","difficulty":"hard"},{"id":"SC-17","group":"SC","section":"signs","topic_zh":"信息与指路标志","question_en":"Signs that tell you about distances and destinations are usually:","question_zh":"提供距离和目的地信息的标志通常是什么样子？","options":[{"en":"Diamond-shaped with an orange background and black letters","zh":"菱形，橙底黑字"},{"en":"Rectangular with a white background and black letters","zh":"长方形，白底黑字"},{"en":"Five-sided with a fluorescent yellow-green background","zh":"五边形，荧光黄绿色底"},{"en":"Rectangular with a green background and white letters","zh":"长方形，绿底白字"}],"answer_index":3,"explanation_zh":"信息与指路标志通常为长方形、绿底白字，用于告诉你距离和目的地。橙底菱形是临时状况标志，荧光黄绿色五边形是学校区域标志。","explanation_en":"Information and direction signs are usually rectangular, green with white letters.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"SC-18","group":"SC","section":"signs","topic_zh":"信息与指路标志","question_en":"Which type of sign tells you about distances and destinations?","question_zh":"哪类标志告诉你距离和目的地信息？","options":[{"en":"Information and direction signs","zh":"信息与指路标志"},{"en":"Regulatory signs","zh":"管制标志"},{"en":"Warning signs","zh":"警告标志"},{"en":"Temporary condition signs","zh":"临时状况标志"}],"answer_index":0,"explanation_zh":"信息与指路标志用于提供距离和目的地信息；管制标志（regulatory signs）给出必须遵守的指令，警告标志和临时状况标志用于提示危险或临时情况。","explanation_en":"Information and direction signs tell you about distances and destinations.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"SC-19","group":"SC","section":"signs","topic_zh":"信息与指路标志","question_en":"According to the handbook, signs that guide you to facilities, services and attractions:","question_zh":"根据手册，指引你前往设施、服务和景点的标志：","options":[{"en":"Must always be green with white letters","zh":"一律是绿底白字"},{"en":"May use colours other than green","zh":"可能使用绿色以外的其他颜色"},{"en":"Are always orange because they are temporary","zh":"一律是橙色，因为属于临时标志"},{"en":"Are always diamond-shaped","zh":"一律是菱形"}],"answer_index":1,"explanation_zh":"手册说明，距离和目的地标志通常为绿色，而指引设施、服务和景点的标志可能使用其他颜色。","explanation_en":"Signs for facilities, services and attractions may use colours other than green.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"SC-20","group":"SC","section":"signs","topic_zh":"指路标志","question_en":"What does this sign show?","question_zh":"这个标志表示什么？","options":[{"en":"Towns where a lower speed limit begins","zh":"从哪些城镇开始执行更低限速"},{"en":"Roads that are closed to through traffic","zh":"禁止过境车辆通行的道路"},{"en":"Directions to nearby towns and cities","zh":"通往附近城镇的方向"},{"en":"Areas where bilingual signs are used","zh":"使用双语标志的地区"}],"answer_index":2,"explanation_zh":"这是指路标志，显示前往附近城镇的方向。","explanation_en":"This sign shows directions to nearby towns and cities.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-87.jpg","sign_desc_en":"A sign from the information and direction category (usually rectangular, green background, white letters).","sign_desc_zh":"信息与指路类标志（此类标志通常为长方形、绿底白字）。","difficulty":"easy"},{"id":"SC-21","group":"SC","section":"signs","topic_zh":"距离标志","question_en":"What do the numbers on this sign tell you?","question_zh":"这个标志上的数字告诉你什么？","options":[{"en":"The speed limit in each town","zh":"各城镇的限速"},{"en":"The exit number for each town","zh":"各城镇对应的出口编号"},{"en":"The distance in miles to each town or city","zh":"到各城镇的英里数"},{"en":"The distance in kilometres to each town or city","zh":"到各城镇的公里数"}],"answer_index":3,"explanation_zh":"距离标志以公里为单位显示到沿路各城镇的距离，不是限速或出口编号，单位也不是英里。","explanation_en":"It shows distances in kilometres to towns and cities on the road.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-88.jpg","sign_desc_en":"A sign from the information and direction category (usually rectangular, green background, white letters).","sign_desc_zh":"信息与指路类标志（此类标志通常为长方形、绿底白字）。","difficulty":"easy"},{"id":"SC-22","group":"SC","section":"signs","topic_zh":"高速出口标志","question_en":"On a busy urban freeway, what is the main purpose of overhead and ground-mounted exit signs like this one?","question_zh":"在繁忙的城市高速公路上，像这样的架空式和路侧立柱式出口标志，主要作用是什么？","options":[{"en":"To help you pick the right lane to exit or stay on the freeway","zh":"帮助你选对车道，以便驶出或继续留在高速公路上"},{"en":"To show the speed limit you must obey on the exit ramp","zh":"显示出口匝道上必须遵守的限速"},{"en":"To show which lanes are reserved for trucks and buses","zh":"显示哪些车道是货车和巴士专用道"},{"en":"To warn you that the exit ahead is temporarily closed","zh":"警告前方出口临时关闭"}],"answer_index":0,"explanation_zh":"城市地区很多出口匝道不止一条车道，架空式和路侧立柱式标志帮助驾驶者选对车道，决定驶出还是继续沿高速公路行驶。","explanation_en":"Exit signs help you pick the correct lane to exit or stay on the freeway.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-89.jpg","sign_desc_en":"A sign from the information and direction category (usually rectangular, green background, white letters).","sign_desc_zh":"信息与指路类标志（此类标志通常为长方形、绿底白字）。","difficulty":"medium"},{"id":"SC-23","group":"SC","section":"signs","topic_zh":"高速出口标志","question_en":"This advance sign appears before a freeway exit. What do its arrows show?","question_zh":"这是高速公路出口前的预告标志。标志上的箭头表示什么？","options":[{"en":"Which lanes are closed for construction","zh":"哪些车道因施工封闭"},{"en":"Which lanes are high-occupancy vehicle (HOV) lanes","zh":"哪些车道是高乘载车道（HOV）"},{"en":"The direction of a detour","zh":"绕行的方向"},{"en":"Which lanes lead off the freeway","zh":"哪些车道通往出口、驶离高速公路"}],"answer_index":3,"explanation_zh":"出口预告标志用箭头显示哪些车道会驶离高速公路；出口处另设有标志。","explanation_en":"Advance signs use arrows to show which lanes lead off the freeway.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-90.jpg","sign_desc_en":"A sign from the information and direction category (usually rectangular, green background, white letters).","sign_desc_zh":"信息与指路类标志（此类标志通常为长方形、绿底白字）。","difficulty":"easy"},{"id":"SC-24","group":"SC","section":"signs","topic_zh":"高速出口标志","question_en":"On this advance sign, the arrow for your lane is inside the yellow box marked 'exit'. If you stay in your lane, what will happen?","question_zh":"在这个预告标志上，你所在车道的箭头位于标有“exit”的黄色方框内。如果你一直留在本车道，会怎样？","options":[{"en":"Your lane will take you off the freeway","zh":"本车道会带你驶离高速公路"},{"en":"Your lane will continue on the freeway past the exit","zh":"本车道过了出口后继续沿高速公路行驶"},{"en":"Your lane will be closed ahead for construction","zh":"本车道前方因施工封闭"},{"en":"Your lane will become a high-occupancy vehicle (HOV) lane","zh":"本车道将变为高乘载车道（HOV）"}],"answer_index":0,"explanation_zh":"预告标志上，对应出口车道的箭头放在黄色方框内，下方注明“exit”。留在这样的车道上就会驶离高速公路；想继续沿高速行驶，应提前选择其他车道。","explanation_en":"Arrows in the yellow 'exit' box mark lanes that lead off the freeway.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-90-2.jpg","sign_desc_en":"An advance freeway exit sign; some arrows are in a yellow box with the word 'exit' under them.","sign_desc_zh":"高速公路出口预告标志；部分箭头位于黄色方框内，下方写有“exit”。","difficulty":"medium"},{"id":"SC-25","group":"SC","section":"signs","topic_zh":"立交编号","question_en":"Freeway interchanges (exits), like the one on this sign, are numbered. What does an interchange number represent?","question_zh":"像这个标志所示，高速公路的立交（出口）都有编号。这个编号代表什么？","options":[{"en":"How many exits come before it, counting from the start of the freeway","zh":"从高速公路起点数起，它是第几个出口"},{"en":"Its distance in kilometres from the beginning of the freeway","zh":"它距高速公路起点的公里数"},{"en":"The distance in kilometres to the next exit","zh":"到下一个出口的公里数"},{"en":"Its distance in miles from the provincial capital","zh":"它距省会的英里数"}],"answer_index":1,"explanation_zh":"立交编号对应其距高速公路起点的距离（公里），不是出口的序号。","explanation_en":"Interchange numbers match the distance in kilometres from the start of the freeway.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-91.jpg","sign_desc_en":"A sign from the information and direction category (usually rectangular, green background, white letters).","sign_desc_zh":"信息与指路类标志（此类标志通常为长方形、绿底白字）。","difficulty":"medium"},{"id":"SC-26","group":"SC","section":"signs","topic_zh":"立交编号","question_en":"Interchange number 204 on Highway 401 tells you that this interchange is:","question_zh":"401 号高速公路上的 204 号立交，说明该立交：","options":[{"en":"204 km from Toronto","zh":"距多伦多 204 公里"},{"en":"The 204th exit on Highway 401","zh":"是 401 号公路上的第 204 个出口"},{"en":"204 km from Windsor","zh":"距温莎（Windsor）204 公里"},{"en":"204 km from the Quebec border","zh":"距魁北克省界 204 公里"}],"answer_index":2,"explanation_zh":"手册举例：401 号公路从温莎起算，所以 204 号立交距温莎 204 公里。编号代表距起点的公里数，不是出口序号。","explanation_en":"Highway 401 begins at Windsor, so interchange 204 is 204 km from Windsor.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SC-27","group":"SC","section":"signs","topic_zh":"立交编号","question_en":"You have just passed interchange 365 on a freeway and plan to leave at interchange 389. About how far is it to your exit?","question_zh":"你在高速公路上刚经过 365 号立交，计划在 389 号立交驶出。大约还有多远？","options":[{"en":"About 389 km","zh":"约 389 公里"},{"en":"About 2.4 km","zh":"约 2.4 公里"},{"en":"It cannot be worked out from interchange numbers","zh":"无法通过立交编号算出"},{"en":"About 24 km","zh":"约 24 公里"}],"answer_index":3,"explanation_zh":"立交编号代表距起点的公里数，两个编号相减即为距离：389 − 365 = 24 公里。","explanation_en":"Subtract one interchange number from the other: 389 − 365 = 24 km.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"SC-28","group":"SC","section":"signs","topic_zh":"指路标志","question_en":"What does the word 'VIA' on this sign mean?","question_zh":"这个标志上的“VIA”是什么意思？","options":[{"en":"The destination has a VIA Rail passenger train station","zh":"目的地有 VIA 铁路客运车站"},{"en":"The roads you must follow to reach the destination","zh":"到达目的地必须经过的道路"},{"en":"The route is a toll road","zh":"该路线是收费公路"},{"en":"The route is closed to trucks","zh":"该路线禁止货车通行"}],"answer_index":1,"explanation_zh":"“VIA”意为“经由”，指出到达目的地需要经过的道路，与 VIA 铁路公司无关。","explanation_en":"'VIA' names the roads you must follow to reach a destination.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-92.jpg","sign_desc_en":"An information and direction sign that includes the word 'VIA'.","sign_desc_zh":"含有“VIA”字样的信息与指路标志。","difficulty":"medium"},{"id":"SC-29","group":"SC","section":"signs","topic_zh":"环岛","question_en":"What does this sign show?","question_zh":"这个标志表示什么？","options":[{"en":"A detour route around a road closure ahead","zh":"绕开前方封路路段的绕行路线"},{"en":"The lane closure layout in a work zone ahead","zh":"前方施工区的车道封闭方式"},{"en":"The exits of the roundabout ahead and where they lead","zh":"前方环岛的各个出口及其通往的地方"},{"en":"The ramps of a cloverleaf freeway interchange ahead","zh":"前方苜蓿叶式高速公路立交的匝道"}],"answer_index":2,"explanation_zh":"这是环岛指路标志，显示即将到达的环岛各出口通往哪里，便于提前选好出口。","explanation_en":"It shows the upcoming roundabout exits and where they lead.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-93.jpg","sign_desc_en":"A sign from the information and direction category (see the official image).","sign_desc_zh":"信息与指路类标志（请看官方图片）。","difficulty":"easy"},{"id":"SC-30","group":"SC","section":"signs","topic_zh":"可变信息标志","question_en":"What kind of information does this type of sign give drivers?","question_zh":"这类标志向驾驶者提供什么信息？","options":[{"en":"Current information on delays and lane closures ahead","zh":"前方延误和车道封闭的实时信息"},{"en":"The permanent speed limit for each section of freeway","zh":"高速公路各路段的固定限速"},{"en":"Your own vehicle's speed as measured by radar","zh":"雷达测得的你本车车速"},{"en":"Distances to the next service centre and rest area","zh":"到下一个服务区和休息区的距离"}],"answer_index":0,"explanation_zh":"这类标志会随交通状况变化，向驾驶者提供前方延误和车道封闭的实时信息。","explanation_en":"These signs change with traffic conditions to show current delays and lane closures.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-94.jpg","sign_desc_en":"A sign from the information and direction category (see the official image).","sign_desc_zh":"信息与指路类标志（请看官方图片）。","difficulty":"medium"},{"id":"SC-31","group":"SC","section":"signs","topic_zh":"设施指引标志","question_en":"What does this sign show?","question_zh":"这个标志表示什么？","options":[{"en":"The beginning of a high-occupancy vehicle (HOV) lane on the freeway","zh":"高速公路上高乘载车道（HOV）的起点"},{"en":"An area where only emergency vehicles are allowed to stop","zh":"仅允许应急车辆停靠的区域"},{"en":"The distance to the next town along this road","zh":"沿本路到下一个城镇的距离"},{"en":"The way to an off-road facility, such as a hospital or carpool lot","zh":"通往路外设施（如医院或拼车停车场）的方向"}],"answer_index":3,"explanation_zh":"这类信息标志指示路外设施的方向，例如医院、机场、大学或拼车停车场。","explanation_en":"It shows the way to off-road facilities such as hospitals, airports, universities or carpool lots.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-95.jpg","sign_desc_en":"See the official image (the handbook gives no colour or shape details for this sign).","sign_desc_zh":"请看官方图片（手册未说明此标志的颜色和形状）。","difficulty":"medium"},{"id":"SC-32","group":"SC","section":"signs","topic_zh":"设施指引标志","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"Railway crossing ahead; look both ways for trains","zh":"前方有铁路道口，注意两侧来往的火车"},{"en":"Route to a passenger railway station","zh":"通往客运火车站的路线"},{"en":"Railway tracks run beside the road","zh":"铁路与道路平行"},{"en":"Truck route to a freight terminal","zh":"通往货运站的货车路线"}],"answer_index":1,"explanation_zh":"这是信息标志，指示通往客运火车站的路线，并不是铁路道口警告。","explanation_en":"This sign shows the route to a passenger railway station.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-96.jpg","sign_desc_en":"See the official image (the handbook gives no colour or shape details for this sign).","sign_desc_zh":"请看官方图片（手册未说明此标志的颜色和形状）。","difficulty":"easy"},{"id":"SC-33","group":"SC","section":"signs","topic_zh":"设施指引标志","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"Watch for low-flying aircraft","zh":"注意低飞的飞机"},{"en":"Route to a heliport for ambulances only","zh":"通往救护车专用直升机场的路线"},{"en":"Route to an airport","zh":"通往机场的路线"},{"en":"Route to a passenger railway station","zh":"通往客运火车站的路线"}],"answer_index":2,"explanation_zh":"这是信息标志，指示通往机场的路线。","explanation_en":"This sign shows the route to an airport.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-97.jpg","sign_desc_en":"See the official image (the handbook gives no colour or shape details for this sign).","sign_desc_zh":"请看官方图片（手册未说明此标志的颜色和形状）。","difficulty":"easy"},{"id":"SC-34","group":"SC","section":"signs","topic_zh":"设施指引标志","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"Facilities that are accessible by wheelchair","zh":"可供轮椅使用的无障碍设施"},{"en":"Hospital emergency entrance","zh":"医院急诊入口"},{"en":"Pedestrian crossover ahead","zh":"前方有行人过街设施（pedestrian crossover）"},{"en":"Seniors' residence ahead; reduce speed","zh":"前方有老年公寓，请减速"}],"answer_index":0,"explanation_zh":"这是信息标志，表示该处设施可供轮椅使用（无障碍）。","explanation_en":"This sign shows facilities that are wheelchair accessible.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-99.jpg","sign_desc_en":"See the official image (the handbook gives no colour or shape details for this sign).","sign_desc_zh":"请看官方图片（手册未说明此标志的颜色和形状）。","difficulty":"easy"},{"id":"SC-35","group":"SC","section":"signs","topic_zh":"超大货物标志","question_en":"What does this sign indicate?","question_zh":"这个标志表示什么？","options":[{"en":"The vehicle is carrying dangerous goods","zh":"车辆运载危险品"},{"en":"The driver is a novice in training","zh":"司机是正在学车的新手"},{"en":"The vehicle travels at 40 km/h or less","zh":"车辆速度不超过 40 公里/小时"},{"en":"An oversize load","zh":"超大（超限）货物"}],"answer_index":3,"explanation_zh":"手册中称为“D 标志”的这种标志表示超大（超限）货物。速度在 40 公里/小时或以下是慢速车辆标志的含义。","explanation_en":"This 'D sign' indicates an oversize load.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-98.jpg","sign_desc_en":"See the official image (the handbook gives no colour or shape details for this sign).","sign_desc_zh":"请看官方图片（手册未说明此标志的颜色和形状）。","difficulty":"medium"},{"id":"SC-36","group":"SC","section":"signs","topic_zh":"慢速车辆标志","question_en":"This sign is on the back of the vehicle ahead of you. What does it tell you?","question_zh":"前方车辆尾部挂着这个标志。它告诉你什么？","options":[{"en":"The vehicle will be travelling at 40 km/h or less","zh":"该车速度不超过 40 公里/小时"},{"en":"The vehicle will be travelling at 60 km/h or less","zh":"该车速度不超过 60 公里/小时"},{"en":"The vehicle is carrying dangerous goods","zh":"该车运载危险品"},{"en":"The vehicle is an oversize load and may need two lanes","zh":"该车为超大货物，可能占用两条车道"}],"answer_index":0,"explanation_zh":"这是慢速车辆标志，提醒后车：前方车辆速度为 40 公里/小时或以下，应视需要减速。","explanation_en":"The slow-moving vehicle sign means the vehicle travels at 40 km/h or less.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-100.jpg","sign_desc_en":"An orange triangle with a red border.","sign_desc_zh":"橙色三角形，红色边框。","difficulty":"easy"},{"id":"SC-37","group":"SC","section":"signs","topic_zh":"慢速车辆标志","question_en":"What does the slow-moving vehicle sign look like?","question_zh":"慢速车辆标志是什么样子？","options":[{"en":"A white triangle with a red border","zh":"白色三角形，红色边框"},{"en":"An orange diamond with black letters","zh":"橙色菱形，黑色文字"},{"en":"An orange triangle with a red border","zh":"橙色三角形，红色边框"},{"en":"A fluorescent yellow-green five-sided sign","zh":"荧光黄绿色五边形"}],"answer_index":2,"explanation_zh":"慢速车辆标志是红色边框的橙色三角形。白底红边三角形是让行标志，橙底菱形是临时状况标志，荧光黄绿色五边形是学校区域标志。","explanation_en":"The slow-moving vehicle sign is an orange triangle with a red border.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SC-38","group":"SC","section":"signs","topic_zh":"慢速车辆标志","question_en":"When on a road, which of these must display the slow-moving vehicle sign?","question_zh":"在道路上行驶时，下列哪种车辆必须展示慢速车辆标志？","options":[{"en":"Any vehicle towing a trailer","zh":"任何拖挂拖车的车辆"},{"en":"A farm tractor","zh":"农用拖拉机"},{"en":"A school bus","zh":"校车"},{"en":"A vehicle with a top speed of 60 km/h","zh":"最高速度为 60 公里/小时的车辆"}],"answer_index":1,"explanation_zh":"在道路上，农用拖拉机、农具/农业机械，以及无法持续以超过 40 公里/小时行驶的车辆，必须展示慢速车辆标志。最高速度 60 公里/小时的车辆能以超过 40 公里/小时行驶，不在要求之列。","explanation_en":"Farm tractors, farm machinery and vehicles unable to sustain over 40 km/h must display the sign.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SC-39","group":"SC","section":"signs","topic_zh":"慢速车辆","question_en":"You come up behind a vehicle displaying a slow-moving vehicle sign. What should you do?","question_zh":"你驶近一辆挂着慢速车辆标志的车辆后方，应该怎么做？","options":[{"en":"Sound your horn so it pulls onto the shoulder","zh":"鸣喇叭让它驶上路肩"},{"en":"Pass it right away, even on a hill, because it is so slow","zh":"因为它很慢，即使在坡道上也立即超车"},{"en":"Watch it carefully and reduce your speed as necessary","zh":"小心观察，视需要减速"},{"en":"Follow closely behind it so you can pass quickly later","zh":"紧跟在它后面，以便稍后快速超车"}],"answer_index":2,"explanation_zh":"慢速车辆速度在 40 公里/小时或以下，遇到这类车辆应注意观察，并视需要减速。","explanation_en":"Watch for slow-moving vehicles and reduce your speed as necessary.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"SC-40","group":"SC","section":"signs","topic_zh":"EDR 标志","question_en":"When are signs like this one used?","question_zh":"这种标志在什么情况下使用？","options":[{"en":"During scheduled road construction that was announced in advance","zh":"在提前公布的计划内道路施工期间"},{"en":"During an unscheduled closure of a provincial highway","zh":"省级公路发生计划外封闭时"},{"en":"To mark a route reserved for police, fire and ambulance vehicles","zh":"标示专供警车、消防车和救护车使用的路线"},{"en":"To mark the route from the highway to the nearest hospital","zh":"标示从公路通往最近医院的路线"}],"answer_index":1,"explanation_zh":"EDR 标志用于省级公路计划外封闭、安大略省警（OPP）把所有车辆导离该公路的情况；它们设在替代路线上，引导驾驶者绕行。","explanation_en":"EDR signs are used when the OPP detour all traffic during an unscheduled provincial highway closure.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-101.jpg","sign_desc_en":"A route marker that the handbook calls an EDR sign.","sign_desc_zh":"手册中称为 EDR 的路线标志牌。","difficulty":"hard"},{"id":"SC-41","group":"SC","section":"signs","topic_zh":"EDR 标志","question_en":"You are following EDR markers on an alternative route. Where will they take you?","question_zh":"你正沿着替代路线上的 EDR 标志牌行驶。它们会把你引向哪里？","options":[{"en":"To the nearest OPP detachment to report the closure","zh":"到最近的安大略省警（OPP）分局报告封路"},{"en":"To a rest area where you wait until the highway reopens","zh":"到休息区等待公路重新开放"},{"en":"Around the highway closure and back onto the highway","zh":"绕过公路封闭路段，再回到该公路"},{"en":"Off the highway for the rest of your trip, onto local roads only","zh":"在剩余行程中离开公路，只走地方道路"}],"answer_index":2,"explanation_zh":"EDR 标志牌设在替代路线上，引导驾驶者绕过封闭路段，再回到该公路。","explanation_en":"EDR markers guide you around the closure and back onto the highway.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SC-42","group":"SC","section":"signs","topic_zh":"长型商用车","question_en":"You see this placard on the rear of a truck. What does it tell you?","question_zh":"你看到一辆货车尾部挂着这块标牌。它告诉你什么？","options":[{"en":"The truck is a long commercial vehicle (LCV)","zh":"该货车是长型商用车（LCV）"},{"en":"The truck is carrying dangerous goods","zh":"该货车运载危险品"},{"en":"The truck cannot go faster than 40 km/h","zh":"该货车速度不能超过 40 公里/小时"},{"en":"The truck is about to make a wide right turn","zh":"该货车即将大幅度右转"}],"answer_index":0,"explanation_zh":"这块标牌表示长型商用车（LCV），即双挂车，长度可达 40 米。应能根据车尾标牌识别 LCV。","explanation_en":"This placard marks a long commercial vehicle, a double trailer up to 40 m long.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-101-2a.jpg","sign_desc_en":"A placard displayed on the rear of a truck (see the official image).","sign_desc_zh":"挂在货车尾部的标牌（请看官方图片）。","difficulty":"medium"},{"id":"SC-43","group":"SC","section":"signs","topic_zh":"长型商用车","question_en":"A long commercial vehicle (LCV) is a double trailer that can be up to how long?","question_zh":"长型商用车（LCV）是一种双挂车，最长可达多少？","options":[{"en":"25 metres","zh":"25 米"},{"en":"30 metres","zh":"30 米"},{"en":"50 metres","zh":"50 米"},{"en":"40 metres","zh":"40 米"}],"answer_index":3,"explanation_zh":"手册说明，长型商用车（LCV）是双挂车，长度可达 40 米。","explanation_en":"An LCV is a double trailer that can be up to 40 metres long.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SC-44","group":"SC","section":"signs","topic_zh":"长型商用车","question_en":"When preparing to pass a long commercial vehicle (LCV) on the highway, what should you anticipate?","question_zh":"在公路上准备超越长型商用车（LCV）时，应预料到什么？","options":[{"en":"That it will speed up quickly to let you by","zh":"它会迅速加速让你通过"},{"en":"Its extended length and limited speed","zh":"它车身特别长、车速受限"},{"en":"That it must pull onto the shoulder to let you pass","zh":"它必须驶上路肩让你超车"},{"en":"That it is no longer than a regular tractor-trailer","zh":"它并不比普通牵引式半挂车长"}],"answer_index":1,"explanation_zh":"超越 LCV 前，要预料到它车身很长（可达 40 米）且车速有限，超车需要更长的距离和时间。","explanation_en":"Anticipate an LCV's extended length and limited speed when preparing to pass.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SC-45","group":"SC","section":"signs","topic_zh":"应急响应标志","question_en":"Some information signs, like this one, have a numbering system along the bottom. What is it for?","question_zh":"有些信息标志（如图）底部有一排编号。它的作用是什么？","options":[{"en":"To show the posted speed limit on the road ahead","zh":"显示前方道路的限速"},{"en":"To help emergency vehicles and drivers find a suitable route","zh":"帮助应急车辆和驾驶者确定合适的路线"},{"en":"To show the distance in kilometres to the next town","zh":"显示到下一个城镇的公里数"},{"en":"To show how many lanes the road will have ahead","zh":"显示前方道路的车道数"}],"answer_index":1,"explanation_zh":"这是应急响应标志：信息标志底部的编号系统用于帮助应急车辆和驾驶者确定合适的路线。","explanation_en":"The numbering helps emergency vehicles and drivers determine an appropriate route.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-102.jpg","sign_desc_en":"An information sign with a numbering system along the bottom.","sign_desc_zh":"底部带有编号的信息标志。","difficulty":"medium"},{"id":"SC-46","group":"SC","section":"signs","topic_zh":"双语标志","question_en":"You are driving in a designated bilingual area and see this sign. How should you read it?","question_zh":"你在指定双语地区行驶，看到这个标志。应该怎样阅读？","options":[{"en":"Read only the French message, because it takes priority","zh":"只看法语信息，因为法语优先"},{"en":"Slow down so you can read both messages completely","zh":"减速，以便把两种语言的信息都完整读完"},{"en":"Read only the English message, because only it is legally binding","zh":"只看英语信息，因为只有英语具有法律效力"},{"en":"Read the message in the language you understand best","zh":"阅读你最熟悉的那种语言的信息"}],"answer_index":3,"explanation_zh":"在指定双语地区，读你最熟悉的语言的信息即可，不必两种都读完。","explanation_en":"Read the message in the language you understand best.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-103a.jpg","sign_desc_en":"A sign with messages in English and French.","sign_desc_zh":"含有英语和法语信息的标志。","difficulty":"easy"},{"id":"SC-47","group":"SC","section":"signs","topic_zh":"双语标志","question_en":"In designated bilingual areas, how may bilingual sign messages be displayed?","question_zh":"在指定双语地区，双语标志信息可能以什么方式呈现？","options":[{"en":"Always together; never on two separate signs","zh":"一律在同一块标志上，绝不分成两块"},{"en":"On two signs, with the French sign always coming first","zh":"分成两块标志，且总是法文标志在前"},{"en":"Together, or on an English sign followed by a French one","zh":"在同一块标志上，或英文标志后紧接法文标志"},{"en":"Only on overhead freeway signs, never at the roadside","zh":"只出现在高速公路的架空标志上，路边不设"}],"answer_index":2,"explanation_zh":"双语信息可以放在同一块标志上，也可以分开设置：先是英文标志，紧接着是法文标志。","explanation_en":"Messages may share one sign, or an English sign may be immediately followed by a French sign.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"SC-48","group":"SC","section":"signs","topic_zh":"慢行车辆标志","question_en":"Farm tractors must display the slow-moving vehicle sign when on a road. Which of these must also display it?","question_zh":"农用拖拉机在道路上行驶时必须展示慢行车辆标志。下列哪一种也必须展示？","options":[{"en":"A pickup truck towing a camping trailer","zh":"拖着露营拖车的皮卡"},{"en":"A truck carrying an oversize load","zh":"运载超大货物的卡车"},{"en":"A vehicle that cannot sustain speeds over 40 km/h","zh":"无法持续以超过40公里/小时的速度行驶的车辆"},{"en":"A car driven by a G1 driver with an accompanying driver","zh":"由G1驾驶员驾驶、有陪驾人陪同的小汽车"}],"answer_index":2,"explanation_zh":"在道路上，农用拖拉机、农用机具/机械，以及无法持续以超过40公里/小时的速度行驶的车辆，都必须展示慢行车辆标志（红边橙色三角形）。","explanation_en":"Farm tractors, farm implements or machinery, and vehicles unable to sustain speeds over 40 km/h must display the slow-moving vehicle sign on a road.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SC-49","group":"SC","section":"signs","topic_zh":"紧急绕行路线标志","question_en":"According to the handbook, EDR (Emergency Detour Route) markers like this one are used when which organization detours all traffic off a provincial highway?","question_zh":"根据手册，像这样的EDR（紧急绕行路线）标志，是在哪个机构把所有车辆引离省级公路时使用的？","options":[{"en":"Local fire services","zh":"当地消防部门"},{"en":"Tow truck operators at the scene","zh":"现场的拖车司机"},{"en":"Municipal road maintenance crews","zh":"市政道路养护人员"},{"en":"The Ontario Provincial Police (OPP)","zh":"安大略省警察（OPP）"}],"answer_index":3,"explanation_zh":"省级公路非计划封闭、由安大略省警察（OPP）把所有车辆引离公路时，会使用EDR标志；沿替代路线设置的EDR标志引导驾驶员绕过封闭路段并返回公路。","explanation_en":"EDR signs are used when the OPP detour all traffic off a provincial highway during an unscheduled closure.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-101.jpg","sign_desc_en":"An Emergency Detour Route (EDR) marker sign","sign_desc_zh":"紧急绕行路线（EDR）标志","difficulty":"medium"},{"id":"SD-01","group":"SD","section":"signs","topic_zh":"绿灯","question_en":"You face a steady green light and want to turn right. Pedestrians are crossing the road you are turning onto. What must you do?","question_zh":"你面对常亮的绿灯，准备右转，而你要转入的道路上有行人正在过马路。你必须怎么做？","options":[{"en":"Yield to the pedestrians, then complete the turn when it is clear.","zh":"让行人先行，等道路清空后再完成转弯。"},{"en":"Turn immediately, because the green light gives you the right-of-way.","zh":"立即转弯，因为绿灯让你拥有先行权。"},{"en":"Sound your horn to warn them, then turn ahead of them.","zh":"鸣笛提醒行人，然后抢在他们前面转弯。"},{"en":"Wait for a green arrow, because turning on green is not allowed while anyone is crossing.","zh":"等待绿色箭头，因为有人过马路时绿灯下不允许转弯。"}],"answer_index":0,"explanation_zh":"绿灯时可以左转、直行或右转，但必须先让已在路口内的车辆和行人；转弯时必须把先行权让给正在横过路口的行人。","explanation_en":"On a green light you may turn, but you must yield to pedestrians crossing the intersection.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"https://files.ontario.ca/3-2-1.jpg","sign_desc_en":"A traffic signal showing a steady green light.","sign_desc_zh":"交通信号灯显示常亮的绿灯。","difficulty":"medium"},{"id":"SD-02","group":"SD","section":"signs","topic_zh":"黄灯","question_en":"As you approach an intersection, the traffic light changes from green to yellow (amber). What should you do?","question_zh":"你驶近路口时，信号灯由绿灯变为黄灯（琥珀色）。你应该怎么做？","options":[{"en":"Speed up so you can clear the intersection before it turns red.","zh":"加速，争取在变红灯前通过路口。"},{"en":"Stop if you can do so safely; otherwise, go through with caution.","zh":"能安全停下就停车；否则谨慎通过。"},{"en":"Stop immediately, no matter how close you are to the intersection.","zh":"无论离路口多近，都要立即停车。"},{"en":"Keep going at the same speed, because yellow means the same as green.","zh":"保持原速行驶，因为黄灯和绿灯意思相同。"}],"answer_index":1,"explanation_zh":"黄灯表示红灯即将亮起。能安全停车就必须停车；如果已经太近、无法安全停下，则谨慎通过。","explanation_en":"A yellow light means red is coming: stop if it is safe, otherwise proceed with caution.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"https://files.ontario.ca/3-2-2.jpg","sign_desc_en":"A traffic signal showing a yellow (amber) light.","sign_desc_zh":"交通信号灯显示黄灯（琥珀色）。","difficulty":"easy"},{"id":"SD-03","group":"SD","section":"signs","topic_zh":"红灯变绿","question_en":"You are stopped at a red light. Your light turns green, but a car from the cross street is still in the intersection. What should you do?","question_zh":"你在红灯前停着。你这边的信号灯变绿了，但横向道路上的一辆车仍在路口内。你应该怎么做？","options":[{"en":"Go immediately, because the green light gives you the right-of-way.","zh":"立即通行，因为绿灯让你拥有先行权。"},{"en":"Sound your horn so the other driver clears the way.","zh":"鸣笛让对方赶紧让开。"},{"en":"Drive around the car to keep traffic moving.","zh":"绕过那辆车，保持车流通畅。"},{"en":"Wait until the intersection is clear before moving through.","zh":"等路口清空后再通过。"}],"answer_index":3,"explanation_zh":"红灯停车后，要等信号灯变绿并且路口已清空才能通过；绿灯时也必须先让已在路口内的车辆和行人。","explanation_en":"Even after the light turns green, wait until the intersection is clear and yield to vehicles already in it.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"SD-04","group":"SD","section":"signs","topic_zh":"闪烁绿灯","question_en":"The green light shown is flashing. What may you do when you face it?","question_zh":"图中的绿灯在闪烁。面对这种信号，你可以怎么做？","options":[{"en":"Turn left only; through traffic must wait.","zh":"只能左转，直行车辆必须等待。"},{"en":"Turn left, go straight or turn right from the proper lane.","zh":"从正确的车道左转、直行或右转都可以。"},{"en":"Proceed only after yielding to oncoming traffic, which also has a green light.","zh":"必须先让同样亮绿灯的对向来车，然后才能通行。"},{"en":"Treat the intersection as an all-way stop because the signal is malfunctioning.","zh":"信号灯故障，应按全向停车路口处理。"}],"answer_index":1,"explanation_zh":"闪烁绿灯是“提前绿灯”（advance green）：可以从正确车道左转、直行或右转，此时对向车辆仍面对红灯。","explanation_en":"A flashing green is an advance green: you may turn left, go straight or turn right from the proper lane.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"https://files.ontario.ca/3-2-4.jpg","sign_desc_en":"A traffic signal showing a flashing green light.","sign_desc_zh":"交通信号灯显示闪烁的绿灯。","difficulty":"easy"},{"id":"SD-05","group":"SD","section":"signs","topic_zh":"提前绿灯","question_en":"A green light shown together with a left-pointing green arrow is called an advance green. Why?","question_zh":"绿灯与向左的绿色箭头同时亮起，被称为“提前绿灯”（advance green）。这是为什么？","options":[{"en":"Because it warns that the light is about to turn red.","zh":"因为它提示信号灯即将变红。"},{"en":"Because cross traffic is shown a yellow light at the same time.","zh":"因为横向车辆此时同时显示黄灯。"},{"en":"Because oncoming traffic is still facing a red light.","zh":"因为对向车辆此时仍面对红灯。"},{"en":"Because it releases only transit vehicles ahead of other traffic.","zh":"因为它只让公共交通车辆先于其他车辆通行。"}],"answer_index":2,"explanation_zh":"面对闪烁绿灯，或左转绿色箭头加绿灯时，可以从正确车道左转、直行或右转；之所以叫提前绿灯，是因为对向车辆此时仍是红灯。","explanation_en":"It is called an advance green because oncoming traffic still faces a red light.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"https://files.ontario.ca/3-2-5.jpg","sign_desc_en":"A traffic signal showing a green light with a left-pointing green arrow.","sign_desc_zh":"交通信号灯显示绿灯和向左的绿色箭头。","difficulty":"medium"},{"id":"SD-06","group":"SD","section":"signs","topic_zh":"同时左转","question_en":"You are in the left-turn lane and the signal shows a red light with a left-turn green arrow. What does this mean?","question_zh":"你在左转车道上，信号灯显示红灯加左转绿色箭头。这是什么意思？","options":[{"en":"You must wait for the red light to turn green before turning.","zh":"必须等红灯变绿后才能转弯。"},{"en":"You may go straight or turn left, because the arrow overrides the red light.","zh":"可以直行或左转，因为箭头优先于红灯。"},{"en":"You may turn left only after yielding to oncoming through traffic, which has a green light.","zh":"必须先让有绿灯的对向直行车辆，然后才能左转。"},{"en":"You may turn left; oncoming drivers may be turning left at the same time.","zh":"可以左转；对向车辆也可能同时左转。"}],"answer_index":3,"explanation_zh":"红灯加左转绿色箭头时，可以从左转车道左转；对向车辆也面对左转绿色箭头，可能同时在左转。","explanation_en":"With a red light and a left green arrow, you may turn left from the left-turn lane; opposing left-turners may also be turning.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"https://files.ontario.ca/3-2-6.jpg","sign_desc_en":"A traffic signal showing a red light with a left-turn green arrow.","sign_desc_zh":"交通信号灯显示红灯和左转绿色箭头。","difficulty":"medium"},{"id":"SD-07","group":"SD","section":"signs","topic_zh":"黄色箭头","question_en":"You are waiting in the left-turn lane and have not started your turn when the left-turn green arrow changes to a yellow arrow. What should you do?","question_zh":"你在左转车道等候、尚未开始转弯，这时左转绿色箭头变成了黄色箭头。你应该怎么做？","options":[{"en":"Start your turn quickly before oncoming traffic gets a green light.","zh":"趁对向车辆还没变绿灯，赶紧开始转弯。"},{"en":"Do not start the turn; stop if you can do so safely.","zh":"不要开始转弯；能安全停下就停车。"},{"en":"Treat it like a flashing yellow light and turn with caution.","zh":"把它当作闪烁黄灯，谨慎转弯即可。"},{"en":"Keep turning, because the yellow arrow still gives you the right-of-way.","zh":"继续转弯，因为黄色箭头仍给你先行权。"}],"answer_index":1,"explanation_zh":"左转绿色箭头之后出现的黄色箭头，表示一个或两个方向的车流即将获得绿灯。此时不要开始左转；能安全停下就停车，否则谨慎完成转弯。","explanation_en":"A yellow arrow means green is about to appear for other traffic: do not start your turn, and stop if it is safe.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"https://files.ontario.ca/3-2-7.jpg","sign_desc_en":"A traffic signal showing a red light with a yellow arrow.","sign_desc_zh":"交通信号灯显示红灯和黄色箭头。","difficulty":"medium"},{"id":"SD-08","group":"SD","section":"signs","topic_zh":"绿灯左转","question_en":"Your left-turn green arrow has ended and the signal now shows a steady green light. This intersection has no separate left-turn signal. You still want to turn left. What is the rule?","question_zh":"你的左转绿色箭头已经结束，信号灯现在显示常亮的绿灯；这个路口没有单独的左转信号灯。你仍想左转，规则是什么？","options":[{"en":"Left turns are allowed only while the arrow is lit, so you must wait.","zh":"只有箭头亮时才能左转，所以必须等待。"},{"en":"You may turn left, and oncoming traffic must yield to you.","zh":"可以左转，对向车辆必须让你。"},{"en":"You may turn left only when the way is clear of traffic and pedestrians.","zh":"只有在没有来车和行人、道路畅通时才可以左转。"},{"en":"You may turn left only if you were first in line when the arrow ended.","zh":"只有箭头结束时你排在第一位才可以左转。"}],"answer_index":2,"explanation_zh":"左转箭头结束、变为绿灯后，仍然可以左转，但只有在没有来车和行人、道路畅通时才可以。","explanation_en":"On the green after the arrow, you may still turn left, but only when the way is clear of traffic and pedestrians.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"https://files.ontario.ca/3-2-8.jpg","sign_desc_en":"A traffic signal showing a steady green light.","sign_desc_zh":"交通信号灯显示常亮的绿灯。","difficulty":"medium"},{"id":"SD-09","group":"SD","section":"signs","topic_zh":"路口内变灯","question_en":"You have moved into the intersection on a green light to turn left and are waiting for oncoming traffic to pass. The light turns red. What should you do?","question_zh":"你在绿灯时驶入路口准备左转，正在等对向车辆通过，这时信号灯变成红灯。你应该怎么做？","options":[{"en":"Back up behind the stop line and wait for the next green.","zh":"倒车退回停车线后，等下一个绿灯。"},{"en":"Complete your turn when it is safe to do so.","zh":"在安全时完成转弯。"},{"en":"Stay where you are until the light turns green again.","zh":"停在原地，直到信号灯再次变绿。"},{"en":"Turn immediately, even if oncoming cars are still passing.","zh":"立即转弯，即使对向车辆仍在通过。"}],"answer_index":1,"explanation_zh":"如果你已经在路口内而信号灯变成红灯，应在安全时完成转弯。","explanation_en":"If the light turns red while you are in the intersection, complete your turn when it is safe.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SD-10","group":"SD","section":"signs","topic_zh":"公交优先信号","question_en":"What does the round signal on top of this traffic light mean?","question_zh":"这个信号灯顶部的圆形信号是什么意思？","options":[{"en":"Public transit vehicles may go through or turn while conflicting traffic faces a red light.","zh":"公共交通车辆可以直行或转弯，与其冲突的车流此时都面对红灯。"},{"en":"The lane below is reserved for bicycles while the bar is lit.","zh":"竖条亮起时，下方车道只供自行车使用。"},{"en":"A railway crossing is ahead and all vehicles must stop.","zh":"前方有铁路道口，所有车辆必须停车。"},{"en":"All vehicles may proceed straight through, but turns are not allowed.","zh":"所有车辆都可以直行，但不准转弯。"}],"answer_index":0,"explanation_zh":"这是公交优先信号（transit priority signal）：圆形信号位于普通信号灯上方，深色底上显示白色竖条，允许公共交通车辆直行、右转或左转，所有冲突方向的车流此时为红灯。","explanation_en":"The white vertical bar lets transit vehicles go through or turn while all conflicting traffic has a red light.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"https://files.ontario.ca/3-2-9.jpg","sign_desc_en":"A round signal with a white vertical bar on a dark background, mounted on top of a regular traffic signal showing red.","sign_desc_zh":"普通信号灯（显示红灯）上方的圆形信号，深色底上有一条白色竖条。","difficulty":"medium"},{"id":"SD-11","group":"SD","section":"signs","topic_zh":"公交优先信号","question_en":"At a transit priority signal, who must yield to public transit vehicles?","question_zh":"在公交优先信号处，谁必须给公共交通车辆让行？","options":[{"en":"Only drivers turning left across the transit vehicle's path","zh":"只有左转时横穿公共交通车辆行驶路线的司机"},{"en":"Only pedestrians in the crosswalk","zh":"只有人行横道上的行人"},{"en":"Both other traffic and pedestrians","zh":"其他车辆和行人都必须让行"},{"en":"No one; transit vehicles must wait for a regular green light","zh":"没有人需要让行，公共交通车辆必须等普通绿灯"}],"answer_index":2,"explanation_zh":"在公交优先信号处，其他车辆和行人都必须给公共交通车辆让行。","explanation_en":"Traffic and pedestrians must yield to public transit vehicles at a transit priority signal.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SD-12","group":"SD","section":"signs","topic_zh":"全保护左转","question_en":"At an intersection with a separate signal for left-turning traffic, you face a left-turn green arrow. What will traffic going straight or turning right in your direction usually see?","question_zh":"在设有单独左转信号灯的路口，你面对左转绿色箭头。同方向直行或右转的车辆通常会看到什么？","options":[{"en":"A red light","zh":"红灯"},{"en":"A green light","zh":"绿灯"},{"en":"A flashing yellow light","zh":"闪烁黄灯"},{"en":"A flashing green light","zh":"闪烁绿灯"}],"answer_index":0,"explanation_zh":"全保护左转（fully protected left turn）路口：左转车道亮绿色箭头时，直行和右转车辆通常面对红灯；对向车辆也可能同时左转。","explanation_en":"During a protected left-turn arrow, through and right-turning traffic usually faces a red light.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"https://files.ontario.ca/3-2-10.jpg","sign_desc_en":"A separate left-turn signal showing a green arrow.","sign_desc_zh":"单独的左转信号灯显示绿色箭头。","difficulty":"medium"},{"id":"SD-13","group":"SD","section":"signs","topic_zh":"全保护左转","question_en":"At a fully protected left-turn intersection, the separate left-turn signal changes from a green arrow to a yellow light. Who does this yellow light apply to?","question_zh":"在全保护左转路口，单独的左转信号灯由绿色箭头变成黄灯。这个黄灯针对的是谁？","options":[{"en":"All traffic approaching from your direction","zh":"你这个方向驶来的所有车辆"},{"en":"Oncoming traffic only","zh":"仅对向车辆"},{"en":"Pedestrians waiting to cross","zh":"等待过街的行人"},{"en":"Left-turning vehicles only","zh":"仅左转车辆"}],"answer_index":3,"explanation_zh":"全保护左转路口中，左转绿色箭头之后出现的黄灯只针对左转车辆；随后出现的红灯也只针对左转车辆。","explanation_en":"After the protected arrow, the yellow light applies only to left-turning vehicles.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"https://files.ontario.ca/3-2-11.jpg","sign_desc_en":"A separate left-turn signal showing a yellow light.","sign_desc_zh":"单独的左转信号灯显示黄灯。","difficulty":"medium"},{"id":"SD-14","group":"SD","section":"signs","topic_zh":"全保护左转","question_en":"At a fully protected left-turn intersection, the left-turn signal is now red and through traffic has a green light. You are first in the left-turn lane and see a large gap in oncoming traffic. What should you do?","question_zh":"在全保护左转路口，左转信号灯已变为红灯，直行车辆亮绿灯。你排在左转车道第一位，看到对向车流有很大空档。你应该怎么做？","options":[{"en":"Turn left, since the way is clear, just as on any green light.","zh":"道路畅通就左转，和普通绿灯时一样。"},{"en":"Wait; you may not begin a left turn after through traffic gets its green.","zh":"等待；直行绿灯亮起后，不能再开始左转。"},{"en":"Make a complete stop, then turn left when the way is clear.","zh":"先完全停车，道路畅通后再左转。"},{"en":"Turn left if no pedestrians are in the crosswalk.","zh":"人行横道上没有行人就可以左转。"}],"answer_index":1,"explanation_zh":"在全保护左转路口，左转信号变红后，直行和右转车辆获得绿灯或绿色箭头，此时不得开始左转。","explanation_en":"At these intersections you may not begin a left turn after the green appears for through and right-turning traffic.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"https://files.ontario.ca/3-2-12.jpg","sign_desc_en":"A separate left-turn signal showing a red light.","sign_desc_zh":"单独的左转信号灯显示红灯。","difficulty":"hard"},{"id":"SD-15","group":"SD","section":"signs","topic_zh":"全保护左转","question_en":"You are already in the intersection making a left turn on a protected green arrow when the left-turn signal turns yellow. What should you do?","question_zh":"你正凭全保护左转绿色箭头在路口内左转，这时左转信号灯变成黄灯。你应该怎么做？","options":[{"en":"Stop where you are and wait for the next arrow.","zh":"原地停车，等待下一次箭头。"},{"en":"Reverse back behind the stop line.","zh":"倒车退回停车线后。"},{"en":"Complete your turn with caution.","zh":"谨慎地完成转弯。"},{"en":"Speed up and sound your horn to warn other drivers.","zh":"加速并鸣笛提醒其他司机。"}],"answer_index":2,"explanation_zh":"在全保护左转路口，如果你已在路口内时信号变成黄灯，应谨慎完成转弯。","explanation_en":"If the light turns yellow while you are in the intersection, complete your turn with caution.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SD-16","group":"SD","section":"signs","topic_zh":"闪烁红灯","question_en":"The red light shown is flashing. What must you do when you face it?","question_zh":"图中的红灯在闪烁。面对这种信号，你必须怎么做？","options":[{"en":"Slow down and go through with caution without stopping.","zh":"减速，不停车谨慎通过。"},{"en":"Stop, then wait until the light turns steady green.","zh":"停车，然后一直等到变成常亮的绿灯。"},{"en":"Come to a complete stop and move through only when it is safe.","zh":"完全停车，确认安全后再通过路口。"},{"en":"Yield only to vehicles on your right; stopping is optional.","zh":"只需让右侧车辆，停不停车自行决定。"}],"answer_index":2,"explanation_zh":"遇到闪烁红灯必须完全停车，只有在安全时才可以通过路口。","explanation_en":"At a flashing red light, stop completely and proceed only when it is safe.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"https://files.ontario.ca/3-2-13.jpg","sign_desc_en":"A traffic signal showing a flashing red light.","sign_desc_zh":"交通信号灯显示闪烁的红灯。","difficulty":"easy"},{"id":"SD-17","group":"SD","section":"signs","topic_zh":"闪烁黄灯","question_en":"This signal is a flashing yellow light. How does its meaning differ from a steady yellow light?","question_zh":"图中是闪烁黄灯。它的含义与常亮黄灯有什么不同？","options":[{"en":"Flashing: drive with caution. Steady: red is coming; stop if safe.","zh":"闪烁黄灯：谨慎驾驶通过；常亮黄灯：即将变红灯，能安全停车就停车。"},{"en":"Flashing: stop completely first. Steady: drive with caution.","zh":"闪烁黄灯：必须先完全停车；常亮黄灯：谨慎通过即可。"},{"en":"Flashing: red is about to appear. Steady: drive with caution.","zh":"闪烁黄灯：即将变红灯；常亮黄灯：谨慎通过即可。"},{"en":"No difference: both mean stop if you can do so safely.","zh":"没有区别：两者都表示能安全停车就停车。"}],"answer_index":0,"explanation_zh":"闪烁黄灯表示驶近和通过路口时要谨慎驾驶；常亮黄灯表示红灯即将亮起，能安全停车就必须停车，否则谨慎通过。要求完全停车的是闪烁红灯。","explanation_en":"A flashing yellow means drive with caution, while a steady yellow means red is coming and you must stop if it is safe.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"https://files.ontario.ca/3-2-14.jpg","sign_desc_en":"A traffic signal showing a flashing yellow light.","sign_desc_zh":"交通信号灯显示闪烁的黄灯。","difficulty":"medium"},{"id":"SD-18","group":"SD","section":"signs","topic_zh":"信号灯熄灭","question_en":"During an electrical power loss, the traffic lights at this intersection are not working. How should you treat the intersection?","question_zh":"停电时，这个路口的信号灯不工作。你应该按什么方式通过这个路口？","options":[{"en":"Use it as you would an intersection with all-way stop signs.","zh":"像通过设有全向停车标志（all-way stop）的路口一样通行。"},{"en":"Treat it like a flashing yellow light: slow down, but do not stop.","zh":"按闪烁黄灯处理：减速即可，不要停车。"},{"en":"Keep going if you are on the busier road; only side-road traffic must stop.","zh":"如果你在较繁忙的道路上就继续行驶，只有支路车辆需要停车。"},{"en":"Stop and wait at the intersection until the power comes back on.","zh":"在路口停车等候，直到恢复供电。"}],"answer_index":0,"explanation_zh":"停电导致信号灯熄灭时，要谨慎通过，像使用设有全向停车标志的路口一样；并让已在路口内的车辆和从右侧驶入的车辆先行。","explanation_en":"Treat a blank signal like an all-way stop, yielding to vehicles in the intersection and those from your right.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"https://files.ontario.ca/3-2-15.jpg","sign_desc_en":"A traffic signal with no lights showing.","sign_desc_zh":"信号灯完全不亮。","difficulty":"medium"},{"id":"SD-19","group":"SD","section":"signs","topic_zh":"信号灯熄灭","question_en":"The traffic lights are out because of a power failure. You and another car arrive at the intersection at about the same time, and the other car is on your right. Who should go first?","question_zh":"信号灯因停电熄灭。你和另一辆车几乎同时到达路口，对方在你的右侧。谁应该先走？","options":[{"en":"You, because you are on the left","zh":"你先走，因为你在左侧"},{"en":"Whichever vehicle is going straight","zh":"直行的那辆车先走"},{"en":"The other car, because it is on your right","zh":"对方先走，因为它在你的右侧"},{"en":"Whichever driver signals first","zh":"先打转向灯的一方先走"}],"answer_index":2,"explanation_zh":"信号灯熄灭时，要让已在路口内的车辆以及从你右侧驶入路口的车辆先行。","explanation_en":"At a blank signal, yield to vehicles entering the intersection from your right.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"SD-20","group":"SD","section":"signs","topic_zh":"交通信标","question_en":"What is a traffic beacon?","question_zh":"什么是交通信标（traffic beacon）？","options":[{"en":"A set of red, yellow and green lights that cycle at an intersection","zh":"在路口按周期变换的红、黄、绿三色信号灯"},{"en":"A single flashing light over an intersection, a sign or a road obstacle","zh":"设在路口上方、标志上方或道路障碍物上的单个闪烁灯"},{"en":"A flashing light on top of an emergency vehicle","zh":"应急车辆车顶的闪光灯"},{"en":"A lit roadside sign that displays your current speed","zh":"显示你当前车速的路边发光标志"}],"answer_index":1,"explanation_zh":"交通信标是单个闪烁灯，悬挂在路口上方，或设在标志上方、道路障碍物上。","explanation_en":"A traffic beacon is a single flashing light over an intersection, over signs or on obstacles.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"SD-21","group":"SD","section":"signs","topic_zh":"闪烁信标","question_en":"A single flashing light (a traffic beacon) hangs over an intersection. In which case must you come to a complete stop?","question_zh":"路口上方悬挂着一个单独的闪烁灯（交通信标）。在哪种情况下你必须完全停车？","options":[{"en":"When it flashes yellow","zh":"信标闪烁黄色时"},{"en":"Whenever it flashes, whatever its colour","zh":"只要在闪烁，不论什么颜色"},{"en":"Only when cross traffic is approaching","zh":"只有横向有来车时"},{"en":"When it flashes red","zh":"信标闪烁红色时"}],"answer_index":3,"explanation_zh":"路口或停车标志上方的闪烁红色信标要求完全停车，安全时才能通过；闪烁黄色信标只是警示你谨慎驾驶。","explanation_en":"A flashing red beacon requires a complete stop; a flashing yellow beacon warns you to drive with caution.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SD-22","group":"SD","section":"signs","topic_zh":"闪烁黄色信标","question_en":"A flashing yellow beacon like this is placed on an obstruction in the road ahead. What does it tell you?","question_zh":"前方道路障碍物上装有这样的闪烁黄色信标。它告诉你什么？","options":[{"en":"Drive with caution.","zh":"谨慎驾驶。"},{"en":"Come to a complete stop before passing it.","zh":"经过前必须完全停车。"},{"en":"The road is closed; turn around.","zh":"道路封闭，需掉头。"},{"en":"The lane beside it is for transit vehicles only.","zh":"旁边车道只供公共交通车辆使用。"}],"answer_index":0,"explanation_zh":"闪烁黄色信标可设在路口上方、警告标志上方或道路障碍物上，提醒你谨慎驾驶。","explanation_en":"A flashing yellow beacon warns you to drive with caution.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-lights","source_title":"MTO 手册 · Traffic lights","image_url":"https://files.ontario.ca/3-2-17.jpg","sign_desc_en":"A single flashing yellow light.","sign_desc_zh":"单个闪烁的黄灯。","difficulty":"easy"},{"id":"SD-23","group":"SD","section":"signs","topic_zh":"行人信号","question_en":"You are waiting to turn at a signalized intersection. A pedestrian facing this signal is crossing in front of you. Who has the right-of-way?","question_zh":"你在有信号灯的路口等候转弯。一名面对这种信号的行人正从你车前横过。谁有先行权？","options":[{"en":"You, because turning vehicles have priority","zh":"你，因为转弯车辆优先"},{"en":"The pedestrian, over all vehicles","zh":"行人，对所有车辆都优先"},{"en":"Whoever entered the intersection first","zh":"先进入路口的一方"},{"en":"The pedestrian, but only when you are turning left","zh":"行人，但仅限你左转时"}],"answer_index":1,"explanation_zh":"白色行走人形图案是行人通行信号。面对该信号的行人可以沿信号方向过马路，过街期间对所有车辆享有先行权。","explanation_en":"A pedestrian crossing on a walk signal has the right-of-way over all vehicles.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/pedestrian-signals","source_title":"MTO 手册 · Pedestrian signals","image_url":"https://files.ontario.ca/3-3-1.jpg","sign_desc_en":"A pedestrian signal showing a white walking symbol.","sign_desc_zh":"行人信号灯显示白色行走人形图案。","difficulty":"easy"},{"id":"SD-24","group":"SD","section":"signs","topic_zh":"行人信号","question_en":"A pedestrian is halfway across the road when this signal appears. Which statement is correct?","question_zh":"行人走到马路中间时，这种信号亮起。下列哪项正确？","options":[{"en":"The pedestrian loses the right-of-way, so waiting drivers may now go.","zh":"行人失去先行权，等候的司机现在可以通行。"},{"en":"The pedestrian must turn back to the curb where they started.","zh":"行人必须退回出发时的路边。"},{"en":"The pedestrian should hurry to safety and still has the right-of-way.","zh":"行人应尽快走到安全区域，且仍享有先行权。"},{"en":"Drivers may sound their horn to hurry the pedestrian along.","zh":"司机可以鸣笛催促行人。"}],"answer_index":2,"explanation_zh":"闪烁或常亮的橙色手形信号表示行人不得开始过街；已经在过街的行人应尽快到达安全区域，过街期间仍对车辆享有先行权。","explanation_en":"Pedestrians already crossing when the hand appears should hurry to safety and still have the right-of-way over vehicles.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/pedestrian-signals","source_title":"MTO 手册 · Pedestrian signals","image_url":"https://files.ontario.ca/3-3-2.jpg","sign_desc_en":"A pedestrian signal showing an orange hand symbol.","sign_desc_zh":"行人信号灯显示橙色手形图案。","difficulty":"medium"},{"id":"SD-25","group":"SD","section":"signs","topic_zh":"行人信号","question_en":"Which signal means a pedestrian must NOT begin to cross?","que
