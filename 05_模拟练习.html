_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-07","group":"LB","section":"rules","topic_zh":"正式驾照扣分","question_en":"A fully licensed driver's licence is suspended when the driver reaches how many demerit points?","question_zh":"持正式驾照的驾驶者累计扣分达到多少分时，驾照会被暂停？","options":[{"en":"9","zh":"9 分"},{"en":"12","zh":"12 分"},{"en":"15","zh":"15 分"},{"en":"20","zh":"20 分"}],"answer_index":2,"explanation_zh":"持正式驾照的驾驶者累计扣分达到 15 分时驾照被暂停。9 分是新手驾驶者的暂停门槛，对持正式驾照者只会收到第二封警告信。","explanation_en":"Fully licensed drivers are suspended at 15 points.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-08","group":"LB","section":"rules","topic_zh":"正式驾照扣分","question_en":"When a fully licensed driver reaches 15 demerit points, how long is the licence suspended?","question_zh":"持正式驾照的驾驶者累计扣分达到 15 分时，驾照会被暂停多久？","options":[{"en":"30 days","zh":"30 天"},{"en":"60 days","zh":"60 天"},{"en":"90 days","zh":"90 天"},{"en":"One year","zh":"一年"}],"answer_index":0,"explanation_zh":"累计扣分达到 15 分时，驾照暂停 30 天，从把驾照上交给交通部之日起计算。注意：新手驾驶者达到 9 分是暂停 60 天。","explanation_en":"Reaching 15 points brings a 30-day suspension.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-09","group":"LB","section":"rules","topic_zh":"正式驾照扣分","question_en":"After a fully licensed driver's 30-day demerit-point suspension, the points on the record are reduced to:","question_zh":"持正式驾照的驾驶者因扣分被暂停驾照 30 天，期满后记录上的扣分会降至多少分？","options":[{"en":"Zero","zh":"0 分"},{"en":"Four","zh":"4 分"},{"en":"Seven","zh":"7 分"},{"en":"Nine","zh":"9 分"}],"answer_index":2,"explanation_zh":"持正式驾照的驾驶者暂停期满后，扣分降为 7 分；新手驾驶者则降为 4 分。","explanation_en":"After the suspension, a fully licensed driver's points drop to seven.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-10","group":"LB","section":"rules","topic_zh":"正式驾照扣分","question_en":"After a fully licensed driver's first demerit-point suspension ends, an offence committed within the next two years brings their record to 15 points again. How long is this subsequent suspension?","question_zh":"一名持完整驾照的驾驶人首次扣分停牌期满后，在其后两年内发生的违章使其再次累计到15分。这次再次停牌的期限多久？","options":[{"en":"30 days","zh":"30 天"},{"en":"60 days","zh":"60 天"},{"en":"Six months","zh":"六个月"},{"en":"Two years","zh":"两年"}],"answer_index":2,"explanation_zh":"按第339/94号法规第9条，如果导致再次停牌的违章发生于前次停牌结束后两年内，就属于再次扣分停牌，期限为六个月；不是不论相隔多久都自动停牌六个月。","explanation_en":"Regulation 339/94 section 9 treats this as a subsequent demerit suspension, requiring six months. The triggering offence must have been committed within two years after the prior suspension ended.","source_url":"https://www.ontario.ca/laws/regulation/940339","source_title":"O. Reg. 339/94 · Section 9 subsequent demerit suspension","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LB-11","group":"LB","section":"rules","topic_zh":"扣分暂停","question_en":"Your licence is suspended for demerit points, but you do not surrender it to the Ministry of Transportation. You can lose your licence for up to:","question_zh":"你因扣分被暂停驾照，但没有把驾照上交给交通部。你最长可能失去驾照多久？","options":[{"en":"Six months","zh":"六个月"},{"en":"One year","zh":"一年"},{"en":"Two years","zh":"两年"},{"en":"Five years","zh":"五年"}],"answer_index":2,"explanation_zh":"无论是新手驾驶者还是持正式驾照者，被暂停后不上交驾照，最长可失去驾照两年。","explanation_en":"Failing to surrender your licence can cost you it for up to two years.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-12","group":"LB","section":"rules","topic_zh":"新手逐级处罚","question_en":"A G2 driver who holds no full motorcycle licence is convicted of an offence associated with four or more demerit points and receives a novice escalating-sanction suspension. How are those points recorded?","question_zh":"一名没有完整摩托车驾照的G2驾驶人，因对应扣4分或以上的违章被定罪，并受到新手逐级加重停牌处罚。相关扣分怎样记录？","options":[{"en":"Doubled, because novice drivers are penalized more heavily","zh":"加倍记录，因为新手驾驶者的处罚更重"},{"en":"Recorded as zero, but an escalating-sanction suspension applies","zh":"记为 0 分，但会受到逐级加重处罚的驾照暂停"},{"en":"Recorded in full and counted toward the nine-point threshold","zh":"全额记入，并计入 9 分的暂停门槛"},{"en":"Recorded in full, and the licence is cancelled","zh":"全额记入，并注销驾照"}],"answer_index":1,"explanation_zh":"现行第340/94号法规第11(6)条规定，题干所述新手逐级加重处罚适用时，这项定罪不记录扣分，但停牌处罚仍会执行。如果同时持有另一类完整驾照，适用规则可能不同。","explanation_en":"Regulation 340/94 section 11(6) confirms that no points are recorded for this conviction when the novice escalating sanction applies. The suspension still applies. Holding another full licence class can change whether this novice rule applies.","source_url":"https://www.ontario.ca/laws/regulation/940340","source_title":"O. Reg. 340/94 · Section 11(6) novice sanctions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LB-13","group":"LB","section":"rules","topic_zh":"新手逐级处罚","question_en":"For novice drivers, escalating sanctions apply when occurrences such as repeated violations of novice restrictions or HTA convictions worth 4 or more demerit points take place within what period?","question_zh":"新手驾驶者在多长时间内出现重复违反新手限制条件、或被判扣 4 分及以上的《公路交通法》（HTA）违章等情况时，会受到逐级加重处罚？","options":[{"en":"One year","zh":"一年"},{"en":"Two years","zh":"两年"},{"en":"Three years","zh":"三年"},{"en":"Five years","zh":"五年"}],"answer_index":3,"explanation_zh":"新手驾驶者在五年内出现以下任一情况，就会适用逐级加重处罚：重复违反新手限制条件、《公路交通法》（HTA）4 分及以上的定罪、法院下令的驾照暂停。","explanation_en":"Escalating sanctions look at occurrences within a five-year period.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-14","group":"LB","section":"rules","topic_zh":"新手违规","question_en":"A G2 driver is convicted for the first time of violating a graduated-licensing condition, with no prior escalating-sanction occurrence. How long is the novice escalating-sanction licence suspension?","question_zh":"一名G2驾驶人首次因违反分级驾照条件被定罪，且此前没有适用逐级加重处罚的记录。这次新手逐级加重处罚会停牌多久？","options":[{"en":"24 hours","zh":"24 小时"},{"en":"7 days","zh":"7 天"},{"en":"30 days","zh":"30 天"},{"en":"60 days","zh":"60 天"}],"answer_index":2,"explanation_zh":"新手逐级加重处罚的第一次相关定罪会停牌30天；在规定期间内第二次为90天，第三次会注销新手驾照。停牌后的交回驾照和恢复要求仍须遵守。","explanation_en":"The first conviction covered by novice escalating sanctions results in a 30-day suspension; a second within the relevant period brings 90 days, and a third cancellation.","source_url":"https://www.ontario.ca/page/understanding-demerit-points","source_title":"Ontario current guidance · Novice escalating penalties","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-15","group":"LB","section":"rules","topic_zh":"扣分标准","question_en":"Which of these offences carries 7 demerit points?","question_zh":"下列哪项违章会被扣 7 分？","options":[{"en":"Failing to stop for police","zh":"警察示意停车时不停车"},{"en":"Careless driving","zh":"疏忽驾驶"},{"en":"Failing to stop for a school bus","zh":"遇校车未停车"},{"en":"Following too closely","zh":"跟车过近"}],"answer_index":0,"explanation_zh":"扣 7 分的只有两项：未留在碰撞现场、警察示意停车时不停车。疏忽驾驶和遇校车未停车扣 6 分，跟车过近扣 4 分。","explanation_en":"Failing to stop for police is a 7-point offence.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-16","group":"LB","section":"rules","topic_zh":"事故现场","question_en":"A driver involved in a collision drives away instead of remaining at the scene. How many demerit points does this offence carry?","question_zh":"一名司机发生碰撞后没有留在现场，直接开车离开。这项违章扣多少分？","options":[{"en":"3","zh":"3 分"},{"en":"4","zh":"4 分"},{"en":"6","zh":"6 分"},{"en":"7","zh":"7 分"}],"answer_index":3,"explanation_zh":"《公路交通法》下未留在碰撞现场的违章通常对应7分。根据事实和具体指控，逃离碰撞现场也可能构成《刑法》罪行；如果按刑事罪名定罪，还可能导致停牌。不能把每项HTA违章都自动等同于刑事定罪。","explanation_en":"The HTA offence of failing to remain at a collision scene carries seven demerit points. Depending on the facts and charge, leaving the scene may also lead to a Criminal Code prosecution and licence suspension.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-17","group":"LB","section":"rules","topic_zh":"校车","question_en":"How many demerit points are given for failing to stop for a school bus?","question_zh":"遇校车未停车会被扣多少分？","options":[{"en":"3","zh":"3 分"},{"en":"4","zh":"4 分"},{"en":"6","zh":"6 分"},{"en":"7","zh":"7 分"}],"answer_index":2,"explanation_zh":"遇校车未停车扣 6 分，与疏忽驾驶、飙车同级。","explanation_en":"Failing to stop for a school bus carries 6 points.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-18","group":"LB","section":"rules","topic_zh":"疏忽驾驶与飙车","question_en":"Careless driving and racing each carry how many demerit points?","question_zh":"疏忽驾驶（careless driving）和飙车（racing）各扣多少分？","options":[{"en":"3","zh":"3 分"},{"en":"4","zh":"4 分"},{"en":"6","zh":"6 分"},{"en":"7","zh":"7 分"}],"answer_index":2,"explanation_zh":"疏忽驾驶和飙车都扣 6 分。疏忽驾驶指驾驶时缺乏应有的谨慎和注意，或未合理顾及其他道路使用者。","explanation_en":"Careless driving and racing are both 6-point offences.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-19","group":"LB","section":"rules","topic_zh":"超速扣分","question_en":"On a freeway with a posted limit of 100 km/h, a driver is caught at 152 km/h. How many demerit points apply?","question_zh":"在限速 100 km/h 的高速公路上，司机被测到时速 152 km/h。会被扣多少分？","options":[{"en":"3","zh":"3 分"},{"en":"4","zh":"4 分"},{"en":"6","zh":"6 分"},{"en":"7","zh":"7 分"}],"answer_index":2,"explanation_zh":"超速 52 km/h，属于超速 50 km/h 或以上，扣 6 分。","explanation_en":"Exceeding the limit by 50 km/h or more carries 6 points.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-20","group":"LB","section":"rules","topic_zh":"超速扣分","question_en":"On a highway posted at 100 km/h, you are caught driving at 135 km/h. How many demerit points apply?","question_zh":"在限速 100 km/h 的公路上，你被测到时速 135 km/h。会被扣多少分？","options":[{"en":"2","zh":"2 分"},{"en":"3","zh":"3 分"},{"en":"4","zh":"4 分"},{"en":"6","zh":"6 分"}],"answer_index":2,"explanation_zh":"超速 35 km/h，属于超速 30–49 km/h，扣 4 分；该路限速不低于 80 km/h，不适用「超速 40 km/h 或以上扣 6 分」的规定。","explanation_en":"Speeding 30 to 49 km/h over carries 4 points.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-21","group":"LB","section":"rules","topic_zh":"超速扣分","question_en":"A driver is caught going 20 km/h over the posted speed limit. How many demerit points apply?","question_zh":"司机被查到超过限速 20 km/h。会被扣多少分？","options":[{"en":"2","zh":"2 分"},{"en":"3","zh":"3 分"},{"en":"4","zh":"4 分"},{"en":"6","zh":"6 分"}],"answer_index":1,"explanation_zh":"超速 16–29 km/h 扣 3 分；超速 30–49 km/h 才扣 4 分。","explanation_en":"Speeding 16 to 29 km/h over carries 3 points.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-22","group":"LB","section":"rules","topic_zh":"跟车距离","question_en":"Following another vehicle too closely carries how many demerit points?","question_zh":"跟车过近会被扣多少分？","options":[{"en":"2","zh":"2 分"},{"en":"3","zh":"3 分"},{"en":"4","zh":"4 分"},{"en":"6","zh":"6 分"}],"answer_index":2,"explanation_zh":"跟车过近扣 4 分，与超速 30–49 km/h、在行人过街设施处未停车同级。","explanation_en":"Following too closely is a 4-point offence.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-23","group":"LB","section":"rules","topic_zh":"行人过街设施","question_en":"Failing to stop at a pedestrian crossover carries how many demerit points?","question_zh":"在行人过街设施（pedestrian crossover）处未停车，会被扣多少分？","options":[{"en":"2","zh":"2 分"},{"en":"3","zh":"3 分"},{"en":"4","zh":"4 分"},{"en":"6","zh":"6 分"}],"answer_index":2,"explanation_zh":"在行人过街设施处未停车扣 4 分，比一般的未让出先行权（3 分）更重。","explanation_en":"Failing to stop at a pedestrian crossover carries 4 points.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-24","group":"LB","section":"rules","topic_zh":"铁路道口","question_en":"A bus driver fails to stop at an unprotected railway crossing. How many demerit points does this carry?","question_zh":"公共汽车司机在无防护设施的铁路道口没有停车，会被扣多少分？","options":[{"en":"3","zh":"3 分"},{"en":"4","zh":"4 分"},{"en":"5","zh":"5 分"},{"en":"6","zh":"6 分"}],"answer_index":2,"explanation_zh":"公共汽车司机在无防护设施的铁路道口未停车扣 5 分，这是扣分表中唯一的 5 分项目。","explanation_en":"A bus driver failing to stop at an unprotected railway crossing gets 5 points.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LB-25","group":"LB","section":"rules","topic_zh":"分心驾驶","question_en":"A fully licensed Class G driver receives a first distracted-driving conviction for holding or using a hand-held phone, or viewing a non-driving display screen. How many demerit points apply?","question_zh":"一名持完整G驾照的驾驶人，首次因驾驶时手持或使用手机、或观看与驾驶无关的显示屏而被判分心驾驶。会被扣多少分？","options":[{"en":"2","zh":"2 分"},{"en":"3","zh":"3 分"},{"en":"4","zh":"4 分"},{"en":"6","zh":"6 分"}],"answer_index":1,"explanation_zh":"完整G驾照驾驶人首次分心驾驶定罪扣3分，另有罚款和停牌；在相关期间内再犯扣6分。G1/G2新手则以更长的逐级加重停牌处罚代替扣分，不能把所有情况一概说成3分。","explanation_en":"A first distracted-driving conviction for a fully licensed G driver carries three points and other penalties. Repeat convictions bring six points. Novice G1/G2 drivers receive longer escalating suspensions instead of demerit points.","source_url":"https://www.ontario.ca/page/distracted-driving","source_title":"Ontario current guidance · Distracted-driving penalties","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-26","group":"LB","section":"rules","topic_zh":"应急车辆","question_en":"You drive past a stopped emergency vehicle without slowing down or passing with care. How many demerit points does this offence carry?","question_zh":"你驾车经过一辆停着的应急车辆时，没有减速，也没有小心通过。这项违章扣多少分？","options":[{"en":"2","zh":"2 分"},{"en":"3","zh":"3 分"},{"en":"4","zh":"4 分"},{"en":"6","zh":"6 分"}],"answer_index":1,"explanation_zh":"经过停着的应急车辆时未减速并小心通过，扣 3 分；在可行时未变到另一条车道避让，同样扣 3 分。","explanation_en":"Failing to slow and carefully pass a stopped emergency vehicle carries 3 points.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-27","group":"LB","section":"rules","topic_zh":"事故报告","question_en":"Failing to report a collision to a police officer carries how many demerit points?","question_zh":"发生碰撞后未向警察报告，会被扣多少分？","options":[{"en":"2","zh":"2 分"},{"en":"3","zh":"3 分"},{"en":"6","zh":"6 分"},{"en":"7","zh":"7 分"}],"answer_index":1,"explanation_zh":"未向警察报告碰撞扣 3 分；如果是未留在碰撞现场，则扣 7 分。","explanation_en":"Failing to report a collision to police carries 3 points.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-28","group":"LB","section":"rules","topic_zh":"儿童乘客安全","question_en":"A driver does not make sure that a 12-year-old passenger is wearing a seatbelt. How many demerit points does the driver get?","question_zh":"司机没有确保 12 岁的乘客系好安全带。司机会被扣多少分？","options":[{"en":"2","zh":"2 分"},{"en":"3","zh":"3 分"},{"en":"4","zh":"4 分"},{"en":"6","zh":"6 分"}],"answer_index":0,"explanation_zh":"司机未确保 16 岁以下乘客系好安全带扣 2 分；司机自己不系安全带同样扣 2 分。","explanation_en":"Not ensuring a passenger under 16 wears a seatbelt costs the driver 2 points.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-29","group":"LB","section":"rules","topic_zh":"扣分标准","question_en":"Which of the following offences carries 2 demerit points?","question_zh":"下列哪项违章扣 2 分？","options":[{"en":"Failing to signal","zh":"未按规定打信号"},{"en":"Failing to yield the right-of-way","zh":"未让出先行权"},{"en":"Following too closely","zh":"跟车过近"},{"en":"Improper use of an HOV lane","zh":"违规使用高乘载车道（HOV）"}],"answer_index":0,"explanation_zh":"未打信号扣 2 分；未让出先行权和违规使用 HOV 车道各扣 3 分，跟车过近扣 4 分。","explanation_en":"Failing to signal is a 2-point offence.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-30","group":"LB","section":"rules","topic_zh":"扣分标准","question_en":"Which of the following offences carries 3 demerit points?","question_zh":"下列哪项违章扣 3 分？","options":[{"en":"Failing to switch to low beams when required","zh":"需要时未将远光灯切换为近光灯"},{"en":"Reversing on a highway","zh":"在公路上倒车"},{"en":"Failing to stop for a school bus","zh":"遇校车未停车"},{"en":"Driving a car fitted with a radar detector","zh":"驾驶装有雷达探测器的车辆"}],"answer_index":3,"explanation_zh":"驾驶装有雷达探测器的车辆扣 3 分；未切换近光灯和在公路上倒车各扣 2 分，遇校车未停车扣 6 分。","explanation_en":"Driving with a radar detector is a 3-point offence.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-31","group":"LB","section":"rules","topic_zh":"驾照管理","question_en":"You move to a new address. Within how many days must you inform the Ministry of Transportation?","question_zh":"你搬到了新地址，必须在几天内通知交通部？","options":[{"en":"6 days","zh":"6 天"},{"en":"15 days","zh":"15 天"},{"en":"30 days","zh":"30 天"},{"en":"60 days","zh":"60 天"}],"answer_index":0,"explanation_zh":"更改姓名或地址后必须在 6 天内通知交通部；因改名或改地址而换发新驾照不收费。","explanation_en":"Name or address changes must be reported within six days.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-32","group":"LB","section":"rules","topic_zh":"驾照管理","question_en":"When are you required to carry your driver's licence?","question_zh":"什么时候必须随身携带驾照？","options":[{"en":"Only when driving on a freeway","zh":"只有在高速公路上驾驶时"},{"en":"Whenever you drive","zh":"每次驾驶时"},{"en":"Only on trips outside your city","zh":"只有出城时"},{"en":"Only when driving a borrowed vehicle","zh":"只有驾驶借来的车辆时"}],"answer_index":1,"explanation_zh":"无论何时驾驶都必须随身携带驾照，并在警察要求时出示。","explanation_en":"You must carry your licence every time you drive.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-33","group":"LB","section":"rules","topic_zh":"驾照法规","question_en":"Which of the following is illegal under Ontario's driver's licence laws?","question_zh":"根据安省驾照法规，下列哪项是违法的？","options":[{"en":"Renewing, without any tests, a full G licence that expired six months ago","zh":"不经考试续期一张已过期六个月的正式 G 级驾照"},{"en":"Holding two Ontario driver's licences at the same time","zh":"同时持有两张安省驾照"},{"en":"Driving with a temporary licence until the card arrives by mail","zh":"在正式驾照寄到前使用临时驾照驾驶"},{"en":"Changing your address on the ServiceOntario website","zh":"在 ServiceOntario 网站上更改地址"}],"answer_index":1,"explanation_zh":"持有一张以上的安省驾照属违法。过期一年内的汽车驾照可免试续期，临时驾照可在正式驾照寄到前使用，地址也可以在网上更改。","explanation_en":"Having more than one Ontario driver's licence is illegal.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-34","group":"LB","section":"rules","topic_zh":"驾照续期","question_en":"Your full Class G licence expired eight months ago. Which statement is correct?","question_zh":"你的正式 G 级驾照已过期八个月。下列哪项说法正确？","options":[{"en":"You can renew it without taking any tests","zh":"可以不经任何考试直接续期"},{"en":"You must retake the knowledge test","zh":"必须重考笔试"},{"en":"You must retake the road test","zh":"必须重考路考"},{"en":"You must restart at Level One (G1)","zh":"必须从第一级（G1）重新开始"}],"answer_index":0,"explanation_zh":"已过期的汽车或摩托车驾照，在过期一年内可以免试续期。","explanation_en":"An expired car licence can be renewed within one year without tests.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-35","group":"LB","section":"rules","topic_zh":"驾照续期","question_en":"Your full Class G licence expired four years ago. What must you do to regain driving privileges?","question_zh":"你的完整G级驾照已过期四年。要重新获得驾驶资格，必须怎么做？","options":[{"en":"Pay the renewal fee only","zh":"只需缴纳续期费"},{"en":"Take a vision test only","zh":"只需做视力测试"},{"en":"Pass vision, knowledge and both road tests; the usual waiting periods are waived","zh":"通过视力、笔试和两次路考；通常的阶段等待期获豁免"},{"en":"Renew online without any tests","zh":"在网上免试续期"}],"answer_index":2,"explanation_zh":"完整G驾照过期3至10年，须通过视力测试、知识考试及两次路考；通过前一项后即可预约下一项，通常的分级阶段等待期获豁免。过期超过10年则须按新驾驶人重新申请并满足等待期。","explanation_en":"For a full G licence expired 3–10 years, pass a vision test, the knowledge test and both road tests. You may book each next test once you pass the preceding one; ordinary graduated waiting periods are waived. More than 10 years is treated differently.","source_url":"https://www.ontario.ca/page/renew-expired-drivers-licence","source_title":"Ontario current guidance · Renew an expired licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-36","group":"LB","section":"rules","topic_zh":"高龄驾驶者","question_en":"Drivers aged 80 or older must renew their driver's licence how often?","question_zh":"80 岁及以上的驾驶者需要多久续期一次驾照？","options":[{"en":"Every year","zh":"每年"},{"en":"Every two years","zh":"每两年"},{"en":"Every three years","zh":"每三年"},{"en":"Every five years","zh":"每五年"}],"answer_index":1,"explanation_zh":"80 岁及以上驾驶者每两年续期一次，续期时需做视力测试和约五分钟的筛查练习；这些要求本身免费，只需付续期费。","explanation_en":"Drivers 80 and older renew every two years.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-37","group":"LB","section":"rules","topic_zh":"分级驾照","question_en":"Except for Class M1, how long do novice drivers have to complete the graduated licensing process?","question_zh":"除 M1 级外，新手驾驶者有多长时间完成分级驾照流程？","options":[{"en":"Two years","zh":"两年"},{"en":"Three years","zh":"三年"},{"en":"Five years","zh":"五年"},{"en":"Ten years","zh":"十年"}],"answer_index":2,"explanation_zh":"新手驾驶者（M1 除外）有五年时间完成分级驾照流程；若 G1、G2 或 M2 驾照快到期仍未完成，可通过考试并缴纳五年驾照费来保留或重新取得同级驾照（requalification）。","explanation_en":"Novice drivers (except M1) have five years to finish graduated licensing.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-38","group":"LB","section":"rules","topic_zh":"零酒精规定","question_en":"Under Ontario law, drivers of what age must have a blood-alcohol concentration (BAC) of zero, regardless of licence class?","question_zh":"根据安省法律，哪个年龄段的驾驶者无论持何种级别驾照，血液酒精浓度（BAC）都必须为零？","options":[{"en":"18 and under","zh":"18 岁及以下"},{"en":"19 and under","zh":"19 岁及以下"},{"en":"21 and under","zh":"21 岁及以下"},{"en":"25 and under","zh":"25 岁及以下"}],"answer_index":2,"explanation_zh":"所有 21 岁及以下的驾驶者，无论驾照级别，驾驶时 BAC 都必须为零。","explanation_en":"All drivers 21 and under must have zero BAC regardless of licence class.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-39","group":"LB","section":"rules","topic_zh":"零酒精规定","question_en":"A 20-year-old with a full G licence is stopped by police and has a small amount of alcohol in their system (below 0.05%). Under Ontario's current rules, what is the immediate licence suspension for a first occurrence?","question_zh":"一名20岁、持完整G驾照的司机体内被查出少量酒精（低于0.05%）。根据安省现行规定，第一次被查到时当场停牌多久？","options":[{"en":"An immediate 7-day licence suspension","zh":"当场暂停驾照 7 天"},{"en":"An immediate 90-day licence suspension","zh":"当场暂停驾照 90 天"},{"en":"Nothing, because the BAC is below .05","zh":"没有处罚，因为血液酒精浓度低于 0.05"},{"en":"A verbal warning only","zh":"只给口头警告"}],"answer_index":0,"explanation_zh":"年轻或新手驾驶人违反零酒精规定，按现行规则首次当场停牌7天，并须完成教育课程及缴纳行政罚款；定罪后还可能追加处罚。手册旧段落的24小时不是现行路边处罚。不要按过时选项推断现行规则。","explanation_en":"The current first-occurrence roadside suspension for a young or novice driver's zero-alcohol violation is seven days, with required education and an administrative penalty. Older handbook text giving 24 hours is superseded by the current impaired-driving guidance.","source_url":"https://www.ontario.ca/page/impaired-driving","source_title":"Ontario current guidance · Roadside impaired-driving penalties","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-40","group":"LB","section":"rules","topic_zh":"零酒精规定","question_en":"If a driver aged 21 or under is convicted of breaking the zero-BAC rule, they face a fine and a licence suspension of at least:","question_zh":"21 岁及以下的驾驶者若因违反零酒精规定被定罪，除罚款外，驾照至少会被暂停多久？","options":[{"en":"7 days","zh":"7 天"},{"en":"30 days","zh":"30 天"},{"en":"90 days","zh":"90 天"},{"en":"One year","zh":"一年"}],"answer_index":1,"explanation_zh":"手册写明：21 岁及以下司机违反零酒精规定被定罪，会被罚款，并停牌至少 30 天。ontario.ca 现行写法是罚款 $60～$1,000，并视年龄和驾照类别再停牌 30 天或 90 天，甚至吊销，和“至少 30 天”一致。","explanation_en":"A conviction brings a fine and at least a 30-day suspension.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LB-41","group":"LB","section":"rules","topic_zh":"警告范围","question_en":"Which blood-alcohol concentration range does Ontario call the 'warn range'?","question_zh":"安省所说的「警告范围」（warn range）是指哪个血液酒精浓度区间？","options":[{"en":".00 to .05","zh":".00 至 .05"},{"en":"0.05% to 0.079%","zh":"0.05%至0.079%（低于0.08%）"},{"en":".08 to .10","zh":".08 至 .10"},{"en":".10 to .15","zh":".10 至 .15"}],"answer_index":1,"explanation_zh":"现行警告范围为BAC 0.05%至0.079%，即达到0.05%但低于0.08%；达到0.08%或以上适用更重的受损驾驶处罚。","explanation_en":"The current warn range is a BAC from 0.05% to 0.079%, below 0.08%. A BAC of 0.08% or more triggers the higher impairment penalties.","source_url":"https://www.ontario.ca/page/impaired-driving","source_title":"Ontario current guidance · Warn-range BAC","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-42","group":"LB","section":"rules","topic_zh":"警告范围","question_en":"A 35-year-old fully licensed driver registers a BAC in the warn range (0.05% to 0.079%) for the first time. Under Ontario's current rules, how long is the immediate roadside licence suspension?","question_zh":"一名35岁、持完整驾照的驾驶人首次被测出BAC处于警告范围（0.05%至0.079%）。按安省现行规定，当场停牌多久？","options":[{"en":"7 days","zh":"7 天"},{"en":"30 days","zh":"30 天"},{"en":"90 days","zh":"90 天"},{"en":"One year","zh":"1 年"}],"answer_index":0,"explanation_zh":"按安省现行规则，首次警告范围违规会当场停牌7天，并有教育课程和行政罚款。手册旧段落的3天已不符合现行路边处罚，应按现行政府指引学习。","explanation_en":"The current first warn-range occurrence brings a seven-day immediate suspension, education and an administrative penalty. The handbook's older three-day figure is superseded.","source_url":"https://www.ontario.ca/page/impaired-driving","source_title":"Ontario current guidance · Roadside impaired-driving penalties","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-43","group":"LB","section":"rules","topic_zh":"警告范围","question_en":"A 40-year-old fully licensed driver is caught in the warn range (0.05% to 0.079%) for the second time. Under Ontario's current rules, what are the roadside consequences?","question_zh":"一名40岁、持完整驾照的驾驶人第二次被查出BAC处于警告范围（0.05%至0.079%）。按安省现行规则，后果是什么？","options":[{"en":"A 14-day suspension, a 16-hour treatment program and a $350 penalty","zh":"停牌 14 天，上 16 小时治疗课程，罚 $350"},{"en":"A 90-day suspension and a 7-day vehicle impoundment","zh":"停牌 90 天，并扣车 7 天"},{"en":"A warning letter from the Ministry only","zh":"只收到交通部的警告信"},{"en":"A lifetime licence suspension","zh":"终身吊销驾照"}],"answer_index":0,"explanation_zh":"按现行规则，第二次警告范围违规会当场停牌14天、完成16小时治疗项目，并缴纳350加元行政罚款。手册旧段落的第二次7天已过时。","explanation_en":"The current second warn-range occurrence brings a 14-day immediate suspension, a 16-hour treatment program and a $350 administrative penalty. Older handbook text giving seven days is superseded.","source_url":"https://www.ontario.ca/page/impaired-driving","source_title":"Ontario current guidance · Roadside impaired-driving penalties","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LB-44","group":"LB","section":"rules","topic_zh":"行政性暂停","question_en":"Police find that a driver's BAC is 0.08% or more. Under the Administrative Driver's Licence Suspension (ADLS), the licence is suspended immediately for:","question_zh":"警方发现驾驶人的BAC达到0.08%或以上。按行政性驾照暂停（ADLS）规定，驾照会被立即暂停多久？","options":[{"en":"7 days","zh":"7 天"},{"en":"30 days","zh":"30 天"},{"en":"90 days","zh":"90 天"},{"en":"One year","zh":"一年"}],"answer_index":2,"explanation_zh":"BAC达到0.08%或以上（每100毫升血液含80毫克酒精或以上），会立即被行政性停牌90天；还适用现行规定中的扣车及其他处罚。","explanation_en":"A BAC of 0.08% or more brings an immediate 90-day administrative suspension, along with other current impairment penalties.","source_url":"https://www.ontario.ca/page/impaired-driving","source_title":"Ontario current guidance · Administrative impaired-driving penalties","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-45","group":"LB","section":"rules","topic_zh":"行政性暂停","question_en":"A driver refuses to provide a breath sample when a police officer demands one. What is the immediate licence consequence?","question_zh":"警察要求司机提供呼气样本，司机拒绝。驾照方面会立即受到什么处罚？","options":[{"en":"None until a court convicts the driver","zh":"在法院定罪前没有任何处罚"},{"en":"A 24-hour roadside suspension","zh":"现场暂停驾照 24 小时"},{"en":"A 3-day warn-range suspension","zh":"按警告范围暂停驾照 3 天"},{"en":"A 90-day administrative suspension","zh":"行政性暂停驾照 90 天"}],"answer_index":3,"explanation_zh":"未能或拒绝按警察要求提供呼气、血液、口腔液或尿液样本，与 BAC 超过 .08 一样，立即暂停驾照 90 天，同时还会被按《刑法》起诉。","explanation_en":"Refusing a breath sample brings the same immediate 90-day suspension as failing it.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-46","group":"LB","section":"rules","topic_zh":"行政性暂停","question_en":"Which statement about the 90-day Administrative Driver's Licence Suspension (ADLS) is correct?","question_zh":"关于 90 天行政性驾照暂停（ADLS），下列哪项说法正确？","options":[{"en":"It starts immediately and is separate from any criminal charges","zh":"立即生效，并且与任何刑事指控相互独立"},{"en":"It begins only after the driver is convicted in criminal court","zh":"只有在驾驶者被刑事法庭定罪后才开始"},{"en":"It replaces any criminal charges arising from the same incident","zh":"它会取代同一事件引起的任何刑事指控"},{"en":"It can be cancelled on the spot by paying an administrative fine","zh":"当场缴纳行政罚款即可撤销"}],"answer_index":0,"explanation_zh":"ADLS 在路边或警察局即时生效，与可能同时进行的刑事指控或起诉相互独立，不会取代刑事程序。","explanation_en":"The ADLS starts at the roadside or station and is separate from criminal proceedings.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LB-47","group":"LB","section":"rules","topic_zh":"血液酒精浓度","question_en":"A blood-alcohol concentration (BAC) of .08 means:","question_zh":"血液酒精浓度（BAC）为 .08，表示：","options":[{"en":"8 milligrams of alcohol in 100 millilitres of blood","zh":"每 100 毫升血液含 8 毫克酒精"},{"en":"80 milligrams of alcohol in 1 litre of blood","zh":"每 1 升血液含 80 毫克酒精"},{"en":"80 milligrams of alcohol in 100 millilitres of blood","zh":"每 100 毫升血液含 80 毫克酒精"},{"en":"800 milligrams of alcohol in 100 millilitres of blood","zh":"每 100 毫升血液含 800 毫克酒精"}],"answer_index":2,"explanation_zh":"BAC 0.08%表示每100毫升血液含80毫克酒精。达到0.08%或以上即达到安省现行较重受损驾驶处罚的酒精浓度门槛；并非一定要超过0.08%。","explanation_en":"BAC 0.08% means 80 mg of alcohol per 100 mL of blood. Current Ontario impairment penalties apply at 0.08% or more.","source_url":"https://www.ontario.ca/page/impaired-driving","source_title":"Ontario current guidance · BAC thresholds","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-48","group":"LB","section":"rules","topic_zh":"刑事定罪","question_en":"Under Ontario's current rules, what licence suspension applies to a first criminal impaired-driving conviction that did not cause death, before any eligible reduction program?","question_zh":"根据安省现行规则，首次受损驾驶刑事定罪且未造成死亡，在考虑任何可申请的减免计划之前，驾照停牌期限是多少？","options":[{"en":"90 days","zh":"90 天"},{"en":"At least one year","zh":"至少一年"},{"en":"Three years","zh":"三年"},{"en":"A lifetime ban","zh":"终身禁驾"}],"answer_index":1,"explanation_zh":"现行一般首次受损驾驶刑事定罪，驾照停牌至少一年；若造成死亡，适用另行规定的终身停牌制度，再犯也有更重处罚。不能把所有与驾驶有关的刑事定罪都说成固定一年。","explanation_en":"The current general first impaired-driving conviction suspension is at least one year. Impaired driving causing death has a separate lifetime-suspension regime; repeat convictions also carry harsher sanctions.","source_url":"https://www.ontario.ca/page/impaired-driving","source_title":"Ontario current guidance · Criminal impaired-driving penalties","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-49","group":"LB","section":"rules","topic_zh":"刑事定罪","question_en":"Criminal Code driving convictions remain on your driver's record for a minimum of:","question_zh":"与驾驶相关的《刑法》定罪至少会在驾驶记录上保留多久？","options":[{"en":"Two years","zh":"两年"},{"en":"Three years","zh":"三年"},{"en":"Five years","zh":"五年"},{"en":"10 years","zh":"10 年"}],"answer_index":3,"explanation_zh":"《刑法》定罪至少在驾驶记录上保留 10 年；相比之下，扣分只保留两年。","explanation_en":"Criminal Code convictions stay on your record for at least 10 years.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-50","group":"LB","section":"rules","topic_zh":"强制暂停","question_en":"A driver is convicted after the court finds that they wilfully continued to avoid police during a pursuit, and no death or bodily harm resulted. Under HTA section 216(3), the mandatory licence suspension is:","question_zh":"法院认定一名驾驶人在警方追逐时故意继续逃避，且未造成死亡或身体伤害，并据此定罪。根据《公路交通法》第216(3)条，强制停牌期限是多久？","options":[{"en":"One year","zh":"一年"},{"en":"Two years","zh":"两年"},{"en":"Three years","zh":"三年"},{"en":"Five years","zh":"五年"}],"answer_index":3,"explanation_zh":"在警方追逐时故意继续逃避，按HTA第216(3)条会停牌五年；如逃避行为或追逐造成死亡或身体伤害，最低期限更长。一般未服从停车指令与这种逃避追逐情形须区分；扣分表的7分项目排除了已经按216(3)条作出停牌命令的情况。","explanation_en":"Wilfully evading police during a pursuit brings a five-year suspension under section 216(3); death or bodily harm triggers a higher minimum. The seven-point failure-to-stop entry excludes cases with a 216(3) suspension order.","source_url":"https://www.ontario.ca/laws/statute/90h08","source_title":"Highway Traffic Act · Section 216(3) escape by flight","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-51","group":"LB","section":"rules","topic_zh":"罚款未缴","question_en":"What can happen if you do not pay a traffic fine that a court ordered you to pay?","question_zh":"如果你不缴纳法院判处的交通罚款，可能会怎样？","options":[{"en":"Your licence is suspended","zh":"驾照会被暂停"},{"en":"Two demerit points are added to your record","zh":"驾驶记录被扣 2 分"},{"en":"Your vehicle is impounded for seven days","zh":"车辆被扣押 7 天"},{"en":"Nothing; an unpaid fine does not affect your licence","zh":"没有影响，未缴罚款与驾照无关"}],"answer_index":0,"explanation_zh":"不缴纳法院判处的交通罚款，属于《公路交通法》（HTA）强制暂停驾照的情形之一。","explanation_en":"Not paying a court-ordered traffic fine leads to a licence suspension.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-52","group":"LB","section":"rules","topic_zh":"驾照注销","question_en":"Your licence was suspended, and afterwards you do not pay the required reinstatement fee. What happens to your licence?","question_zh":"你的驾照被暂停后，你没有缴纳规定的驾照恢复费（reinstatement fee）。你的驾照会怎样？","options":[{"en":"It is reinstated, and the fee is billed later","zh":"照常恢复，费用日后再收"},{"en":"It is cancelled","zh":"驾照被注销"},{"en":"Three demerit points are added","zh":"被扣 3 分"},{"en":"The suspension is extended by 30 days","zh":"暂停期延长 30 天"}],"answer_index":1,"explanation_zh":"暂停后不缴恢复费或行政罚款，驾照会被注销。其他导致注销的情况包括：驾驶复考不及格、缴费支票被银行退票、自愿向交通部交回驾照。","explanation_en":"Not paying the reinstatement fee after a suspension leads to cancellation.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LB-53","group":"LB","section":"rules","topic_zh":"医疗暂停","question_en":"A physician identifies a prescribed high-risk medical condition that must be reported to the Ministry of Transportation. From what patient age does this mandatory reporting rule apply?","question_zh":"医生发现患者有法规规定、必须向交通部报告的高风险疾病。这项强制报告规定适用于几岁及以上的患者？","options":[{"en":"16 or older","zh":"16 岁或以上"},{"en":"18 or older","zh":"18 岁或以上"},{"en":"65 or older","zh":"65 岁或以上"},{"en":"80 or older","zh":"80 岁或以上"}],"answer_index":0,"explanation_zh":"强制报告针对16岁或以上、具有法规规定高风险状况的人。现行职责也适用于执业护士及验光师各自的报告范围；其他可能影响驾驶的状况可适用专业人员酌情报告，并非所有疾病都必须上报。","explanation_en":"The reporting duty concerns people aged 16 or older with prescribed high-risk conditions. Current duties also cover nurse practitioners and optometrists within their respective scopes; other concerns may be reported at professional discretion.","source_url":"https://www.ontario.ca/laws/statute/90h08","source_title":"Highway Traffic Act · Section 203 medical reporting","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-54","group":"LB","section":"rules","topic_zh":"医疗暂停","question_en":"If your licence is suspended for a medical reason, how long does the suspension last?","question_zh":"如果你的驾照因医疗原因被暂停，暂停会持续多久？","options":[{"en":"A fixed 90 days, like an administrative suspension","zh":"固定 90 天，与行政性暂停相同"},{"en":"One year from the date of the doctor's report","zh":"自医生报告之日起一年"},{"en":"Until new medical evidence shows no safety risk","zh":"直到新的医疗证据表明病情不构成安全风险"},{"en":"Until you pass a new vision test and road test","zh":"直到你重新通过视力测试和路考"}],"answer_index":2,"explanation_zh":"医疗暂停没有固定期限，驾照会被暂停到新的医疗证据显示该病情不构成安全风险为止。","explanation_en":"A medical suspension lasts until new medical evidence shows the condition is not a safety risk.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-55","group":"LB","section":"rules","topic_zh":"暂停期驾驶","question_en":"You are convicted of driving while your licence was suspended for a Highway Traffic Act (HTA) offence. Besides fines, how much time is added to your current suspension?","question_zh":"你因在驾照被《公路交通法》（HTA）暂停期间驾驶而被定罪。除罚款外，你现有的暂停期会延长多久？","options":[{"en":"30 days","zh":"30 天"},{"en":"90 days","zh":"90 天"},{"en":"Six months","zh":"六个月"},{"en":"One year","zh":"一年"}],"answer_index":2,"explanation_zh":"在 HTA 暂停期间驾驶被定罪，会被罚款数千元，法院可判最多六个月监禁，现有暂停期还会再加六个月。","explanation_en":"Six months is added to the current suspension.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LB-56","group":"LB","section":"rules","topic_zh":"禁驾令","question_en":"A driver is convicted for the second time of violating a Criminal Code driving prohibition order. What licence suspension applies?","question_zh":"某驾驶者第二次因违反《刑法》禁驾令被定罪，驾照会被暂停多久？","options":[{"en":"Six months","zh":"六个月"},{"en":"One year","zh":"一年"},{"en":"Two years","zh":"两年"},{"en":"A lifetime ban","zh":"终身禁驾"}],"answer_index":2,"explanation_zh":"违反《刑法》禁驾令：首次暂停驾照一年，再次违反暂停两年。","explanation_en":"A subsequent prohibition-order violation brings a two-year suspension.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LB-57","group":"LB","section":"rules","topic_zh":"扣押车辆","question_en":"A driver has an ignition-interlock condition because of administrative impaired-driving suspensions, rather than a criminal conviction. The driver is caught driving without the required device. How long is the vehicle impounded?","question_zh":"一名驾驶人因受损驾驶的行政停牌记录（而非刑事定罪）被加上酒精点火联锁装置条件，却驾驶没有所需装置的车辆。车辆会被扣押多久？","options":[{"en":"24 hours","zh":"24 小时"},{"en":"7 days","zh":"7 天"},{"en":"45 days","zh":"45 天"},{"en":"90 days","zh":"90 天"}],"answer_index":1,"explanation_zh":"因行政停牌而附加的点火联锁装置条件，违规驾驶会扣车7天。若点火联锁条件源于刑事定罪，首次违规扣车45天、第二次90天、第三次及以后180天，不能统一答成7天。","explanation_en":"An administrative-suspension ignition-interlock violation brings seven days of vehicle impoundment. For a criminal-conviction interlock condition, impoundment is 45 days for a first violation,90 for a second and 180 for later violations.","source_url":"https://www.ontario.ca/page/ignition-interlock-program","source_title":"Ontario current guidance · Ignition-interlock impoundment","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-58","group":"LB","section":"rules","topic_zh":"扣押车辆","question_en":"A driver is caught driving while their licence is suspended for a Criminal Code offence. The vehicle is impounded for a minimum of:","question_zh":"某驾驶者在因《刑法》罪行被暂停驾照期间驾驶被查获。车辆至少会被扣押多久？","options":[{"en":"7 days","zh":"7 天"},{"en":"30 days","zh":"30 天"},{"en":"45 days","zh":"45 天"},{"en":"90 days","zh":"90 天"}],"answer_index":2,"explanation_zh":"在《刑法》暂停期间驾驶，车辆至少扣押 45 天；在 HTA 暂停期间驾驶则扣押 7 天。","explanation_en":"Driving under a Criminal Code suspension means at least a 45-day impoundment.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-59","group":"LB","section":"rules","topic_zh":"扣押车辆","question_en":"You lend your car to a relative whose licence is currently suspended for accumulated demerit points. Police catch them driving it. What happens to your car?","question_zh":"你把车借给一名因累计扣分而正被停牌的亲戚，警方查到他开车。你的车会怎样？","options":[{"en":"Nothing happens to it, because you were not the one driving","zh":"不受影响，因为开车的不是你"},{"en":"It is impounded for 7 days; you pay towing and storage","zh":"被扣押 7 天，由你支付拖车和停放费用"},{"en":"It is impounded, but the driver alone pays all the costs","zh":"会被扣押，但所有费用只由开车的亲戚承担"},{"en":"It is impounded only if the relative has a criminal record","zh":"只有亲戚有刑事记录时才会被扣押"}],"answer_index":1,"explanation_zh":"因累计扣分停牌期间驾驶，适用现行扣车7天的规定。借来的车辆同样适用，车主须支付拖车与保管费用。医疗原因及部分其他类别的停牌另有规定，不能把所有HTA停牌一概处理。","explanation_en":"A demerit-suspended driver is within the current seven-day impoundment rule. Borrowed vehicles are covered and the owner must pay towing and storage. Medical and certain other suspension categories have separate rules.","source_url":"https://www.ontario.ca/laws/statute/90h08","source_title":"Highway Traffic Act · Section 55.2 impoundment while suspended","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LB-60","group":"LB","section":"rules","topic_zh":"酒驾与药驾","question_en":"You are impaired and sitting behind the wheel of a parked car, but you have not started to drive. Can you be charged?","question_zh":"你因饮酒或用药而处于能力受损状态，坐在一辆停着的车的驾驶座上，但还没有开始驾驶。你会被起诉吗？","options":[{"en":"No, the vehicle must be in motion","zh":"不会，车辆必须处于行驶状态"},{"en":"Yes, even though you have not started driving","zh":"会，即使你还没有开始驾驶"},{"en":"Only if the engine is running","zh":"只有发动机在运转时才会"},{"en":"Only if you are parked on a public road","zh":"只有停在公共道路上时才会"}],"answer_index":1,"explanation_zh":"在加拿大，受酒精或药物影响、能力受损时驾驶属于犯罪；车辆不必在行驶，只要能力受损时坐在驾驶座上，即使尚未开车也可被起诉。","explanation_en":"You can be charged if impaired behind the wheel even before you start to drive.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-61","group":"LB","section":"rules","topic_zh":"酒精检测","question_en":"A driver cannot give a breath sample, or getting one is impractical. What can the police officer require instead?","question_zh":"司机无法提供呼气样本，或采集呼气样本不可行。警察可以改为要求什么？","options":[{"en":"A blood sample","zh":"血液样本"},{"en":"A signed promise not to drive","zh":"签署不再驾驶的承诺书"},{"en":"Nothing; the driver must be released","zh":"不能要求，只能放行"},{"en":"A doctor's note within seven days","zh":"七天内提交医生证明"}],"answer_index":0,"explanation_zh":"无法提供或不便采集呼气样本时，警察可要求提供血液样本；不配合会被按《刑法》起诉。","explanation_en":"Police can require a blood sample instead of a breath sample.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-62","group":"LB","section":"rules","topic_zh":"药驾","question_en":"Police suspect a driver is impaired by a drug and ask for physical co-ordination tests. The driver refuses. What is the result?","question_zh":"警察怀疑司机受药物影响，要求其做身体协调性测试，司机拒绝。结果会怎样？","options":[{"en":"Nothing, because these tests are voluntary","zh":"没事，因为这些测试是自愿的"},{"en":"The driver is charged under the Criminal Code","zh":"司机会被按《刑法》起诉"},{"en":"The driver gets two demerit points only","zh":"只扣 2 分"},{"en":"The driver gets a written warning only","zh":"只会收到书面警告"}],"answer_index":1,"explanation_zh":"怀疑药驾时，警察可要求做身体协调性测试、药物评估，并提供血液、口腔液或尿液样本；拒绝或不配合会被按《刑法》起诉，驾照还会被立即暂停 90 天。","explanation_en":"Refusing drug-impairment tests leads to a Criminal Code charge.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-63","group":"LB","section":"rules","topic_zh":"药物与酒精","question_en":"What does the handbook warn about combining a drug with alcohol?","question_zh":"关于药物与酒精同时作用，手册有什么警告？","options":[{"en":"It can be dangerous even several days after taking the drug","zh":"即使服药几天之后，仍可能产生危险作用"},{"en":"Any effect wears off within 12 hours of taking the drug","zh":"服药 12 小时内作用就会完全消失"},{"en":"Prescribed drugs never interact with alcohol","zh":"处方药从不与酒精相互作用"},{"en":"A small amount of alcohol is always safe","zh":"少量饮酒总是安全的"}],"answer_index":0,"explanation_zh":"药物与任何量的酒精一起都可能产生危险作用，甚至在服药几天后仍然如此；应咨询医生或药剂师。","explanation_en":"Drugs with any alcohol can be dangerous even days after taking the drug.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-64","group":"LB","section":"rules","topic_zh":"酒驾处罚","question_en":"A driver is convicted again within five years of the previous conviction of driving while their licence is suspended under HTA section 41 or 42 because of a criminal driving offence. Under section 53(1.1), what is the maximum fine for this subsequent offence?","question_zh":"一名司机因驾驶刑事罪名而被按HTA第41或42条停牌，并在前次同类定罪后五年内，再次因停牌期间驾驶被定罪。根据第53(1.1)条，该再犯罪行的最高罚款是多少？","options":[{"en":"$5,000","zh":"5,000 加元"},{"en":"$10,000","zh":"10,000 加元"},{"en":"$25,000","zh":"25,000 加元"},{"en":"$50,000","zh":"50,000 加元"}],"answer_index":3,"explanation_zh":"现行HTA第53(1.1)(b)及53(2.1)条规定：在第41或42条停牌期间驾驶，并于前次同类定罪后五年内再犯，最高罚款50,000加元。这个特定上限不能当作所有酒驾或药驾刑事罪名的统一最高罚款。","explanation_en":"Current HTA section 53(1.1)(b), with the five-year subsequent-offence rule in section 53(2.1), sets a maximum fine of $50,000 for this conviction. That specific maximum must not be generalized to every impaired-driving criminal offence.","source_url":"https://www.ontario.ca/laws/statute/90h08","source_title":"Highway Traffic Act · Section 53(1.1) suspended-driving fines","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-65","group":"LB","section":"rules","topic_zh":"酒驾处罚","question_en":"Impaired driving causing bodily harm can be punished by imprisonment for up to:","question_zh":"酒驾或药驾致人身体伤害，最高可判多少年监禁？","options":[{"en":"2 years","zh":"2 年"},{"en":"5 years","zh":"5 年"},{"en":"10 years","zh":"10 年"},{"en":"14 years","zh":"14 年"}],"answer_index":3,"explanation_zh":"酒驾或药驾致人身体伤害最高可判 14 年监禁；致人死亡最高可判终身监禁。","explanation_en":"Impaired driving causing bodily harm carries up to 14 years in prison.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LB-66","group":"LB","section":"rules","topic_zh":"补救措施","question_en":"Which mandatory remedial program is required for every driver convicted of an impaired-driving Criminal Code offence?","question_zh":"所有因酒驾或药驾等与驾驶相关的《刑法》罪行被定罪的驾驶者，必须完成哪个强制性补救计划？","options":[{"en":"Back on Track","zh":"「Back on Track」补救计划"},{"en":"A driver-improvement interview","zh":"驾驶改进面谈"},{"en":"A senior driver group education session","zh":"高龄驾驶者小组教育课"},{"en":"A defensive-driving course","zh":"防御性驾驶课程"}],"answer_index":0,"explanation_zh":"「Back on Track」是针对酒驾或药驾类《刑法》定罪的强制补救计划；未完成补救要求前，驾照会一直处于暂停状态。","explanation_en":"Back on Track is mandatory for impaired-driving Criminal Code convictions.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-67","group":"LB","section":"rules","topic_zh":"补救措施","question_en":"A driver with no previous alcohol-related convictions is convicted of dangerous driving under the Criminal Code; alcohol was not involved. Which remedial measure must the driver complete?","question_zh":"一名此前没有任何酒精相关定罪的驾驶者，因危险驾驶（与酒精无关）被按《刑法》定罪。他必须完成哪种补救措施？","options":[{"en":"Back on Track","zh":"「Back on Track」补救计划"},{"en":"A Ministry of Transportation driver-improvement interview","zh":"交通部驾驶改进面谈"},{"en":"A remedial alcohol-education program","zh":"补救性酒精教育课程"},{"en":"An ignition interlock program","zh":"酒精点火锁计划"}],"answer_index":1,"explanation_zh":"危险驾驶属于与酒驾无关的《刑法》驾驶罪行，无酒精相关前科者须参加交通部驾驶改进面谈；若《刑法》暂停期满仍未完成，驾照会继续被暂停。「Back on Track」则针对酒驾或药驾类定罪。","explanation_en":"Non-alcohol Criminal Code driving convictions require a driver-improvement interview.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LB-68","group":"LB","section":"rules","topic_zh":"刑事定罪","question_en":"Someone is convicted under the Criminal Code of operating a boat with a BAC over .08. What can happen to their driver's licence?","question_zh":"某人因 BAC 超过 .08 时驾驶船只，被按《刑法》定罪。他的驾照会怎样？","options":[{"en":"Nothing, because a boat is not a car","zh":"没有影响，因为船不是汽车"},{"en":"It will be suspended","zh":"驾照会被暂停"},{"en":"Only demerit points are added","zh":"只会被扣分"},{"en":"Only a boating fine applies","zh":"只会有一笔船只驾驶罚款"}],"answer_index":1,"explanation_zh":"驾驶或控制交通工具（包括船只）时 BAC 超过 .08 而被《刑法》定罪，驾照同样会被暂停。","explanation_en":"A Criminal Code conviction for operating a boat over .08 also suspends your driver's licence.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LB-69","group":"LB","section":"rules","topic_zh":"超速风险","question_en":"On a road posted at 60 km/h or less, colliding at 50 km/h or more over the limit makes the risk of death or serious injury about how many times greater?","question_zh":"在限速 60 km/h 或以下的道路上，以超速 50 km/h 或以上的速度发生碰撞，死亡或重伤风险大约增加到多少倍？","options":[{"en":"About two times","zh":"约 2 倍"},{"en":"About three times","zh":"约 3 倍"},{"en":"Almost five times","zh":"接近 5 倍"},{"en":"Almost eight times","zh":"接近 8 倍"}],"answer_index":3,"explanation_zh":"在限速 60 km/h 或以下的道路上，超速 50 km/h 或以上碰撞的死亡或重伤风险接近 8 倍；在公路上则接近 5 倍。","explanation_en":"On roads posted 60 km/h or less the risk is almost eight times greater.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LB-70","group":"LB","section":"rules","topic_zh":"攻击性驾驶","question_en":"Which of these is identified in the handbook as aggressive driving?","question_zh":"下列哪项被手册列为攻击性驾驶（aggressive driving）？","options":[{"en":"Speeding up to stop another vehicle from passing you","zh":"加速阻止其他车辆超越你"},{"en":"Moving right to let a faster vehicle pass","zh":"向右让行，让更快的车超越"},{"en":"Slowing down as you approach a stale green light","zh":"接近已亮了一段时间的绿灯时减速"},{"en":"Leaving extra space behind a motorcycle","zh":"在摩托车后面留出更多空间"}],"answer_index":0,"explanation_zh":"攻击性驾驶包括：驾车阻止他车超越、故意切入他车前方、街头飙车、特技驾驶，以及大幅超速（限速低于 80 km/h 的道路超速 40 km/h 或以上，或任何道路超速 50 km/h 或以上）。","explanation_en":"Driving to prevent another vehicle from passing is listed as aggressive driving.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-71","group":"LB","section":"rules","topic_zh":"危险驾驶行为","question_en":"Using which of the following while driving on a highway is prohibited in Ontario?","question_zh":"在安省公路上驾驶时，禁止使用下列哪项？","options":[{"en":"Daytime running lights","zh":"日间行车灯"},{"en":"Winter tires","zh":"冬季轮胎"},{"en":"A connected nitrous-oxide system","zh":"已接通的一氧化二氮（俗称氮气加速）系统"},{"en":"Cruise control on a dry, clear road","zh":"在干燥晴朗的路上使用定速巡航"}],"answer_index":2,"explanation_zh":"在公路上驾驶时禁止使用已接通的一氧化二氮加速系统，这是手册在危险驾驶行为部分列出的禁止事项。","explanation_en":"A connected nitrous-oxide system is prohibited while driving on a highway.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-72","group":"LB","section":"rules","topic_zh":"扣分：不遵守信号/停车标志","question_en":"A driver stopped by police is convicted of failing to obey a red traffic light. How many demerit points are added to the driver's record?","question_zh":"某司机闯红灯被警察拦下，并因不遵守交通信号灯被定罪。其驾驶记录上会被扣多少分？","options":[{"en":"2","zh":"2 分"},{"en":"3","zh":"3 分"},{"en":"4","zh":"4 分"},{"en":"6","zh":"6 分"}],"answer_index":1,"explanation_zh":"不遵守停车标志、交通信号灯或铁路道口信号，属于扣 3 分的违章。","explanation_en":"Failing to obey a stop sign, traffic light or railway-crossing signal carries 3 demerit points.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-73","group":"LB","section":"rules","topic_zh":"扣分：超速","question_en":"A fully licensed driver is convicted of stunt driving under HTA section 172 for driving 90 km/h on a road posted 50 km/h. How many demerit points does the stunt-driving offence carry?","question_zh":"一名持完整驾照的驾驶人在限速50公里/小时的道路开到90公里/小时，并按HTA第172条被判特技驾驶（stunt driving）。这项特技驾驶定罪对应多少扣分？","options":[{"en":"3","zh":"3 分"},{"en":"4","zh":"4 分"},{"en":"6","zh":"6 分"},{"en":"7","zh":"7 分"}],"answer_index":2,"explanation_zh":"按HTA第172条定罪的特技驾驶对应6分。限速低于80公里/小时的路段，超速40公里/小时或以上达到特技驾驶速度门槛；若仅按普通超速条款定罪，超速30至49公里/小时属于另一个4分项目，须区分具体罪名。","explanation_en":"A stunt-driving conviction under section 172 carries six points. On a road posted below 80 km/h, driving 40 km/h or more over is a stunt-driving threshold. A speeding-only conviction for 30–49 km/h over is a separate four-point category.","source_url":"https://www.ontario.ca/laws/regulation/940339","source_title":"O. Reg. 339/94 · Table: speeding and stunt-driving points","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-74","group":"LB","section":"rules","topic_zh":"扣分：未让行","question_en":"A driver is convicted of failing to yield the right-of-way. How many demerit points does this offence carry?","question_zh":"某司机因未让出先行权（未让行）被定罪。该违章扣多少分？","options":[{"en":"2","zh":"2 分"},{"en":"4","zh":"4 分"},{"en":"6","zh":"6 分"},{"en":"3","zh":"3 分"}],"answer_index":3,"explanation_zh":"未让出先行权扣 3 分，与闯红灯、在单行道上逆行属于同一级别。","explanation_en":"Failing to yield the right-of-way is a 3-point offence, the same level as running a red light or going the wrong way on a one-way road.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-75","group":"LB","section":"rules","topic_zh":"扣分制度（正式驾照）","question_en":"A fully licensed driver's record goes from 6 to 9 demerit points. What happens?","question_zh":"一名持正式驾照的司机，记录上的扣分从 6 分增加到 9 分。会发生什么？","options":[{"en":"The driver receives a second warning letter","zh":"司机会收到第二封警告信"},{"en":"The licence is suspended for 60 days","zh":"驾照被暂停 60 天"},{"en":"The licence is suspended for 30 days","zh":"驾照被暂停 30 天"},{"en":"The driver receives a first warning letter","zh":"司机收到第一封警告信"}],"answer_index":0,"explanation_zh":"正式驾照司机：扣分达 6 分收到第一封警告信，9 分收到第二封警告信，15 分才暂停驾照 30 天。新手司机（G1/G2）达到 9 分才会被暂停 60 天。","explanation_en":"A fully licensed driver gets a warning letter at 6 points, a second warning letter at 9 and a 30-day suspension at 15.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-76","group":"LB","section":"rules","topic_zh":"扣分制度（新手）","question_en":"A G2 driver completes a first 60-day demerit-point suspension. An offence committed within two years after it ends brings the record to 9 points again. How long is the subsequent demerit suspension?","question_zh":"一名G2驾驶人首次扣分停牌60天期满后，在其后两年内发生的违章使其再次累计到9分。这次再次扣分停牌多久？","options":[{"en":"Another 60-day suspension","zh":"再次暂停 60 天"},{"en":"A six-month licence suspension","zh":"驾照被暂停六个月"},{"en":"A 30-day suspension","zh":"暂停 30 天"},{"en":"Only a third warning letter","zh":"只会收到第三封警告信"}],"answer_index":1,"explanation_zh":"导致再次停牌的违章发生于前次停牌结束后两年内时，再次新手扣分停牌为六个月。首次停牌后记录上的扣分降为4分；具体再次处罚须符合上述时间条件。","explanation_en":"The subsequent novice demerit suspension is six months when the triggering offence occurs within two years after the prior suspension expires. After the first suspension, the points are reduced to four.","source_url":"https://www.ontario.ca/laws/regulation/940339","source_title":"O. Reg. 339/94 · Section 17 subsequent novice suspension","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-77","group":"LB","section":"rules","topic_zh":"扣分：铁路道口栏杆","question_en":"A driver goes around a railway-crossing gate while it is down. Besides being dangerous, how many demerit points does this offence carry?","question_zh":"某司机在铁路道口栏杆放下时绕过栏杆通行。除了危险之外，这项违章还会被扣多少分？","options":[{"en":"2","zh":"2 分"},{"en":"5","zh":"5 分"},{"en":"3","zh":"3 分"},{"en":"6","zh":"6 分"}],"answer_index":2,"explanation_zh":"穿过、绕过或从下方钻过铁路道口栏杆扣 3 分。5 分是针对公交车司机在无防护的铁路道口未停车。","explanation_en":"Driving through, around or under a railway-crossing barrier carries 3 demerit points; 5 points applies to bus drivers who fail to stop at unprotected crossings.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-78","group":"LB","section":"rules","topic_zh":"扣分：不当开车门","question_en":"Which of these offences carries the most demerit points?","question_zh":"下列违章中，哪一项扣分最多？","options":[{"en":"Making an improper right turn","zh":"右转方式不当"},{"en":"Driving unnecessarily slowly","zh":"无故慢速行驶"},{"en":"Failing to signal before changing lanes","zh":"变道前未打转向灯"},{"en":"Opening a vehicle door improperly","zh":"不当打开车门"}],"answer_index":3,"explanation_zh":"不当打开车门扣 3 分；右转不当、无故慢速行驶和未打信号各扣 2 分。开车门前要先确认后方没有来车和骑车人。","explanation_en":"Improper opening of a vehicle door carries 3 demerit points, while an improper right turn, unnecessary slow driving and failing to signal carry 2.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-79","group":"LB","section":"rules","topic_zh":"扣分：未切换近光灯","question_en":"At night, a driver keeps the high beams on while meeting an oncoming car and is convicted of failing to lower the headlight beam. How many demerit points apply?","question_zh":"夜间会车时，某司机一直开着远光灯，被以未降低前照灯光束（未切换近光灯）定罪。会被扣多少分？","options":[{"en":"2","zh":"2 分"},{"en":"3","zh":"3 分"},{"en":"4","zh":"4 分"},{"en":"None; it is a fine only","zh":"不扣分，只罚款"}],"answer_index":0,"explanation_zh":"未降低前照灯光束扣 2 分。距对向来车 150 米以内必须切换为近光灯。","explanation_en":"Failing to lower your headlight beam is a 2-point offence; switch to low beams within 150 m of an oncoming vehicle.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-80","group":"LB","section":"rules","topic_zh":"扣分：拖拽人员","question_en":"Which of these offences carries the fewest demerit points?","question_zh":"下列违章中，哪一项扣分最少？","options":[{"en":"Failing to yield the right-of-way","zh":"未让出先行权"},{"en":"Towing someone on a toboggan","zh":"用车辆拖拽坐在雪橇上的人"},{"en":"Following another vehicle too closely","zh":"跟车过近"},{"en":"Going the wrong way on a one-way road","zh":"在单行道上逆行"}],"answer_index":1,"explanation_zh":"拖拽人员（如坐雪橇、骑自行车或滑雪的人）扣 2 分；未让行和单行道逆行各扣 3 分，跟车过近扣 4 分。","explanation_en":"Towing people on toboggans, bicycles or skis carries 2 points, fewer than failing to yield or wrong-way driving (3) or following too closely (4).","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-81","group":"LB","section":"rules","topic_zh":"扣车：酒精浓度超标","question_en":"A driver is caught with a BAC of 0.08% or more while driving a car borrowed from a friend. Besides the 90-day licence suspension, what happens to the car?","question_zh":"一名司机驾驶朋友借出的车，被查出BAC达到0.08%或以上。除了停牌90天，这辆车会怎样？","options":[{"en":"It is impounded for 7 days","zh":"被扣押 7 天"},{"en":"Nothing happens, because the driver does not own it","zh":"不受影响，因为司机不是车主"},{"en":"It is impounded for a minimum of 45 days","zh":"至少被扣押 45 天"},{"en":"It is held until the criminal case is over","zh":"一直扣押到刑事案件结束"}],"answer_index":0,"explanation_zh":"BAC达到0.08%或以上，或拒绝规定的检测，现行受损驾驶处罚包括扣车7天。借来的或租来的车辆同样适用，车主须支付拖车与保管费才能取回车辆；司机还会受到其他处罚。","explanation_en":"The current impairment penalties include seven-day impoundment at BAC0.08% or more or for refusing the required tests. Borrowed and rented vehicles are also covered; the owner must pay towing and storage before release.","source_url":"https://www.ontario.ca/page/impaired-driving","source_title":"Ontario current guidance · Impairment impoundment","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-82","group":"LB","section":"rules","topic_zh":"受损驾驶致死","question_en":"What is the maximum sentence for impaired driving causing death?","question_zh":"受酒精或药物影响驾驶（受损驾驶）致人死亡，最高可判什么刑罚？","options":[{"en":"Up to 14 years in prison","zh":"最高 14 年监禁"},{"en":"Life imprisonment","zh":"终身监禁"},{"en":"Up to 10 years in prison","zh":"最高 10 年监禁"},{"en":"Up to 5 years in prison","zh":"最高 5 年监禁"}],"answer_index":1,"explanation_zh":"受损驾驶致人死亡可判终身监禁；致人身体伤害最高可判 14 年。","explanation_en":"Impaired driving causing death can be punished by life imprisonment, compared with up to 14 years for causing bodily harm.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-83","group":"LB","section":"rules","topic_zh":"驾照注销","question_en":"You pay your licence fee by cheque, and your bank does not honour the cheque. What happens to your driver's licence?","question_zh":"你用支票支付驾照费用，但银行拒付了这张支票。你的驾照会怎样？","options":[{"en":"It is suspended for 30 days","zh":"被暂停 30 天"},{"en":"You receive 2 demerit points","zh":"被扣 2 分"},{"en":"It is cancelled","zh":"被注销"},{"en":"It stays valid until the renewal date","zh":"在续期日之前仍然有效"}],"answer_index":2,"explanation_zh":"用于支付驾照费用的支票被银行拒付，驾照会被注销，而不只是暂停。","explanation_en":"A licence is cancelled if your cheque for licence fees is not honoured by your bank.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-84","group":"LB","section":"rules","topic_zh":"驾照注销","question_en":"Which of these results in your licence being cancelled, rather than suspended?","question_zh":"下列哪种情况会导致驾照被注销，而不是被暂停？","options":[{"en":"Not paying a court-ordered traffic fine","zh":"未缴纳法院判处的交通罚款"},{"en":"A novice driver reaching 9 demerit points","zh":"新手司机累计扣分达到 9 分"},{"en":"Violating a G1 licence condition","zh":"违反 G1 驾照的限制条件"},{"en":"Failing a driver's re-examination","zh":"驾驶重新考核未通过"}],"answer_index":3,"explanation_zh":"驾驶重新考核不及格、暂停后未缴恢复费或行政罚款、支票被拒付、自愿交回驾照，都会导致驾照被注销；其他三项会导致暂停。","explanation_en":"Failing a driver's re-examination leads to cancellation, while the other situations lead to suspensions.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-85","group":"LB","section":"rules","topic_zh":"刑事定罪：补救要求","question_en":"A driver's one-year Criminal Code suspension has ended, but the driver has not completed the required remedial program. What is the status of the licence?","question_zh":"某司机因《刑法》驾驶罪名被暂停驾照一年，期限已满，但尚未完成规定的补救项目。驾照现在是什么状态？","options":[{"en":"It stays suspended until the program is completed","zh":"在完成项目之前仍处于暂停状态"},{"en":"It is reinstated, with 6 demerit points added","zh":"恢复有效，但加扣 6 分"},{"en":"It is reinstated, but the program must be done within 60 days","zh":"恢复有效，但须在 60 天内完成项目"},{"en":"It is downgraded to a G1 licence","zh":"降级为 G1 驾照"}],"answer_index":0,"explanation_zh":"因《刑法》定罪被暂停的驾照，在完成补救要求（如 Back on Track 项目或驾驶改进面谈）之前一直处于暂停状态，即使暂停期已满。","explanation_en":"After a Criminal Code suspension, the licence stays suspended until the remedial requirements are completed.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/other-ways-lose-your-licence","source_title":"MTO 手册 · Other ways to lose your licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-86","group":"LB","section":"rules","topic_zh":"刑事定罪：暂停期","question_en":"Repeated criminal impaired-driving convictions within the applicable look-back period can ultimately lead to which licence penalty?","question_zh":"在适用的追溯期间内，多次因受损驾驶被刑事定罪，最终可能导致哪种驾照处罚？","options":[{"en":"A maximum suspension of two years","zh":"最长暂停两年"},{"en":"A lifetime ban from driving","zh":"终身禁驾"},{"en":"A maximum suspension of five years","zh":"最长暂停五年"},{"en":"Only higher fines, with no longer suspension","zh":"只会提高罚款，暂停期不变"}],"answer_index":1,"explanation_zh":"多次受损驾驶刑事定罪可导致终身停牌。现行规定会区分定罪次数、追溯期间，以及是否属于致人死亡的受损驾驶，不能统一概括成首次固定停牌一年。","explanation_en":"Repeated impaired-driving convictions can lead to a lifetime licence suspension. Current rules distinguish conviction counts, look-back periods and impaired driving causing death.","source_url":"https://www.ontario.ca/page/impaired-driving","source_title":"Ontario current guidance · Repeated criminal convictions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-87","group":"LB","section":"rules","topic_zh":"80岁以上司机","question_en":"According to the handbook, what must a driver aged 80 or older complete at the licence-renewal appointment?","question_zh":"根据手册，80岁或以上的司机在驾照续期预约时必须完成什么？","options":[{"en":"A written knowledge test and a road test","zh":"笔试和路考"},{"en":"A full medical exam by their family doctor","zh":"由其家庭医生进行全面体检"},{"en":"A vision test and a five-minute screening exercise","zh":"视力测试和一项五分钟的筛查练习"},{"en":"A hearing test and a road test with an examiner","zh":"听力测试和由考官主持的路考"}],"answer_index":2,"explanation_zh":"80岁及以上司机每两年续期一次，预约时须完成视力测试和五分钟筛查练习；之后可能还需要路考，或提交医疗、视力资料。","explanation_en":"Drivers 80 or older must complete a vision test and a five-minute screening exercise at the renewal appointment.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-88","group":"LB","section":"rules","topic_zh":"80岁以上司机","question_en":"What does a driver aged 80 or older pay to complete the licence-renewal requirements?","question_zh":"80岁或以上的司机办理驾照续期的各项要求，需要支付什么费用？","options":[{"en":"The renewal fee plus a fee for the screening exercise","zh":"续期费加筛查练习费"},{"en":"The renewal fee plus a vision-test fee","zh":"续期费加视力测试费"},{"en":"Nothing at all; renewal is free from age 80","zh":"完全免费，80岁起续期不收费"},{"en":"Only the licence-renewal fee","zh":"只需支付驾照续期费"}],"answer_index":3,"explanation_zh":"各项续期要求（视力测试、筛查练习等）都不收费，只需支付驾照续期费。","explanation_en":"There is no charge for the renewal requirements for drivers 80 or older; only the licence-renewal fee is paid.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-89","group":"LB","section":"rules","topic_zh":"重新取得资格","question_en":"Your G2 licence will expire soon, and you have not yet passed the road test for a full G. How can you keep your G2?","question_zh":"你的G2驾照即将到期，而你还没有通过G级路考。怎样才能保留G2驾照？","options":[{"en":"Pass a test and pay the five-year licensing fee","zh":"通过一项考试并缴纳五年驾照费"},{"en":"Pay a late-renewal fee; no test is needed","zh":"缴纳逾期续期费即可，无需考试"},{"en":"Do nothing; novice licences renew automatically","zh":"什么都不用做，新手驾照会自动续期"},{"en":"Give up the G2 and start again at G1 right away","zh":"放弃G2，立即从G1重新开始"}],"answer_index":0,"explanation_zh":"G1、G2或M2驾照即将到期而尚未完成分级考照时，可通过一项考试并缴纳五年驾照费来保留同级驾照，这称为重新取得资格（requalification）。","explanation_en":"Novice drivers whose licence is about to expire can requalify by passing a test and paying the five-year licensing fee.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-90","group":"LB","section":"rules","topic_zh":"重新取得资格","question_en":"Your G1 licence expired before you completed graduated licensing or requalified. What must you do to drive again?","question_zh":"你的G1驾照在完成分级考照或重新取得资格之前就已过期。要想再次驾驶，必须怎么做？","options":[{"en":"Nothing; a G1 stays valid while you are still learning","zh":"什么都不用做，G1在学车期间一直有效"},{"en":"Reapply for a Level One licence","zh":"重新申请第一级（G1）驾照"},{"en":"Drive on the expired licence for up to 60 days, then renew","zh":"可用过期驾照继续开60天，然后再续期"},{"en":"Take only the road test for a G2","zh":"只需参加G2路考"}],"answer_index":1,"explanation_zh":"如果在G1、G2或M2驾照到期前既未完成分级考照，也未重新取得资格，你就没有驾照，必须重新申请第一级驾照。","explanation_en":"If a G1, G2 or M2 expires before you finish or requalify, you have no licence and must reapply for Level One.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-91","group":"LB","section":"rules","topic_zh":"更改地址","question_en":"You moved and reported your new address. How much does the new driver's licence cost?","question_zh":"你搬家后报告了新地址。新的驾照需要多少费用？","options":[{"en":"The full licence-renewal fee","zh":"全额驾照续期费"},{"en":"Half of the five-year licensing fee","zh":"五年驾照费的一半"},{"en":"Nothing; there is no charge","zh":"不收费"},{"en":"A small replacement-card fee","zh":"少量补卡费"}],"answer_index":2,"explanation_zh":"因更改姓名或地址而换发新驾照不收费。须在六天内通知交通部；收到新驾照后销毁旧驾照，开车时随身携带新驾照。","explanation_en":"There is no charge for a new licence issued because of a name or address change.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-92","group":"LB","section":"rules","topic_zh":"更改姓名","question_en":"Your legal name has changed. Which statement about your driver's licence is correct?","question_zh":"你的法定姓名已经变更。关于你的驾照，下列哪项说法正确？","options":[{"en":"Keep using your old licence until it expires","zh":"继续使用旧驾照直到过期"},{"en":"Update it online; no new card is issued","zh":"在网上更新即可，不会发新卡"},{"en":"You must retake the vision and knowledge tests","zh":"必须重新参加视力测试和笔试"},{"en":"You need a new licence, and a new photo will be taken","zh":"需要换新驾照，并会重新拍照"}],"answer_index":3,"explanation_zh":"更改姓名需要换新驾照：带上所需证件和现有驾照到办理处，会重新拍照，并先拿到临时驾照，开车时须随身携带。","explanation_en":"A name change requires a new licence, and a new photo is taken.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-93","group":"LB","section":"rules","topic_zh":"酒驾处罚（现行）","question_en":"Under Ontario's current roadside rules, a fully licensed driver is caught in the warn range(0.05% to 0.079%) for the first time. Besides a 7-day licence suspension, what applies?","question_zh":"根据安省现行路边处罚，一名持完整驾照的司机首次被查出BAC处于警告范围（0.05%至0.079%）。除了停牌7天，还会受到什么处罚？","options":[{"en":"A 16-hour treatment program and a $350 penalty","zh":"16小时治疗项目和350加元行政罚款"},{"en":"A 6-month ignition interlock condition and a $450 penalty","zh":"6个月酒精点火联锁装置条件和450加元行政罚款"},{"en":"A 7-day vehicle impoundment and a $550 penalty","zh":"车辆扣押7天和550加元行政罚款"},{"en":"An 8-hour education course and a $250 penalty","zh":"8小时教育课程和250加元行政罚款"}],"answer_index":3,"explanation_zh":"现行首次警告范围违规，除当场停牌7天外，还须完成8小时教育课程并缴纳250加元行政罚款。手册旧段落的3天已过时；商用驾驶人的零容忍处罚须另行区分。","explanation_en":"The current first warn-range occurrence also requires an 8-hour education course and a $250 administrative penalty. These are current roadside rules; the older handbook's three-day figure is superseded.","source_url":"https://www.ontario.ca/page/impaired-driving","source_title":"Ontario current guidance · Roadside impaired-driving penalties","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LB-94","group":"LB","section":"rules","topic_zh":"酒驾处罚（现行）","question_en":"Under Ontario's current rules, what applies to a third warn-range occurrence or a third zero-alcohol violation by a young or novice driver?","question_zh":"按安省现行规定，第三次警告范围违规，或年轻/新手驾驶人第三次违反零酒精规定，会受到什么处罚？","options":[{"en":"30-day suspension, treatment, 6-month interlock, $450","zh":"暂停30天、治疗项目、6个月酒精点火联锁装置、450加元"},{"en":"14-day suspension, 16-hour treatment program, $350","zh":"暂停14天、16小时治疗项目、350加元"},{"en":"90-day suspension, 7-day vehicle impoundment, $550","zh":"暂停90天、车辆扣押7天、550加元"},{"en":"7-day suspension, 8-hour education course, $250","zh":"暂停7天、8小时教育课程、250加
