元"}],"answer_index":0,"explanation_zh":"上述类别的第三次违规，现行处罚包括停牌30天、16小时治疗项目、6个月点火联锁装置条件及450加元行政罚款。商用驾驶人的零容忍规定属于另一类别；BAC达到0.08%或以上或拒绝规定检测也适用不同处罚。","explanation_en":"The current third occurrence in these categories brings 30-day suspension,16-hour treatment, a six-month ignition-interlock condition and a $450 administrative penalty. Commercial-driver zero-tolerance rules are a separate category.","source_url":"https://www.ontario.ca/page/impaired-driving","source_title":"Ontario current guidance · Roadside impaired-driving penalties","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RA-01","group":"RA","section":"rules","topic_zh":"防御性驾驶","question_en":"According to the handbook, defensive driving is based on which three ideas?","question_zh":"根据驾驶手册，防御性驾驶建立在哪三个理念之上？","options":[{"en":"Speed, braking and steering","zh":"车速、制动和转向"},{"en":"Patience, courtesy and confidence","zh":"耐心、礼让和自信"},{"en":"Visibility, space and communication","zh":"可见性、空间和沟通"},{"en":"Mirrors, signals and the horn","zh":"后视镜、转向灯和喇叭"}],"answer_index":2,"explanation_zh":"手册指出防御性驾驶（defensive driving）建立在三个理念上：可见性（看清路况，也让别人看见你）、管理车辆周围的空间、与其他道路使用者沟通。","explanation_en":"Defensive driving rests on visibility, space and communication.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/safe-and-responsible-driving","source_title":"MTO 手册 · Safe and Responsible Driving","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-02","group":"RA","section":"rules","topic_zh":"观察与后视镜","question_en":"While driving along, about how often should you check your mirrors?","question_zh":"正常行驶时，大约每隔多久应查看一次后视镜？","options":[{"en":"Every 30 seconds or so","zh":"大约每 30 秒"},{"en":"Every five seconds or so","zh":"大约每 5 秒"},{"en":"Only when you are about to change lanes","zh":"只在准备变道时"},{"en":"Every minute or so","zh":"大约每分钟"}],"answer_index":1,"explanation_zh":"手册要求养成前后左右观察的习惯：大约每 5 秒查看一次后视镜，并转头越肩查看盲区。","explanation_en":"Check your mirrors about every five seconds.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-along","source_title":"MTO 手册 · Driving along","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-03","group":"RA","section":"rules","topic_zh":"防御性驾驶","question_en":"Where does the handbook say the greatest risk of a collision is, and what should you do about it?","question_zh":"手册认为发生碰撞的最大风险来自哪个方向？应该怎么做？","options":[{"en":"Behind you, so watch your rear-view mirror constantly","zh":"来自后方，所以要一直盯着车内后视镜"},{"en":"To your left, so always drive in the right lane","zh":"来自左侧，所以要一直在右侧车道行驶"},{"en":"To your right, so stay away from the curb lane","zh":"来自右侧，所以要远离路边车道"},{"en":"In front of you, so stay well back","zh":"来自前方，所以要与前车保持足够距离"}],"answer_index":3,"explanation_zh":"手册指出碰撞的最大风险在车辆前方，因此要在前、后、两侧都留出缓冲空间，尤其要与前车保持足够距离。","explanation_en":"The greatest collision risk is in front, so stay well back.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/safe-and-responsible-driving","source_title":"MTO 手册 · Safe and Responsible Driving","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-04","group":"RA","section":"rules","topic_zh":"安全责任","question_en":"Another driver makes an error and a collision with your vehicle follows. Can you still be found responsible?","question_zh":"另一名司机犯了错，随后与你的车发生碰撞。你是否仍可能被认定负有责任？","options":[{"en":"Yes, if you could have avoided it","zh":"可能，如果你本可以避免这次碰撞"},{"en":"No, only the driver who broke a rule can be responsible","zh":"不会，只有违规的一方才负责"},{"en":"Only if you were driving above the speed limit","zh":"只有在你超速时才会"},{"en":"Only if you hold a G1 or G2 licence","zh":"只有你持 G1 或 G2 驾照时才会"}],"answer_index":0,"explanation_zh":"手册强调每个人都有责任避免碰撞；即使是别人做错了，只要你本来可以采取措施避免碰撞，你也可能被认定负有责任。","explanation_en":"Everyone must avoid collisions; you can be responsible if you could have prevented it.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/safe-and-responsible-driving","source_title":"MTO 手册 · Safe and Responsible Driving","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-05","group":"RA","section":"rules","topic_zh":"违法后果","question_en":"If you are caught driving while your licence is suspended, what may also happen to the vehicle?","question_zh":"如果你在驾照被暂停期间驾车被查获，车辆还可能面临什么处理？","options":[{"en":"Nothing; the penalties apply only to the driver","zh":"不受影响，处罚只针对司机"},{"en":"It may only be driven in daylight for one year","zh":"一年内只能在白天驾驶"},{"en":"It may be impounded","zh":"可能被扣押（impound）"},{"en":"It must be re-registered in another person's name","zh":"必须过户到他人名下"}],"answer_index":2,"explanation_zh":"手册指出，驾照被暂停期间驾车被查获，车辆可能被扣押；违反交通法还可能被罚款、入狱或失去驾照。","explanation_en":"Driving while suspended can get your vehicle impounded.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/safe-and-responsible-driving","source_title":"MTO 手册 · Safe and Responsible Driving","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-06","group":"RA","section":"rules","topic_zh":"沟通","question_en":"At an intersection, what is a good way to make sure pedestrians, cyclists and other drivers have seen you?","question_zh":"在路口，怎样做能确认行人、骑车人和其他司机已经注意到你？","options":[{"en":"Make eye contact with them","zh":"与他们进行眼神交流"},{"en":"Flash your high beams at them","zh":"对他们闪远光灯"},{"en":"Turn on your hazard lights","zh":"打开危险警示灯（双闪）"},{"en":"Rev your engine","zh":"轰油门"}],"answer_index":0,"explanation_zh":"手册要求与其他道路使用者沟通：在路口与行人、骑车人和司机进行眼神交流，并在减速、停车、转弯或变道时打信号；需要引起他人注意时可以按喇叭。","explanation_en":"Make eye contact at intersections so others know you see them.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/safe-and-responsible-driving","source_title":"MTO 手册 · Safe and Responsible Driving","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-07","group":"RA","section":"rules","topic_zh":"疲劳驾驶","question_en":"Even if a tired driver stays awake, how does fatigue affect their driving?","question_zh":"即使疲劳的司机没有睡着，疲劳会怎样影响驾驶？","options":[{"en":"It has little effect as long as the driver stays awake","zh":"只要没睡着，影响不大"},{"en":"It only matters after midnight","zh":"只有午夜之后才有影响"},{"en":"It sharpens attention because the driver tries harder","zh":"司机会更努力，所以注意力反而更集中"},{"en":"Thinking slows and the driver may miss things","zh":"思维变慢，可能漏看路况"}],"answer_index":3,"explanation_zh":"手册指出，即使没睡着，疲劳也会降低驾驶能力：思考变慢、看漏东西，紧急时可能做错决定或反应不够快。所以疲劳时不要开车。","explanation_en":"Fatigue slows thinking and makes you miss things even if you stay awake.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-08","group":"RA","section":"rules","topic_zh":"情绪与身心状态","question_en":"You have just had a heated argument and feel very angry. What does the handbook advise about driving?","question_zh":"你刚和别人激烈争吵，非常生气。手册对此时开车有什么建议？","options":[{"en":"Drive, but stay at least 10 km/h under the limit","zh":"可以开，但车速比限速低至少 10 km/h"},{"en":"Drive, but only on roads you know well","zh":"可以开，但只走熟悉的路"},{"en":"Don't drive while you feel this way","zh":"此时不要开车"},{"en":"Drive with loud music on to help you calm down","zh":"开车时把音乐开大来平复心情"}],"answer_index":2,"explanation_zh":"手册明确指出，心烦或生气时不要开车，因为强烈的情绪会降低你思考和快速反应的能力。","explanation_en":"Don't drive when upset or angry; strong emotions slow thinking and reactions.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-09","group":"RA","section":"rules","topic_zh":"驾驶辅助技术","question_en":"Your vehicle has lane-keeping assist and automatic emergency braking. Who is responsible for the driving tasks when these systems are on?","question_zh":"你的车配有车道保持辅助和自动紧急制动。这些系统开启时，由谁对驾驶任务负责？","options":[{"en":"You, the driver, at all times","zh":"始终是你（司机）"},{"en":"The system, as long as it is switched on","zh":"系统负责，只要它处于开启状态"},{"en":"The vehicle manufacturer","zh":"汽车制造商"},{"en":"The driver and the system share it equally","zh":"司机与系统各负一半责任"}],"answer_index":0,"explanation_zh":"无论车辆配备什么辅助技术，司机都要留意其运行，在意外情况下随时准备接管，并始终对所有驾驶任务负责。","explanation_en":"Whatever assist technology you have, you remain responsible for all driving tasks.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-10","group":"RA","section":"rules","topic_zh":"驾驶姿势","question_en":"When you are seated properly, you should be able to see the ground how far in front of your vehicle?","question_zh":"坐姿正确时，你应该能看到车前方多远处的地面？","options":[{"en":"1 metre","zh":"1 米"},{"en":"4 metres","zh":"4 米"},{"en":"10 metres","zh":"10 米"},{"en":"15 metres","zh":"15 米"}],"answer_index":1,"explanation_zh":"手册要求座位要足够高，能越过方向盘和发动机罩，看到车前 4 米处的地面；必要时可垫一个硬垫子。","explanation_en":"Sit high enough to see the ground 4 metres in front of the vehicle.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-11","group":"RA","section":"rules","topic_zh":"驾驶姿势","question_en":"What simple check does the handbook suggest to confirm your seat is the right distance from the pedals?","question_zh":"手册建议用什么简单方法确认座椅与踏板的距离合适？","options":[{"en":"Press the brake pedal all the way down with your leg completely straight","zh":"腿完全伸直，把制动踏板踩到底"},{"en":"Make sure your knees touch the bottom of the steering wheel","zh":"确认膝盖碰到方向盘底部"},{"en":"Lean back against the headrest and see if your toes reach the pedals","zh":"向后靠在头枕上，看脚尖能否够到踏板"},{"en":"Rest your feet flat under the brake pedal without stretching","zh":"不用伸腿就能把双脚平放在制动踏板下方的地板上"}],"answer_index":3,"explanation_zh":"身体坐直、手肘微弯；如果不用伸腿就能把双脚平放在制动踏板下方的地板上，说明座椅位置合适，这也能让你操控车辆时更稳定。","explanation_en":"If your feet rest flat under the brake pedal without stretching, you are seated properly.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-12","group":"RA","section":"rules","topic_zh":"头枕","question_en":"How should an adjustable head restraint (headrest) be set?","question_zh":"可调节的头枕应该怎样调整？","options":[{"en":"As low as it goes, so it supports your neck","zh":"调到最低，用来托住脖子"},{"en":"So its top is level with your shoulders","zh":"使头枕顶部与肩膀齐平"},{"en":"So its middle is directly behind the back of your head","zh":"使后脑勺正对头枕的中部"},{"en":"Removed, if it blocks your view through the rear window","zh":"如果挡住后窗视线就拆掉"}],"answer_index":2,"explanation_zh":"头枕的作用是在碰撞时保护头颈，应调到合适高度，使后脑勺正对头枕的中部。","explanation_en":"The back of your head should be directly in front of the middle of the headrest.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-13","group":"RA","section":"rules","topic_zh":"盲区","question_en":"In most vehicles, where are the blind spots located?","question_zh":"大多数车辆的盲区位于哪里？","options":[{"en":"To the back left and back right of the vehicle","zh":"车辆的左后方和右后方"},{"en":"Directly in front of the bumper","zh":"车头保险杠正前方"},{"en":"Directly behind the centre of the rear window","zh":"后窗中央的正后方"},{"en":"Beside the front wheels","zh":"前轮两侧"}],"answer_index":0,"explanation_zh":"手册指出大多数车辆的盲区在左后方和右后方；行人或骑车人在盲区内时你可能看不到，有些车的盲区甚至大到能容下一整辆车。","explanation_en":"Blind spots in most vehicles are to the back left and back right.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-14","group":"RA","section":"rules","topic_zh":"盲区","question_en":"What is the only way to make sure nothing is in your blind spots?","question_zh":"要确认盲区里什么都没有，唯一的方法是什么？","options":[{"en":"Look carefully in both side mirrors","zh":"仔细查看两侧外后视镜"},{"en":"Rely on the interior rear-view mirror","zh":"依靠车内后视镜"},{"en":"Turn on your signal and wait for others to react","zh":"打开转向灯，等其他车辆反应"},{"en":"Turn your head and do a shoulder check","zh":"转头越肩查看（shoulder check）"}],"answer_index":3,"explanation_zh":"外后视镜的视角很窄，只有转头越肩查看（shoulder check）才能确认盲区里没有车辆、骑车人或行人。","explanation_en":"Side mirrors show narrow angles; only a shoulder check clears blind spots.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-15","group":"RA","section":"rules","topic_zh":"后视镜调整","question_en":"How should you adjust the interior rear-view mirror?","question_zh":"车内后视镜应该怎样调整？","options":[{"en":"So it mainly shows the passengers in the back seat","zh":"主要用来看后排乘客"},{"en":"So its centre shows the centre of the rear window","zh":"使镜面中心映出后窗中心"},{"en":"So it shows the left side of the rear window and the left lane","zh":"对准后窗左侧和左侧车道"},{"en":"Tilted down to show the road just behind the bumper","zh":"向下倾斜，看后保险杠后方的路面"}],"answer_index":1,"explanation_zh":"车内后视镜应调到镜面中心映出后窗中心，这样能看到车辆正后方，并进一步减少盲区。","explanation_en":"The interior mirror's centre should show the centre of the rear window.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-16","group":"RA","section":"rules","topic_zh":"后视镜调整","question_en":"How should you set the right outside mirror to reduce blind spots?","question_zh":"为减少盲区，右侧外后视镜应该怎样调整？","options":[{"en":"Sit normally and angle it down toward the curb","zh":"正常坐姿，把镜子向下对准路边"},{"en":"Lean toward the right window and set it so half the mirror shows your car","zh":"身体靠向右侧车窗，调到镜面一半是自己的车身"},{"en":"Lean to the centre of the car and set it to just show your car's rear","zh":"身体向车辆中间倾斜，调到刚好能看到自己车的后部"},{"en":"Sit normally and set it to match the view in your interior mirror","zh":"正常坐姿，调到与车内后视镜看到的画面相同"}],"answer_index":2,"explanation_zh":"调右侧外后视镜时，身体向车内中间倾斜，调到刚好能看到自己车尾；调左侧外后视镜则靠向左车窗。各镜子的视野应尽量不重叠。","explanation_en":"Lean to the vehicle's centre and set the right mirror so you just see your car's rear.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RA-17","group":"RA","section":"rules","topic_zh":"安全带","question_en":"A driver who does not wear a seatbelt can be fined and will also receive how many demerit points?","question_zh":"司机不系安全带除了会被罚款，还会被扣几分？","options":[{"en":"None; it is a fine only","zh":"不扣分，只罚款"},{"en":"Three","zh":"3 分"},{"en":"Two","zh":"2 分"},{"en":"Four","zh":"4 分"}],"answer_index":2,"explanation_zh":"司机自己不系安全带，可被罚款并扣 2 分（demerit points）。","explanation_en":"An unbuckled driver can be fined and gets two demerit points.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-18","group":"RA","section":"rules","topic_zh":"安全带","question_en":"Who is legally responsible for making sure a 14-year-old passenger is properly buckled up?","question_zh":"确保一名 14 岁乘客正确系好安全带，法律责任在谁？","options":[{"en":"The driver","zh":"司机"},{"en":"The passenger, because they are over 12","zh":"乘客本人，因为已满 12 岁"},{"en":"A parent, if one is riding in the vehicle","zh":"孩子的父母（如果在车上）"},{"en":"The registered owner of the vehicle","zh":"车辆的登记车主"}],"answer_index":0,"explanation_zh":"司机必须确保所有 16 岁以下的乘客正确使用安全带、儿童安全座椅或增高座椅，否则司机可被罚款和扣分。","explanation_en":"Drivers must ensure every passenger under 16 is properly restrained.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-19","group":"RA","section":"rules","topic_zh":"G1 限制","question_en":"A G1 driver is behind the wheel. Who may sit in the front passenger seat?","question_zh":"由 G1 司机驾驶时，谁可以坐在副驾驶座？","options":[{"en":"Any adult who wears a seatbelt","zh":"任何系好安全带的成年人"},{"en":"Only the accompanying driver","zh":"只能是陪同驾驶人（accompanying driver）"},{"en":"Any passenger aged 16 or older","zh":"任何 16 岁及以上的乘客"},{"en":"Any member of the driver's family","zh":"司机的任何家庭成员"}],"answer_index":1,"explanation_zh":"G1 司机只允许陪同驾驶人坐在前排副驾驶位置，而且必须为其配备安全带。","explanation_en":"A G1 driver may only have the accompanying driver in the front seat.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-20","group":"RA","section":"rules","topic_zh":"新手司机","question_en":"A novice driver carries more passengers than there are working seatbelts. What penalty can follow?","question_zh":"新手司机载客人数超过车上可用安全带的数量，可能受到什么处罚？","options":[{"en":"A warning only, for a first offence","zh":"初犯仅警告"},{"en":"A 7-day licence suspension","zh":"驾照被暂停 7 天"},{"en":"Two demerit points, with no suspension","zh":"扣 2 分，不暂停驾照"},{"en":"Loss of licence for at least 30 days","zh":"驾照被暂停至少 30 天"}],"answer_index":3,"explanation_zh":"新手司机必须为每位乘客配备可用的安全带；做不到的话，可能被暂停驾照至少 30 天。","explanation_en":"Novice drivers without a working seatbelt for each passenger can lose their licence for at least 30 days.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-21","group":"RA","section":"rules","topic_zh":"安全带","question_en":"Which is the correct way to wear a lap-and-shoulder seatbelt?","question_zh":"下列哪种是正确佩戴三点式安全带（腰带加肩带）的方法？","options":[{"en":"Shoulder strap under your arm, lap belt across your stomach","zh":"肩带从腋下穿过，腰带系在腹部"},{"en":"Shoulder strap behind your back, lap belt low over your hips","zh":"肩带放在背后，腰带低系在髋部"},{"en":"Shoulder strap over your shoulder, lap belt low over your hips","zh":"肩带跨过肩膀，腰带低系在髋部"},{"en":"Shoulder strap over your shoulder, lap belt across your stomach","zh":"肩带跨过肩膀，腰带系在腹部"}],"answer_index":2,"explanation_zh":"安全带要系紧：肩带必须跨过肩膀，不能放在腋下或背后；腰带应低系在髋部，而不是勒在腹部。","explanation_en":"Shoulder strap over the shoulder; lap belt low over the hips.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-22","group":"RA","section":"rules","topic_zh":"安全带","question_en":"Two small children want to share one seatbelt for a short trip. What does the handbook say?","question_zh":"两个小孩想在短途行程中共用一条安全带。手册怎么说？","options":[{"en":"It is allowed if both children are under eight","zh":"两个孩子都不满 8 岁时可以"},{"en":"Never; each child needs their own belt or seat","zh":"绝对不行，每个孩子都要有自己的安全带或座椅"},{"en":"It is allowed if they sit in the back seat","zh":"坐在后排就可以"},{"en":"It is allowed for trips under 10 km","zh":"行程在 10 公里以内可以"}],"answer_index":1,"explanation_zh":"手册规定一条安全带只能系一个人；多人共用一条安全带在碰撞中可能造成重伤甚至死亡。每位乘客都要有自己的安全带、儿童安全座椅或增高座椅。","explanation_en":"Never put more than one person in a seatbelt; each passenger needs their own restraint.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-23","group":"RA","section":"rules","topic_zh":"安全气囊","question_en":"You are sitting in a seat with an active airbag. Do you still need to wear your seatbelt?","question_zh":"你坐的位置有已启用的安全气囊，还需要系安全带吗？","options":[{"en":"No; in a crash the airbag does the seatbelt's job","zh":"不需要，碰撞时安全气囊能代替安全带"},{"en":"Only when driving on a highway","zh":"只有在高速公路上行驶时才需要"},{"en":"Only when going faster than 50 km/h","zh":"只有车速超过 50 km/h 时才需要"},{"en":"Yes; the belt holds you in place for the airbag","zh":"需要，安全带让你保持在正确位置，安全气囊才能起保护作用"}],"answer_index":3,"explanation_zh":"安全气囊不能代替安全带。碰撞时安全带把你固定在正确位置，安全气囊才能有效保护你。","explanation_en":"Airbags do not replace seatbelts; the belt positions you for the airbag.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-24","group":"RA","section":"rules","topic_zh":"儿童安全座椅","question_en":"According to research cited in the handbook, a correctly used child car seat can reduce the likelihood of injury or death by about how much?","question_zh":"根据手册引用的研究，正确使用儿童安全座椅可将受伤或死亡的可能性降低多少？","options":[{"en":"75 per cent","zh":"75%"},{"en":"25 per cent","zh":"25%"},{"en":"45 per cent","zh":"45%"},{"en":"60 per cent","zh":"60%"}],"answer_index":0,"explanation_zh":"研究表明，正确使用儿童安全座椅可将受伤或死亡的可能性降低 75%。（60% 是增高座椅比只系安全带多提供的保护，注意区分。）","explanation_en":"A correctly used child car seat cuts the risk of injury or death by 75%.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-25","group":"RA","section":"rules","topic_zh":"增高座椅","question_en":"Compared with a seatbelt alone, how much more protection does a booster seat provide?","question_zh":"与只系安全带相比，增高座椅（booster seat）能多提供多少保护？","options":[{"en":"30 per cent more","zh":"多 30%"},{"en":"75 per cent more","zh":"多 75%"},{"en":"60 per cent more","zh":"多 60%"},{"en":"90 per cent more","zh":"多 90%"}],"answer_index":2,"explanation_zh":"增高座椅把孩子垫高，让成人安全带更有效，比只系安全带多提供 60% 的保护。","explanation_en":"Booster seats give 60% more protection than seatbelts alone.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-26","group":"RA","section":"rules","topic_zh":"儿童安全座椅","question_en":"A baby weighs 7 kg (about 15 lbs). How must the baby travel in a vehicle?","question_zh":"一名婴儿体重 7 公斤（约 15 磅），乘车时必须怎样固定？","options":[{"en":"In a forward-facing child car seat with the tether strap attached","zh":"使用前向式儿童安全座椅，并连接顶部系带"},{"en":"In a rear-facing child car seat held by a seatbelt or UAS strap","zh":"使用后向式儿童安全座椅，用安全带或 UAS 固定带固定在车上"},{"en":"In a booster seat with a lap and shoulder belt","zh":"坐增高座椅，系三点式安全带"},{"en":"On an adult's lap, with the adult's seatbelt around both","zh":"由成人抱在腿上，用成人的安全带一起系住"}],"answer_index":1,"explanation_zh":"体重不足 9 公斤（20 磅）的婴儿必须使用后向式儿童安全座椅，并用安全带或通用下部固定系统（UAS）固定在车上。","explanation_en":"Infants under 9 kg must ride in a rear-facing child car seat.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-27","group":"RA","section":"rules","topic_zh":"儿童安全座椅","question_en":"Where should a rear-facing child car seat be installed?","question_zh":"后向式儿童安全座椅应安装在哪里？","options":[{"en":"In the front passenger seat, so the driver can watch the baby","zh":"安装在副驾驶座，方便司机看护婴儿"},{"en":"In front of an active airbag, which cushions the seat in a crash","zh":"安装在有已启用安全气囊的座位，碰撞时气囊可起缓冲作用"},{"en":"Anywhere, as long as the UAS strap is used","zh":"只要使用 UAS 固定带，装在哪里都可以"},{"en":"In the back seat, never where there is an active airbag","zh":"安装在后排，绝不能放在有已启用安全气囊的座位"}],"answer_index":3,"explanation_zh":"后向式儿童安全座椅最好装在后排；绝不能放在有已启用安全气囊的座位，气囊弹出可能严重伤害孩子。","explanation_en":"Rear-facing seats belong in the back seat, never in front of an active airbag.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-28","group":"RA","section":"rules","topic_zh":"儿童安全座椅","question_en":"A toddler weighing 15 kg rides in a forward-facing child car seat held in place by the vehicle's seatbelt. What else must be attached?","question_zh":"一名体重 15 公斤的幼儿坐在用车辆安全带固定的前向式儿童安全座椅里。还必须连接什么？","options":[{"en":"Its tether strap, to the tether anchor","zh":"座椅的顶部系带（tether strap），连接到车辆的系带锚点"},{"en":"Nothing else is required","zh":"不需要其他连接"},{"en":"A second seatbelt across the child's lap","zh":"再用一条安全带系在孩子腿上"},{"en":"A locking clip on every seatbelt in the vehicle","zh":"给车内每条安全带都装上锁定夹（locking clip）"}],"answer_index":0,"explanation_zh":"使用前向式儿童安全座椅时，必须按座椅及车辆说明书连接顶部系带至锚点。体重超过9公斤的儿童仍可在座椅允许的身高、体重范围内继续使用后向式座椅；不能只因达到9公斤就认定必须转为前向。","explanation_en":"A forward-facing child seat must be installed with its top tether attached to the vehicle's tether anchor, following both manufacturers' instructions. A suitable rear-facing seat may still be used for children above 9 kg within its height/weight limits.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RA-29","group":"RA","section":"rules","topic_zh":"增高座椅","question_en":"A 6-year-old has outgrown her forward-facing car seat. She weighs 22 kg and is 120 cm tall. How must she ride?","question_zh":"一名 6 岁女孩已不再适合使用前向式儿童安全座椅，体重 22 公斤，身高 120 厘米。她必须怎样乘车？","options":[{"en":"With the adult lap and shoulder belt, no booster","zh":"只系成人三点式安全带，不用增高座椅"},{"en":"In a booster seat with a lap and shoulder belt","zh":"坐增高座椅，并系三点式安全带（腰带加肩带）"},{"en":"In a booster seat secured with a lap belt only","zh":"坐增高座椅，只用腰带固定"},{"en":"In a forward-facing car seat with a tether strap","zh":"继续坐前向式儿童安全座椅，并连接顶部系带"}],"answer_index":1,"explanation_zh":"已不再适合前向式座椅、未满 8 岁、体重 18 公斤以上但不足 36 公斤、身高不足 145 厘米的儿童必须使用增高座椅，而且增高座椅必须配合三点式安全带使用。","explanation_en":"She meets the booster criteria, and a booster needs a lap/shoulder belt.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-30","group":"RA","section":"rules","topic_zh":"增高座椅","question_en":"A child under eight and under 145 cm tall has outgrown a forward-facing car seat. In what weight range must the child use a booster seat?","question_zh":"一名未满 8 岁、身高不足 145 厘米的儿童已不再适合使用前向式儿童安全座椅。体重在什么范围内必须使用增高座椅？","options":[{"en":"At least 9 kg but less than 18 kg (20–40 lbs)","zh":"至少9公斤、不足18公斤（20～40磅）"},{"en":"At least 15 kg but less than 30 kg (33–66 lbs)","zh":"至少15公斤、不足30公斤（33～66磅）"},{"en":"At least 18 kg but less than 36 kg (40–80 lbs)","zh":"至少18公斤、不足36公斤（40～80磅）"},{"en":"At least 20 kg but less than 45 kg (44–100 lbs)","zh":"至少20公斤、不足45公斤（44～100磅）"}],"answer_index":2,"explanation_zh":"符合题干年龄和身高条件、且已不再适合前向式儿童座椅的儿童，体重达到18公斤但不足36公斤时，必须使用增高座椅。18公斤本身也包含在内；增高座椅须配合腰带加肩带使用。","explanation_en":"Booster seats are for children from 18 kg up to under 36 kg.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-31","group":"RA","section":"rules","topic_zh":"增高座椅","question_en":"A 7-year-old is 147 cm tall and weighs 33 kg. The adult seatbelt fits properly across the hips, the centre of the chest and the shoulder. May the child stop using a booster seat?","question_zh":"一名 7 岁儿童身高 147 厘米、体重 33 公斤，成人安全带能正确贴合髋部、胸部中央和肩膀。这个孩子可以不再使用增高座椅吗？","options":[{"en":"No, the child must first turn eight","zh":"不可以，必须先满 8 岁"},{"en":"No, the child must first weigh at least 36 kg","zh":"不可以，体重必须先达到 36 公斤"},{"en":"No, the age, weight and height conditions must all be met","zh":"不可以，年龄、体重、身高三项条件都必须满足"},{"en":"Yes, reaching 145 cm is enough on its own","zh":"可以，身高达到 145 厘米这一项就足够"}],"answer_index":3,"explanation_zh":"只要孩子能正确系好安全带，并满足以下任一条件即可改用安全带：年满 8 岁、体重达 36 公斤（80 磅）或身高达 145 厘米（4 英尺 9 英寸）。","explanation_en":"Any one criterion (age 8, 36 kg or 145 cm) is enough once the belt fits.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RA-32","group":"RA","section":"rules","topic_zh":"增高座椅","question_en":"Your vehicle has lap belts only (no shoulder belts). How should you secure a child who would normally ride in a booster seat?","question_zh":"你的车只有腰带（没有肩带）。平时应坐增高座椅的孩子应该怎样固定？","options":[{"en":"Lap belt only, with no booster seat","zh":"只系腰带，不用增高座椅"},{"en":"On the booster seat, using the lap belt","zh":"坐增高座椅，系腰带"},{"en":"On the booster seat, with no belt","zh":"坐增高座椅，不系安全带"},{"en":"In a rear-facing child car seat","zh":"改用后向式儿童安全座椅"}],"answer_index":0,"explanation_zh":"增高座椅必须配合三点式安全带使用；如果车上只有腰带，就只用腰带固定孩子，绝不能让孩子坐增高座椅却只系腰带。","explanation_en":"With lap belts only, use the lap belt alone; never a booster with only a lap belt.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RA-33","group":"RA","section":"rules","topic_zh":"儿童乘车","question_en":"Children under what age are safest riding in the back seat?","question_zh":"多大年龄以下的儿童坐在后排最安全？","options":[{"en":"Under 8","zh":"8 岁以下"},{"en":"Under 13","zh":"13 岁以下"},{"en":"Under 10","zh":"10 岁以下"},{"en":"Under 16","zh":"16 岁以下"}],"answer_index":1,"explanation_zh":"手册指出 13 岁以下儿童最安全的位置是后排；也不要让孩子坐在未关闭的安全气囊前面。","explanation_en":"The back seat is safest for children under 13.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-34","group":"RA","section":"rules","topic_zh":"儿童安全座椅","question_en":"After installing a child car seat, how much should it move where the seatbelt or UAS strap passes through it?","question_zh":"儿童安全座椅安装好后，在安全带或 UAS 固定带穿过座椅的位置，移动幅度不应超过多少？","options":[{"en":"No more than 5 cm (2 inches)","zh":"不超过 5 厘米（2 英寸）"},{"en":"No more than 10 cm (4 inches)","zh":"不超过 10 厘米（4 英寸）"},{"en":"No more than 2.5 cm (1 inch)","zh":"不超过 2.5 厘米（1 英寸）"},{"en":"No more than 7.5 cm (3 inches)","zh":"不超过 7.5 厘米（3 英寸）"}],"answer_index":2,"explanation_zh":"安装时用膝盖压住座椅、借体重把它压进车座，再尽量拉紧安全带或 UAS 固定带；装好后在固定带穿过处的移动不应超过 2.5 厘米（1 英寸）。","explanation_en":"An installed child seat should move no more than 2.5 cm at the belt path.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RA-35","group":"RA","section":"rules","topic_zh":"车灯使用","question_en":"Apart from times of poor visibility, during which period must your headlights be on?","question_zh":"除能见度差的情况外，在哪个时间段内必须开启前大灯？","options":[{"en":"From one-half hour before sunset to one-half hour after sunrise","zh":"日落前半小时到日出后半小时"},{"en":"From sunset to sunrise","zh":"从日落到日出"},{"en":"From one hour before sunset to one hour after sunrise","zh":"日落前 1 小时到日出后 1 小时"},{"en":"From one-half hour after sunset to one-half hour before sunrise","zh":"日落后半小时到日出前半小时"}],"answer_index":0,"explanation_zh":"手册规定，从日落前半小时到日出后半小时必须开启前大灯；雾、雪、雨等光线差的情况也必须开。","explanation_en":"Headlights are required from half an hour before sunset to half an hour after sunrise.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-36","group":"RA","section":"rules","topic_zh":"车灯使用","question_en":"In fog, snow or rain, you must turn on your headlights if you cannot clearly see people or vehicles within what distance?","question_zh":"在雾、雪或雨中，如果看不清多远以内的行人或车辆，就必须开启前大灯？","options":[{"en":"60 m","zh":"60 米"},{"en":"110 m","zh":"110 米"},{"en":"300 m","zh":"300 米"},{"en":"150 m","zh":"150 米"}],"answer_index":3,"explanation_zh":"任何时候只要光线差（如雾、雪、雨），以致看不清 150 米以内的行人或车辆，就必须开启前大灯。","explanation_en":"Use headlights whenever you cannot clearly see people or vehicles within 150 m.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-37","group":"RA","section":"rules","topic_zh":"远光灯","question_en":"You are following another vehicle at night and do not intend to pass it. When must you use your low beams?","question_zh":"夜间你跟在另一辆车后面行驶，且不打算超车。什么情况下必须使用近光灯？","options":[{"en":"Only when you are less than 20 m behind it","zh":"只有距离前车不足 20 米时"},{"en":"Whenever you are within 300 m of it","zh":"只要在前车 300 米以内"},{"en":"When you are less than 60 m behind it","zh":"距离前车不足 60 米时"},{"en":"Only on roads without a median","zh":"只在没有中央分隔带的道路上"}],"answer_index":2,"explanation_zh":"跟车距离不足 60 米时必须使用近光灯（超车时除外）；这条规定适用于所有道路。","explanation_en":"Use low beams when less than 60 m behind another vehicle unless passing.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-38","group":"RA","section":"rules","topic_zh":"车灯标准","question_en":"Your headlights must be strong enough to light up objects at least how far away?","question_zh":"前大灯的亮度必须足以照亮至少多远处的物体？","options":[{"en":"60 m","zh":"60 米"},{"en":"150 m","zh":"150 米"},{"en":"200 m","zh":"200 米"},{"en":"110 m","zh":"110 米"}],"answer_index":3,"explanation_zh":"前大灯必须发出白光，至少能在前方 150 米处被看见，并且亮度足以照亮 110 米外的物体。","explanation_en":"Headlights must light up objects 110 m away (and be visible from 150 m).","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RA-39","group":"RA","section":"rules","topic_zh":"远光灯","question_en":"You are using high beams on a divided highway and a car approaches on the other side. Does the 150-metre dimming rule apply?","question_zh":"你开着远光灯在有中央分隔带的公路上行驶，对向车道有车驶来。150 米内切换近光灯的规定是否适用？","options":[{"en":"No, because the median blocks the glare","zh":"不适用，中央分隔带会挡住眩光"},{"en":"Yes, it applies on all roads","zh":"适用，所有道路都适用"},{"en":"Only if there is no concrete barrier","zh":"只有没有混凝土隔离墩时才适用"},{"en":"Only inside city limits","zh":"只在市区范围内适用"}],"answer_index":1,"explanation_zh":"手册明确指出，远光灯和近光灯的使用规定适用于所有道路，包括有中央分隔带的道路。","explanation_en":"The beam rules apply on all roads, including divided ones.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-40","group":"RA","section":"rules","topic_zh":"车灯使用","question_en":"Light is fading in the evening. Which lights should you use while driving?","question_zh":"傍晚光线渐暗，行驶时应该开哪种灯？","options":[{"en":"Headlights","zh":"前大灯"},{"en":"Parking lights","zh":"示廓灯（停车灯）"},{"en":"Hazard warning lights","zh":"危险警示灯（双闪）"},{"en":"Daytime running lights only","zh":"仅日间行车灯"}],"answer_index":0,"explanation_zh":"示廓灯（停车灯）只用于停车；光线变暗时要开前大灯，开前大灯会同时启动尾灯和后车牌灯等必需灯光。","explanation_en":"In low light use headlights; parking lights are only for parking.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-41","group":"RA","section":"rules","topic_zh":"日间行车灯","question_en":"What is the problem with using daytime running lights instead of headlights at night or in poor visibility?","question_zh":"在夜间或能见度差时，用日间行车灯代替前大灯有什么问题？","options":[{"en":"They drain the battery much faster than headlights do","zh":"比前大灯耗电多得多"},{"en":"They are illegal to use at any time in Ontario","zh":"在安省任何时候使用都是违法的"},{"en":"They can cause glare and may leave tail lights off","zh":"可能造成眩光，且尾灯可能不亮"},{"en":"They only work at speeds above 50 km/h","zh":"只有车速超过 50 km/h 时才会亮"}],"answer_index":2,"explanation_zh":"日间行车灯只用于光线良好时提高车辆的辨识度；在光线差时使用会对他人造成眩光，而且可能不会开启尾灯等其他必需灯光。建议把灯光设为自动模式。","explanation_en":"DRLs can cause glare and may not turn on tail lights, so use headlights in poor light.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-42","group":"RA","section":"rules","topic_zh":"转向操作","question_en":"Picturing the steering wheel as a clock, where should you place your hands?","question_zh":"把方向盘想象成钟面，双手应放在什么位置？","options":[{"en":"10 o'clock and 2 o'clock","zh":"10 点和 2 点"},{"en":"8 o'clock and 4 o'clock","zh":"8 点和 4 点"},{"en":"12 o'clock and 6 o'clock","zh":"12 点和 6 点"},{"en":"9 o'clock and 3 o'clock","zh":"9 点和 3 点"}],"answer_index":3,"explanation_zh":"手册要求把方向盘想象成钟面，双手放在 9 点和 3 点位置；转向要平稳精确，大多数转向和变道时双手都不离开方向盘。","explanation_en":"Hold the wheel at nine and three o'clock.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-along","source_title":"MTO 手册 · Driving along","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-43","group":"RA","section":"rules","topic_zh":"手势信号","question_en":"Your turn signals are not working and you want to turn left. What hand signal should you give?","question_zh":"你的转向灯坏了，你想左转。应该做什么手势？","options":[{"en":"Left arm extended straight out","zh":"左臂向外水平伸直"},{"en":"Left arm extended out and bent upward at a right angle","zh":"左臂伸出，向上弯成直角"},{"en":"Left arm extended out and bent downward at a right angle","zh":"左臂伸出，向下弯成直角"},{"en":"Right arm extended straight out the passenger window","zh":"右臂从副驾驶车窗水平伸出"}],"answer_index":0,"explanation_zh":"转向灯和制动灯失灵时要用手势：左转是左臂水平伸直；右转是左臂伸出、向上弯成直角；减速或停车是左臂伸出、向下弯成直角。","explanation_en":"Left turn: left arm straight out.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-along","source_title":"MTO 手册 · Driving along","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-44","group":"RA","section":"rules","topic_zh":"手势信号","question_en":"A driver ahead has their left arm out the window, bent upward at a right angle. What are they signalling?","question_zh":"前车司机将左臂伸出车窗，并向上弯成直角。这表示什么？","options":[{"en":"A left turn","zh":"左转"},{"en":"A right turn","zh":"右转"},{"en":"Slowing down or stopping","zh":"减速或停车"},{"en":"That it is safe for you to pass","zh":"示意你可以超车"}],"answer_index":1,"explanation_zh":"左臂伸出并向上弯成直角是右转手势；左臂水平伸直是左转；左臂向下弯成直角是减速或停车。","explanation_en":"Left arm bent upward means a right turn.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-along","source_title":"MTO 手册 · Driving along","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-45","group":"RA","section":"rules","topic_zh":"手势信号","question_en":"Your brake lights have stopped working and you need to slow down for traffic ahead. How should you signal the drivers behind you?","question_zh":"你的制动灯坏了，而你需要为前方车流减速。应该怎样向后方司机示意？","options":[{"en":"Switch on your hazard lights and then brake firmly","zh":"打开危险警示灯（双闪），然后用力制动"},{"en":"Put your left arm out, bent up at a right angle","zh":"左臂伸出车窗，向上弯成直角"},{"en":"Put your left arm out, bent down at a right angle","zh":"左臂伸出车窗，向下弯成直角"},{"en":"Tap your horn several times while you brake","zh":"制动时连按几下喇叭"}],"answer_index":2,"explanation_zh":"转向灯和制动灯失灵时要改用手势：减速或停车是左臂伸出车窗、向下弯成直角；向上弯成直角则表示右转。","explanation_en":"With brake lights out, signal slowing or stopping with your left arm out and bent down.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-along","source_title":"MTO 手册 · Driving along","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-46","group":"RA","section":"rules","topic_zh":"转向灯使用","question_en":"In which of these situations must you signal?","question_zh":"下列哪种情况必须打信号？","options":[{"en":"Pulling away from the curb after being parked","zh":"停车后从路边起步驶出"},{"en":"Driving straight through an intersection on a green light","zh":"绿灯时直行通过路口"},{"en":"Keeping a steady speed in your own lane","zh":"在本车道保持匀速行驶"},{"en":"Driving past a side street without turning","zh":"经过一条小路但不转弯"}],"answer_index":0,"explanation_zh":"在停车、减速、转弯、变道、驶离道路或从停车位置驶出之前，都要提前使用转向灯或制动灯示意，并确保别人看得见。","explanation_en":"Signal before moving out from a parked position, as well as before stopping, turning or changing lanes.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-along","source_title":"MTO 手册 · Driving along","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-47","group":"RA","section":"rules","topic_zh":"车道位置","question_en":"You are driving more slowly than other traffic on a multi-lane road. Which lane should you use?","question_zh":"在多车道道路上，你的车速比其他车辆慢。应该在哪条车道行驶？","options":[{"en":"The left-hand lane, so others can pass on the right","zh":"最左侧车道，让别人从右边超车"},{"en":"The right-hand lane, unless turning left or passing","zh":"最右侧车道，除非要左转或超车"},{"en":"The centre lane, to leave room on both sides","zh":"中间车道，两侧都留出空间"},{"en":"Any lane, as long as you are under the speed limit","zh":"任何车道都可以，只要不超速"}],"answer_index":1,"explanation_zh":"除非要左转或超车，否则应靠道路右侧行驶，多车道道路上应走右侧车道；车速比别人慢时尤其重要。","explanation_en":"Keep right unless turning left or passing, especially when driving slower.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-along","source_title":"MTO 手册 · Driving along","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-48","group":"RA","section":"rules","topic_zh":"限速","question_en":"There are no speed limit signs on a street in a city, town or village. What is the maximum speed?","question_zh":"在城市、城镇或村庄内的道路上，没有张贴限速标志。最高车速是多少？","options":[{"en":"40 km/h","zh":"40 km/h"},{"en":"60 km/h","zh":"60 km/h"},{"en":"50 km/h","zh":"50 km/h"},{"en":"70 km/h","zh":"70 km/h"}],"answer_index":2,"explanation_zh":"没有张贴限速时，城市、城镇和村庄内的最高车速为 50 km/h。","explanation_en":"With no posted limit, the maximum in cities, towns and villages is 50 km/h.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-along","source_title":"MTO 手册 · Driving along","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-49","group":"RA","section":"rules","topic_zh":"限速","question_en":"You drive out of a village onto a rural road. Neither the village street nor the rural road has a posted speed limit. How does your maximum speed change?","question_zh":"你从村庄驶出，进入村外的乡间道路。村内街道和乡间道路都没有张贴限速。你的最高车速如何变化？","options":[{"en":"From 50 km/h to 90 km/h","zh":"从 50 km/h 变为 90 km/h"},{"en":"From 40 km/h to 80 km/h","zh":"从 40 km/h 变为 80 km/h"},{"en":"It stays at 50 km/h until you see a sign","zh":"保持 50 km/h 不变，直到看到限速标志"},{"en":"From 50 km/h to 80 km/h","zh":"从 50 km/h 变为 80 km/h"}],"answer_index":3,"explanation_zh":"没有张贴限速时，城市、城镇和村庄内最高 50 km/h，其他地方最高 80 km/h，所以驶出村庄后最高车速从 50 km/h 变为 80 km/h。","explanation_en":"Unposted limits are 50 km/h in cities, towns and villages and 80 km/h elsewhere.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-along","source_title":"MTO 手册 · Driving along","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-50","group":"RA","section":"rules","topic_zh":"限速","question_en":"The posted limit is 80 km/h, but it is raining heavily and traffic is heavy. What speed should you drive?","question_zh":"道路限速 80 km/h，但正下大雨且交通繁忙。你应该以什么速度行驶？","options":[{"en":"Below 80 km/h, at a speed that lets you stop safely","zh":"低于 80 km/h，以能安全停车的速度行驶"},{"en":"80 km/h, because the posted limit is always a safe speed","zh":"80 km/h，因为限速值总是安全的"},{"en":"A little over 80 km/h to keep up with traffic","zh":"略高于 80 km/h，跟上车流"},{"en":"Exactly 20 km/h below the limit, whatever the conditions","zh":"无论路况如何，正好比限速低 20 km/h"}],"answer_index":0,"explanation_zh":"限速是最高速度，任何时候都要以能安全停车的速度行驶；恶劣天气、交通繁忙或施工区内应低于最高限速。","explanation_en":"Drive below the maximum in bad weather or heavy traffic, at a speed that lets you stop safely.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-along","source_title":"MTO 手册 · Driving along","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-51","group":"RA","section":"rules","topic_zh":"定速巡航","question_en":"When should you avoid using cruise control?","question_zh":"在什么情况下应避免使用定速巡航？","options":[{"en":"On a dry, lightly travelled highway in daylight","zh":"白天在干燥、车少的公路上"},{"en":"When the road is wet or icy","zh":"路面湿滑或结冰时"},{"en":"When you want to avoid going over the limit by accident","zh":"想避免不小心超速时"},{"en":"When you want to save fuel on a long trip","zh":"长途行驶想省油时"}],"answer_index":1,"explanation_zh":"定速巡航可以省油、防止不经意超速，但在路面湿滑、结冰等恶劣条件下，交通繁忙时，或感到疲劳时都不应使用。","explanation_en":"Don't use cruise control on wet, icy or slippery roads, in heavy traffic or when tired.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-along","source_title":"MTO 手册 · Driving along","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-52","group":"RA","section":"rules","topic_zh":"测速预警装置","question_en":"What does the handbook say about speed-measuring warning devices (such as radar detectors) in your vehicle?","question_zh":"对于车内的测速预警装置（如雷达探测器），手册怎么说？","options":[{"en":"Legal as long as they are switched off","zh":"只要处于关闭状态就合法"},{"en":"Legal in cars but not in trucks","zh":"小汽车可以用，货车不行"},{"en":"Illegal, with a fine and demerit points","zh":"违法，会被罚款并扣分"},{"en":"Legal if mounted where police can see them","zh":"安装在警察看得到的位置就合法"}],"answer_index":2,"explanation_zh":"测速预警装置是违法的；驾车时被发现带有此类装置，会被罚款并累计扣分。","explanation_en":"Speed-measuring warning devices are illegal: fine plus demerit points.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-along","source_title":"MTO 手册 · Driving along","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-53","group":"RA","section":"rules","topic_zh":"服从警察","question_en":"A police officer directing traffic at an intersection signals you to stop, but your traffic light is green. What should you do?","question_zh":"在路口，指挥交通的警察示意你停车，但你这边是绿灯。你应该怎么做？","options":[{"en":"Proceed, because a green light gives you the right-of-way","zh":"继续行驶，因为绿灯给了你先行权"},{"en":"Sound your horn to get the officer's attention, then go","zh":"按喇叭引起警察注意后再走"},{"en":"Proceed slowly and wave to the officer","zh":"慢慢通过并向警察挥手"},{"en":"Stop, because the officer's directions override the light","zh":"停车，因为警察的指挥优先于信号灯"}],"answer_index":3,"explanation_zh":"警察指挥交通时，即使其指示与信号灯或标志不同，也必须服从警察的指挥。","explanation_en":"Police directions override traffic lights and signs.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-along","source_title":"MTO 手册 · Driving along","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-54","group":"RA","section":"rules","topic_zh":"服从警察","question_en":"A police officer signals you to pull over. What should you do?","question_zh":"警察示意你靠边停车。你应该怎么做？","options":[{"en":"Pull over as far right as is safe, stop, and stay in your vehicle","zh":"在安全前提下尽量靠右，完全停车并留在车内"},{"en":"Stop at once in your lane, then walk back to the police car","zh":"立即在本车道停车，然后走到警车旁"},{"en":"Move to the left shoulder, stop, and step out to meet the officer","zh":"驶到左侧路肩停车，下车迎接警察"},{"en":"Keep driving to the next exit, then stop and wait in the car","zh":"继续开到下一个出口再停车，在车内等候"}],"answer_index":0,"explanation_zh":"警察示意靠边时，必须在安全的前提下尽量靠右并完全停车，留在车内等警察过来。","explanation_en":"Pull over as far right as safely possible, stop completely and stay in the vehicle.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-along","source_title":"MTO 手册 · Driving along","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-55","group":"RA","section":"rules","topic_zh":"服从警察","question_en":"An officer who has stopped you asks for your driver's licence, vehicle permit and proof of insurance. When must you hand them over?","question_zh":"警察拦停你后，要求你出示驾照、车辆登记证（vehicle permit）和保险证明。你必须在什么时候交出这些证件？","options":[{"en":"Within 24 hours, at a police station","zh":"24 小时内到警察局提交"},{"en":"Immediately, when the officer asks","zh":"警察要求时立即交出"},{"en":"Within seven days","zh":"7 天内"},{"en":"Only if you are charged with an offence","zh":"只有被控违法时才需要"}],"answer_index":1,"explanation_zh":"警察要求时必须立即交出驾照、车辆登记证（或复印件）和保险证明；手册特别指出，并没有所谓的「24 小时内出示」的宽限。","explanation_en":"You must surrender these documents immediately; there is no 24-hour grace period.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-along","source_title":"MTO 手册 · Driving along","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-56","group":"RA","section":"rules","topic_zh":"跟车距离","question_en":"Under ideal conditions, what is the minimum safe following distance behind the vehicle ahead?","question_zh":"在理想条件下，与前车的最小安全跟车距离是多少？","options":[{"en":"One car length","zh":"一个车身长度"},{"en":"At least one second","zh":"至少 1 秒"},{"en":"At least two seconds","zh":"至少 2 秒"},{"en":"About five metres","zh":"约 5 米"}],"answer_index":2,"explanation_zh":"安全跟车距离至少为 2 秒，这只是理想条件下的最小值，能让你看清前车周围，并在前车急刹时安全停车。","explanation_en":"Keep at least two seconds behind the vehicle ahead.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-along","source_title":"MTO 手册 · Driving along","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-57","group":"RA","section":"rules","topic_zh":"跟车距离","question_en":"You pick a pole ahead and start counting when the rear of the vehicle in front passes it. The front of your car reaches the pole before you finish saying 'one thousand and two'. What does this tell you?","question_zh":"你在前方选定一根电线杆，前车车尾经过它时开始数数。还没数完「one thousand and two（一千零二）」，你的车头就已经到达电线杆。这说明什么？","options":[{"en":"Your following distance is ideal","zh":"跟车距离正好"},{"en":"You are too far back and should speed up","zh":"离得太远，应该加速"},{"en":"The vehicle ahead is speeding","zh":"前车超速了"},{"en":"You are following too closely","zh":"你跟车太近了"}],"answer_index":3,"explanation_zh":"两秒规则：前车车尾经过参照物时开始数「一千零一、一千零二」，自己的车头到达参照物时停止；还没数到「一千零二」就到了，说明跟车太近。","explanation_en":"Reaching the marker before 'one thousand and two' means you are too close.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-along","source_title":"MTO 手册 · Driving along","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-58","group":"RA","section":"rules","topic_zh":"跟车距离","question_en":"The two-second rule is a minimum for ideal conditions. In which situation do you need MORE following distance?","question_zh":"两秒规则只是理想条件下的最小值。下列哪种情况需要「更大」的跟车距离？","options":[{"en":"Behind a motorcycle or a large truck","zh":"跟在摩托车或大货车后面时"},{"en":"On a dry, straight road in daylight","zh":"白天在干燥、平直的路面上行驶时"},{"en":"In light traffic","zh":"车流稀少时"},{"en":"Following a small car on a clear, dry day","zh":"晴朗干燥的天气里跟在一辆小汽车后面时"}],"answer_index":0,"explanation_zh":"两秒规则只适用于理想条件；遇到恶劣天气、跟随摩托车或大货车、或车辆载重较大时，都需要留出更大的跟车距离。","explanation_en":"Leave extra space behind motorcycles or large trucks, in bad weather, or with heavy loads.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-along","source_title":"MTO 手册 · Driving along","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-59","group":"RA","section":"rules","topic_zh":"盲区","question_en":"Why should you avoid staying alongside large commercial vehicles?","question_zh":"为什么要避免长时间在大型商用车旁边行驶？","options":[{"en":"They are not allowed to change lanes","zh":"它们不允许变道"},{"en":"They have large blind spots at the sides and back","zh":"它们两侧和后方通常有很大的盲区"},{"en":"Their drivers must always yield to cars","zh":"它们的司机必须始终给小汽车让行"},{"en":"Their mirrors give the driver a complete view on all sides","zh":"它们的后视镜能让司机看清四周所有情况"}],"answer_index":1,"explanation_zh":"不要在其他车辆的盲区内行驶，尤其是大型商用车，它们两侧和后方通常有很大的盲区，司机可能看不到你。","explanation_en":"Large commercial vehicles have big blind spots to the sides and back.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-along","source_title":"MTO 手册 · Driving along","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-60","group":"RA","section":"rules","topic_zh":"盲区","question_en":"You notice another car keeps travelling in your blind spot. What does the handbook suggest?","question_zh":"你发现另一辆车一直在你的盲区里行驶。手册建议怎么做？","options":[{"en":"Sound your horn until the driver moves away","zh":"一直按喇叭直到对方离开"},{"en":"Turn on your hazard lights so the driver notices you","zh":"打开危险警示灯（双闪）让对方注意你"},{"en":"Change your speed to get it out of your blind spot","zh":"调整车速，让那辆车离开你的盲区"},{"en":"Drift toward its lane to encourage it to pass","zh":"向它的车道靠拢，迫使它超车"}],"answer_index":2,"explanation_zh":"手册建议通过改变自己的车速，让其他车辆离开你的盲区；同时也不要在别人的盲区里行驶。","explanation_en":"Keep others out of your blind spot by changing your speed.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-along","source_title":"MTO 手册 · Driving along","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-61","group":"RA","section":"rules","topic_zh":"观察与预判","question_en":"You are driving past a row of parked cars and see people sitting inside some of them. What should you watch for?","question_zh":"你经过一排停放的车辆，看到其中几辆车里有人。你应该注意什么？","options":[{"en":"Parked cars that are blocking the sidewalk","zh":"挡住人行道的停放车辆"},{"en":"Parking meters that have expired","zh":"已经过期的停车计时器"},{"en":"Nothing in particular, since parked cars cannot move suddenly","zh":"无需特别注意，停着的车不会突然移动"},{"en":"A vehicle pulling out in front of you or a door being opened","zh":"有车突然驶出到你前方，或有人突然开车门"}],"answer_index":3,"explanation_zh":"手册提醒要看远一些，注意停放车辆里的人，他们可能突然驶出到你前方或打开车门；同时留意小型车辆、自行车和行人。","explanation_en":"People in parked vehicles may pull out or open a door in front of you.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-along","source_title":"MTO 手册 · Driving along","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-62","group":"RA","section":"rules","topic_zh":"车灯要求","question_en":"By law, your headlights must shine a white light that can be seen at least how far ahead, and your red rear lights must be visible from how far away?","question_zh":"按法律规定，前照灯的白光至少要能在前方多远处被看到？红色尾灯又必须在多远处可见？","options":[{"en":"110 m ahead; 60 m behind","zh":"前方 110 米；后方 60 米"},{"en":"150 m ahead; 150 m behind","zh":"前方 150 米；后方 150 米"},{"en":"150 m ahead; 60 m behind","zh":"前方 150 米；后方 60 米"},{"en":"60 m ahead; 150 m behind","zh":"前方 60 米；后方 150 米"}],"answer_index":1,"explanation_zh":"前照灯的白光须在前方至少 150 米处可见，并能照亮 110 米外的物体；红色尾灯须在 150 米外可见，开前照灯时还须有白灯照亮后车牌。","explanation_en":"Headlights must be visible at least 150 m ahead and light objects 110 m away, and red rear lights must be visible from 150 m.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RA-63","group":"RA","section":"rules","topic_zh":"车灯要求","question_en":"One of your headlights has burned out. What does the handbook say?","question_zh":"你的一只前照灯烧坏了。手册怎么说？","options":[{"en":"You may keep driving at night if you switch to high beams","zh":"夜间改开远光灯就可以继续驾驶"},{"en":"It's acceptable as long as your fog lights still work","zh":"只要雾灯还能用就没问题"},{"en":"Don't drive on one headlight; get the bulb replaced soon","zh":"不要只用一只前照灯驾驶，应尽快更换灯泡"},{"en":"It only matters when you drive on unlit rural roads","zh":"只有在没有路灯的乡村道路上行驶才有影响"}],"answer_index":2,"explanation_zh":"不要只用一只前照灯或灯光未校准时驾驶。应定期检查整个灯光系统，保持清洁，尽快更换烧坏的灯泡。","explanation_en":"Don't drive with only one headlight or with misaimed lights; replace burned-out bulbs as soon as possible.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-64","group":"RA","section":"rules","topic_zh":"车窗贴膜","question_en":"Which statement about coating or tinting your vehicle's windows is correct?","question_zh":"关于给车窗贴膜或加涂层，下列哪项说法正确？","options":[{"en":"Any tint is allowed as long as you can still see out the front","zh":"只要还能看清前方，任何贴膜都可以"},{"en":"Only the rear window has to be left completely uncoated","zh":"只有后窗必须完全不贴膜"},{"en":"Side windows may be fully darkened if your mirrors are clear","zh":"只要后视镜视野清楚，侧窗可以完全贴黑"},{"en":"The windshield and front door windows must let people see inside","zh":"前挡风玻璃和前车门车窗必须让外面的人能看到车内"}],"answer_index":3,"explanation_zh":"车窗不得涂覆任何会妨碍你向任何方向看出去的材料；前挡风玻璃和前车门车窗也不得涂覆到让别人看不到车内的程度。","explanation_en":"Windows must not be coated to block your view out in any direction, and the windshield and front door windows must not be coated to stop people seeing inside.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RA-65","group":"RA","section":"rules","topic_zh":"交通法规","question_en":"Which governments make traffic laws that apply to drivers in Ontario?","question_zh":"适用于安大略省司机的交通法律由哪些政府制定？","options":[{"en":"Only the provincial government","zh":"只有省政府"},{"en":"Federal, provincial and municipal governments","zh":"联邦、省和市三级政府"},{"en":"Only the federal government","zh":"只有联邦政府"},{"en":"The provincial government and insurance companies","zh":"省政府和保险公司"}],"answer_index":1,"explanation_zh":"交通法律由联邦、省和市三级政府制定，各级警察都可以执法。违反交通法律可能被罚款、监禁或失去驾照。","explanation_en":"Traffic laws are made by federal, provincial and municipal governments, and police from each level can enforce them.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/safe-and-responsible-driving","source_title":"MTO 手册 · Safe and Responsible Driving","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-66","group":"RA","section":"rules","topic_zh":"交通法规","question_en":"According to the handbook, what is the major cause of collisions?","question_zh":"根据手册，造成碰撞事故的主要原因是什么？","options":[{"en":"Bad weather","zh":"恶劣天气"},{"en":"Poor road design","zh":"道路设计不良"},{"en":"Breaking the rules of the road","zh":"违反道路交通规则"},{"en":"Vehicle mechanical failure","zh":"车辆机械故障"}],"answer_index":2,"explanation_zh":"违反道路交通规则是碰撞事故的主要原因。做一名安全负责的司机需要知识、技能和态度三者结合。","explanation_en":"Breaking the rules of the road is the major cause of collisions.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/safe-and-responsible-driving","source_title":"MTO 手册 · Safe and Responsible Driving","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RA-67","group":"RA","section":"rules","topic_zh":"仪表盘警告灯","question_en":"When you start your car, the dashboard warning lights come on and then go out, but one stays on after you drive away. What may this mean?","question_zh":"启动汽车时，仪表盘警告灯亮起后熄灭，但有一个在你开走后仍然亮着。这可能意味着什么？","options":[{"en":"There could be a serious problem with your vehicle","zh":"车辆可能存在严重问题"},{"en":"Nothing; warning lights stay on for the first few kilometres","zh":"没什么，警告灯在开头几公里内都会亮着"},{"en":"It is normal; the light will go out once the engine warms up","zh":"这很正常，发动机热起来后灯就会熄灭"},{"en":"Nothing, as long as the car seems to drive normally","zh":"只要车开起来似乎正常，就没什么问题"}],"answer_index":0,"explanation_zh":"启动时仪表盘警告灯亮起然后熄灭是正常的；如果开车后某个警告灯一直亮着，可能表示车辆有严重问题，应进一步检查。","explanation_en":"A warning light that stays on after you drive away could mean a serious problem with your vehicle.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-ready-drive","source_title":"MTO 手册 · Getting ready to drive","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RB-01","group":"RB","section":"rules","topic_zh":"儿童安全","question_en":"You are driving along a residential street where children are playing near parked cars. What should you expect?","question_zh":"你在住宅区街道上行驶，有孩子在停放的车辆旁玩耍。你应该作何预判？","options":[{"en":"The children know the rules of the road and will wait at the curb.","zh":"孩子们懂交通规则，会在路边等候。"},{"en":"A child may dart out between the parked cars, so slow down.","zh":"可能有孩子从停放的车辆之间突然冲出来，所以要减速。"},{"en":"Only children at marked crosswalks need your attention.","zh":"只需留意在有标线的人行横道上的孩子。"},{"en":"One tap of the horn is enough to keep them off the road.","zh":"按一下喇叭就足以让他们不跑上马路。"}],"answer_index":1,"explanation_zh":"手册提醒：不能指望儿童懂得交通规则，他们可能从停放的车辆之间突然冲出，或不看来车就横穿马路。在学校区、住宅区等可能有儿童的地方，要慢速、谨慎驾驶。","explanation_en":"Don't rely on children knowing traffic laws; expect them to dart out and drive slowly.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RB-02","group":"RB","section":"rules","topic_zh":"人行横道","question_en":"On a multi-lane road, the vehicle in the lane next to you has stopped just before a crosswalk, and you cannot see why. What should you do?","question_zh":"在多车道道路上，你旁边车道的车在人行横道前停了下来，你看不到原因。你应该怎么做？","options":[{"en":"Speed up to clear the crosswalk before a pedestrian reaches your lane.","zh":"加速通过人行横道，赶在行人走到你的车道之前。"},{"en":"Pass it carefully, since your own lane is clear.","zh":"你所在的车道没有障碍，所以小心地超越它。"},{"en":"Sound your horn and continue at the same speed.","zh":"按喇叭并保持原速继续行驶。"},{"en":"Do not pass it; a pedestrian may be crossing in front of it.","zh":"不要超越它，它前面可能有行人正在过马路。"}],"answer_index":3,"explanation_zh":"手册规定不要超越停在人行横道前的车辆。别的车停下，可能正是因为有行人在过马路，而那辆车挡住了你的视线。","explanation_en":"Never pass a vehicle stopped at a crosswalk; it may be stopped for a pedestrian.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-03","group":"RB","section":"rules","topic_zh":"行人过街设施","question_en":"A pedestrian is crossing at a pedestrian crossover. Which road users must stop and yield the whole roadway?","question_zh":"有行人正在行人过街设施（pedestrian crossover）处过马路。哪些道路使用者必须停车并让出整条道路？","options":[{"en":"Both motor vehicle drivers and cyclists","zh":"机动车驾驶者和骑车人都必须"},{"en":"Only motor vehicle drivers; cyclists may ride through","zh":"只有机动车驾驶者，骑车人可以直接骑过去"},{"en":"Only vehicles in the lane the pedestrian is currently in","zh":"只有行人当时所在车道上的车辆"},{"en":"Only vehicles on the pedestrian's half of the road","zh":"只有行人所在那半边道路上的车辆"}],"answer_index":0,"explanation_zh":"手册规定，在行人过街设施、学校过街处和有过街引导员的地点，驾驶者（包括骑车人）都必须停车，并让出整条道路，而不只是行人所在的车道。","explanation_en":"Drivers and cyclists alike must stop and yield the entire roadway at a crossover.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-04","group":"RB","section":"rules","topic_zh":"视障行人","question_en":"A pedestrian waiting at a corner is using a white cane. What does this usually indicate?","question_zh":"一位在路口等候的行人拿着白手杖。这通常说明什么？","options":[{"en":"The person is deaf or hard of hearing.","zh":"此人失聪或有听力障碍。"},{"en":"The person has a temporary leg injury.","zh":"此人腿部暂时受伤。"},{"en":"The person is blind or has a visual disability.","zh":"此人失明或有视力障碍。"},{"en":"The person is elderly and walks slowly.","zh":"此人年纪大、行动慢。"}],"answer_index":2,"explanation_zh":"手册指出，失明或有视力障碍的行人可能借助白手杖或导盲犬，在人行道上行走和穿过路口。驾驶者应格外小心并礼让。","explanation_en":"A white cane or guide dog indicates a pedestrian who is blind or visually impaired.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RB-05","group":"RB","section":"rules","topic_zh":"安静车辆与视障行人","question_en":"Why should drivers of hybrid or electric vehicles take extra care near intersections?","question_zh":"为什么混合动力车或电动车的驾驶者在路口附近要格外小心？","options":[{"en":"Vision-impaired pedestrians may not hear them slow or stop.","zh":"车辆减速或停车时几乎没有声音，视障行人可能听不到。"},{"en":"Their brakes need a much longer distance to stop.","zh":"它们的刹车距离长得多。"},{"en":"Their headlights are dimmer than those of gasoline vehicles.","zh":"它们的前大灯比燃油车暗。"},{"en":"They are not allowed to turn right on a red light.","zh":"它们不允许红灯右转。"}],"answer_index":0,"explanation_zh":"视障人士进入路口前常依靠发动机的声音判断来车；混合动力车和电动车减速或停车时几乎没有可辨别的声音，所以驾驶者要格外小心。","explanation_en":"Quiet vehicles may not be heard by vision-impaired people who rely on engine sound.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-06","group":"RB","section":"rules","topic_zh":"电动轮椅使用者","question_en":"A person in a motorized wheelchair is crossing the road ahead of you. How should you treat them?","question_zh":"一位坐电动轮椅的人正在你前方过马路。你应该把对方视为什么？","options":[{"en":"As a motor vehicle that must yield to traffic","zh":"视为必须给车流让行的机动车"},{"en":"As a cyclist who should use the bike lane","zh":"视为应走自行车道的骑车人"},{"en":"As a slow-moving vehicle that must display an orange-and-red sign","zh":"视为必须挂橙红色标志的慢速车辆"},{"en":"As a pedestrian","zh":"视为行人"}],"answer_index":3,"explanation_zh":"手册明确：使用电动轮椅和医用代步车（medical scooter）的人也是行人，应像对待其他行人一样礼让。","explanation_en":"Motorized wheelchair and medical scooter users are pedestrians.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-07","group":"RB","section":"rules","topic_zh":"有轨电车","question_en":"A streetcar is stopped at a stop that has a special safety island for passengers. What should you do?","question_zh":"有轨电车停靠在一个设有乘客专用安全岛的车站。你应该怎么做？","options":[{"en":"Stop at least two metres behind its rear doors until they close.","zh":"在后门后方至少 2 米处停车，直到车门关闭。"},{"en":"Pass at a reasonable speed, ready for sudden moves by pedestrians.","zh":"以合理速度通过，并随时准备应对行人的突然举动。"},{"en":"Pass the streetcar on its left side at normal speed.","zh":"以正常速度从电车左侧超越。"},{"en":"Sound your horn to warn the passengers, then pass.","zh":"按喇叭提醒乘客，然后超越。"}],"answer_index":1,"explanation_zh":"设有安全岛或乘客专区的有轨电车站，应以合理速度通过，并随时准备应对行人突然或意外的举动。在后门后方至少 2 米处停车的规定只适用于没有乘客专区的车站。","explanation_en":"Pass safety islands at a reasonable speed, watching for pedestrians.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RB-08","group":"RB","section":"rules","topic_zh":"自行车","question_en":"Bicycles and mopeds travelling slower than other traffic are expected to ride about how far from the curb or parked cars?","question_zh":"比其他车辆慢的自行车和轻便摩托车（moped），通常应在距路缘或停放车辆大约多远处行驶？","options":[{"en":"About 30 centimetres","zh":"约 30 厘米"},{"en":"About 1 metre","zh":"约 1 米"},{"en":"About 2 metres","zh":"约 2 米"},{"en":"About 3 metres","zh":"约 3 米"}],"answer_index":1,"explanation_zh":"比其他车辆慢的自行车和轻便摩托车通常应在距路缘或停放车辆约 1 米处行驶；没有路缘时尽量靠近道路右侧边缘。为了安全，必要时他们也可以使用车道的任何部分。","explanation_en":"Slower bicycles and mopeds ride about one metre from the curb or parked cars.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RB-09","group":"RB","section":"rules","topic_zh":"自行车","question_en":"A cyclist ahead moves out from the curb to cross streetcar tracks. At what angle should a cyclist cross railway or streetcar tracks?","question_zh":"前方的骑车人离开路缘一侧，准备穿越有轨电车轨道。骑车人应以什么角度穿越铁路或有轨电车轨道？","options":[{"en":"30°","zh":"30 度"},{"en":"90°","zh":"90 度"},{"en":"45°","zh":"45 度"},{"en":"Parallel to the tracks","zh":"与轨道平行"}],"answer_index":1,"explanation_zh":"为了安全，骑车人必要时可以使用车道的任何部分，例如以 90 度角穿越铁路或有轨电车轨道。驾驶者要预料到骑车人可能因此离开路缘一侧。","explanation_en":"Cyclists may leave the curb side to cross tracks at a 90° angle.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-10","group":"RB","section":"rules","topic_zh":"自行车左转","question_en":"At an intersection, a cyclist moves from the right side of the road into the left-turn lane. Is this allowed?","question_zh":"在路口，一名骑车人从道路右侧移到了左转车道。这样做允许吗？","options":[{"en":"No; cyclists must always stay near the right edge.","zh":"不允许，骑车人必须始终靠道路右侧边缘骑行。"},{"en":"No; to turn left, cyclists must dismount and cross as pedestrians.","zh":"不允许，骑车人左转必须下车，像行人一样过马路。"},{"en":"Only if the road has no bike lane.","zh":"只有在道路没有自行车道时才允许。"},{"en":"Yes; cyclists may turn left from a left-turn lane.","zh":"允许，骑车人可以从左转车道左转。"}],"answer_index":3,"explanation_zh":"骑车人在左转或准备左转时，以及车速达到或超过当时当地的正常车速时，不必靠右侧边缘骑行；有左转车道时，可以从左转车道左转。","explanation_en":"Cyclists may leave the right edge to turn left and may use a left-turn lane.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-11","group":"RB","section":"rules","topic_zh":"超越骑车人","question_en":"When passing a cyclist, what minimum distance must a motor vehicle driver leave, where practical?","question_zh":"超越骑车人时，在可行的情况下，机动车驾驶者与骑车人之间至少要保持多远的距离？","options":[{"en":"1.5 metres","zh":"1.5 米"},{"en":"2 metres","zh":"2 米"},{"en":"0.5 metre","zh":"0.5 米"},{"en":"1 metre","zh":"1 米"}],"answer_index":3,"explanation_zh":"超越骑车人时，在可行的情况下，机动车与骑车人之间至少要保持 1 米距离；只要条件允许，最好换道超越。","explanation_en":"Leave at least one metre when passing a cyclist, where practical.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RB-12","group":"RB","section":"rules","topic_zh":"扣分制度","question_en":"A driver passes a cyclist without leaving the required minimum distance. Besides a fine, what penalty can apply?","question_zh":"驾驶者超越骑车人时没有保持规定的最小距离。除罚款外，还可能受到什么处罚？","options":[{"en":"2 demerit points","zh":"扣 2 分"},{"en":"3 demerit points","zh":"扣 3 分"},{"en":"4 demerit points","zh":"扣 4 分"},{"en":"6 demerit points","zh":"扣 6 分"}],"answer_index":0,"explanation_zh":"超越骑车人时未保持至少 1 米的距离，可被罚款，并在驾驶记录上额外扣 2 分。","explanation_en":"The penalty is a fine plus 2 demerit points.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-13","group":"RB","section":"rules","topic_zh":"自行车","question_en":"Why should you avoid following a cyclist too closely?","question_zh":"为什么不应该紧跟在骑车人后面？","options":[{"en":"The law requires a 3-second gap behind bicycles only at night.","zh":"法律只在夜间要求与自行车保持 3 秒距离。"},{"en":"Your exhaust can make the cyclist lose balance.","zh":"你的尾气会让骑车人失去平衡。"},{"en":"Bicycles have no brake lights to warn you they are slowing.","zh":"自行车没有刹车灯，减速或停车时无法提醒你。"},{"en":"Cyclists are not allowed to stop in a travel lane.","zh":"骑车人不允许在行车道上停下。"}],"answer_index":2,"explanation_zh":"自行车没有刹车灯，减速或停车时无法提醒后方车辆，所以不要跟得太近。","explanation_en":"Bicycles have no brake lights, so keep your distance.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RB-14","group":"RB","section":"rules","topic_zh":"转弯与骑车人","question_en":"You are about to turn right at an intersection where cyclists are riding. What should you do so you don't cut one off?","question_zh":"你准备在路口右转，路上有骑车人。为避免转弯时切断骑车人的去路，你应该怎么做？","options":[{"en":"Signal, then check your mirrors and the blind spot on your right.","zh":"打转向灯，然后检查后视镜和右侧盲区。"},{"en":"Check only your left mirror, since cyclists pass on the left.","zh":"只检查左后视镜，因为骑车人从左侧经过。"},{"en":"Turn quickly so you finish before any cyclist reaches the corner.","zh":"快速转弯，赶在骑车人到达路口前完成。"},{"en":"Sound your horn before turning so cyclists know to stop.","zh":"转弯前按喇叭，让骑车人知道要停下。"}],"answer_index":0,"explanation_zh":"右转时要打转向灯，并检查后视镜和右侧盲区，确保不会切断右侧骑车人的去路。","explanation_en":"Signal and check mirrors and your right blind spot before turning right.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-15","group":"RB","section":"rules","topic_zh":"转弯与骑车人","question_en":"You are waiting to turn left, and a cyclist is approaching from the opposite direction. What must you do?","question_zh":"你正在等候左转，一名骑车人从对面驶来。你必须怎么做？","options":[{"en":"Turn first; bicycles are slow and the cyclist can brake.","zh":"先转，自行车速度慢，骑车人能刹住。"},{"en":"Turn as long as the cyclist is more than one metre away.","zh":"只要骑车人距离超过 1 米就可以转。"},{"en":"Flash your headlights to tell the cyclist to stop.","zh":"闪大灯示意骑车人停下。"},{"en":"Stop and wait for the cyclist to pass before turning.","zh":"停车等骑车人通过后再左转。"}],"answer_index":3,"explanation_zh":"左转时，必须停车等对向的自行车通过后再转弯。","explanation_en":"When turning left, wait for oncoming bicycles to pass.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RB-16","group":"RB","section":"rules","topic_zh":"超越骑车人","question_en":"You feel you must use your horn while overtaking a cyclist. How should you do it?","question_zh":"超越骑车人时，你觉得必须按喇叭。应该怎样按？","options":[{"en":"Give a long, firm blast as you pull alongside.","zh":"与骑车人并排时用力长按一声。"},{"en":"Tap it quickly and lightly while still well back.","zh":"在离骑车人还较远时，快速、轻轻地按一下。"},{"en":"Hold it until the cyclist moves onto the shoulder.","zh":"一直按到骑车人移到路肩上为止。"},{"en":"Sound it only after you have passed the cyclist.","zh":"超越骑车人之后再按。"}],"answer_index":1,"explanation_zh":"超越骑车人时不要无谓地按喇叭，否则可能惊吓对方导致失控；如确需按喇叭，应在距离尚远时快速、轻轻地按一下。","explanation_en":"If needed, tap the horn quickly and lightly from a distance.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-17","group":"RB","section":"signs","topic_zh":"自行车道标线","question_en":"How is a bike lane typically marked on the road?","question_zh":"自行车道在路面上通常用什么标线标出？","options":[{"en":"A solid white line","zh":"白色实线"},{"en":"A solid yellow line","zh":"黄色实线"},{"en":"Two chevrons painted above a bicycle symbol","zh":"自行车图案上方画两个 V 形标记"},{"en":"A double solid yellow line","zh":"双黄实线"}],"answer_index":0,"explanation_zh":"自行车道专供骑车人使用，通常用一条白色实线标出。自行车图案上方画两个 V 形标记的是共享车道标线（sharrow），表示机动车和自行车共用车道，并不是自行车专用道。","explanation_en":"Bike lanes are reserved for cyclists and usually marked with a solid white line.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RB-18","group":"RB","section":"rules","topic_zh":"穿越自行车道右转","question_en":"You need to turn right across a conventional bike lane where the road markings allow you to enter it for the turn. What should you do?","question_zh":"你要右转，旁边是允许为转弯而驶入的普通自行车道（没有实体隔离）。正确做法是什么？","options":[{"en":"Turn from your lane without checking; cyclists must yield to turning cars.","zh":"不必查看，直接从本车道转弯，骑车人必须给转弯车辆让行。"},{"en":"Never enter a bike lane; turn sharply from your current lane.","zh":"任何情况下都不能进入自行车道，从本车道直接急转。"},{"en":"Make sure it is safe, enter the bike lane, then turn.","zh":"确认安全后进入自行车道，然后转弯。"},{"en":"Drive in the bike lane for the whole block before the turn.","zh":"提前一整个街区就开进自行车道行驶。"}],"answer_index":2,"explanation_zh":"在设计和标线允许为转弯驶入自行车道时，先打灯、查看后视镜与右侧盲区，礼让骑车人，确认安全后再驶入并转弯。带实体隔离的自行车道须按其标志、信号和设计通行，不能一概提前开进去。","explanation_en":"Where the design and markings permit entering the bike lane to turn, signal, check mirrors and the right blind spot, yield to cyclists, then enter only when safe and turn. Follow any separate signs or signals at protected lanes.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-19","group":"RB","section":"rules","topic_zh":"骑车人手势","question_en":"A cyclist ahead of you extends their right arm straight out to the side. What is the cyclist signalling?","question_zh":"你前方的骑车人把右臂向身体侧面伸直。骑车人在示意什么？","options":[{"en":"Slowing down or stopping","zh":"减速或停车"},{"en":"That it is safe for you to pass","zh":"你可以安全超车"},{"en":"A left turn","zh":"左转"},{"en":"A right turn","zh":"右转"}],"answer_index":3,"explanation_zh":"要留意骑车人的手势：手册指出，骑车人可以向侧面伸直右臂来表示右转。","explanation_en":"An extended right arm signals a right turn.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RB-20","group":"RB","section":"signs","topic_zh":"自行车停车框","question_en":"At an intersection with traffic lights, this marking is painted on the road and your light is red. Where should you stop your car?","question_zh":"在有信号灯的路口，路面上画有这种标线，你面前是红灯。你应该把车停在哪里？","options":[{"en":"Inside the box, as close to the intersection as possible","zh":"停在方框内，尽量靠近路口"},{"en":"With your front wheels on the box's front line","zh":"前轮
