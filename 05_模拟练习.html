压在方框的前边线上"},{"en":"Behind the box, leaving it clear","zh":"停在方框后方，不进入方框"},{"en":"In the bike lane beside the box","zh":"停在方框旁边的自行车道上"}],"answer_index":2,"explanation_zh":"这是自行车停车框（bike box），用来减少路口机动车与自行车之间的碰撞。因信号灯停车时，驾驶者必须停在框的后方，不能停在框内。","explanation_en":"At a bike box, drivers stop behind the box, never in it.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"https://files.ontario.ca/diagram2-13.jpg","sign_desc_en":"Diagram: a box painted on the road at an intersection, with a white bicycle symbol inside.","sign_desc_zh":"示意图：路口路面上画的一个方框，框内有白色自行车图案。","difficulty":"medium"},{"id":"RB-21","group":"RB","section":"signs","topic_zh":"共享车道标线","question_en":"What does this pavement marking mean?","question_zh":"这个路面标线是什么意思？","options":[{"en":"Bicycles are prohibited in this lane.","zh":"该车道禁止自行车通行。"},{"en":"The lane is for bicycles only.","zh":"该车道仅供自行车使用。"},{"en":"Cyclists must yield to cars in this lane.","zh":"在该车道内，骑车人必须给汽车让行。"},{"en":"Vehicles and bicycles share this lane.","zh":"机动车和自行车共用该车道。"}],"answer_index":3,"explanation_zh":"这是共享车道标线（sharrow）：自行车图案上方画两个 V 形标记，表示机动车和自行车都可能在该车道内行驶，提醒驾驶者留意车道内的骑车人。","explanation_en":"A sharrow means the lane is shared by vehicles and bicycles.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"https://files.ontario.ca/diagram2-14.jpg","sign_desc_en":"Pavement marking in a travel lane: two chevrons painted above a bicycle symbol.","sign_desc_zh":"行车道上的路面标线：自行车图案上方画有两个 V 形标记。","difficulty":"medium"},{"id":"RB-22","group":"RB","section":"rules","topic_zh":"开车门","question_en":"You are parked at the side of the road and want to get out. What should you do before opening your door?","question_zh":"你把车停在路边，准备下车。开车门之前应该做什么？","options":[{"en":"Look behind you and check your mirrors and blind spot for cyclists.","zh":"回头看，并检查后视镜和盲区有没有骑车人经过。"},{"en":"Open the door a little first, then look for traffic.","zh":"先把车门推开一点，再看有没有来车。"},{"en":"Check only the side mirror, since cyclists stay in the bike lane.","zh":"只看车外后视镜，因为骑车人都在自行车道里。"},{"en":"Turn on your hazard lights; cyclists must then stop.","zh":"打开危险警告灯（双闪），骑车人就必须停下。"}],"answer_index":0,"explanation_zh":"在路边停车后，开车门前要回头看，并检查后视镜和盲区，确认没有骑车人正从旁边经过。","explanation_en":"Look back and check mirrors and blind spots for cyclists before opening a door.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RB-23","group":"RB","section":"rules","topic_zh":"摩托车","question_en":"A motorcycle ahead of you is riding near the left side of the lane, leaving space on its right. What should you do?","question_zh":"前方一辆摩托车靠车道左侧行驶，右侧留有空间。你应该怎么做？","options":[{"en":"Pass it within the same lane, using the space on its right.","zh":"利用它右侧的空间，在同一车道内超越它。"},{"en":"Drive alongside it, since two vehicles fit in one lane.","zh":"与它并排行驶，因为一条车道能容下两辆车。"},{"en":"Treat it like any other vehicle; it uses a full lane.","zh":"像对待其他车辆一样对待它，它占用整条车道。"},{"en":"Flash your lights so the rider moves to the shoulder.","zh":"闪灯示意骑手开到路肩上。"}],"answer_index":2,"explanation_zh":"手册指出，摩托车使用整条车道，应像对待其他车辆一样对待它，因此不要与它并排共用一条车道，也不要在同一车道内超越它。","explanation_en":"Motorcycles use a full lane; treat them like any other vehicle.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-24","group":"RB","section":"rules","topic_zh":"摩托车","question_en":"You want to turn left. An oncoming motorcycle has its turn signal flashing. What should you do?","question_zh":"你准备左转，对向驶来的一辆摩托车开着转向灯。你应该怎么做？","options":[{"en":"Turn immediately, because the motorcycle is going to turn.","zh":"立即转弯，因为摩托车要转弯了。"},{"en":"Sound your horn to confirm the rider's intention.","zh":"按喇叭确认骑手的意图。"},{"en":"Turn, since motorcycles must yield to left-turning vehicles.","zh":"直接转弯，因为摩托车必须给左转车辆让行。"},{"en":"Wait until you are sure it is really turning.","zh":"等确定它真的在转弯后再左转。"}],"answer_index":3,"explanation_zh":"许多摩托车的转向灯不会自动关闭，骑手可能只是忘了关。在打着转向灯的对向摩托车前左转要格外小心，先确认它确实在转弯。","explanation_en":"Motorcycle signals may not self-cancel, so confirm the rider is actually turning.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-25","group":"RB","section":"rules","topic_zh":"大型车辆盲区","question_en":"You are driving beside a tractor-trailer. Which clue tells you the truck driver probably cannot see you?","question_zh":"你在一辆半挂车旁边行驶。下列哪种情况说明货车司机很可能看不到你？","options":[{"en":"You can't see the driver's face in the truck's side-view mirror.","zh":"你在货车的侧后视镜里看不到司机的脸。"},{"en":"The truck's turn signal is not on.","zh":"货车没有打转向灯。"},{"en":"Your own headlights are switched on.","zh":"你自己的前大灯开着。"},{"en":"The truck is travelling below the speed limit.","zh":"货车行驶速度低于限速。"}],"answer_index":0,"explanation_zh":"大型商用车两侧都有很大的盲区，你在其正后方时司机也看不到你。如果你在它的侧后视镜里看不到司机的脸，司机就看不到你。","explanation_en":"If you can't see the driver's face in the truck's mirror, the driver can't see you.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RB-26","group":"RB","section":"rules","topic_zh":"超越大型车辆","question_en":"You have just passed a large truck. When should you move back into its lane?","question_zh":"你刚超越一辆大货车。什么时候并回它所在的车道？","options":[{"en":"Right away, then tap your brakes so the driver notices you","zh":"立刻并回，再轻点一下刹车让司机注意到你"},{"en":"As soon as your rear bumper is past the truck's front bumper","zh":"你的后保险杠一超过货车前保险杠就并回"},{"en":"Only after leaving plenty of room in front of the truck","zh":"在货车前方留出足够空间后再并回"},{"en":"Whenever the truck slows down to let you in","zh":"等货车减速让你进去时再并回"}],"answer_index":2,"explanation_zh":"大型商用车的停车距离比小型车长得多。超越后紧贴着切到它前面，会压缩它安全停车所需的缓冲空间，因此超越大型车辆时要留出更多空间。","explanation_en":"Large vehicles need much longer to stop, so leave plenty of room before cutting in.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-27","group":"RB","section":"rules","topic_zh":"大型车辆转弯","question_en":"A large truck ahead of you in the right lane signals a right turn and swings out to the left, leaving a gap along the curb. What should you do?","question_zh":"你前方右侧车道上的一辆大货车打了右转灯，先向左摆宽，在路缘一侧空出了一段空间。你应该怎么做？","options":[{"en":"Stay well back until the truck has completely cleared the lane.","zh":"在后方保持足够距离，等货车完全驶离该车道。"},{"en":"Move up into the gap and turn right beside the truck.","zh":"开进空出来的位置，在货车旁边右转。"},{"en":"Pass the truck on the right before it completes the turn.","zh":"趁货车还没转完，从它右侧超越。"},{"en":"Sound your horn to tell the driver you are by the curb.","zh":"按喇叭，告诉司机你在路缘一侧。"}],"answer_index":0,"explanation_zh":"大型车辆右转时可能需要先向左摆宽，以免撞到右侧路缘。车头转过路口后，车身其余部分会部分回到右侧车道，你若开进那片空间，就会被夹在挂车和路缘之间，所以应在后方等它完全驶离该车道。","explanation_en":"Stay back; a turning truck can squeeze you between its trailer and the curb.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-28","group":"RB","section":"rules","topic_zh":"大型车辆","question_en":"You are stopped behind a large truck at a traffic light. Why should you leave plenty of room in front of your vehicle?","question_zh":"遇红灯时，你停在一辆大货车后面。为什么要在车前留出足够空间？","options":[{"en":"So you can pass it on the shoulder when the light turns green","zh":"以便绿灯时从路肩超越它"},{"en":"The truck may roll back when the driver releases the brakes","zh":"司机松开刹车时，货车可能向后溜"},{"en":"Truck drivers must back up slightly to check behind them","zh":"货车司机起步前必须稍微倒车查看后方"},{"en":"Large trucks accelerate faster than cars","zh":"大货车起步加速比轿车快"}],"answer_index":1,"explanation_zh":"停在大型车辆后面时要留足空间：大型车辆停车后，司机松开刹车时车辆可能向后溜。","explanation_en":"A large vehicle may roll back when its brakes are released.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RB-29","group":"RB","section":"rules","topic_zh":"大型车辆","question_en":"When you pass a large vehicle, what can affect your control of your own vehicle?","question_zh":"超越大型车辆时，下列哪种因素可能影响你对自己车辆的控制？","options":[{"en":"Strong air turbulence created by the large vehicle","zh":"大型车辆造成的强烈气流扰动"},{"en":"Radio interference from the truck's equipment","zh":"货车设备产生的无线电干扰"},{"en":"Glare from the truck's reflective markings","zh":"货车反光标识造成的眩光"},{"en":"Heat from the truck's exhaust","zh":"货车排气管散发的热量"}],"answer_index":0,"explanation_zh":"受气压和气流等因素影响，大型车辆会产生强烈的气流扰动，超越时可能影响你对车辆的控制。此外，恶劣天气中它还会溅起泥水、雪和杂物，暂时挡住你的视线。","explanation_en":"Air turbulence from a large vehicle can affect your control when passing.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-30","group":"RB","section":"rules","topic_zh":"公交车","question_en":"You are driving in the lane next to a bus bay. A bus in the bay starts flashing its left-turn signals. What must you do?","question_zh":"你在紧邻公交港湾（bus bay）的车道上行驶，港湾里的公交车开始闪左转向灯。你必须怎么做？","options":[{"en":"Speed up to get past before the bus pulls out","zh":"加速，赶在公交车驶出前开过去"},{"en":"Sound your horn to warn the bus driver","zh":"按喇叭提醒公交车司机"},{"en":"Allow the bus to re-enter traffic","zh":"让公交车驶回车流"},{"en":"Continue; a bus in a bay must wait for a gap in traffic","zh":"继续行驶，港湾里的公交车必须等车流出现空当"}],"answer_index":2,"explanation_zh":"港湾里的公交车闪左转向灯，表示准备驶离港湾；在相邻车道驶近的驾驶者必须让它重新驶入车流。","explanation_en":"You must let a bus signalling from a bus bay re-enter traffic.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-31","group":"RB","section":"rules","topic_zh":"农用机械","question_en":"You are following a large tractor towing a wagon on a rural road. What should you be prepared for?","question_zh":"你在乡村道路上跟在一辆拖着拖斗的大型拖拉机后面。你应该对什么情况有所准备？","options":[{"en":"It may turn directly into a field rather than onto a road.","zh":"它可能直接转进田地，而不是转进道路。"},{"en":"It will always pull onto the shoulder to let you pass.","zh":"它总会开到路肩上让你超车。"},{"en":"It is not allowed on the road after dark.","zh":"天黑后它不允许上路。"},{"en":"It will reach the posted speed limit once on pavement.","zh":"一上铺装路面，它就会提速到限速。"}],"answer_index":0,"explanation_zh":"农用机械很慢（多数拖拉机和联合收割机最高时速 40 km/h，拖带农具或拖斗时更慢），车身宽、长，司机不易看到后方来车，还常直接转进田地或在车道间移动。播种和收获旺季，天黑后在路上遇到农用机械也很常见。","explanation_en":"Farm machinery is slow and may turn directly into fields.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-32","group":"RB","section":"rules","topic_zh":"马车","question_en":"A horse-drawn buggy is coming toward you from the opposite direction on a two-lane road. What should you do?","question_zh":"在双车道道路上，一辆马车从对面驶来。你应该怎么做？","options":[{"en":"Sound your horn so the driver keeps the horse to the side","zh":"按喇叭，让驾车人把马控制在路边"},{"en":"Flash your high beams to warn the driver","zh":"闪远光灯提醒驾车人"},{"en":"Speed up to reduce the time you spend near the horse","zh":"加速驶过，缩短靠近马匹的时间"},{"en":"Move to the far right of your lane","zh":"移到本车道的最右侧"}],"answer_index":3,"explanation_zh":"迎面遇到马车时，应移到本车道最右侧，并减速、格外小心；马受惊可能在路上突然改变方向。","explanation_en":"Move to the far right of your lane when meeting a horse-drawn vehicle.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-33","group":"RB","section":"rules","topic_zh":"马车","question_en":"You are about to pass a horse-drawn vehicle travelling in your direction. What does the handbook advise?","question_zh":"你准备超越一辆同向行驶的马车。手册的建议是什么？","options":[{"en":"Pass close to it so you spend less time in the oncoming lane.","zh":"贴近马车超越，缩短在对向车道停留的时间。"},{"en":"Sound your horn as you pass so the horse knows you are there.","zh":"超越时按喇叭，让马知道你在旁边。"},{"en":"Leave as much space between you and the buggy as possible.","zh":"在你和马车之间留出尽可能大的距离。"},{"en":"Pass on the right, using the shoulder.","zh":"借用路肩从右侧超越。"}],"answer_index":2,"explanation_zh":"跟在马车后要保持安全距离，只在安全时超越，并尽量拉开横向距离。超越时离得太近可能惊吓马匹，使它在路上突然转向。","explanation_en":"Give a horse-drawn vehicle as much room as possible when passing.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-34","group":"RB","section":"rules","topic_zh":"校车","question_en":"A school bus ahead has its overhead amber lights flashing. What does this mean?","question_zh":"前方校车顶部的琥珀色（黄色）灯在闪烁。这是什么意思？","options":[{"en":"It has finished loading and is about to pull away.","zh":"校车已完成上下客，准备开走。"},{"en":"It is preparing to stop; slow down and be ready to stop.","zh":"校车准备停车，你要减速并做好停车准备。"},{"en":"You must already be stopped 20 metres behind it.","zh":"你此时必须已在校车后方 20 米处停好。"},{"en":"It is turning, so you may pass it on the left.","zh":"校车要转弯，你可以从左侧超越它。"}],"answer_index":1,"explanation_zh":"校车顶部琥珀色灯闪烁，表示它即将停车上下乘客。无论你在校车后方还是迎面驶来，都要减速并做好停车准备；在有中央隔离带的道路上，只有校车后方的车辆需要准备停车。","explanation_en":"Flashing amber lights mean the bus is about to stop; slow down and prepare to stop.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-35","group":"RB","section":"rules","topic_zh":"应急车辆","question_en":"When a fire vehicle is responding to an alarm, it is illegal to follow it within what distance?","question_zh":"消防车执行警报任务时，跟在它后方多少米以内是违法的？","options":[{"en":"150 metres","zh":"150 米"},{"en":"100 metres","zh":"100 米"},{"en":"300 metres","zh":"300 米"},{"en":"50 metres","zh":"50 米"}],"answer_index":0,"explanation_zh":"应急车辆驶过后，确认安全并打转向灯再并回车流，同时留意可能还有其他应急车辆。跟在执行警报任务的消防车后方 150 米以内是违法的。","explanation_en":"Do not follow within 150 metres of a fire vehicle answering an alarm.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-36","group":"RB","section":"rules","topic_zh":"减速换道（move over）","question_en":"On a highway with two lanes in your direction, you approach a tow truck stopped on the right with its amber lights flashing. What does the law require?","question_zh":"在你行驶方向有两条车道的公路上，你驶近一辆停在右侧、闪着琥珀色灯的清障车（tow truck）。法律要求你怎么做？","options":[{"en":"Nothing special; this law covers only police, fire and ambulance.","zh":"没有特别要求，这条法律只适用于警车、消防车和救护车。"},{"en":"Slow down, use caution and, if safe, move over a lane.","zh":"减速、谨慎通过，在安全的情况下换到远离它的车道。"},{"en":"Stop behind the tow truck until it leaves.","zh":"停在清障车后面，等它离开。"},{"en":"Keep your speed but sound your horn as you pass.","zh":"保持车速，但经过时按喇叭。"}],"answer_index":1,"explanation_zh":"同向驶近闪着红灯（或红蓝灯）停着的应急车辆，或闪着琥珀色灯停着的清障车时，必须减速并谨慎通过；同向有两条或以上车道时，在安全的情况下还必须换到远离它的车道。","explanation_en":"Slow down for a stopped tow truck with flashing amber lights and, if safe, move over a lane.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-particular-situations","source_title":"MTO 手册 · Dealing with particular situations","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-37","group":"RB","section":"rules","topic_zh":"扫雪车","question_en":"On a freeway, several snow plows with flashing blue lights are staggered across all lanes, clearing snow together. What should you do?","question_zh":"在高速公路上，几辆闪着蓝灯的扫雪车错开排列，同时清扫所有车道。你应该怎么做？","options":[{"en":"Pass between the plows when a gap opens.","zh":"一出现空隙就从扫雪车之间穿过。"},{"en":"Stay back and do not try to pass between them.","zh":"留在后方，不要试图从它们之间穿过。"},{"en":"Pass on the shoulder to the right of the last plow.","zh":"从最后一辆扫雪车右侧的路肩超越。"},{"en":"Follow one plow closely so its driver can see you.","zh":"紧跟在一辆扫雪车后面，让司机看到你。"}],"answer_index":1,"explanation_zh":"扫雪车装有 150 米外可见的蓝色闪灯，提示这是又宽又慢的车辆，有的侧翼向右伸出可达 3 米。几辆扫雪车错开清扫时，切勿从它们之间穿过：空间不足，湿雪埂还可能使车辆失控。","explanation_en":"Never try to pass between staggered snow plows.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-38","group":"RB","section":"rules","topic_zh":"转弯时的行人安全","question_en":"At intersections, pedestrians are hit far more often by vehicles making which kind of turn?","question_zh":"在路口，行人被哪种转弯的车辆撞到的次数要多得多？","options":[{"en":"Right turns","zh":"右转"},{"en":"Right turns on a red light","zh":"红灯右转"},{"en":"Left and right turns equally","zh":"左转和右转一样多"},{"en":"Left turns","zh":"左转"}],"answer_index":3,"explanation_zh":"被左转车辆撞到的行人远多于右转车辆，因为双方都在看别处：司机忙于应对路口，而过街行人在看正前方。","explanation_en":"Many more pedestrians are hit by left-turning cars than right-turning cars because both the driver and the pedestrian are looking elsewhere.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-39","group":"RB","section":"rules","topic_zh":"与大型货车共用道路","question_en":"According to recent data cited in the handbook, most deaths in collisions involving large commercial trucks result from what?","question_zh":"根据手册引用的最新数据，涉及大型商用货车的碰撞中，大多数死亡是由什么造成的？","options":[{"en":"The other driver's actions","zh":"另一方司机的行为"},{"en":"The truck driver's actions","zh":"货车司机的行为"},{"en":"Mechanical failure of the truck","zh":"货车机械故障"},{"en":"Poor weather and road conditions","zh":"恶劣天气和路况"}],"answer_index":0,"explanation_zh":"数据显示，涉及大型商用货车的碰撞死亡，多数不是货车司机造成的，而是另一方司机的行为所致，所以要了解大型车辆的能力和局限。","explanation_en":"Recent data show most deaths in collisions with large trucks result from the other driver's actions, not the truck driver's.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RB-40","group":"RB","section":"rules","topic_zh":"与大型货车共用道路","question_en":"Why should you avoid tailgating a large truck?","question_zh":"为什么不应紧跟在大型货车后面行驶？","options":[{"en":"Its brake lights are mounted too high for drivers behind to see","zh":"它的刹车灯装得太高，后车看不到"},{"en":"The driver can't see you, and you have nowhere to go if it stops","zh":"货车司机看不到你，而且它一旦急停你无处可躲"},{"en":"The truck driver may think you want to pass and pull onto the shoulder","zh":"货车司机可能以为你要超车而驶上路肩"},{"en":"Following closely is only a problem when the truck is making a turn","zh":"只有货车转弯时紧跟才有问题"}],"answer_index":1,"explanation_zh":"大型车辆两侧都有很大的盲区。紧跟在正后方时货车司机看不到你，一旦货车急停你也无处可躲。","explanation_en":"Directly behind a large truck the driver cannot see you, and if it stops suddenly you have nowhere to go.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RB-41","group":"RB","section":"rules","topic_zh":"与骑车人共享道路","question_en":"Cyclists travelling slower than other traffic are expected to ride near the right side of the road. In which situation is a cyclist NOT required to ride close to the right edge?","question_zh":"比其他车辆慢的骑车人通常应靠近道路右侧骑行。在下列哪种情况下，骑车人不必紧靠道路右边缘骑行？","options":[{"en":"When getting into position to turn left","zh":"正在调整到左转位置、准备左转时"},{"en":"When riding slower than other traffic on a straight road","zh":"在直路上比其他车辆骑得慢时"},{"en":"When riding at night with a front light on","zh":"夜间开着前灯骑行时"},{"en":"When the posted speed limit is 50 km/h or less","zh":"限速标志为50公里/小时或以下时"}],"answer_index":0,"explanation_zh":"骑车人以等于或高于当时当地正常车流的速度骑行，或正在左转、准备左转时，不必紧靠道路右边缘。速度较慢的骑车人通常应离路缘或停放车辆约1米骑行。","explanation_en":"Cyclists need not ride close to the right edge when travelling at or above the normal speed of traffic, or when turning or preparing to turn left.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/sharing-road-other-road-users","source_title":"MTO 手册 · Sharing the road with other road users","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-01","group":"RC","section":"rules","topic_zh":"无控制路口","question_en":"Two vehicles coming from different roads reach an intersection that has no signs or traffic lights at the same time. Which driver must yield?","question_zh":"两辆车从不同道路同时到达一个既没有标志也没有信号灯的路口。哪位驾驶员必须让行？","options":[{"en":"The driver on the right","zh":"右侧的驾驶员"},{"en":"The driver who is going straight","zh":"直行的驾驶员"},{"en":"The driver on the narrower road","zh":"位于较窄道路上的驾驶员"},{"en":"The driver on the left","zh":"左侧的驾驶员"}],"answer_index":3,"explanation_zh":"在无控制路口（没有标志或信号灯），两车同时到达时，左侧车辆必须让右侧车辆先行，这就是让出先行权。","explanation_en":"At an uncontrolled intersection, when two vehicles arrive together, the driver on the left yields to the driver on the right.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-through-intersections","source_title":"MTO 手册 · Driving through intersections","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-02","group":"RC","section":"rules","topic_zh":"无控制路口","question_en":"At an intersection with no signs or lights, a vehicle approaching from your left clearly gets there before you. Who has the right-of-way?","question_zh":"在没有标志和信号灯的路口，一辆从你左侧驶来的车明显比你先到达。谁拥有先行权？","options":[{"en":"You, because you are on the other driver's right","zh":"你，因为你在对方的右侧"},{"en":"The vehicle that arrived first","zh":"先到达路口的那辆车"},{"en":"Whichever vehicle is travelling faster","zh":"车速较快的那辆车"},{"en":"You, as long as you are going straight","zh":"你，只要你是直行"}],"answer_index":1,"explanation_zh":"在无控制路口，必须让比你先到达路口的车辆先行；「让右侧车先行」只适用于两车同时到达的情况。","explanation_en":"You must yield to a vehicle that reaches an uncontrolled intersection before you; the yield-to-the-right rule applies only to simultaneous arrivals.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-through-intersections","source_title":"MTO 手册 · Driving through intersections","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-03","group":"RC","section":"rules","topic_zh":"全向停车路口","question_en":"At an intersection with stop signs at all corners, you and the driver on your right come to a complete stop at the same moment. What should happen?","question_zh":"在四个路角都设有停车标志的路口，你和你右侧的车同时完全停下。应该怎么做？","options":[{"en":"You go first, because you are on the left","zh":"你先走，因为你在左侧"},{"en":"Whoever is going straight goes first","zh":"直行的一方先走"},{"en":"You yield and let the driver on your right go first","zh":"你让行，让右侧的驾驶员先走"},{"en":"You wait for the other driver to wave you through","zh":"你等对方挥手示意你先走"}],"answer_index":2,"explanation_zh":"在全向停车路口，两车同时停稳时，左侧车辆必须让右侧车辆先行。","explanation_en":"At an all-way stop, if two vehicles stop at the same time, the vehicle on the left yields to the one on the right.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-through-intersections","source_title":"MTO 手册 · Driving through intersections","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-04","group":"RC","section":"rules","topic_zh":"全向停车路口","question_en":"Several vehicles arrive one after another at an intersection with stop signs at all four corners. Which vehicle has the right-of-way?","question_zh":"几辆车先后来到四个路角都设有停车标志的路口。哪辆车拥有先行权？","options":[{"en":"The first one to come to a complete stop","zh":"最先完全停稳的那辆车"},{"en":"The one travelling on the wider road","zh":"行驶在较宽道路上的那辆车"},{"en":"The one that turns on its signal first","zh":"最先打开转向灯的那辆车"},{"en":"The largest one, such as a truck","zh":"体积最大的车，例如卡车"}],"answer_index":0,"explanation_zh":"在全向停车路口，必须让最先完全停稳的车辆先行。","explanation_en":"At an all-way stop, the first vehicle to come to a complete stop has the right-of-way.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-through-intersections","source_title":"MTO 手册 · Driving through intersections","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-05","group":"RC","section":"signs","topic_zh":"交通信号灯","question_en":"You are approaching an intersection where the light has been green for some time. What should you be prepared to do?","question_zh":"你正驶近一个绿灯已经亮了一段时间的路口。你应该做好什么准备？","options":[{"en":"Speed up so you clear the intersection before it changes","zh":"加速，在信号灯变化前通过路口"},{"en":"Slow to a crawl until the light changes","zh":"把车速降到极低，直到信号灯变化"},{"en":"Keep going even on yellow, since yellow still means go","zh":"即使变黄灯也继续走，因为黄灯仍表示可以通行"},{"en":"Be ready to stop if the light turns yellow","zh":"做好在信号灯变黄时停车的准备"}],"answer_index":3,"explanation_zh":"绿灯已亮一段时间，随时可能变黄，应做好变黄灯时停车的准备；只有离路口太近、无法安全停车时，才谨慎通过。","explanation_en":"A green light that has been on for a while may soon turn yellow, so be prepared to stop.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-through-intersections","source_title":"MTO 手册 · Driving through intersections","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-06","group":"RC","section":"signs","topic_zh":"交通信号灯","question_en":"The light turns yellow just as you reach the intersection, and you are too close to stop safely. What should you do?","question_zh":"你刚到路口时信号灯变成黄灯，而你离得太近、无法安全停车。你应该怎么做？","options":[{"en":"Brake hard and stop, even if you end up in the crosswalk","zh":"急刹车停下，即使会停在人行横道上"},{"en":"Continue through the intersection with caution","zh":"谨慎地继续通过路口"},{"en":"Accelerate hard to beat the red light","zh":"猛加速抢在红灯前通过"},{"en":"Stop inside the intersection and wait there","zh":"在路口中间停下等待"}],"answer_index":1,"explanation_zh":"黄灯时一般应准备停车，但如果已离路口太近、无法安全停下，应谨慎通过路口，而不是急刹车或加速抢灯。","explanation_en":"If you are too close to stop safely when the light turns yellow, drive through the intersection with caution.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-through-intersections","source_title":"MTO 手册 · Driving through intersections","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-07","group":"RC","section":"rules","topic_zh":"路口通行","question_en":"You are going straight on a main road with a green light, but traffic is backed up into the intersection ahead. What should you do?","question_zh":"你在主路上绿灯直行，但前方车流已排进路口，把路口堵住了。你应该怎么做？","options":[{"en":"Enter the intersection and wait there, since your light is green","zh":"驶入路口并在里面等待，因为你是绿灯"},{"en":"Use the right shoulder to get around the stopped traffic","zh":"利用右侧路肩绕过停下的车流"},{"en":"Stay out of the intersection until traffic ahead moves on","zh":"停在路口外，等前方车辆驶离后再进入"},{"en":"Sound your horn to get the traffic ahead moving","zh":"按喇叭催促前方车辆移动"}],"answer_index":2,"explanation_zh":"在主路上驶近被车流堵住的路口时，应在进入路口之前停车，等前方车辆驶离后再走；正在左转或右转的车辆不受此限。","explanation_en":"When an intersection is blocked by traffic, stop before entering and wait for traffic ahead to clear (turning vehicles excepted).","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-through-intersections","source_title":"MTO 手册 · Driving through intersections","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-08","group":"RC","section":"signs","topic_zh":"停车标志","question_en":"You reach a stop sign and no other vehicles or pedestrians are in sight. What must you do?","question_zh":"你来到一个停车标志前，周围看不到其他车辆或行人。你必须怎么做？","options":[{"en":"Slow to walking speed, then continue if the road is empty","zh":"减速到步行速度，路上没人就继续行驶"},{"en":"Stop only if you plan to turn at the intersection","zh":"只有在路口要转弯时才停车"},{"en":"Sound your horn and roll through slowly","zh":"按喇叭后缓慢滑行通过"},{"en":"Come to a complete stop, then go when the way is clear","zh":"完全停车，确认安全后再通过"}],"answer_index":3,"explanation_zh":"停车标志要求必须完全停车（全停），确认道路安全后才能通过，即使周围没有其他车辆或行人也一样。","explanation_en":"A stop sign always requires a complete stop; proceed only when the way is clear.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-through-intersections","source_title":"MTO 手册 · Driving through intersections","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-09","group":"RC","section":"rules","topic_zh":"驶出私人车道","question_en":"You are driving out of a private driveway that crosses a sidewalk. The road is clear, but a pedestrian is walking along the sidewalk toward your driveway. What should you do?","question_zh":"你正从一条横穿人行道的私人车道驶出。道路上没有车，但有一名行人正沿人行道朝你的车道走来。你应该怎么做？","options":[{"en":"Drive out first, since the pedestrian can see your vehicle","zh":"先开出去，因为行人看得见你的车"},{"en":"Sound your horn to warn the pedestrian, then drive out","zh":"按喇叭提醒行人，然后开出去"},{"en":"Wait for the pedestrian to pass before driving out","zh":"等行人走过后再驶出"},{"en":"Drive out, since only road traffic has the right-of-way over you","zh":"直接开出去，因为只有道路上的车辆比你有先行权"}],"answer_index":2,"explanation_zh":"从私人道路或私人车道驶入道路时，必须让道路上的车辆和人行道上的行人先行，所以要等行人走过后再驶出。","explanation_en":"When entering a road from a private road or driveway, yield to vehicles on the road and pedestrians on the sidewalk.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-through-intersections","source_title":"MTO 手册 · Driving through intersections","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-10","group":"RC","section":"rules","topic_zh":"先行权","question_en":"You have turned on your signal to move into another lane. What does signalling give you?","question_zh":"你已打开转向灯，准备变换到另一条车道。打转向灯能让你获得什么？","options":[{"en":"The right-of-way over drivers already in that lane","zh":"优先于该车道上已有车辆的先行权"},{"en":"The right-of-way once it has flashed for three seconds","zh":"转向灯闪烁三秒后即获得先行权"},{"en":"No right-of-way; you must still make sure the way is clear","zh":"不能获得先行权，你仍须确认安全"},{"en":"The right-of-way over cyclists, but not over cars","zh":"对骑车人有先行权，但对汽车没有"}],"answer_index":2,"explanation_zh":"打转向灯并不给你先行权，你仍必须确认道路安全；即使你打了灯，其他驾驶员也会预期你让行。","explanation_en":"Signalling never gives you the right-of-way; you must still make sure the way is clear.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-through-intersections","source_title":"MTO 手册 · Driving through intersections","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-11","group":"RC","section":"rules","topic_zh":"停车位置","question_en":"You must stop at an intersection that has a crosswalk but no stop line painted on the road. Where should you stop?","question_zh":"你需要在一个有人行横道、但路面上没有画停车线的路口停车。你应该停在哪里？","options":[{"en":"At the edge of the intersection","zh":"路口边缘"},{"en":"At the crosswalk","zh":"人行横道前"},{"en":"At the edge of the sidewalk","zh":"人行道边缘"},{"en":"Wherever you get the best view of cross traffic","zh":"任何能最清楚看到横向车流的位置"}],"answer_index":1,"explanation_zh":"有停车线时停在停车线前；没有停车线时停在人行横道前（无论人行横道是否画有标线）；没有人行横道才停在人行道边缘；连人行道也没有则停在路口边缘。","explanation_en":"With no stop line, stop at the crosswalk, whether it is marked or not.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/stopping","source_title":"MTO 手册 · Stopping","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-12","group":"RC","section":"rules","topic_zh":"停车位置","question_en":"On a rural road, an intersection with a stop sign has no stop line, no crosswalk and no sidewalk. Where should you stop?","question_zh":"在一条乡村道路上，一个设有停车标志的路口没有停车线、没有人行横道，也没有人行道。你应该停在哪里？","options":[{"en":"About ten metres before the stop sign","zh":"停车标志前约十米处"},{"en":"In line with the stop sign post","zh":"与停车标志杆平齐处"},{"en":"At the edge of the intersection","zh":"路口边缘"},{"en":"Partway into the intersection so you can see","zh":"驶入路口一部分，以便看清路况"}],"answer_index":2,"explanation_zh":"停车位置的顺序是：停车线 → 人行横道 → 人行道边缘 → 路口边缘。三者都没有时，应停在路口边缘，确认安全后再进入路口。","explanation_en":"If there is no stop line, crosswalk or sidewalk, stop at the edge of the intersection.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/stopping","source_title":"MTO 手册 · Stopping","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-13","group":"RC","section":"rules","topic_zh":"铁路道口","question_en":"What is the longest distance a train may need to stop under full emergency braking?","question_zh":"火车全力紧急制动时，最长可能需要多远的距离才能停下？","options":[{"en":"300 metres","zh":"300 米"},{"en":"1 kilometre","zh":"1 公里"},{"en":"2 kilometres","zh":"2 公里"},{"en":"5 kilometres","zh":"5 公里"}],"answer_index":2,"explanation_zh":"火车紧急制动时可能需要长达 2 公里才能停下，所以绝不能与火车抢道。","explanation_en":"A train under full emergency braking can take up to two kilometres to stop.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/stopping","source_title":"MTO 手册 · Stopping","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-14","group":"RC","section":"rules","topic_zh":"铁路道口","question_en":"A train is approaching a railway crossing. You must stop at least how far from the nearest rail or gate?","question_zh":"有火车正驶近铁路道口。你必须在距离最近的铁轨或栏杆至少多远处停车？","options":[{"en":"2 metres","zh":"2 米"},{"en":"5 metres","zh":"5 米"},{"en":"10 metres","zh":"10 米"},{"en":"20 metres","zh":"20 米"}],"answer_index":1,"explanation_zh":"有火车驶来时，必须在距最近铁轨或栏杆至少 5 米处停车，确认所有火车都通过后才能过道口。","explanation_en":"When a train is coming, stop at least five metres from the nearest rail or gate.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/stopping","source_title":"MTO 手册 · Stopping","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-15","group":"RC","section":"rules","topic_zh":"铁路道口","question_en":"After a train passes, the gate at a railway crossing begins to rise. When may you cross?","question_zh":"火车通过后，铁路道口的栏杆开始升起。你什么时候可以通过？","options":[{"en":"As soon as it starts to rise, if no other train is visible","zh":"栏杆刚开始升起、且看不到其他火车时"},{"en":"While it is still rising, by driving carefully around its end","zh":"栏杆仍在升起时，小心地从栏杆末端绕过去"},{"en":"When it is high enough for your vehicle to fit under","zh":"栏杆升到足以让车辆从下方通过的高度时"},{"en":"Once the lights stop flashing and the gate is fully up","zh":"信号灯停止闪烁且栏杆完全升起后"}],"answer_index":3,"explanation_zh":"有信号灯要等它停止闪烁，有栏杆要等它升起后才能通过；栏杆放下、正在下降或正在升起时绕行、钻过或冲过都是违法且危险的。","explanation_en":"Wait until the lights stop flashing and the gate rises; going around or under a gate that is down, lowering or rising is illegal.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/stopping","source_title":"MTO 手册 · Stopping","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-16","group":"RC","section":"rules","topic_zh":"铁路道口","question_en":"Traffic is slow and heavy just beyond a railway crossing. What should you do before driving onto the tracks?","question_zh":"铁路道口另一侧车流缓慢拥堵。驶上铁轨前你应该怎么做？","options":[{"en":"Make sure there is room on the far side to clear the tracks completely","zh":"确认对面有足够空间，能让车辆完全越过铁轨"},{"en":"Move onto the tracks and wait; traffic will clear before a train comes","zh":"先开上铁轨等待，火车来之前车流会疏通"},{"en":"Turn on your hazard lights and follow the vehicle ahead closely","zh":"打开双闪灯，紧跟前车通过"},{"en":"Shift to a lower gear while on the tracks so you can stop quickly","zh":"在铁轨上换低速挡，以便能快速停车"}],"answer_index":0,"explanation_zh":"应避免停在铁轨中间：交通拥堵时，先确认对面有足够空间让车辆完全越过铁轨再通过；过铁轨时也应避免换挡。","explanation_en":"Don't start across unless you have room to clear the tracks completely; avoid stopping or shifting gears on the tracks.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/stopping","source_title":"MTO 手册 · Stopping","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-17","group":"RC","section":"rules","topic_zh":"铁路道口","question_en":"Your vehicle stalls and becomes trapped on a railway crossing. What should you do?","question_zh":"你的车熄火，被困在铁路道口上。你应该怎么做？","options":[{"en":"Stay inside with seatbelts fastened and call for help","zh":"系好安全带留在车内求救"},{"en":"Keep trying to restart the engine until it starts","zh":"不断尝试重新启动发动机，直到启动为止"},{"en":"Turn on your hazard lights and wait for the train crew","zh":"打开双闪灯，等待火车工作人员"},{"en":"Get everyone out and away, then call the authorities","zh":"让所有人下车并远离车辆，然后联系有关部门"}],"answer_index":3,"explanation_zh":"被困在铁路道口时，应立即让车上所有人下车并远离车辆，到达安全地点后再联系有关部门。","explanation_en":"If trapped on a crossing, immediately get everyone out and away from the vehicle, then contact authorities.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/stopping","source_title":"MTO 手册 · Stopping","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-18","group":"RC","section":"rules","topic_zh":"校车","question_en":"You are following a school bus toward a railway crossing that has gates and signal lights. No train is coming. What should you expect the bus to do?","question_zh":"你跟在一辆校车后面驶向一个设有栏杆和信号灯的铁路道口，此时没有火车驶来。你应预计校车会怎么做？","options":[{"en":"Drive across without stopping, because the crossing has gates","zh":"不停车直接通过，因为道口有栏杆"},{"en":"Stop at the crossing and turn on its upper alternating red lights","zh":"在道口停车，并打开上方交替闪烁的红灯"},{"en":"Stop at the crossing without using its upper alternating red lights","zh":"在道口停车，但不使用上方交替闪烁的红灯"},{"en":"Stop only if the signal lights are flashing","zh":"只有信号灯闪烁时才停车"}],"answer_index":2,"explanation_zh":"校车在所有铁路道口都必须停车，不论是否有栏杆或信号灯；这类停车不使用上方交替闪烁的红灯，所以后车要格外留意，准备在其后停车。","explanation_en":"School buses stop at every railway crossing and do not use their upper alternating red lights for these stops.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/stopping","source_title":"MTO 手册 · Stopping","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RC-19","group":"RC","section":"rules","topic_zh":"铁路道口","question_en":"You approach a railway crossing that has a stop sign, and no train is in sight. What must you do?","question_zh":"你驶近一个设有停车标志的铁路道口，看不到火车。你必须怎么做？","options":[{"en":"Stop, unless a flagman directs you otherwise","zh":"停车，除非有旗手（flagman）另行指挥"},{"en":"Slow down and cross if no train is visible","zh":"减速，看不到火车就通过"},{"en":"Stop only if the signal lights are flashing","zh":"只有信号灯闪烁时才停车"},{"en":"Stop only if you are driving a bus","zh":"只有驾驶公共汽车时才需要停车"}],"answer_index":0,"explanation_zh":"设有停车标志的铁路道口必须停车，除非有旗手另行指挥；有些车流较少的道口就是用停车标志来控制的。","explanation_en":"At a railway crossing with a stop sign you must stop unless a flagman directs otherwise.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/stopping","source_title":"MTO 手册 · Stopping","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-20","group":"RC","section":"rules","topic_zh":"学校过街协管员","question_en":"A school crossing guard is holding up a red and white stop sign at a crossing. How long must you stay stopped?","question_zh":"学校过街协管员（school crossing guard）在过街处举起红白色停车牌。你必须停多久？","options":[{"en":"Until everyone, including the guard, has cleared the entire roadway","zh":"直到包括协管员在内的所有人都离开整条道路"},{"en":"Until the children have passed in front of your vehicle","zh":"直到孩子们走过你的车头"},{"en":"Until the children have crossed your half of the road","zh":"直到孩子们走过你这一侧的半幅道路"},{"en":"Until the guard lowers the sign, even if the guard is still on the road","zh":"直到协管员放下停车牌，即使协管员仍在路面上"}],"answer_index":0,"explanation_zh":"必须在过街处之前停车，并保持停车，直到包括协管员在内的所有人都离开整条道路、确认安全后再走；有疑问时就继续等待。","explanation_en":"Stay stopped until everyone, including the crossing guard, has cleared the entire roadway and it is safe.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/stopping","source_title":"MTO 手册 · Stopping","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-21","group":"RC","section":"rules","topic_zh":"扣分制度","question_en":"A driver who fails to stop as required for a school crossing guard can receive a substantial fine and how many demerit points?","question_zh":"未按规定为学校过街协管员停车的驾驶员，除可能被处以高额罚款外，还可能被扣多少分？","options":[{"en":"2 demerit points","zh":"扣 2 分"},{"en":"3 demerit points","zh":"扣 3 分"},{"en":"4 demerit points","zh":"扣 4 分"},{"en":"6 demerit points","zh":"扣 6 分"}],"answer_index":1,"explanation_zh":"不按要求为学校过街协管员停车，可能被处高额罚款并扣 3 分。（注意：不为校车停车是扣 6 分。）","explanation_en":"Failing to stop for a school crossing guard can bring a substantial fine and three demerit points.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/stopping","source_title":"MTO 手册 · Stopping","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-22","group":"RC","section":"rules","topic_zh":"校车","question_en":"You come up behind a stopped school bus with its upper red lights flashing. At least how far back must you stop?","question_zh":"你从后方驶近一辆停着且上方红灯正在闪烁的校车。你至少要在多远处停车？","options":[{"en":"5 metres","zh":"5 米"},{"en":"10 metres","zh":"10 米"},{"en":"20 metres","zh":"20 米"},{"en":"30 metres","zh":"30 米"}],"answer_index":2,"explanation_zh":"从校车后方驶来时，必须在距校车至少 20 米处停车，等校车开动或红灯停止闪烁后才能走。","explanation_en":"When coming from behind a stopped school bus with flashing red lights, stop at least 20 metres away.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/stopping","source_title":"MTO 手册 · Stopping","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-23","group":"RC","section":"rules","topic_zh":"校车","question_en":"On a two-lane road with no median, a school bus is stopped facing you with its upper red lights flashing. What must you do?","question_zh":"在一条没有中央隔离带的双车道道路上，一辆校车面向你停着，上方红灯正在闪烁。你必须怎么做？","options":[{"en":"Keep going slowly; only traffic behind the bus must stop","zh":"慢速继续行驶，只有校车后方的车辆才需要停车"},{"en":"Slow down, sound your horn and pass the bus carefully","zh":"减速、按喇叭，小心地驶过校车"},{"en":"Stop only if you see children standing beside the bus","zh":"只有看到孩子站在校车旁时才停车"},{"en":"Stop far enough back for children to cross in front of you","zh":"在安全距离外停车，让孩子能下车并从你车前过马路"}],"answer_index":3,"explanation_zh":"无论在校车后方还是迎面驶来都必须停车；迎面驶来时，要停在足够安全的距离，让孩子下车并从你车前过马路。","explanation_en":"Oncoming drivers on a road without a median must also stop, at a safe distance for children to cross.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/stopping","source_title":"MTO 手册 · Stopping","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-24","group":"RC","section":"rules","topic_zh":"校车","question_en":"You are on a road divided by a raised median. A school bus with its upper red lights flashing is stopped on the other side of the median, facing you. What must you do?","question_zh":"你行驶在一条有凸起式中央隔离带的道路上。一辆上方红灯闪烁的校车停在隔离带另一侧，面向你。你必须怎么做？","options":[{"en":"Stop at least 20 metres from the bus","zh":"在距校车至少 20 米处停车"},{"en":"Proceed with caution; you are not required to stop","zh":"小心行驶，你不必停车"},{"en":"Stop until the bus's stop arm folds away","zh":"停车，直到校车的停车臂收回"},{"en":"Stop, because the law applies on every road regardless of lanes","zh":"停车，因为该规定适用于所有道路，不论车道多少"}],"answer_index":1,"explanation_zh":"在有中央隔离带（凸起、下沉、土质或铺装的实体分隔带，车辆无法跨越）的道路上，只有校车后方的车辆必须停车，对向车辆不必停车。","explanation_en":"On a road with a median, only vehicles coming from behind the bus must stop.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/stopping","source_title":"MTO 手册 · Stopping","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RC-25","group":"RC","section":"rules","topic_zh":"校车","question_en":"When does the requirement to stop for a school bus with flashing upper red lights apply?","question_zh":"为上方红灯闪烁的校车停车的规定在什么情况下适用？","options":[{"en":"Only on school days during school hours","zh":"只在上学日的上课时间"},{"en":"Only where the speed limit is 60 km/h or less","zh":"只在限速 60 km/h 或以下的道路"},{"en":"Only on roads with one lane in each direction","zh":"只在每个方向只有一条车道的道路"},{"en":"At any time, on any road","zh":"任何时间、任何道路"}],"answer_index":3,"explanation_zh":"校车停车规定适用于任何道路，不论有几条车道或限速多少；也不只限于上学时间，随时都要准备为校车停车。","explanation_en":"The school bus law applies on any road, regardless of lanes or speed limit, at any time.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/stopping","source_title":"MTO 手册 · Stopping","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-26","group":"RC","section":"rules","topic_zh":"校车","question_en":"You have stopped for a school bus that has its stop arm out and its red lights flashing. When may you continue?","question_zh":"你已为一辆伸出停车臂、红灯闪烁的校车停下。你什么时候可以继续行驶？","options":[{"en":"When the arm folds away and all the lights stop flashing","zh":"停车臂收回且所有灯都停止闪烁时"},{"en":"When the bus driver waves at you to go ahead","zh":"校车司机挥手示意你先走时"},{"en":"As soon as the last child reaches the sidewalk","zh":"最后一个孩子走上人行道时"},{"en":"After about 30 seconds, if no children are visible","zh":"等待约 30 秒且看不到孩子时"}],"answer_index":0,"explanation_zh":"校车驾驶员一侧的停车臂（带闪烁红灯的标准停车标志）伸出时，要一直停着，直到停车臂收回、所有灯停止闪烁，或校车开动。","explanation_en":"Remain stopped until the stop arm folds away and all lights stop flashing, or the bus moves.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/stopping","source_title":"MTO 手册 · Stopping","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-27","group":"RC","section":"rules","topic_zh":"校车","question_en":"A school bus driver reports a car that illegally passed the stopped bus, but the person driving it is not identified. What can the car's registered owner face?","question_zh":"校车司机举报了一辆违法超越停靠校车的汽车，但未能确认当时是谁在驾驶。该车的登记车主可能受到什么处罚？","options":[{"en":"Six demerit points on the owner's licence","zh":"车主驾照被扣 6 分"},{"en":"A jail term in place of the driver","zh":"代替驾驶员服刑"},{"en":"Nothing, because only the driver can be charged","zh":"不受任何处罚，因为只能起诉驾驶员"},{"en":"The fine, but not demerit points or jail","zh":"罚款，但不扣分、也不判监禁"}],"answer_index":3,"explanation_zh":"校车司机和其他目击者可以举报违法超越校车的车辆；登记车主可能被处以罚款，但不会被扣分，也不会被判监禁。","explanation_en":"The registered owner can be fined, but does not receive demerit points or jail time.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/stopping","source_title":"MTO 手册 · Stopping","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RC-28","group":"RC","section":"signs","topic_zh":"行人过街设施","question_en":"At a pedestrian crossover, the overhead yellow lights start flashing. What does this tell you?","question_zh":"在行人过街设施（pedestrian crossover）处，上方的黄灯开始闪烁。这表示什么？","options":[{"en":"The crossover is temporarily closed to pedestrians","zh":"该过街设施暂时禁止行人通行"},{"en":"Pedestrians must wait until the lights stop flashing","zh":"行人必须等灯停止闪烁后才能过马路"},{"en":"A pedestrian has pushed the button and intends to cross","zh":"有行人按了按钮，准备过马路"},{"en":"A school-zone speed limit is now in effect","zh":"学校区域限速现在生效"}],"answer_index":2,"explanation_zh":"行人过街设施设在没有交通信号灯的地方；行人按下按钮后上方黄灯闪烁，提醒驾驶员有人要过马路，驾驶员必须让行。","explanation_en":"The flashing overhead yellow lights warn drivers that a pedestrian has pushed the button and will be crossing.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/stopping","source_title":"MTO 手册 · Stopping","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-29","group":"RC","section":"rules","topic_zh":"行人过街设施","question_en":"You must NOT pass another vehicle within how many metres of a pedestrian crossover?","question_zh":"在距离行人过街设施（pedestrian crossover）多少米以内「不得」超越其他车辆？","options":[{"en":"15 metres","zh":"15 米"},{"en":"30 metres","zh":"30 米"},{"en":"50 metres","zh":"50 米"},{"en":"100 metres","zh":"100 米"}],"answer_index":1,"explanation_zh":"距行人过街设施 30 米以内禁止超越任何车辆。","explanation_en":"Passing any vehicle within 30 metres of a pedestrian crossover is not allowed.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/stopping","source_title":"MTO 手册 · Stopping","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-30","group":"RC","section":"rules","topic_zh":"转弯","question_en":"To keep full control of your vehicle when turning a corner, when should you finish braking?","question_zh":"转弯时为了完全控制车辆，应在什么时候完成制动？","options":[{"en":"Halfway through the turn","zh":"转弯进行到一半时"},{"en":"Just as you straighten the wheels","zh":"回正车轮时"},{"en":"While turning, so braking and steering happen together","zh":"转弯过程中，让刹车和转向同时进行"},{"en":"Before you start turning the steering wheel","zh":"开始转动方向盘之前"}],"answer_index":3,"explanation_zh":"转弯前应先减速，弯越急速度越慢；为保持对车辆的完全控制，要在转动方向盘之前完成制动，尽量不要同时刹车和转向。","explanation_en":"Finish braking before you turn the steering wheel; avoid braking and steering at the same time.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-31","group":"RC","section":"rules","topic_zh":"左转","question_en":"Unless signs or pavement markings tell you otherwise, in which lane should a left turn begin and end?","question_zh":"除非标志或路面标线另有指示，左转应在哪条车道开始和结束？","options":[{"en":"The right-hand lane","zh":"右侧车道"},{"en":"Any lane, as long as you signal","zh":"任何车道，只要打了转向灯"},{"en":"The far left lane in your direction","zh":"你行驶方向的最左侧车道"},{"en":"Begin in the far left lane, end in the right curb lane","zh":"从最左侧车道开始，转入右侧路缘车道"}],"answer_index":2,"explanation_zh":"左转应从你行驶方向最左侧的车道开始，并转入新道路上你行驶方向最左侧的车道；右转则应靠道路右侧开始和结束。","explanation_en":"Begin and end a left turn in the far left lane for your direction of travel.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-32","group":"RC","section":"rules","topic_zh":"右转","question_en":"You are preparing to turn right. A moped rider is beside you on the right and is going straight through the intersection. What should you do?","question_zh":"你准备右转，一名轻便摩托车（moped）骑手在你右侧，准备直行通过路口。你应该怎么做？","options":[{"en":"Turn ahead of the moped, since you signalled first","zh":"抢在轻便摩托车前转弯，因为你先打了灯"},{"en":"Let the moped go through the intersection, then make your turn","zh":"让轻便摩托车先通过路口，再转弯"},{"en":"Sound your horn so the rider knows to stop","zh":"按喇叭让骑手停下"},{"en":"Speed up to finish your turn before the moped reaches you","zh":"加速，在轻便摩托车到达前完成转弯"}],"answer_index":1,"explanation_zh":"右转前要检查右后方盲区，让骑车人、限速摩托车或轻便摩托车先通过路口，再完成转弯。","explanation_en":"Let cyclists, limited-speed motorcycles and moped riders go through the intersection before you turn right.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-33","group":"RC","section":"rules","topic_zh":"红灯右转","question_en":"You are facing a red light and want to turn right. No sign prohibits the turn. What is correct?","question_zh":"你面对红灯，想要右转，且没有禁止右转的标志。正确做法是什么？","options":[{"en":"Slow down and turn without stopping if no one is coming","zh":"减速，没有来车就不停车直接转"},{"en":"Wait for the green light; turning right on red is not allowed","zh":"等绿灯，红灯时不允许右转"},{"en":"Stop, then turn at once, since turning traffic has priority","zh":"停车后立即转弯，因为转弯车辆有优先权"},{"en":"Come to a full stop, then turn once the way is clear","zh":"先完全停车，确认安全后再转弯"}],"answer_index":3,"explanation_zh":"除非有标志禁止，红灯时可以右转，但必须先完全停车，等道路安全后再转，并打转向灯、让行人和其他道路使用者先行。","explanation_en":"Unless a sign prohibits it, you may turn right on red after a complete stop, yielding to pedestrians and traffic.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-34","group":"RC","section":"rules","topic_zh":"左转","question_en":"While stopped in an intersection waiting to turn left, why should you keep your wheels pointed straight until you can complete the turn?","question_zh":"在路口停车等待左转时，为什么在能够完成转弯之前应保持车轮朝正前方？","options":[{"en":"A rear-end crash could push you into oncoming traffic","zh":"一旦被追尾，车辆可能被推入对向车流"},{"en":"To reduce wear on your tires while waiting","zh":"减少等待时轮胎的磨损"},{"en":"So oncoming drivers think you are going straight","zh":"让对向驾驶员以为你要直行"},{"en":"So you can back out of the intersection if the light changes","zh":"以便信号灯变化时能倒车退出路口"}],"answer_index":0,"explanation_zh":"如果车轮已向左打，一旦被后车撞上，车辆可能被推入对向车流；所以要等能完成转弯时再向左转动方向盘。","explanation_en":"With your wheels turned left, being hit from behind could push you into oncoming traffic.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-35","group":"RC","section":"rules","topic_zh":"左转","question_en":"You want to turn left and are behind a motorcycle that is also waiting to turn left. What should you do?","question_zh":"你想左转，前面有一辆摩托车也在等待左转。你应该怎么做？","options":[{"en":"Pull up beside the motorcycle so you can both turn together","zh":"开到摩托车旁边，与它同时转弯"},{"en":"Pass it on the right and turn first","zh":"从右侧超过它并先转弯"},{"en":"Stay behind it and turn when the way is clear","zh":"留在它后面，等道路安全时再转弯"},{"en":"Sound your horn to hurry the rider","zh":"按喇叭催促骑手"}],"answer_index":2,"explanation_zh":"摩托车、自行车、限速摩托车和轻便摩托车与大型车辆一样左转；跟在它们后面时不要并排同时转弯，应留在其后，等道路安全再转。","explanation_en":"Stay behind the smaller vehicle and turn when the way is clear; do not pull up beside it.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-36","group":"RC","section":"rules","topic_zh":"左转","question_en":"When turning left from a two-way road onto another two-way road, which lane should you turn into?","question_zh":"从一条双向道路左转进入另一条双向道路时，应转入哪条车道？","options":[{"en":"The lane just right of the centre line","zh":"中心线右侧紧邻的车道"},{"en":"Directly into the right curb lane","zh":"直接转入右侧路缘车道"},{"en":"The lane just left of the centre line","zh":"中心线左侧紧邻的车道"},{"en":"Whichever lane happens to be empty","zh":"任何恰好空着的车道"}],"answer_index":0,"explanation_zh":"应从最靠近中心线的车道沿平顺弧线转入中心线右侧的车道，之后在条件允许时再并入右侧路缘车道。","explanation_en":"Turn from the lane nearest the centre line into the lane just right of the centre line, then move right when you can.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-37","group":"RC","section":"rules","topic_zh":"左转","question_en":"When turning left from a two-way road onto a one-way road, which lane should you turn into?","question_zh":"从双向道路左转进入单行道时，应转入哪条车道？","options":[{"en":"The right curb lane","zh":"右侧路缘车道"},{"en":"The centre lane","zh":"中间车道"},{"en":"Whichever lane has the least traffic","zh":"车辆最少的车道"},{"en":"The left curb lane","zh":"左侧路缘车道"}],"answer_index":3,"explanation_zh":"从双向道路最靠近中心线的车道左转，直接转入单行道的左侧路缘车道。","explanation_en":"Turn from the lane nearest the centre line into the left curb lane of the one-way road.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-38","group":"RC","section":"rules","topic_zh":"左转","question_en":"When turning left from a one-way road onto another one-way road, which lanes should you use?","question_zh":"从一条单行道左转进入另一条单行道时，应从哪条车道转入哪条车道？","options":[{"en":"Right curb lane to left curb lane","zh":"从右侧路缘车道转入左侧路缘车道"},{"en":"Left curb lane to left curb lane","zh":"从左侧路缘车道转入左侧路缘车道"},{"en":"Left curb lane to right curb lane","zh":"从左侧路缘车道转入右侧路缘车道"},{"en":"Centre lane to centre lane","zh":"从中间车道转入中间车道"}],"answer_index":1,"explanation_zh":"从单行道左转进入单行道时，应从左侧路缘车道转入左侧路缘车道。","explanation_en":"Turn from the left curb lane into the left curb lane.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-39","group":"RC","section":"rules","topic_zh":"双向左转车道","question_en":"A road has a centre lane marked as a two-way left-turn lane. How should you use it?","question_zh":"一条道路的中间车道被标为双向左转车道。你应该如何使用它？","options":[{"en":"Use it to pass slow traffic when the way ahead is clear","zh":"前方无车时用它超越慢车"},{"en":"Drive in it for several blocks before your turn","zh":"在转弯前几个街区就驶入并一直在里面行驶"},{"en":"Stop in it to drop off passengers","zh":"停在里面让乘客下车"},{"en":"Enter it just before your turn and wait for a gap","zh":"在转弯前不久驶入，等待空隙再转"}],"answer_index":3,"explanation_zh":"使用双向左转车道时，在转弯前不久打灯驶入并减速，前移到要转入的道路或车道对面，确认安全后再转；对向车辆也会用它左转，而且不得用它超车。","explanation_en":"Signal and enter the two-way left-turn lane shortly before your turn, then turn when clear; it is not for passing.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-40","group":"RC","section":"rules","topic_zh":"红灯左转","question_en":"After a complete stop and when the way is clear, in which situation may you turn left on a red light?","question_zh":"在完全停车并确认安全后，以下哪种情况可以红灯左转？","options":[{"en":"From a two-way road onto a one-way road","zh":"从双向道路转入单行道"},{"en":"From a one-way road onto a one-way road","zh":"从单行道转入单行道"},{"en":"From a one-way road onto a two-way road","zh":"从单行道转入双向道路"},{"en":"From any road, as long as no sign prohibits it","zh":"任何道路，只要没有禁止标志"}],"answer_index":1,"explanation_zh":"只有从单行道左转进入单行道时，才可以在红灯时左转，前提是先完全停车、确认安全，并让行人和其他车辆先行。","explanation_en":"A left turn on red is allowed only from a one-way road onto a one-way road, after a complete stop.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-41","group":"RC","section":"rules","topic_zh":"环岛","question_en":"You want to turn left at a two-lane roundabout. Which lane should you be in as you approach?","question_zh":"你要在双车道环岛左转。驶近环岛时应在哪条车道？","options":[{"en":"The left lane","zh":"左车道"},{"en":"The right lane, then move left once inside","zh":"右车道，进入环岛后再向左变道"},{"en":"Either lane","zh":"任一车道均可"},{"en":"The right lane, with your left signal on","zh":"右车道，同时打左转向灯"}],"answer_index":0,"explanation_zh":"在双车道环岛，左转或直行用左车道，右转或直行用右车道；想左转时不要从右车道进入环岛。","explanation_en":"Use the left lane to turn left at a two-lane roundabout; never enter from the right lane to turn left.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-42","group":"RC","section":"rules","topic_zh":"环岛","question_en":"In a two-lane roundabout, which lane may you use to go straight through?","question_zh":"在双车道环岛中，直行可以使用哪条车道？","options":[{"en":"Only the left lane","zh":"只能用左车道"},{"en":"Only the right lane","zh":"只能用右车道"},{"en":"Either the left or the right lane","zh":"左车道或右车道都可以"},{"en":"The right lane, then switch to the left lane inside","zh":"右车道，进入后再换到左车道"}],"answer_index":2,"explanation_zh":"左车道可用于左转或直行，右车道可用于右转或直行，所以直行时两条车道都可以；进入后不要在环岛内变道。","explanation_en":"Either lane may be used to go straight; the left lane also serves left turns and the right lane right turns.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-43","group":"RC","section":"rules","topic_zh":"环岛","question_en":"Once you are inside a roundabout, which way do you travel?","question_zh":"进入环岛后，你应朝哪个方向行驶？","options":[{"en":"Clockwise","zh":"顺时针"},{"en":"Either direction, depending on your exit","zh":"视出口而定，两个方向都可以"},{"en":"Clockwise for left turns, counter-clockwise for right turns","zh":"左转时顺时针，右转时逆时针"},{"en":"Counter-clockwise","zh":"逆时针"}],"answer_index":3,"explanation_zh":"进入环岛后要始终保持在中心岛右侧，按逆时针方向行驶。","explanation_en":"Travel counter-clockwise, keeping to the right of the central island.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-44","group":"RC","section":"rules","topic_zh":"环岛","question_en":"You are about to enter a roundabout. Who has the right-of-way?","question_zh":"你即将驶入环岛。谁拥有先行权？","options":[{"en":"Vehicles entering from your right","zh":"从你右侧驶入的车辆"},{"en":"Vehicles already circulating in the roundabout","zh":"已在环岛内行驶的车辆"},{"en":"You, if you reach the yield line first","zh":"你，只要你先到达让行线"},{"en":"Whichever vehicle is larger, such as a bus or truck","zh":"体积较大的车辆，例如公共汽车或卡车"}],"answer_index":1,"explanation_zh":"环岛内正在行驶的车辆拥有先行权（向左让行原则）；准备进入时要特别注意左侧来车，必要时在让行标志处停车，等出现足够空隙再进入。","explanation_en":"Traffic already in the roundabout has the right-of-way; look left and yield before entering.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-45","group":"RC","section":"rules","topic_zh":"环岛","question_en":"You are in the inside lane of a two-lane roundabout and miss your exit. What should you do?","question_zh":"你在双车道环岛的内侧车道行驶，错过了出口。你应该怎么做？","options":[{"en":"Keep going around until you reach your exit again","zh":"继续绕行，直到再次到达你的出口"},{"en":"Stop and wait for a gap so you can cut across","zh":"停车等待空隙，然后横穿过去"},{"en":"Change quickly to the outside lane and exit","zh":"迅速换到外侧车道驶出"},{"en":"Reverse a short distance back to the exit","zh":"倒车一小段回到出口"}],"answer_index":0,"explanation_zh":"在环岛内不要变道，除为避免碰撞外也不要停车；在内侧车道错过出口时，应继续绕行，直到再次到达出口。","explanation_en":"Don't stop or change lanes; continue around until you reach your exit again.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-46","group":"RC","section":"rules","topic_zh":"环岛","question_en":"You plan to leave a roundabout at the third exit. When should you turn on your right signal?","question_zh":"你打算从环岛的第三个出口驶出。应在什么时候打开右转向灯？","options":[{"en":"As soon as you enter the roundabout","zh":"一进入环岛就打"},{"en":"Only after you have left the roundabout","zh":"驶离环岛之后才打"},{"en":"Once you have passed the second exit","zh":"驶过第二个出口之后"},{"en":"You do not need to signal when leaving a roundabout","zh":"离开环岛时不需要打转向灯"}],"answer_index":2,"explanation_zh":"驶过目标出口的前一个出口（本题即第二个出口）后，就应打开右转向灯，表示准备驶出，并注意行人。","explanation_en":"Signal right once you have passed the exit before the one you want, here the second exit.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-47","group":"RC","section":"rules","topic_zh":"应急车辆","question_en":"You are already in a roundabout when an emergency vehicle with flashing lights approaches. What should you do?","question_zh":"你已在环岛内行驶，这时一辆闪着警灯的应急车辆驶来。你应该怎么做？","options":[{"en":"Stop immediately where you are in the roundabout","zh":"在环岛内原地立即停车"},{"en":"Exit as planned, then pull over past the traffic island","zh":"按原定出口驶出，越过交通岛后再靠边停车"},{"en":"Pull onto the apron of the central island and stop","zh":"驶上中心岛的裙边（apron）停车"},{"en":"Take the very next exit and stop right there","zh":"从紧接着的下一个出口驶出并立即停车"}],"answer_index":1,"explanation_zh":"已在环岛内时，应从原定出口驶出，越过交通岛后再靠边停车；如果还没进入环岛，应尽可能靠右停车，等应急车辆通过。","explanation_en":"Exit at your intended exit and pull over beyond the traffic island; if not yet in, pull right and wait.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RC-48","group":"RC","section":"rules","topic_zh":"环岛","question_en":"A large truck ahead of you is approaching a two-lane roundabout and is taking up both lanes. What should you do?","question_zh":"你前方的一辆大卡车正驶近双车道环岛，并占用了两条车道。你应该怎么做？","options":[{"en":"Pass it on the right before it enters the roundabout","zh":"在它进入环岛前从右侧超过它"},{"en":"Enter the roundabout beside it in the other lane","zh":"在另一条车道与它并排进入环岛"},{"en":"Stay well back and give it plenty of room","zh":"与它保持距离，给它留出充足空间"},{"en":"Sound your horn so the driver keeps to one lane","zh":"按喇叭让司机只占一条车道"}],"answer_index":2,"explanation_zh":"大型车辆进入环岛前可能需要占用两条车道，在环岛内可能需要使用全部路面，包括中心岛旁可驶上的裙边，要给它们留出充足空间。","explanation_en":"Large vehicles may need both lanes and the apron, so give them plenty of room.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-49","group":"RC","section":"rules","topic_zh":"倒车","question_en":"You are reversing straight back. How should you look behind you?","question_zh":"你正在直线倒车。应该如何观察后方？","options":[{"en":"Keep facing forward and watch the inside mirror","zh":"保持面向前方，看车内后视镜"},{"en":"Turn your body and head left and look over your left shoulder","zh":"身体和头转向左侧，从左肩上方向后看"},{"en":"Rely only on your side mirrors","zh":"只依靠两侧后视镜"},{"en":"Turn your body and head right and look over your right shoulder","zh":"身体和头转向右侧，从右肩上方向后看"}],"answer_index":3,"explanation_zh":"直线倒车或向右倒车时，应把身体和头转向右侧，从右肩上方向后看；向左倒车时从左肩看，同时也要检查另一侧。","explanation_en":"When reversing straight back or to the right, turn your body and head right and look over your right shoulder.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-50","group":"RC","section":"rules","topic_zh":"倒车","question_en":"Your seatbelt prevents you from turning far enough to see properly while reversing. What may you do?","question_zh":"倒车时，安全带让你无法充分转身看清后方。你可以怎么做？","options":[{"en":"Unbuckle to reverse, then buckle up before driving forward","zh":"倒车时可以解开，但向前行驶前要重新系好"},{"en":"You must keep it fastened at all times while the vehicle is moving","zh":"车辆行驶时必须始终系好安全带"},{"en":"You may remove it and drive forward short distances without it","zh":"可以解开，并在不系安全带的情况下向前开一小段"},{"en":"Only passengers may unbuckle while the vehicle is reversing","zh":"倒车时只有乘客可以解开安全带"}],"answer_index":0,"explanation_zh":"倒车时可以不系安全带；如需解开安全带才能转身看清，可以解开，但向前行驶前必须重新系好。","explanation_en":"You don't have to wear a seatbelt while reversing, but buckle up again before moving forward.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-51","group":"RC","section":"rules","topic_zh":"倒车","question_en":"On a divided road with a speed limit over 80 km/h, when may you drive in reverse, either on the road or on the shoulder?","question_zh":"在限速超过 80 km/h 的分隔道路上，什么情况下可以倒车（无论在行车道还是路肩上）？","options":[{"en":"To get back to an exit you have just missed","zh":"为了退回刚刚错过的出口"},{"en":"When the shoulder is wide and empty","zh":"路肩宽阔且没有车辆时"},{"en":"At any time, if your hazard lights are on","zh":"只要打开双闪灯，任何时候都可以"},{"en":"Only when you are helping someone in trouble","zh":"只有在帮助遇到困难的人时"}],"answer_index":3,"explanation_zh":"在限速超过 80 km/h 的分隔道路上倒车是违法的，行车道和路肩都包括在内，唯一例外是为了帮助遇到困难的人。","explanation_en":"Reversing on a divided road with a limit over 80 km/h is illegal, shoulder included, unless helping someone in trouble.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-52","group":"RC","section":"rules","topic_zh":"掉头","question_en":"You have missed a turn and need to head back the other way. What is the simplest and safest way to turn around?","question_zh":"你错过了路口，需要掉头往回走。最简单、最安全的掉头方式是什么？","options":[{"en":"Make a U-turn at the next opportunity","zh":"在下一个可以掉头的地方进行 U 形掉头"},{"en":"Back up to the street you missed","zh":"倒车回到错过的路口"},{"en":"Drive around the block","zh":"绕街区行驶一圈"},{"en":"Make a three-point turn on the spot","zh":"就地进行三点掉头"}],"answer_index":2,"explanation_zh":"掉头最简单、最安全的方法是绕街区行驶一圈；无法这样做时，才考虑 U 形掉头或三点掉头。","explanation_en":"Driving around the block is the simplest and safest way to turn around.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-53","group":"RC","section":"rules","topic_zh":"U形掉头","question_en":"Before making a U-turn, you must be able to see at least how far in both directions?","question_zh":"进行 U 形掉头前，你必须能看清两个方向至少多远的距离？","options":[{"en":"75 metres","zh":"75 米"},{"en":"150 metres","zh":"150 米"},{"en":"200 metres","zh":"200 米"},{"en":"300 metres","zh":"300 米"}],"answer_index":1,"explanation_zh":"进行 U 形掉头前要确认没有禁止标志，并且必须能看清两个方向至少 150 米的路况。","explanation_en":"Only make a U-turn if you can see at least 150 metres in both directions.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-54","group":"RC","section":"rules","topic_zh":"U形掉头","question_en":"Where is it illegal to make a U-turn?","question_zh":"在以下哪个地点进行 U 形掉头是违法的？","options":[{"en":"On or near a railway crossing","zh":"在铁路道口上或其附近"},{"en":"On a straight, level road where you can see 200 metres both ways","zh":"在平直道路上、两个方向都能看清 200 米的地方"},{"en":"On a straight residential street with no sign prohibiting it","zh":"在没有禁止标志的平直住宅街道上"},{"en":"On a wide, straight two-way road with light traffic","zh":"在车辆稀少、宽阔平直的双向道路上"}],"answer_index":0,"explanation_zh":"在弯道上、铁路道口或坡顶上或附近，以及遮挡视线的桥梁或隧道附近进行 U 形掉头都是违法的。","explanation_en":"U-turns are illegal on curves, on or near railway crossings or hilltops, and near view-blocking bridges or tunnels.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-55","group":"RC","section":"rules","topic_zh":"三点掉头","question_en":"You need to turn around on a narrow road using a three-point turn. How does it begin?","question_zh":"你需要在一条窄路上用三点掉头（three-point turn）调转方向。应该如何开始？","options":[{"en":"From the centre of the road, signalling right","zh":"从道路中央开始，打右转向灯"},{"en":"From the far right side of the road, signalling left","zh":"从道路最右侧开始，打左转向灯"},{"en":"From the far left side of the road, signalling right","zh":"从道路最左侧开始，打右转向灯"},{"en":"From the far left side of the road, signalling left","zh":"从道路最左侧开始，打左转向灯"}],"answer_index":1,"explanation_zh":"三点掉头从道路最右侧开始，先打左转向灯；两个方向都安全后向前行驶，向左急打方向盘到对面路边停下，再挂倒挡、打右转向灯倒车，最后向前驶出。","explanation_en":"A three-point turn starts from the far right side of the road with a left-turn signal.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-directions","source_title":"MTO 手册 · Changing directions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-56","group":"RC","section":"rules","topic_zh":"变道","question_en":"As you steer into a new lane, what should you do with your speed?","question_zh":"在转向驶入新车道时，你应该如何控制车速？","options":[{"en":"Keep the same speed or gently increase it","zh":"保持原速或平缓加速"},{"en":"Slow down so other drivers can see you","zh":"减速，让其他驾驶员看到你"},{"en":"Brake lightly to show what you intend","zh":"轻踩刹车表明你的意图"},{"en":"Accelerate sharply to get ahead of others","zh":"猛加速抢到其他车前面"}],"answer_index":0,"explanation_zh":"变道时应平缓地转入新车道，不要减速，保持原速或略微加速。","explanation_en":"Steer gradually into the new lane, keeping your speed or gently increasing it.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-positions","source_title":"MTO 手册 · Changing positions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-57","group":"RC","section":"rules","topic_zh":"变道","question_en":"How should you check your blind spot before changing lanes?","question_zh":"变道前应如何检查盲区？","options":[{"en":"Look over your shoulder in the direction of the lane change","zh":"朝变道方向转头，越过肩膀向后查看"},{"en":"Check your inside mirror a second time","zh":"再看一次车内后视镜"},{"en":"Look over the shoulder opposite to your lane change","zh":"朝变道的相反方向转头，越过肩膀查看"},{"en":"Adjust your side mirror while moving over","zh":"一边变道一边调整侧后视镜"}],"answer_index":0,"explanation_zh":"先看后视镜，再朝变道方向转头越过肩膀查看盲区，特别留意自行车等小型车辆；打灯后再次确认安全才变道。","explanation_en":"Check your blind spot by looking over your shoulder in the direction of the lane change.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-positions","source_title":"MTO 手册 · Changing positions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-58","group":"RC","section":"rules","topic_zh":"变道","question_en":"In which situation should you avoid changing lanes?","question_zh":"以下哪种情况应避免变道？","options":[{"en":"On a straight multi-lane road with light traffic","zh":"车辆稀少的平直多车道道路上"},{"en":"In or near an intersection","zh":"在路口内或路口附近"},{"en":"When passing a slower vehicle on a multi-lane road","zh":"在多车道道路上超越慢车时"},{"en":"When moving around a parked vehicle","zh":"绕过停靠的车辆时"}],"answer_index":1,"explanation_zh":"不要在路口内或路口附近变道；也应避免不必要的变道和在车道间来回穿插，尤其在交通繁忙或天气恶劣时。","explanation_en":"Don't change lanes in or near an intersection.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-positions","source_title":"MTO 手册 · Changing positions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-59","group":"RC","section":"rules","topic_zh":"超车","question_en":"When may you pass a snow plow that is moving?","question_zh":"什么情况下可以超越正在行驶的扫雪车？","options":[{"en":"Only on its right side","zh":"只能从它的右侧超"},{"en":"Only during daylight","zh":"只能在白天超"},{"en":"Under no conditions","zh":"任何情况下都不可以"},{"en":"When it moves partly onto the shoulder","zh":"当它部分驶上路肩时"}],"answer_index":2,"explanation_zh":"驾驶员手册明确规定，任何情况下都不要超越正在行驶的扫雪车。","explanation_en":"Never pass a moving snow plow under any conditions.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-positions","source_title":"MTO 手册 · Changing positions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-60","group":"RC","section":"rules","topic_zh":"超车","question_en":"After overtaking a vehicle, when is it safe to move back into your original lane?","question_zh":"超越一辆车之后，什么时候可以安全地回到原车道？","options":[{"en":"As soon as your rear bumper clears its front bumper","zh":"你的后保险杠刚越过它的前保险杠时"},{"en":"When the other driver flashes the headlights at you","zh":"对方驾驶员向你闪大灯时"},{"en":"After counting two seconds from passing its front bumper","zh":"越过它的前保险杠后数两秒"},{"en":"When its whole front shows in your inside mirror","zh":"在车内后视镜中能看到它的整个车头时"}],"answer_index":3,"explanation_zh":"超车后先打转向灯，当你在车内后视镜中能看到被超车辆的整个车头时，才可以并回原车道，不要突然切到它前面。","explanation_en":"Signal, then return when you can see the entire front of the passed vehicle in your inside mirror.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-positions","source_title":"MTO 手册 · Changing positions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-61","group":"RC","section":"rules","topic_zh":"超车","question_en":"While you are passing, the vehicle you are overtaking speeds up. What should you do?","question_zh":"你正在超车，被超的车辆却加速了。你应该怎么做？","options":[{"en":"Don't race; go back to your original lane","zh":"不要与它竞速，回到原来的车道"},{"en":"Accelerate harder to finish the pass","zh":"更用力加速完成超车"},{"en":"Sound your horn and keep going","zh":"按喇叭并继续超车"},{"en":"Use the left shoulder to complete the pass","zh":"利用左侧路肩完成超车"}],"answer_index":0,"explanation_zh":"被超车辆加速时不要与其竞速，应回到原来的车道；反过来，别人超你车时你加速是违法且危险的。","explanation_en":"If the vehicle you are passing speeds up, don't race; return to your original lane.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-positions","source_title":"MTO 手册 · Changing positions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RC-62","group":"RC","section":"rules","topic_zh":"被超车","question_en":"On an undivided two-lane road, a driver behind you pulls into the opposite lane to pass you. What should you do?","question_zh":"在没有中央隔离带的双车道道路上，后车驶入对向车道准备超越你。你应该怎么做？","options":[{"en":"Speed up so that the pass takes less time","zh":"加速，让对方超车用时更短"},{"en":"Hold your speed and stay in the centre of your lane","zh":"保持车速，留在车道中间行驶"},{"en":"Keep right in your lane and be ready to slow down","zh":"在本车道内靠右行驶，并准备减速"},{"en":"Brake hard immediately to let the driver in","zh":"立即急刹车让对方并入"}],"answer_index":2,"explanation_zh":"被超车时应靠向车道右侧，注意对向来车，并准备减速，让超车者更快回到你前方；此时加速是违法的。","explanation_en":"Move toward the right of your lane and be ready to slow down; speeding up while being passed is unlawful.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/changing-positions","source_title":"MTO 手册 · Changing positions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RC-63","group":"RC","section":"rules","topic_zh":"禁止超车","question_en":"Passing to the le
