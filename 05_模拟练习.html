<script>
const BANK = [{"id":"LA-01","group":"LA","section":"rules","topic_zh":"申请条件","question_en":"What is the minimum age to apply for a driver's licence in Ontario?","question_zh":"在安大略省申请驾照，最低年龄是多少岁？","options":[{"en":"15 years old","zh":"15岁"},{"en":"16 years old","zh":"16岁"},{"en":"17 years old","zh":"17岁"},{"en":"18 years old","zh":"18岁"}],"answer_index":1,"explanation_zh":"在安省申请驾照必须年满16岁，并通过视力测试和交通规则与交通标志知识考试，之后才能取得G1驾照。","explanation_en":"You must be at least 16 to apply for an Ontario licence.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-02","group":"LA","section":"rules","topic_zh":"申请条件","question_en":"Which tests must you pass to receive a Class G1 licence?","question_zh":"要取得G1驾照，必须通过哪些考试？","options":[{"en":"A vision test and a road test","zh":"视力测试和路考"},{"en":"A knowledge test and a road test","zh":"知识考试和路考"},{"en":"A vision test and a knowledge test","zh":"视力测试和知识考试"},{"en":"A medical exam and a knowledge test","zh":"体检和知识考试"}],"answer_index":2,"explanation_zh":"取得G1驾照不需要路考：年满16岁并通过视力测试和交通规则与交通标志知识考试即可。路考在G1升G2、G2升G时才考。","explanation_en":"A G1 requires a vision test and a knowledge test; road tests come later.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-03","group":"LA","section":"rules","topic_zh":"分级驾照","question_en":"According to the handbook, what is the shortest time in which Ontario's two-step graduated licensing process can be completed?","question_zh":"根据手册，安省两阶段分级驾照制度最快需要多长时间才能完成？","options":[{"en":"12 months","zh":"12个月"},{"en":"24 months","zh":"24个月"},{"en":"36 months","zh":"36个月"},{"en":"20 months","zh":"20个月"}],"answer_index":3,"explanation_zh":"两阶段分级驾照制度至少需要20个月：完成认可的BDE课程后，G1阶段可缩短为8个月，再加上G2阶段至少12个月。","explanation_en":"The two-step process takes at least 20 months to complete.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-04","group":"LA","section":"rules","topic_zh":"G1规定","question_en":"Without an approved driver-education course, how long does Level One (G1) last before you can take the road test to move up to G2?","question_zh":"如果没有完成认可的驾驶教育课程，G1阶段要持续多久，才能参加升G2的路考？","options":[{"en":"6 months","zh":"6个月"},{"en":"8 months","zh":"8个月"},{"en":"12 months","zh":"12个月"},{"en":"18 months","zh":"18个月"}],"answer_index":2,"explanation_zh":"G1阶段为期12个月；只有完成交通部认可的初学驾驶教育（BDE）课程，才能缩短为8个月。","explanation_en":"Level One lasts 12 months unless you complete an approved BDE course.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-05","group":"LA","section":"rules","topic_zh":"驾驶教育课程","question_en":"You received your G1 licence on January 15 and then graduated from a ministry-approved beginner driver education (BDE) course. What is the earliest date you could take the road test to move up to G2?","question_zh":"你在1月15日取得G1驾照，之后完成了交通部认可的初学驾驶教育（BDE）课程。你最早可以在哪一天参加升G2的路考？","options":[{"en":"May 15 of the same year","zh":"同年5月15日"},{"en":"July 15 of the same year","zh":"同年7月15日"},{"en":"September 15 of the same year","zh":"同年9月15日"},{"en":"January 15 of the following year","zh":"次年1月15日"}],"answer_index":2,"explanation_zh":"完成认可的BDE课程可使G1阶段缩短4个月，由12个月减为8个月。从1月15日起满8个月是9月15日，届时即可参加升G2的路考。","explanation_en":"An approved BDE course shortens Level One from 12 to 8 months, so the earliest date is September 15.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-06","group":"LA","section":"rules","topic_zh":"驾驶教育课程","question_en":"What is the minimum length of a ministry-approved BDE course, and how may those hours be divided?","question_zh":"交通部认可的BDE课程最少需要多少小时？这些课时可以怎样分配？","options":[{"en":"30 hours: 20 in-class and 10 in-vehicle","zh":"30小时：课堂20小时、车内10小时"},{"en":"40 hours: 20 in-class, 10 in-vehicle and 10 flexible","zh":"40小时：课堂20小时、车内10小时、灵活教学10小时"},{"en":"60 hours: 20 in-class, 20 in-vehicle and 20 flexible","zh":"60小时：课堂20小时、车内20小时、灵活教学20小时"},{"en":"20 hours: 10 in-class and 10 in-vehicle","zh":"20小时：课堂10小时、车内10小时"}],"answer_index":1,"explanation_zh":"认可的BDE课程至少40小时，可分为至少20小时课堂教学、10小时车内教学和10小时灵活教学（可包括电脑教学、模拟器、家庭作业等）。","explanation_en":"Approved BDE courses run at least 40 hours: 20 in-class, 10 in-vehicle and 10 flexible.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-07","group":"LA","section":"rules","topic_zh":"驾驶教育课程","question_en":"Besides shortening Level One, what other benefit may a graduate of an approved BDE course receive?","question_zh":"除了缩短G1阶段外，完成认可的BDE课程还可能带来什么好处？","options":[{"en":"An exemption from the second road test","zh":"免考第二次路考"},{"en":"Permission to drive alone as a G1 driver","zh":"G1阶段可以单独驾驶"},{"en":"Possible savings on car insurance","zh":"可能降低汽车保险费"},{"en":"Fewer demerit points for traffic offences","zh":"交通违法时少扣分"}],"answer_index":2,"explanation_zh":"完成认可的BDE课程会记入驾驶记录，可使G1阶段缩短4个月，还可能为你节省汽车保险费；但它不能免除路考，也不能取消G1的其他限制。","explanation_en":"An approved BDE course may also lower your car insurance premiums.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-08","group":"LA","section":"rules","topic_zh":"酒精规定","question_en":"As a G1 driver, what is the highest blood alcohol concentration (BAC) you may have while driving?","question_zh":"作为G1驾驶人，开车时允许的最高血液酒精浓度（BAC）是多少？","options":[{"en":"Zero","zh":"零"},{"en":"Less than 0.05%","zh":"低于0.05%"},{"en":"Less than 0.08%","zh":"低于0.08%"},{"en":"Less than 0.02%","zh":"低于0.02%"}],"answer_index":0,"explanation_zh":"G1驾驶人饮酒后不得驾驶，血液酒精浓度必须为零。「低于0.05%」是对陪同驾驶人的要求，不适用于G1驾驶人本人。","explanation_en":"G1 drivers must have a blood alcohol level of zero.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-09","group":"LA","section":"rules","topic_zh":"陪同驾驶人","question_en":"How much driving experience must the person accompanying a G1 driver have?","question_zh":"G1驾驶人的陪同驾驶人至少需要有多少年驾驶经验？","options":[{"en":"At least 2 years","zh":"至少2年"},{"en":"At least 3 years","zh":"至少3年"},{"en":"At least 5 years","zh":"至少5年"},{"en":"At least 4 years","zh":"至少4年"}],"answer_index":3,"explanation_zh":"陪同驾驶人必须持有有效的G级（或更高级别）驾照，并且至少有四年驾驶经验。","explanation_en":"The accompanying driver needs a valid Class G (or higher) licence and at least four years' experience.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-10","group":"LA","section":"rules","topic_zh":"陪同驾驶人","question_en":"When a fully licensed driver aged 22 or older accompanies a G1 driver, without providing paid driving instruction, what must the accompanying driver's blood alcohol concentration be?","question_zh":"由一名22岁或以上、持完整驾照的驾驶人陪同G1练车，且不是提供有偿驾驶教学时，陪同驾驶人的血液酒精浓度必须符合什么要求？","options":[{"en":"Zero","zh":"为零"},{"en":"Less than 0.05%","zh":"低于0.05%"},{"en":"Less than 0.08%","zh":"低于0.08%"},{"en":"Less than 0.10%","zh":"低于0.10%"}],"answer_index":1,"explanation_zh":"题干中的普通陪同驾驶人BAC必须低于0.05%；21岁或以下的陪同驾驶人，以及提供有偿驾驶教学的教练，须遵守零酒精要求。G1驾驶人本人不论年龄，BAC都必须为零。","explanation_en":"For this ordinary accompanying driver, BAC must be below 0.05%. Accompanying drivers aged 21 or under and paid driving instructors are subject to zero-alcohol rules.","source_url":"https://www.ontario.ca/page/get-g-drivers-licence-new-drivers","source_title":"Ontario current guidance · G1 accompanying drivers","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-11","group":"LA","section":"rules","topic_zh":"陪同驾驶人","question_en":"You hold a G1 licence and your fully licensed aunt is supervising your practice drive. Where must she sit?","question_zh":"你持有G1驾照，由持完整驾照的姑姑陪同练车。她必须坐在哪里？","options":[{"en":"In the front passenger seat","zh":"坐在副驾驶座"},{"en":"Anywhere, as long as she wears a seatbelt","zh":"坐哪里都可以，只要系好安全带"},{"en":"In the rear seat directly behind you","zh":"坐在你正后方的后排座位"},{"en":"In the rear seat on the passenger side","zh":"坐在后排乘客一侧"}],"answer_index":0,"explanation_zh":"陪同驾驶人必须坐在副驾驶座，而且你驾驶时，前排除你之外只能坐陪同驾驶人一人。","explanation_en":"The accompanying driver must sit in the front passenger seat and be the only other person in front.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-12","group":"LA","section":"rules","topic_zh":"陪同驾驶人","question_en":"Your father has held a full G licence for 20 years and has four demerit points on his record. Can he be your accompanying driver while you hold a G1?","question_zh":"你父亲持有完整G驾照已20年，驾驶记录上已被扣4分。你持G1驾照期间，他能否担任你的陪同驾驶人？","options":[{"en":"No, he must have zero demerit points","zh":"不能，他必须没有任何扣分"},{"en":"No, he must have fewer than three demerit points","zh":"不能，他的扣分必须少于3分"},{"en":"Only after he completes a refresher driving course","zh":"必须先完成驾驶复习课程才可以"},{"en":"Yes, provided his licence is not suspended","zh":"可以，只要他的驾照没有被暂停"}],"answer_index":3,"explanation_zh":"陪同驾驶人的驾照上可以有扣分，但不能处于暂停状态；此外还须持有G级或以上驾照、至少四年驾驶经验，陪同时BAC低于0.05%。","explanation_en":"An accompanying driver may have demerit points but cannot have a suspended licence.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-13","group":"LA","section":"rules","topic_zh":"陪同驾驶人","question_en":"Your cousin held a valid, never-suspended G2 licence for two years and has now held a full G licence for two more years. Does she meet the four-year experience requirement to accompany a G1 driver?","question_zh":"你的表姐持有有效、从未被暂停的G2驾照两年，之后又持有完整G驾照两年。她是否满足陪同G1驾驶人所需的「四年驾驶经验」要求？","options":[{"en":"No, only time with a full G licence counts","zh":"不满足，只有持完整G驾照的时间才算"},{"en":"Yes, valid G2 time counts toward the four years","zh":"满足，持有有效G2驾照的时间也计入四年"},{"en":"No, she needs four years after receiving her full G","zh":"不满足，她必须在取得完整G驾照后再满四年"},{"en":"Yes, but only if she is also a driving instructor","zh":"满足，但前提是她同时是驾驶教练"}],"answer_index":1,"explanation_zh":"只要G2驾照有效（未被暂停），持G2的时间也计入陪同驾驶人所需的四年经验，因此她共有四年经验，符合要求。","explanation_en":"Time with a valid (unsuspended) G2 counts toward the accompanying driver's four years.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LA-14","group":"LA","section":"rules","topic_zh":"G1规定","question_en":"Which rule limits the number of people who may ride in a vehicle driven by a G1 driver?","question_zh":"G1驾驶人开车时，车上可载人数受以下哪条规定限制？","options":[{"en":"Only the accompanying driver may be in the vehicle","zh":"车上只能有陪同驾驶人一人"},{"en":"No more than two passengers in total","zh":"乘客总数不得超过两人"},{"en":"Every person must have a working seatbelt","zh":"车上每个人都必须有一条可正常使用的安全带"},{"en":"No more than three passengers aged 19 or under","zh":"19岁及以下乘客不得超过三人"}],"answer_index":2,"explanation_zh":"G1阶段要求车内每个人都必须有一条可正常使用的安全带，因此载客人数受可用安全带数量限制；此外前排只能坐陪同驾驶人。「19岁及以下乘客」的人数限制属于19岁及以下G2驾驶人的深夜规定，不适用于此。","explanation_en":"Each person in a G1 driver's vehicle must have a working seatbelt.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-15","group":"LA","section":"rules","topic_zh":"G1道路限制","question_en":"You are a G1 driver accompanied by your mother, who is fully licensed but not a driving instructor. Which of these roads are you NOT allowed to drive on?","question_zh":"你是G1驾驶人，由持完整驾照的母亲陪同，她不是驾驶教练。以下哪条道路你「不」可以驾驶？","options":[{"en":"The Don Valley Parkway in Toronto","zh":"多伦多的Don Valley Parkway（DVP）"},{"en":"A residential street posted at 40 km/h","zh":"限速40公里/小时的住宅区街道"},{"en":"A city arterial road posted at 60 km/h","zh":"限速60公里/小时的市区主干道"},{"en":"A two-lane rural road posted at 80 km/h","zh":"限速80公里/小时的双车道乡村道路"}],"answer_index":0,"explanation_zh":"G1驾驶人不得驾驶限速超过80公里/小时的400系列高速公路，也不得驾驶伊丽莎白女王大道（QEW）、Don Valley Parkway（DVP）、Gardiner Expressway、温莎的E.C. Row Expressway和基奇纳-滑铁卢的Conestoga Parkway等高速道路，除非陪同驾驶人是驾驶教练。","explanation_en":"G1 drivers may not use listed high-speed roads such as the Don Valley Parkway unless accompanied by a driving instructor.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-16","group":"LA","section":"rules","topic_zh":"G1道路限制","question_en":"When may a G1 driver legally drive on a 400-series highway with a posted speed limit of 100 km/h?","question_zh":"G1驾驶人在什么情况下可以合法驾驶限速100公里/小时的400系列高速公路？","options":[{"en":"When the accompanying driver is a driving instructor","zh":"陪同驾驶人是驾驶教练时"},{"en":"When the accompanying driver has ten years of experience","zh":"陪同驾驶人有十年驾驶经验时"},{"en":"After holding the G1 licence for eight months","zh":"持有G1驾照满八个月后"},{"en":"Only in daylight and in good weather","zh":"只在白天且天气良好时"}],"answer_index":0,"explanation_zh":"G1驾驶人原则上不能驾驶限速超过80公里/小时的400系列高速公路及QEW、DVP等指定道路；但如果陪同驾驶人是驾驶教练，就可以在任何道路上驾驶。","explanation_en":"If the accompanying driver is a driving instructor, a G1 driver may drive on any road.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-17","group":"LA","section":"rules","topic_zh":"G1规定","question_en":"During which hours is a G1 driver NOT allowed to drive?","question_zh":"G1驾驶人在哪个时段「不」允许驾驶？","options":[{"en":"Between 10 p.m. and 5 a.m.","zh":"晚上10点至凌晨5点"},{"en":"Between midnight and 6 a.m.","zh":"午夜12点至早上6点"},{"en":"Between 11 p.m. and 6 a.m.","zh":"晚上11点至早上6点"},{"en":"Between midnight and 5 a.m.","zh":"午夜12点至凌晨5点"}],"answer_index":3,"explanation_zh":"G1驾驶人不得在午夜12点至凌晨5点之间驾驶，即使有陪同驾驶人也不行。","explanation_en":"G1 drivers must not drive between midnight and 5 a.m.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-18","group":"LA","section":"rules","topic_zh":"考试准备","question_en":"According to the handbook's checklist for the G1 knowledge test, how many pieces of identification should you bring?","question_zh":"根据手册中G1知识考试的携带物品清单，应携带几份身份证件？","options":[{"en":"One","zh":"一份"},{"en":"Two","zh":"两份"},{"en":"Three","zh":"三份"},{"en":"Four","zh":"四份"}],"answer_index":1,"explanation_zh":"手册的备考清单建议带两份身份证件；这不代表所有申请人依法都必须提供两份。DriveTest说明，能否只用一份证件取决于它是否包含所需身份信息。出发前应核对DriveTest最新认可证件清单，并带上考试费及驾驶所需的眼镜或隐形眼镜。","explanation_en":"The handbook checklist recommends two pieces of ID. DriveTest's actual identity requirements can be met by one or more acceptable original, valid documents, depending on the information they contain.","source_url":"https://drivetest.ca/licences/acceptable-id-documents/","source_title":"DriveTest · Acceptable identity documents","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-19","group":"LA","section":"rules","topic_zh":"路考","question_en":"How early should you arrive for a scheduled road test?","question_zh":"参加已预约的路考，应至少提前多久到达？","options":[{"en":"At least 30 minutes before","zh":"至少提前30分钟"},{"en":"At least 10 minutes before","zh":"至少提前10分钟"},{"en":"At least 15 minutes before","zh":"至少提前15分钟"},{"en":"At least 2 hours before","zh":"至少提前2小时"}],"answer_index":0,"explanation_zh":"路考清单要求至少在预约时间前30分钟到达，并带上车况良好的车辆、需要时的考试费用，以及驾驶所需的眼镜或隐形眼镜。","explanation_en":"Arrive at least 30 minutes before your road test appointment.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-20","group":"LA","section":"rules","topic_zh":"G2规定","question_en":"What is the minimum time you must spend at Level Two (G2) before you may take the road test for a full Class G licence?","question_zh":"G2阶段至少要持续多久，才能参加考取完整G驾照的路考？","options":[{"en":"6 months","zh":"6个月"},{"en":"8 months","zh":"8个月"},{"en":"24 months","zh":"24个月"},{"en":"12 months","zh":"12个月"}],"answer_index":3,"explanation_zh":"G2阶段至少持续12个月，满12个月后才能参加路考，通过后取得完整的G驾照。","explanation_en":"Level Two lasts at least 12 months before the full G road test.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-21","group":"LA","section":"rules","topic_zh":"G2乘客限制","question_en":"You are 18 and got your G2 licence two months ago. At 1 a.m., with no fully licensed driver in the front passenger seat and no immediate family members aboard, how many passengers aged 19 or under may you carry?","question_zh":"你18岁，两个月前刚取得G2驾照。凌晨1点驾驶时，副驾驶座上没有持完整驾照的驾驶人，车上也没有你的近亲属。你最多可以载几名19岁及以下的乘客？","options":[{"en":"One","zh":"一名"},{"en":"None","zh":"一名也不能载"},{"en":"Two","zh":"两名"},{"en":"Three","zh":"三名"}],"answer_index":0,"explanation_zh":"19岁及以下的G2驾驶人在取得G2后的头六个月内，午夜至凌晨5点只能载一名19岁及以下的乘客。","explanation_en":"In the first six months of G2, drivers 19 and under may carry only one passenger aged 19 or under from midnight to 5 a.m.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-22","group":"LA","section":"rules","topic_zh":"G2乘客限制","question_en":"You are 19 and have held your G2 licence for eight months. Driving at 2 a.m. with no exemption applying, what is the maximum number of passengers aged 19 or under you may carry?","question_zh":"你19岁，持G2驾照已八个月。凌晨2点驾驶且不适用任何豁免时，最多可以载几名19岁及以下的乘客？","options":[{"en":"One","zh":"一名"},{"en":"Two","zh":"两名"},{"en":"Three","zh":"三名"},{"en":"Four","zh":"四名"}],"answer_index":2,"explanation_zh":"持G2满六个月后，直到取得完整G驾照或年满20岁之前，19岁及以下的G2驾驶人在午夜至凌晨5点最多可载三名19岁及以下的乘客。","explanation_en":"After six months on G2, up to three passengers aged 19 or under are allowed from midnight to 5 a.m.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-23","group":"LA","section":"rules","topic_zh":"G2乘客限制","question_en":"A 19-year-old who got her G2 licence last month is driving home at 1 a.m. Her only passengers are her two teenage brothers. Is this allowed?","question_zh":"一名19岁的驾驶人上个月刚取得G2驾照，凌晨1点开车回家，车上只有她的两个十几岁的弟弟。这样是否允许？","options":[{"en":"No, she may carry only one passenger aged 19 or under","zh":"不允许，她只能载一名19岁及以下的乘客"},{"en":"Yes, the limit does not apply to immediate family","zh":"允许，该限制不适用于近亲属"},{"en":"No, G2 drivers may not drive between midnight and 5 a.m.","zh":"不允许，G2驾驶人在午夜至凌晨5点不得驾驶"},{"en":"Yes, but only if both brothers sit in the back seat","zh":"允许，但两个弟弟都必须坐后排"}],"answer_index":1,"explanation_zh":"19岁及以下G2驾驶人的深夜乘客限制不适用于近亲属（监护人，或有血缘、婚姻、事实婚姻或收养关系的亲属），因此载自己的弟弟是允许的。","explanation_en":"The G2 late-night passenger limits do not apply when the passengers are immediate family.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-24","group":"LA","section":"rules","topic_zh":"G2乘客限制","question_en":"For a G2 driver aged 19 or under, which situation removes the late-night limit on young passengers?","question_zh":"对于19岁及以下的G2驾驶人，以下哪种情况可以免除深夜载年轻乘客的人数限制？","options":[{"en":"Every passenger is wearing a working seatbelt","zh":"每名乘客都系着可正常使用的安全带"},{"en":"The driver has completed an approved BDE course","zh":"驾驶人已完成认可的BDE课程"},{"en":"The driver stays on roads posted at 80 km/h or less","zh":"只在限速80公里/小时及以下的道路上行驶"},{"en":"A qualified fully licensed driver with at least four years of experience sits in the front passenger seat","zh":"一名符合陪同资格、至少有四年驾驶经验的完整驾照驾驶人坐在副驾驶座"}],"answer_index":3,"explanation_zh":"副驾驶座有符合陪同资格的驾驶人时，可豁免深夜年轻乘客人数限制：其须持有效完整G级或相应更高级别驾照，至少有四年持照经验，并符合陪同时的酒精等要求。近亲属乘客也不计入这项年轻乘客限制。","explanation_en":"The night passenger limit does not apply when a qualified accompanying driver with at least four years of licensed experience sits beside the G2 driver, or for passengers who are immediate family. The accompanying driver must meet the applicable alcohol and licence requirements.","source_url":"https://www.ontario.ca/page/get-g-drivers-licence-new-drivers","source_title":"Ontario current guidance · G2 passenger restrictions","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-25","group":"LA","section":"rules","topic_zh":"G2乘客限制","question_en":"A 23-year-old G2 driver is driving at 1 a.m. with four friends aged 18 to 19, each using a working seatbelt. Which statement is correct?","question_zh":"一名23岁的G2驾驶人凌晨1点开车，车上载着四名18至19岁的朋友，每人都系着可正常使用的安全带。下列哪项说法正确？","options":[{"en":"Not allowed, because any G2 driver may carry only one passenger after midnight","zh":"不允许，因为任何G2驾驶人午夜后都只能载一名乘客"},{"en":"Not allowed, because a G2 driver may carry at most three passengers aged 19 or under","zh":"不允许，因为G2驾驶人最多只能载三名19岁及以下乘客"},{"en":"Allowed, because these passenger limits apply only to G2 drivers aged 19 or under","zh":"允许，因为这些乘客限制只适用于19岁及以下的G2驾驶人"},{"en":"Not allowed, because G2 drivers may not drive at all between midnight and 5 a.m.","zh":"不允许，因为G2驾驶人在午夜至凌晨5点完全不得驾驶"}],"answer_index":2,"explanation_zh":"G2深夜（午夜至凌晨5点）载年轻乘客的限制只针对19岁及以下的G2驾驶人；23岁的G2驾驶人不受此限，但车内每人仍须有安全带，且驾驶人BAC必须为零。","explanation_en":"The late-night passenger limits apply only to G2 drivers aged 19 and under.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LA-26","group":"LA","section":"rules","topic_zh":"酒精规定","question_en":"A 20-year-old has just earned a full Class G licence. What blood alcohol concentration is allowed when this person drives?","question_zh":"一名20岁的驾驶人刚取得完整的G驾照。此人驾驶时允许的血液酒精浓度是多少？","options":[{"en":"Less than 0.05%","zh":"低于0.05%"},{"en":"Less than 0.08%","zh":"低于0.08%"},{"en":"Zero","zh":"零"},{"en":"Zero only during the first year of the full G licence","zh":"仅在取得完整G驾照的第一年内必须为零"}],"answer_index":2,"explanation_zh":"法律规定，所有21岁及以下的驾驶人，无论持有哪一类驾照，血液酒精浓度都必须为零。","explanation_en":"All drivers aged 21 and under, regardless of licence class, must have zero BAC.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-27","group":"LA","section":"rules","topic_zh":"酒精规定","question_en":"A 35-year-old driver holds a G2 licence. What blood alcohol concentration is permitted while driving?","question_zh":"一名35岁的驾驶人持有G2驾照。驾驶时允许的血液酒精浓度是多少？","options":[{"en":"Less than 0.08%","zh":"低于0.08%"},{"en":"Zero","zh":"零"},{"en":"Less than 0.05%","zh":"低于0.05%"},{"en":"Zero only between midnight and 5 a.m.","zh":"仅在午夜至凌晨5点必须为零"}],"answer_index":1,"explanation_zh":"G2阶段的驾驶人不论年龄，饮酒后都不得驾驶，血液酒精浓度必须为零。","explanation_en":"Level Two drivers of any age must have a BAC of zero.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-28","group":"LA","section":"rules","topic_zh":"路考","question_en":"If you fail a road test, how long must you wait before taking another one?","question_zh":"如果路考没有通过，至少要等多久才能再次参加路考？","options":[{"en":"At least 7 days","zh":"至少7天"},{"en":"At least 14 days","zh":"至少14天"},{"en":"At least 30 days","zh":"至少30天"},{"en":"At least 10 days","zh":"至少10天"}],"answer_index":3,"explanation_zh":"两次路考之间必须至少间隔10天。考官会给你一份完整的技能报告，指出需要改进的地方。","explanation_en":"You must wait at least 10 days between road tests.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-29","group":"LA","section":"rules","topic_zh":"路考费用","question_en":"To keep your prepaid road-test fee, at least how much notice must you give when cancelling or rescheduling your appointment?","question_zh":"取消或改期路考预约时，至少要提前多久通知，才不会损失已预付的路考费？","options":[{"en":"One week","zh":"一周"},{"en":"24 hours","zh":"24小时"},{"en":"72 hours","zh":"72小时"},{"en":"48 hours","zh":"48小时"}],"answer_index":3,"explanation_zh":"如果提前不足48小时取消或改期，或者缺考，预付的路考费不予退还；只有在近亲属去世等特殊情况下，费用才会作为抵用额度保留在驾驶记录上。","explanation_en":"Cancelling with less than 48 hours' notice, or not showing up, forfeits the prepaid fee.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-30","group":"LA","section":"rules","topic_zh":"路考费用","question_en":"Your road test is declared out-of-order because your vehicle does not meet ministry standards. What happens to your road-test fee?","question_zh":"你的车辆不符合交通部的路考标准，考官因此判定路考「无法进行」（out-of-order）。你的路考费会怎样处理？","options":[{"en":"You lose the whole fee and must pay it again to rebook","zh":"全部费用作废，重新预约须再全额付费"},{"en":"The whole fee stays as a credit on your record","zh":"全部费用作为抵用额度保留在驾驶记录上"},{"en":"You lose half; the other half stays as a credit","zh":"损失一半，另一半作为抵用额度保留在驾驶记录上"},{"en":"You lose a quarter; the rest is refunded to you","zh":"损失四分之一，其余退还给你"}],"answer_index":2,"explanation_zh":"路考被判定为out-of-order时，你会损失50%的路考费，另外50%作为抵用额度留在驾驶记录上；重新预约时需补交被扣的那50%。","explanation_en":"An out-of-order road test costs you 50% of the fee; the rest remains as a credit.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LA-31","group":"LA","section":"rules","topic_zh":"路考","question_en":"Which of the following may you NOT rely on during an Ontario road test?","question_zh":"在安省路考中，以下哪一项是你「不」可以依赖使用的？","options":[{"en":"The vehicle's mirrors","zh":"车辆的后视镜"},{"en":"A back-up camera","zh":"倒车摄像头"},{"en":"The turn signals","zh":"转向灯"},{"en":"Shoulder checks","zh":"转头检查盲区"}],"answer_index":1,"explanation_zh":"路考必须展示转头、查看后视镜、观察周围及倒车等基本技能，不能依赖倒车摄像头替代这些检查。DriveTest允许使用配备倒车摄像头的车辆，但摄像头不能代替实际观察。","explanation_en":"You must demonstrate observation and reversing skills without relying on a back-up camera: turn your head, check mirrors and look around. DriveTest allows vehicles fitted with a rear camera; its presence does not replace these checks.","source_url":"https://drivetest.ca/home/faqs/","source_title":"DriveTest · Road-test rear camera FAQ","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-32","group":"LA","section":"rules","topic_zh":"路考","question_en":"Who else may be in the vehicle with you during a road test?","question_zh":"路考期间，车上除了你之外还可以有谁？","options":[{"en":"Only the driver examiner","zh":"只有路考考官"},{"en":"Your driving instructor, in the back seat","zh":"坐在后排的驾驶教练"},{"en":"A translator, if you need one","zh":"如有需要，可带一名翻译"},{"en":"Your accompanying driver, if you hold a G1","zh":"如果你持G1，可带陪同驾驶人"}],"answer_index":0,"explanation_zh":"路考时车上除了考官以外，不允许有其他乘客或宠物；驾驶教练、朋友、亲属和翻译都不能陪同。","explanation_en":"Only the driver examiner may be in the vehicle during a road test.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-33","group":"LA","section":"rules","topic_zh":"路考","question_en":"You hold a G1 licence and are taking your own car to your road test for a G2. What does the handbook require?","question_zh":"你持有G1驾照，要开自己的车去参加升G2的路考。手册对此有什么要求？","options":[{"en":"You may drive there alone, since you are going to a test","zh":"可以单独开车前往，因为是去考试"},{"en":"You may drive there alone if you have completed a BDE course","zh":"如果已完成BDE课程，可以单独开车前往"},{"en":"A friend with a G2 licence may ride with you as your supervisor","zh":"可以由持G2驾照的朋友陪同前往"},{"en":"An accompanying driver must come with you to the test centre","zh":"必须有陪同驾驶人和你一起到考场"}],"answer_index":3,"explanation_zh":"G1驾驶人去路考时，必须有陪同驾驶人一起到考场；陪同驾驶人须持G级或以上驾照并有至少四年经验，G2驾照持有人不符合条件。G2驾驶人去路考则要准备好万一不及格时另找交通工具回家。","explanation_en":"A Level One driver must have an accompanying driver come with them to the test centre.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-34","group":"LA","section":"rules","topic_zh":"路考","question_en":"Which condition must the vehicle you bring to a road test meet?","question_zh":"你带去路考的车辆必须满足下列哪个条件？","options":[{"en":"It must be provided by the DriveTest Centre","zh":"必须由DriveTest考试中心提供"},{"en":"It must be equipped with a back-up camera","zh":"必须配备倒车摄像头"},{"en":"It may be uninsured if the examiner agrees","zh":"只要考官同意，可以不投保"},{"en":"It must be fit, plated and insured","zh":"必须车况良好、已挂牌并已投保"}],"answer_index":3,"explanation_zh":"路考须自备合适类别的车辆，车辆必须状况良好、可正常行驶、已挂牌并投保。DriveTest允许配备倒车摄像头的车辆，但考生必须实际观察、转头和查看后视镜，不能依赖摄像头替代这些技能。","explanation_en":"Your road-test vehicle must be fit, in proper working condition, plated and insured.","source_url":"https://drivetest.ca/home/faqs/","source_title":"DriveTest · Road-test rear camera FAQ","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-35","group":"LA","section":"rules","topic_zh":"G2路考","question_en":"Before taking the G2 exit test for a full G licence, what must you complete?","question_zh":"参加G2升G的路考之前，你必须完成什么？","options":[{"en":"A logbook of 50 hours of supervised night driving","zh":"一份记录50小时有人陪同夜间驾驶的日志"},{"en":"A Declaration of Highway Driving Experience form","zh":"《高速公路驾驶经验声明表》"},{"en":"A second vision test and a new knowledge test","zh":"再做一次视力测试和新的知识考试"},{"en":"A ministry-approved beginner driver education course","zh":"交通部认可的初学驾驶教育（BDE）课程"}],"answer_index":1,"explanation_zh":"参加G2升G路考前必须具备高速公路驾驶经验，并填写《高速公路驾驶经验声明表》（Declaration of Highway Driving Experience），说明你的高速驾驶经历。","explanation_en":"You must complete a Declaration of Highway Driving Experience before the G2 exit test.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-36","group":"LA","section":"rules","topic_zh":"G2路考","question_en":"The highway driving experience required before the G2 exit test means driving on roads with speed limits of at least:","question_zh":"G2升G路考前所需的高速公路驾驶经验，是指在限速至少多少的道路上驾驶的经验？","options":[{"en":"100 km/h","zh":"100公里/小时"},{"en":"60 km/h","zh":"60公里/小时"},{"en":"80 km/h","zh":"80公里/小时"},{"en":"90 km/h","zh":"90公里/小时"}],"answer_index":2,"explanation_zh":"G2升G路考前所需的「高速公路驾驶经验」，指在限速至少80公里/小时的道路上驾驶的经验。","explanation_en":"Highway experience means driving on roads with limits of at least 80 km/h.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-37","group":"LA","section":"rules","topic_zh":"身份证明","question_en":"Which of these would be accepted as proof of your legal name and date of birth when applying for a licence?","question_zh":"申请驾照时，下列哪一项可以作为法定姓名和出生日期的证明？","options":[{"en":"A photocopy of your Canadian passport","zh":"加拿大护照的复印件"},{"en":"Your expired Permanent Resident Card","zh":"已过期的永久居民卡"},{"en":"Your parent confirming your identity in person","zh":"由父母当面确认你的身份"},{"en":"Your original, valid foreign passport","zh":"你本人有效的外国护照原件"}],"answer_index":3,"explanation_zh":"证件必须是原件且在有效期内，复印件和过期证件都不被接受；加拿大或外国护照均可，但由父母或监护人直接证明身份不被接受。","explanation_en":"Documents must be original and valid; a valid foreign passport is acceptable.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-38","group":"LA","section":"rules","topic_zh":"身份证明","question_en":"When you apply for a driver's licence, your documents must prove which information?","question_zh":"申请驾照时，你提交的证件必须证明哪些信息？","options":[{"en":"Your legal name and complete date of birth","zh":"你的法定姓名和完整出生日期"},{"en":"Your home address and phone number","zh":"你的住址和电话号码"},{"en":"Your employer and annual income","zh":"你的雇主和年收入"},{"en":"Your Social Insurance Number and citizenship","zh":"你的社会保险号和国籍"}],"answer_index":0,"explanation_zh":"申请驾照时必须出示原件证件，证明你的法定姓名及完整出生日期（日、月、年）。","explanation_en":"You must prove your legal name and complete date of birth.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-39","group":"LA","section":"rules","topic_zh":"驾照照片","question_en":"Which of the following is acceptable in your driver's licence photo?","question_zh":"拍摄驾照照片时，以下哪一项是允许的？","options":[{"en":"A broad, natural smile that shows your teeth","zh":"露出牙齿的自然笑容"},{"en":"Hair hanging down over your eyes","zh":"头发垂下遮住眼睛"},{"en":"Religious headwear not covering your face","zh":"不遮挡面部的宗教头饰"},{"en":"Your head tilted slightly to one side","zh":"头部稍微向一侧倾斜"}],"answer_index":2,"explanation_zh":"照片中面部必须完全可见、无遮挡、表情自然放松（不要笑）、正对镜头；出于宗教或医疗原因可以佩戴头饰，但不能遮住面部任何部分，头发也不能遮住眼睛。","explanation_en":"Religious or medical headwear is allowed if it does not cover any part of the face.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-40","group":"LA","section":"rules","topic_zh":"申请费用","question_en":"The fee you pay when you first apply for a licence covers which of the following?","question_zh":"首次申请驾照时缴纳的费用包括哪些项目？","options":[{"en":"The knowledge test and both road tests","zh":"知识考试和两次路考"},{"en":"The knowledge test, first road test and a five-year licensing fee","zh":"知识考试、第一次路考和五年的驾照费"},{"en":"The knowledge test only","zh":"仅知识考试"},{"en":"The knowledge test, first road test and a ten-year licensing fee","zh":"知识考试、第一次路考和十年的驾照费"}],"answer_index":1,"explanation_zh":"申请时缴纳的费用包括知识考试、第一次路考和五年的驾照费；第二次路考和任何补考需另外付费，预约路考须先预付费用。","explanation_en":"The application fee covers the knowledge test, first road test and a five-year licence.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-41","group":"LA","section":"rules","topic_zh":"健康要求","question_en":"Which professionals have mandatory duties to report prescribed high-risk medical or visual conditions that make driving dangerous?","question_zh":"对于法规规定、会导致驾驶危险的高风险疾病或视力状况，哪些专业人员负有强制报告义务？","options":[{"en":"Physicians, nurse practitioners and optometrists, within their reporting duties","zh":"医生、执业护士及验光师，各按其法定报告职责"},{"en":"Insurance companies","zh":"保险公司"},{"en":"Driving instructors","zh":"驾驶教练"},{"en":"The person's employer","zh":"当事人的雇主"}],"answer_index":0,"explanation_zh":"现行制度中，医生、执业护士及验光师须按各自职责报告法规规定的高风险状况；验光师的强制报告范围为视力障碍。不是所有可能影响驾驶的疾病都属于强制报告项目，其他情况可能适用专业人员的酌情报告权限。","explanation_en":"Physicians, nurse practitioners and optometrists have mandatory reporting duties for prescribed high-risk conditions. Optometrists' mandatory reporting concerns visual impairments. Some other unsafe conditions can be reported at professional discretion.","source_url":"https://www.ontario.ca/page/reporting-driver-medical-review","source_title":"Ontario current guidance · Mandatory medical reporting","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-42","group":"LA","section":"rules","topic_zh":"新居民","question_en":"You have just moved to Ontario from another country and hold a valid licence from there. How long may you drive with it before you need an Ontario licence?","question_zh":"你刚从其他国家搬到安大略省居住，持有原居住国的有效驾照。你可以用这本驾照在安省驾驶多久，之后就必须取得安省驾照？","options":[{"en":"90 days","zh":"90天"},{"en":"30 days","zh":"30天"},{"en":"60 days","zh":"60天"},{"en":"6 months","zh":"6个月"}],"answer_index":2,"explanation_zh":"新居民可用其他省份或国家的有效驾照在安省驾驶60天；60天后若要继续驾驶，必须取得安省驾照。","explanation_en":"New residents may use a valid out-of-province or foreign licence for 60 days.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-43","group":"LA","section":"rules","topic_zh":"车辆登记","question_en":"As a new Ontario resident who brought your own car, how long do you have to register the vehicle in Ontario?","question_zh":"作为安省新居民，如果你带来了自己的车，需要在多长时间内在安省为车辆办理登记？","options":[{"en":"30 days","zh":"30天"},{"en":"60 days","zh":"60天"},{"en":"10 days","zh":"10天"},{"en":"90 days","zh":"90天"}],"answer_index":0,"explanation_zh":"新居民有30天时间为车辆办理登记，需到ServiceOntario申领车辆许可证和安省车牌。注意：用原驾照驾驶的期限是60天，两者不同。","explanation_en":"New residents have 30 days to register their vehicles.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/vehicle-insurance-and-registration","source_title":"MTO 手册 · Vehicle insurance and registration","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-44","group":"LA","section":"rules","topic_zh":"访客驾驶","question_en":"A visitor with a valid licence from their home country will drive in Ontario. For a visit longer than how long do they also need an International Driver's Permit from their own country?","question_zh":"一名访客持有本国有效驾照，打算在安省驾驶。访问时间超过多久时，还需要持有本国签发的国际驾驶许可证（International Driver's Permit）？","options":[{"en":"6 months","zh":"6个月"},{"en":"1 month","zh":"1个月"},{"en":"12 months","zh":"12个月"},{"en":"3 months","zh":"3个月"}],"answer_index":3,"explanation_zh":"访客须年满16岁并持有本国（省、州）有效驾照；如在安省停留超过3个月，还须持有本国签发的国际驾驶许可证。访客不能申请安省驾照。","explanation_en":"Visitors staying more than 3 months need an International Driver's Permit from their own country.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-45","group":"LA","section":"rules","topic_zh":"申请条件","question_en":"You hold an Ontario Photo Card and now apply for a driver's licence. What happens to the Photo Card?","question_zh":"你持有安省照片卡（Ontario Photo Card），现在申请驾照。照片卡会怎样处理？","options":[{"en":"You keep both, since they serve different purposes","zh":"两者都可以保留，因为用途不同"},{"en":"You keep it until you get your full G licence","zh":"可以保留到取得完整G驾照为止"},{"en":"It is automatically converted into a G1 licence","zh":"它会自动转换为G1驾照"},{"en":"You must give it up as part of the process","zh":"你必须在申请过程中交回照片卡"}],"answer_index":3,"explanation_zh":"同一人不能同时持有安省驾照和安省照片卡；申请驾照时必须交回照片卡。","explanation_en":"You cannot hold both; the Photo Card must be given up when you apply.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-46","group":"LA","section":"rules","topic_zh":"外国驾照换领","question_en":"A new resident from a country with a licence-exchange agreement with Ontario holds an equivalent licence but has only one year of driving experience. What can this driver expect?","question_zh":"一名新居民来自与安省签有驾照互换协议的国家，持有同等类别的驾照，但只有一年驾驶经验。他可以得到怎样的处理？","options":[{"en":"Credit for experience and entry into Level Two (G2)","zh":"经验获得认可，并进入第二阶段（G2）"},{"en":"An immediate full Class G licence","zh":"立即获得完整G驾照"},{"en":"A G1 licence and the full 12-month waiting period","zh":"获得G1驾照，并需等满12个月"},{"en":"A requirement to complete a BDE course first","zh":"必须先完成BDE课程"}],"answer_index":0,"explanation_zh":"来自互换协议地区、持同等类别驾照的驾驶人可换领完整G驾照；但如果驾驶经验不足两年，可获经验认可并进入第二阶段（G2），累计满两年经验后再参加G2升G路考。","explanation_en":"With under two years' experience, a driver from an exchange jurisdiction may be credited into Level Two.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-47","group":"LA","section":"rules","topic_zh":"外国驾照换领","question_en":"Which of these countries is listed in the handbook as having a licence-exchange agreement with Ontario?","question_zh":"下列哪个国家在手册中被列为与安省签有驾照互换协议？","options":[{"en":"China","zh":"中国"},{"en":"India","zh":"印度"},{"en":"Japan","zh":"日本"},{"en":"Brazil","zh":"巴西"}],"answer_index":2,"explanation_zh":"安省与加拿大各省及地区，以及澳大利亚、法国、德国、英国、日本、韩国、美国等签有驾照互换协议；中国、印度、巴西不在该名单中，来自这些国家的申请人须通过视力和知识考试，从G1开始。","explanation_en":"Japan is on Ontario's licence-exchange list; China, India and Brazil are not.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LA-48","group":"LA","section":"rules","topic_zh":"外国驾照换领","question_en":"Starting July 1, 2026, what is the maximum driving experience an applicant from a non-exchange jurisdiction can claim by presenting an original, valid foreign licence?","question_zh":"自2026年7月1日起，来自未与安省签订驾照互换协议地区的申请人，凭有效的外国驾照原件最多可申报多少驾驶经验？","options":[{"en":"24 months","zh":"24个月"},{"en":"6 months","zh":"6个月"},{"en":"36 months","zh":"36个月"},{"en":"12 months","zh":"12个月"}],"answer_index":3,"explanation_zh":"自2026年7月1日起，非互换地区的申请人最多只能申报12个月的驾驶经验，而且只计算过去三年内的经验。","explanation_en":"From July 1, 2026, non-exchange applicants can claim at most 12 months of experience.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-49","group":"LA","section":"rules","topic_zh":"外国驾照换领","question_en":"When foreign driving experience from a non-exchange jurisdiction is credited, only experience from within what period can count?","question_zh":"认定来自非互换地区的驾驶经验时，只有哪段时间内的经验才能被计入？","options":[{"en":"The past one year","zh":"过去一年内"},{"en":"The past two years","zh":"过去两年内"},{"en":"The past three years","zh":"过去三年内"},{"en":"The past five years","zh":"过去五年内"}],"answer_index":2,"explanation_zh":"只有过去三年内的驾驶经验可以被认定，且最多认定12个月。","explanation_en":"Only experience within the past three years, up to 12 months, may be credited.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-50","group":"LA","section":"rules","topic_zh":"外国驾照换领","question_en":"Your foreign licence (from a non-exchange country) was issued recently, but you have more driving experience than it shows. Which letter of authentication would be acceptable to prove your full experience?","question_zh":"你的外国驾照（来自非互换国家）是近期签发的，但你的实际驾驶经验比驾照显示的更长。下列哪封认证信可以用来证明你的全部驾驶经验？","options":[{"en":"A letter from your former employer, dated last month, in your native language","zh":"前雇主上个月出具、用你的母语写成的信"},{"en":"A letter from your country's consulate, dated two months ago, in English","zh":"本国领事馆两个月前出具的英文信"},{"en":"A letter from your country's embassy, dated two years ago, in French","zh":"本国大使馆两年前出具的法文信"},{"en":"A letter from your driving school back home, translated by a friend","zh":"本国驾校出具、由朋友翻译的信"}],"answer_index":1,"explanation_zh":"认证信必须是最近6个月内出具的，由你所在国的大使馆、领事馆或驾照签发机构出具，并且使用英文或法文。","explanation_en":"The letter must be from the past 6 months, from an embassy, consulate or licensing agency, and in English or French.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LA-51","group":"LA","section":"rules","topic_zh":"外国驾照换领","question_en":"An applicant from a non-exchange country is credited with at least 12 months of foreign driving experience. What may this applicant do next?","question_zh":"一名来自非互换国家的申请人，被认定至少有12个月的外国驾驶经验。他接下来可以怎样做？","options":[{"en":"Take the G road test right away to get a full licence","zh":"立即参加G路考，直接取得完整驾照"},{"en":"Hold a G1 for 12 more months before any road test","zh":"须再持G1满12个月才能参加任何路考"},{"en":"Take the G2 road test at once; the G road test 12 months later","zh":"立即参加G2路考，至少再过12个月才能考G路考"},{"en":"Exchange the foreign licence directly for a full G","zh":"直接把外国驾照换成完整G驾照"}],"answer_index":2,"explanation_zh":"被认定至少12个月外国驾驶经验的申请人，可以立即参加考取G2的路考；之后必须至少再等12个月，才能参加G路考取得完整G驾照。","explanation_en":"With 12+ months credited, you may take the G2 road test right away, then wait at least 12 months for the G test.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LA-52","group":"LA","section":"rules","topic_zh":"外国驾照换领","question_en":"An applicant from a non-exchange country is credited with 6 months of foreign experience and has not taken a BDE course. How much longer must they hold a G1 before taking the road test for a G2?","question_zh":"一名来自非互换国家的申请人被认定了6个月的外国驾驶经验，且没有参加BDE课程。他还需要再持有G1多久，才能参加考取G2的路考？","options":[{"en":"No additional time","zh":"无需再等"},{"en":"4 more months","zh":"再等4个月"},{"en":"6 more months","zh":"再等6个月"},{"en":"12 more months","zh":"再等12个月"}],"answer_index":2,"explanation_zh":"被认定6个月经验的申请人，须再持G1满6个月，合计12个月才能参加G2路考；如完成交通部认可的BDE课程，这12个月可缩短为8个月。","explanation_en":"With 6 months credited, hold the G1 another 6 months (12 in total), or 8 months in total with BDE.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LA-53","group":"LA","section":"rules","topic_zh":"申请条件","question_en":"As of May 11, 2026, what must you declare when applying for a Class G or Class M licence?","question_zh":"自2026年5月11日起，申请G级或M级驾照时，必须声明什么？","options":[{"en":"Ontario is your main residence and you are legally in Canada","zh":"安省是你的主要居住地，且你在加拿大的居留合法"},{"en":"You have no unpaid traffic fines in any other province","zh":"你在其他任何省份都没有未缴的交通罚款"},{"en":"You own or lease a vehicle that is registered in Ontario","zh":"你拥有或租用一辆在安省登记的车辆"},{"en":"You have completed a ministry-approved beginner driver course","zh":"你已完成交通部认可的初学驾驶教育课程"}],"answer_index":0,"explanation_zh":"自2026年5月11日起，申请G级或M级驾照时需声明：安省是你的主要居住地，且你在加拿大的居留是合法的。","explanation_en":"Applicants must declare that Ontario is their primary residence and that they are legally in Canada.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-54","group":"LA","section":"rules","topic_zh":"驾照类别","question_en":"How many different classes of driver's licence are there in Ontario?","question_zh":"安大略省共有多少种不同类别的驾照？","options":[{"en":"9","zh":"9种"},{"en":"12","zh":"12种"},{"en":"15","zh":"15种"},{"en":"6","zh":"6种"}],"answer_index":1,"explanation_zh":"安省共有12种驾照类别，每一种对应不同类型的车辆，所持驾照类别必须与所驾驶的车辆类型相符。","explanation_en":"Ontario has 12 licence classes, and your class must match the vehicle you drive.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-55","group":"LA","section":"rules","topic_zh":"驾照类别","question_en":"Which licence can you obtain without first holding a Class G licence?","question_zh":"以下哪种驾照可以在没有先取得G驾照的情况下申请？","options":[{"en":"Class D (trucks)","zh":"D类（货车）"},{"en":"Class B (school buses)","zh":"B类（校车）"},{"en":"Class A (tractor-trailers)","zh":"A类（半挂牵引车）"},{"en":"Class M (motorcycles)","zh":"M类（摩托车）"}],"answer_index":3,"explanation_zh":"想考其他任何类别的驾照，都必须先持有G驾照；唯一的例外是摩托车驾照（M类），可以不先考G驾照。","explanation_en":"A motorcycle (Class M) licence is the only class you can get without a Class G first.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-56","group":"LA","section":"rules","topic_zh":"驾照类别","question_en":"Which of these licence classes allows you to drive an ambulance?","question_zh":"以下哪一类驾照可以驾驶救护车？","options":[{"en":"Class F","zh":"F类"},{"en":"Class G","zh":"G类"},{"en":"Class D","zh":"D类"},{"en":"Class A","zh":"A类"}],"answer_index":0,"explanation_zh":"F类驾照可驾驶最多24座的普通巴士和救护车；G类、D类、A类都不包括救护车（A类只可兼驾D类和G类车辆）。","explanation_en":"Class F covers regular buses of up to 24 passengers and ambulances.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LA-57","group":"LA","section":"rules","topic_zh":"驾照类别","question_en":"What is a 'Z' endorsement on a driver's licence required for?","question_zh":"驾照上的「Z」附加资格（endorsement）是驾驶哪类车辆所必需的？","options":[{"en":"Vehicles equipped with air brakes","zh":"配备气压制动系统（气刹）的车辆"},{"en":"Recreational vehicles","zh":"房车"},{"en":"Motorcycles","zh":"摩托车"},{"en":"Towing a trailer over 4,600 kg","zh":"拖挂超过4,600公斤的拖车"}],"answer_index":0,"explanation_zh":"驾驶任何配备气压制动系统（气刹）的机动车，驾照上都必须有「Z」附加资格；房车附加资格则是「T」。","explanation_en":"A Z endorsement is required to drive any motor vehicle equipped with air brakes.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-58","group":"LA","section":"rules","topic_zh":"驾照类别","question_en":"With an RV ('T') endorsement, a Class G driver may operate a recreational vehicle weighing up to:","question_zh":"持有房车附加资格（「T」endorsement）的G驾照驾驶人，可以驾驶重量不超过多少的房车？","options":[{"en":"4,600 kg","zh":"4,600公斤"},{"en":"20,000 kg","zh":"20,000公斤"},{"en":"11,000 kg","zh":"11,000公斤"},{"en":"14,000 kg","zh":"14,000公斤"}],"answer_index":3,"explanation_zh":"房车附加资格（T）允许持E、F、G类驾照的驾驶人驾驶不超过14,000公斤的房车；任何重量的房车则可用A、B、C、D类驾照，或带房车限制（Q）的D类驾照驾驶。","explanation_en":"A T endorsement lets Class E, F and G drivers operate RVs of up to 14,000 kg.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LA-59","group":"LA","section":"rules","topic_zh":"自行车","question_en":"Do you need a driver's licence to ride a bicycle in Ontario?","question_zh":"在安大略省骑自行车需要驾照吗？","options":[{"en":"No, but bicycles are vehicles under the Highway Traffic Act","zh":"不需要，但自行车在《公路交通法》中属于车辆"},{"en":"Yes, riders aged 16 or older need a Class G licence","zh":"需要，16岁及以上的骑车人须持G驾照"},{"en":"Yes, a Class M licence, the same as for a moped","zh":"需要，须持M类驾照，与轻便摩托车相同"},{"en":"No, and cyclists must follow pedestrian rules instead","zh":"不需要，而且骑车人应遵守行人规则"}],"answer_index":0,"explanation_zh":"在安省骑自行车不需要驾照，但《公路交通法》（Highway Traffic Act）将自行车定义为车辆，骑车人享有与其他车辆驾驶人相似的权利，并承担相似的责任。","explanation_en":"No licence is needed, but bicycles are vehicles under the Highway Traffic Act, with similar rights and duties.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-60","group":"LA","section":"rules","topic_zh":"驾照类别","question_en":"You hold a full Class G licence but no motorcycle licence. May you ride a moped or limited-speed motorcycle on the road?","question_zh":"你持有完整的G驾照，但没有任何摩托车驾照。你可以在道路上驾驶轻便摩托车（moped）或限速摩托车吗？","options":[{"en":"Yes, a full G licence also covers mopeds","zh":"可以，完整G驾照也包括轻便摩托车"},{"en":"No, you need an M-class licence, such as an M1 or M2","zh":"不可以，必须持有M类驾照（如M1或M2）"},{"en":"Yes, as long as you ride no faster than 50 km/h","zh":"可以，只要时速不超过50公里"},{"en":"No, mopeds may only be ridden on private property","zh":"不可以，轻便摩托车只能在私人场地行驶"}],"answer_index":1,"explanation_zh":"驾驶限速摩托车或轻便摩托车只能持M类驾照（包括M1、M2(L)、M2、M(L)或M），其他类别的驾照（包括G驾照）都不行。","explanation_en":"Mopeds and limited-speed motorcycles may only be driven on an M-class licence.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-61","group":"LA","section":"rules","topic_zh":"防诈骗","question_en":"A website promises a guaranteed pass on your road test and charges a 'booking fee' to schedule it. According to the handbook, what should you do?","question_zh":"某网站承诺保证你通过路考，并收取「预约费」帮你预约路考。根据手册，你应该怎么做？","options":[{"en":"Pay it, as long as it is lower than the official test fee","zh":"付钱，只要比官方考试费低就行"},{"en":"Pay it, since a guaranteed pass will save you time","zh":"付钱，因为保证通过能节省时间"},{"en":"Don't trust it; use only ontario.ca and drivetest.ca","zh":"不要相信，只使用ontario.ca和drivetest.ca"},{"en":"Use it, but only to book your G2 exit test","zh":"可以用，但只用来预约G2升G路考"}],"answer_index":2,"explanation_zh":"交通部和DriveTest不另外收取路考预约服务费，但路考本身的规定考试费仍须预付。不要相信免考发证或保证通过的承诺；核对路考资讯和官方收费时应使用ontario.ca及drivetest.ca。","explanation_en":"MTO and DriveTest charge no booking fees; distrust sites that promise guaranteed passes.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-62","group":"LA","section":"rules","topic_zh":"汽车保险","question_en":"In Ontario, you must show proof of auto insurance before you can do which of the following?","question_zh":"在安省，必须先出示汽车保险证明，才能办理以下哪项事务？","options":[{"en":"Book a G1 knowledge test at DriveTest","zh":"在DriveTest预约G1知识考试"},{"en":"Register a vehicle or renew its registration","zh":"车辆登记或续期登记"},{"en":"Change the address shown on your licence","zh":"更改驾照上的地址"},{"en":"Enrol in a beginner driver education course","zh":"报名参加初学驾驶教育课程"}],"answer_index":1,"explanation_zh":"安省实行强制汽车保险，每辆在本省登记的车辆都必须投保；办理车辆登记或续期登记前必须出示保险证明。","explanation_en":"Ontario has compulsory auto insurance; proof is needed to register a vehicle or renew its registration.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/vehicle-insurance-and-registration","source_title":"MTO 手册 · Vehicle insurance and registration","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-63","group":"LA","section":"rules","topic_zh":"车牌","question_en":"You sell your car to another person. What should you do with its licence plates?","question_zh":"你把车卖给了别人。车上的车牌应该怎么处理？","options":[{"en":"Leave them on the car for the buyer","zh":"留在车上给买家"},{"en":"Remove them; plates stay with the owner","zh":"取下车牌，车牌跟随车主"},{"en":"Destroy them and report them lost","zh":"销毁车牌并报失"},{"en":"Leave them on until the buyer registers it","zh":"留在车上，直到买家完成登记"}],"answer_index":1,"explanation_zh":"安省车牌实行「车牌跟人」（plate-to-owner）制度，车牌跟随车主而不是车辆；卖车或换车时必须取下车牌，如果不打算用在其他车上，可以交回ServiceOntario。","explanation_en":"Ontario plates move with the owner, so remove them when you sell or change vehicles.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/vehicle-insurance-and-registration","source_title":"MTO 手册 · Vehicle insurance and registration","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-64","group":"LA","section":"rules","topic_zh":"车辆登记","question_en":"What does vehicle registration in Ontario include?","question_zh":"在安省，车辆登记包括什么？","options":[{"en":"Your driver's licence and insurance card","zh":"驾照和保险卡"},{"en":"A safety certificate and an emissions test","zh":"安全证书和尾气检测"},{"en":"Licence plates only","zh":"仅车牌"},{"en":"Licence plates and a vehicle permit","zh":"车牌和车辆许可证（vehicle permit）"}],"answer_index":3,"explanation_zh":"安省的车辆登记包括车牌和车辆许可证（vehicle permit，即所有权证明 ownership）。","explanation_en":"Vehicle registration includes licence plates and a vehicle permit.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/vehicle-insurance-and-registration","source_title":"MTO 手册 · Vehicle insurance and registration","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-65","group":"LA","section":"rules","topic_zh":"车辆登记","question_en":"A new resident is registering a vehicle brought from another country. Which item is NOT required at ServiceOntario?","question_zh":"一名新居民要为从其他国家带来的车辆办理登记。以下哪一项「不」是在ServiceOntario办理时必须携带的？","options":[{"en":"A safety standards certificate","zh":"安全标准证书（safety standards certificate）"},{"en":"Proof of insurance","zh":"保险证明"},{"en":"A letter of authentication from your embassy","zh":"本国大使馆出具的认证信"},{"en":"The vehicle permit (ownership) from where you used to live","zh":"原居住地的车辆许可证（所有权证明）"}],"answer_index":2,"explanation_zh":"新居民登记车辆需携带：安全标准证书、保险证明、车辆进口表格（如车辆从其他国家带入），以及原居住地的车辆许可证或所有权证明。大使馆认证信用于证明外国驾驶经验，与车辆登记无关。","explanation_en":"Registration needs a safety certificate, insurance proof, import forms and the old permit, not an embassy letter.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/vehicle-insurance-and-registration","source_title":"MTO 手册 · Vehicle insurance and registration","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-66","group":"LA","section":"rules","topic_zh":"汽车保险","question_en":"Which organization regulates insurance in Ontario?","question_zh":"在安省，由哪个机构监管保险业？","options":[{"en":"ServiceOntario","zh":"ServiceOntario"},{"en":"DriveTest","zh":"DriveTest"},{"en":"The Financial Services Regulatory Authority of Ontario (FSRA)","zh":"安大略省金融服务监管局（FSRA）"},{"en":"The Ministry of Transportation","zh":"交通部"}],"answer_index":2,"explanation_zh":"安省保险业由安大略省金融服务监管局（FSRA）监管，可在其网站查核保险公司或代理是否持牌；保险经纪则由安大略省注册保险经纪人协会（RIBO）自律监管。","explanation_en":"FSRA regulates insurance in Ontario; RIBO self-regulates insurance brokers.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/vehicle-insurance-and-registration","source_title":"MTO 手册 · Vehicle insurance and registration","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-67","group":"LA","section":"rules","topic_zh":"保险欺诈防范","question_en":"After a collision, what does the handbook recommend to protect yourself from insurance fraud?","question_zh":"发生碰撞后，为了防范保险欺诈，手册建议你怎么做？","options":[{"en":"Sign blank repair forms so work can start sooner","zh":"先签署空白维修表格，以便尽快开工"},{"en":"Get details from everyone involved, including passengers","zh":"向所有相关人员（包括对方车上的乘客）收集信息"},{"en":"Get details from the other driver only, not passengers","zh":"只向对方驾驶人收集信息，不必问乘客"},{"en":"Avoid taking photos and wait for the police report","zh":"不要拍照，等警方报告即可"}],"answer_index":1,"explanation_zh":"碰撞后应尽量收集信息：拍摄现场照片，并记录所有相关人员（包括对方车上乘客）的姓名、地址、电话、车牌号、驾照号码和保险信息；不要在接受服务前签署空白表格。","explanation_en":"Take photos and collect everyone's details, including passengers; never sign blank forms.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/vehicle-insurance-and-registration","source_title":"MTO 手册 · Vehicle insurance and registration","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-68","group":"LA","section":"rules","topic_zh":"保险欺诈防范","question_en":"After a collision, a tow truck operator offers you money to take your car to a particular body shop. What should you do?","question_zh":"发生碰撞后，一名拖车司机提出给你钱，让你把车送到某家修车厂。你应该怎么做？","options":[{"en":"Accept, since the shop will bill your insurer anyway","zh":"接受，反正修车厂会向保险公司收费"},{"en":"Be wary and contact your insurance company","zh":"保持警惕，联系你的保险公司"},{"en":"Accept only if the shop is close to your home","zh":"只有修车厂离家近时才接受"},{"en":"Sign the operator's forms first, then decide","zh":"先签拖车司机的表格，再做决定"}],"answer_index":1,"explanation_zh":"如果拖车司机向你施压或给钱让你去特定的修车厂、律师、法律助理或医疗机构，要提高警惕；应联系自己的保险公司，了解拖车事宜和该去哪里修车。","explanation_en":"Be wary of tow-operator referrals and contact your insurer instead.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/vehicle-insurance-and-registration","source_title":"MTO 手册 · Vehicle insurance and registration","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-69","group":"LA","section":"rules","topic_zh":"车主责任","question_en":"Who is responsible for making sure a vehicle is registered, insured and maintained to basic safety standards?","question_zh":"谁有责任确保车辆已登记、已投保并保持符合基本安全标准？","options":[{"en":"The insurance company","zh":"保险公司"},{"en":"The last mechanic who serviced it","zh":"最近一次为车辆维修的技师"},{"en":"The vehicle's owner","zh":"车主"},{"en":"The Ministry of Transportation","zh":"交通部"}],"answer_index":2,"explanation_zh":"安省道路上的所有机动车都必须登记、投保，并维护到符合基本安全标准；车主有责任确保车辆满足这些要求。","explanation_en":"Vehicle owners are responsible for registration, insurance and basic safety standards.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/your-vehicle","source_title":"MTO 手册 · Your Vehicle","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-70","group":"LA","section":"rules","topic_zh":"驾照法规","question_en":"A relative asks to borrow your driver's licence for a day. What does Ontario law say about this?","question_zh":"一位亲戚想借用你的驾照一天。安省法律对此是怎样规定的？","options":[{"en":"It is allowed if you are with them when they use it","zh":"如果他使用时你在场就可以"},{"en":"It is allowed if they return it within 24 hours","zh":"只要24小时内归还就可以"},{"en":"Lending your licence is illegal","zh":"出借驾照是违法的"},{"en":"It is allowed if they hold the same class of licence","zh":"只要他持有同类驾照就可以"}],"answer_index":2,"explanation_zh":"在安省，出借驾照、让他人使用你的驾照、使用涂改过的驾照、把别人的驾照当作自己的使用，或持有一张以上安省驾照，都是违法的。","explanation_en":"Lending your licence or letting someone else use it is illegal.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-71","group":"LA","section":"rules","topic_zh":"路考","question_en":"According to the handbook, when should you ask the examiner your questions about the road test?","question_zh":"根据手册，关于路考的疑问应该在什么时候向考官提出？","options":[{"en":"Before the test begins","zh":"路考开始之前"},{"en":"Whenever you are unsure during the test","zh":"路考中有疑问时随时问"},{"en":"Only after you receive your results","zh":"拿到成绩之后才可以问"},{"en":"Only while parked partway through the test","zh":"只有在路考中途停车时才可以问"}],"answer_index":0,"explanation_zh":"考官会在开始前说明考试内容和时限，考试过程中不允许指导你，所以有疑问要在路考开始前问清楚；考官也不会要求你做任何违法的操作。","explanation_en":"Ask questions before the test, because the examiner is not allowed to coach you during it.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LA-72","group":"LA","section":"rules","topic_zh":"驾照类别","question_en":"A person holds only a full Class M (motorcycle) licence. Under what conditions may they drive a car?","question_zh":"某人只持有完整的M类（摩托车）驾照。他可以在什么条件下驾驶小汽车？","options":[{"en":"With no restrictions, like a full G licence holder","zh":"没有任何限制，与完整G驾照持有人相同"},{"en":"Under the conditions that apply to a G2 licence holder","zh":"须遵守适用于G2驾照持有人的条件"},{"en":"Under the conditions that apply to a G1 licence holder","zh":"须遵守适用于G1驾照持有人的条件"},{"en":"They may not drive a car at all","zh":"完全不能驾驶小汽车"}],"answer_index":2,"explanation_zh":"M类（以及M2）驾照持有人也可以驾驶G类车辆，但必须遵守G1驾照持有人的条件，例如需有符合要求的陪同驾驶人、BAC为零、午夜至凌晨5点不得驾驶等。","explanation_en":"Class M and M2 holders may drive Class G vehicles only under G1 conditions.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LA-73","group":"LA","section":"rules","topic_zh":"驾照类别","question_en":"Which class of licence allows you to drive any tractor-trailer combination?","question_zh":"哪一类驾照允许驾驶任何牵引车加挂车（tractor-trailer）组合？","options":[{"en":"Class D","zh":"D类"},{"en":"Class A","zh":"A类"},{"en":"Class C","zh":"C类"},{"en":"Class B","zh":"B类"}],"answer_index":1,"explanation_zh":"A类可驾驶任何牵引车加挂车组合；B类为任何校车，C类为任何普通客车，D类为总重超过11,000公斤的机动车（或被拖车辆不超过4,600公斤的货车组合）。","explanation_en":"A Class A licence allows you to drive any tractor-trailer combination.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-74","group":"LA","section":"rules","topic_zh":"驾照类别","question_en":"What does a Class E licence allow you to drive?","question_zh":"E类驾照允许驾驶什么车辆？","options":[{"en":"Any school bus, whatever its passenger capacity","zh":"任何校车，不论载客量多少"},{"en":"Any regular bus, whatever its passenger capacity","zh":"任何普通客车，不论载客量多少"},{"en":"A school bus with a maximum capacity of 24 passengers","zh":"最多载客24人的校车"},{"en":"A truck with a gross weight of more than 11,000 kg","zh":"总重超过11,000公斤的货车"}],"answer_index":2,"explanation_zh":"E类可驾驶最多载客24人的校车，也可驾驶F类和G类车辆；任何校车（不限载客量）需B类，任何普通客车需C类，总重超过11,000公斤的车辆需D类。","explanation_en":"A Class E licence covers school-purposes buses with a maximum capacity of 24 passengers.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LA-75","group":"LA","section":"rules","topic_zh":"驾照互换","question_en":"A new Ontario resident from Japan holds an equivalent licence and has five years of driving experience. What licence can this driver get?","question_zh":"一名来自日本的安大略省新居民持有同等级别的驾照，并有五年驾驶经验。他可以获得什么驾照？","options":[{"en":"A G1, then the full graduated-licensing process","zh":"G1，然后走完整个分级考照流程"},{"en":"A G2, then a G road test after 12 months","zh":"G2，12个月后参加G级路考"},{"en":"A G1 with credit for 12 months of experience","zh":"G1，并获得12个月驾驶经验抵免"},{"en":"A full Class G licence","zh":"正式G级驾照"}],"answer_index":3,"explanation_zh":"来自与安省签有驾照互换协议地区（如日本）的司机，持同等级别驾照且有至少两年经验，可直接获得正式G级驾照；不足两年则获得经验抵免并进入G2。","explanation_en":"Drivers from licence-exchange jurisdictions with an equivalent licence and at least two years' experience receive a full Class G licence.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-76","group":"LA","section":"rules","topic_zh":"访客驾驶","question_en":"A tourist is visiting Ontario for two months and asks for an Ontario driver's licence. What does the handbook say?","question_zh":"一名游客来安大略省旅游两个月，想申请安省驾照。手册怎么说？","options":[{"en":"Visitors are not eligible for an Ontario licence","zh":"访客没有资格获得安省驾照"},{"en":"They can get one after driving here for 60 days","zh":"在安省开车满60天后可以申请"},{"en":"They can get one by passing a knowledge test","zh":"通过笔试就可以获得"},{"en":"They can get one with an International Driver's Permit","zh":"持国际驾照即可获得"}],"answer_index":0,"explanation_zh":"访客须年满16岁并持有本国（省、州）有效驾照，访问超过3个月还需本国签发的国际驾照，但访客没有资格获得安省驾照。","explanation_en":"Visitors may drive on a valid home licence but are not eligible for an Ontario driver's licence.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/getting-your-drivers-licence","source_title":"MTO 手册 · Getting Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LA-77","group":"LA","section":"rules","topic_zh":"保险欺诈防范","question_en":"To check whether an insurance broker is licensed in Ontario, which organization's website should you visit?","question_zh":"要核实某保险经纪人在安大略省是否持牌，应查看哪个机构的网站？","options":[{"en":"The Financial Services Regulatory Authority of Ontario (FSRA)","zh":"安大略金融服务监管局（FSRA）"},{"en":"The Registered Insurance Brokers of Ontario (RIBO)","zh":"安大略注册保险经纪人协会（RIBO）"},{"en":"The Ministry of Transportation","zh":"交通部"},{"en":"ServiceOntario","zh":"ServiceOntario（安省政府服务中心）"}],"answer_index":1,"explanation_zh":"FSRA监管安省保险业，可在其网站查保险公司或代理人是否持牌；保险经纪人的自律监管机构是RIBO，可在RIBO网站查经纪人是否持牌。","explanation_en":"RIBO is the self-regulatory body for Ontario insurance brokers, and its website shows whether a broker is licensed.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/vehicle-insurance-and-registration","source_title":"MTO 手册 · Vehicle insurance and registration","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"LA-78","group":"LA","section":"rules","topic_zh":"保险欺诈防范","question_en":"After a collision, a clinic asks you to sign blank forms before you receive any treatment. What should you do?","question_zh":"发生碰撞后，一家诊所要求你在接受任何治疗前先签署空白表格。你应该怎么做？","options":[{"en":"Sign them to speed up your insurance claim","zh":"签字以加快保险理赔"},{"en":"Sign them if the tow-truck driver recommended the clinic","zh":"如果是拖车司机推荐的诊所就签"},{"en":"Refuse to sign blank forms in advance","zh":"拒绝预先签署空白表格"},{"en":"Sign them and ask for copies later","zh":"先签字，之后再索取副本"}],"answer_index":2,"explanation_zh":"为防范汽车保险欺诈，在接受服务或治疗前拒绝签署空白表格，并要求提供详细的维修和医疗账单，仔细核对。","explanation_en":"To guard against insurance fraud, refuse to sign blank forms before receiving services or treatment.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/vehicle-insurance-and-registration","source_title":"MTO 手册 · Vehicle insurance and registration","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-01","group":"LB","section":"rules","topic_zh":"扣分制度","question_en":"How long do demerit points remain on your Ontario driving record?","question_zh":"扣分会在安省驾驶记录上保留多长时间？","options":[{"en":"One year from the date of the offence","zh":"自违章之日起一年"},{"en":"Two years from the date of the offence","zh":"自违章之日起两年"},{"en":"Three years from the date of conviction","zh":"自定罪之日起三年"},{"en":"Five years from the date of conviction","zh":"自定罪之日起五年"}],"answer_index":1,"explanation_zh":"扣分自违章行为发生之日起在记录上保留两年，不是从定罪之日起计算。","explanation_en":"Demerit points stay on your record for two years from the offence date.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-02","group":"LB","section":"rules","topic_zh":"新手扣分","question_en":"A G2 driver's record reaches 2 demerit points. What happens?","question_zh":"一名 G2 驾驶者的累计扣分达到 2 分，会发生什么？","options":[{"en":"The driver receives a warning letter","zh":"驾驶者会收到一封警告信"},{"en":"The licence is suspended for 30 days","zh":"驾照被暂停 30 天"},{"en":"The licence is suspended for 60 days","zh":"驾照被暂停 60 天"},{"en":"The licence is cancelled","zh":"驾照被注销"}],"answer_index":0,"explanation_zh":"新手驾驶者（G1、G2）累计扣分达到 2 分或以上会收到警告信；6 分收到第二封警告信；9 分或以上才会被暂停驾照 60 天。","explanation_en":"Novice drivers with two or more points receive a warning letter.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-03","group":"LB","section":"rules","topic_zh":"新手扣分","question_en":"A novice (G1 or G2) driver has accumulated 6 demerit points. According to the handbook, what happens?","question_zh":"一名新手驾驶者（G1 或 G2）累计扣分达到 6 分。根据手册，会发生什么？","options":[{"en":"The licence is suspended for 30 days","zh":"驾照被暂停 30 天"},{"en":"The driver receives a second warning letter","zh":"驾驶者收到第二封警告信"},{"en":"The licence is suspended for 60 days","zh":"驾照被暂停 60 天"},{"en":"The driver must restart at Level One","zh":"驾驶者必须从第一级（G1）重新开始"}],"answer_index":1,"explanation_zh":"新手驾驶者累计扣分达到 6 分时会收到第二封警告信，敦促其改善驾驶行为；要到 9 分才会被暂停驾照。","explanation_en":"At six points a novice driver gets a second warning letter.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-04","group":"LB","section":"rules","topic_zh":"新手扣分","question_en":"A G1 or G2 driver accumulates 9 demerit points within two years for the first time. How long is the licence suspended?","question_zh":"一名 G1 或 G2 驾驶者首次在两年内累计扣分达到 9 分，驾照会被暂停多久？","options":[{"en":"30 days","zh":"30 天"},{"en":"60 days","zh":"60 天"},{"en":"90 days","zh":"90 天"},{"en":"Six months","zh":"六个月"}],"answer_index":1,"explanation_zh":"新手驾驶者两年内累计扣分达到 9 分或以上，驾照暂停 60 天，从向交通部上交驾照之日起计算；期满后若再次达到 9 分，可能被暂停六个月。","explanation_en":"Nine or more points brings a 60-day suspension for novice drivers.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"LB-05","group":"LB","section":"rules","topic_zh":"新手扣分","question_en":"After a novice driver's 60-day demerit-point suspension ends, the points on the record are reduced to:","question_zh":"新手驾驶者因扣分被暂停驾照 60 天，期满后记录上的扣分会降至多少分？","options":[{"en":"Zero","zh":"0 分"},{"en":"Two","zh":"2 分"},{"en":"Four","zh":"4 分"},{"en":"Seven","zh":"7 分"}],"answer_index":2,"explanation_zh":"新手驾驶者暂停期满后，记录上的扣分降为 4 分；若再次累计到 9 分，驾照可能被暂停六个月。","explanation_en":"After the suspension, a novice driver's points are reduced to four.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source_title":"MTO 手册 · Keeping Your Driver's Licence","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"LB-06","group":"LB","section":"rules","topic_zh":"正式驾照扣分","question_en":"At how many demerit points does a fully licensed driver receive a first warning letter?","question_zh":"持正式驾照的驾驶者累计扣分达到多少分时，会收到第一封警告信？","options":[{"en":"2","zh":"2 分"},{"en":"6","zh":"6 分"},{"en":"9","zh":"9 分"},{"en":"15","zh":"15 分"}],"answer_index":1,"explanation_zh":"持正式驾照的驾驶者 6 分时收到警告信，9 分时收到第二封警告信，15 分时被暂停驾照。2 分收警告信是新手驾驶者的标准。","explanation_en":"Fully licensed drivers get a warning letter at six points.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/keeping-your-drivers-licence","source
