"应该；拖着走说不定能把发动机带着"},{"en":"Yes, as long as you keep your speed under 40 km/h the whole way","zh":"可以，只要全程车速低于 40 km/h"},{"en":"Yes, as long as nobody sits in the broken-down car","zh":"可以，只要没人坐在抛锚的车里"}],"answer_index":0,"explanation_zh":"发动机无法运转时，不要牵引装有助力刹车和助力转向的车辆：没有发动机，刹车和转向都很费力，可能导致碰撞，应叫清障车。用拖拽方式发动故障车也很危险。","explanation_en":"Don't tow a vehicle with power brakes and steering if its engine can't run; get a tow truck.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/towing","source_title":"MTO 手册 · Towing","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"RE-66","group":"RE","section":"rules","topic_zh":"雾天驾驶","question_en":"In dense fog, what is the danger of stopping in a driving lane?","question_zh":"在浓雾中，停在行车道上有什么危险？","options":[{"en":"There is none, as long as your hazard lights are flashing","zh":"只要危险警示灯在闪，就没有危险"},{"en":"You could become the first link in a chain-reaction collision","zh":"你可能成为连环追尾碰撞的第一环"},{"en":"It is only a problem if your fog lights are switched off","zh":"只有雾灯关着时才有问题"},{"en":"Your windshield will fog up while the car is stopped","zh":"车停下后挡风玻璃会起雾"}],"answer_index":1,"explanation_zh":"在雾中或暴风雪白茫（whiteout）中，不要停在道路的行车部分，否则可能引发连环追尾。能见度迅速下降时，应驶离道路进入安全的停车区。","explanation_en":"Stopping on the travelled part of the road in fog could make you the first link in a chain-reaction collision.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RE-67","group":"RE","section":"rules","topic_zh":"雾天驾驶","question_en":"While you are driving in fog, the fog seems to be clearing ahead. What should you do?","question_zh":"你在雾中行驶，前方的雾似乎正在消散。你应该怎么做？","options":[{"en":"Speed up to make up for the time lost in the fog","zh":"加速，弥补在雾中耽误的时间"},{"en":"Pass the slower vehicles ahead while you can still see them","zh":"趁还能看清，超过前面的慢车"},{"en":"Don't speed up suddenly; you could quickly be back in fog","zh":"不要突然加速，你可能很快又驶入雾中"},{"en":"Switch to high beams so you can see farther ahead","zh":"切换到远光灯，以便看得更远"}],"answer_index":2,"explanation_zh":"即使雾看起来在消散也不要突然加速，因为可能很快又进入浓雾；雾中还应避免超车和变道，并使用近光灯。","explanation_en":"Don't speed up suddenly in fog even if it seems to be clearing, because you could find yourself back in fog.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-night-and-bad-weather","source_title":"MTO 手册 · Driving at night and in bad weather","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-68","group":"RE","section":"rules","topic_zh":"碰撞后的处理","question_en":"After a collision, which information should you give to the police?","question_zh":"发生碰撞后，你应向警察提供哪些信息？","options":[{"en":"Only your driver's licence number and the time of the collision","zh":"只提供驾照号码和碰撞发生的时间"},{"en":"Your employer's name and address","zh":"你雇主的名称和地址"},{"en":"Your vehicle's full repair history and your mechanic's name","zh":"车辆的全部维修记录和修车师傅的姓名"},{"en":"The plate and permit numbers and your liability insurance card","zh":"车牌号、车辆许可证号以及你的责任保险卡"}],"answer_index":3,"explanation_zh":"应尽力协助警方：提供你的姓名和地址、登记车主的姓名和地址、车牌号和车辆许可证号以及责任保险卡；还要记下所有目击者的姓名、地址和电话。","explanation_en":"Give police your name and address, the registered owner's name and address, the plate and permit numbers and your liability insurance card.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-emergencies","source_title":"MTO 手册 · Dealing with emergencies","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-69","group":"RE","section":"rules","topic_zh":"碰撞后的处理","question_en":"You come upon a collision you were not involved in, and police and other officials have not yet arrived. What should you do?","question_zh":"你遇到一起与你无关的碰撞事故，警察和其他官员尚未到场。你应该怎么做？","options":[{"en":"Stop to offer help","zh":"停车提供帮助"},{"en":"Drive on; only drivers involved may stop","zh":"继续行驶，只有当事司机才能停车"},{"en":"Stop only if you are trained in first aid","zh":"只有受过急救培训才停车"},{"en":"Slow down and take photos as you pass","zh":"减速并在经过时拍照"}],"answer_index":0,"explanation_zh":"当事司机必须留在现场或立即返回并尽力协助；未卷入事故的司机，如果警察或其他官员尚未到场，也应停车提供帮助。","explanation_en":"A driver not involved in a collision should stop to offer help if police or other officials have not arrived.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/dealing-emergencies","source_title":"MTO 手册 · Dealing with emergencies","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RE-70","group":"RE","section":"rules","topic_zh":"拖挂车转弯","question_en":"You are towing a trailer and need to make a sharp right turn. What should you do?","question_zh":"你正拖着挂车，需要做一个急右转。应该怎么做？","options":[{"en":"Start turning early, before your front wheels reach the curb","zh":"提前转向，在前轮到达路缘之前就开始转"},{"en":"Turn as you normally would; the trailer follows your exact path","zh":"照常转弯，挂车会完全沿你的轨迹行驶"},{"en":"Back up slightly first so the trailer lines up with the corner","zh":"先稍微倒车，让挂车对准转角"},{"en":"Move ahead until your front wheels are well past the curb, then turn","zh":"先向前行驶，直到前轮远远越过路缘，再向右转"}],"answer_index":3,"explanation_zh":"拖挂车急右转时，先看右后视镜、打灯减速，向前行驶到前轮远远越过路缘后再右转；左转时则要驶入路口较深处再转，转大弯。","explanation_en":"When towing, for a sharp right turn move ahead until your front wheels are well past the curb before turning.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/towing","source_title":"MTO 手册 · Towing","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-71","group":"RE","section":"rules","topic_zh":"挂车装备","question_en":"To avoid spraying or splashing traffic behind, what must your trailer have (unless it is designed not to spray)?","question_zh":"为避免向后方车辆溅水甩泥，挂车必须配备什么（除非其设计本身不会溅射）？","options":[{"en":"Mud guards, fenders and flaps","zh":"挡泥板、翼子板和挡泥皮"},{"en":"An orange-and-red slow-moving vehicle sign","zh":"橙红色慢行车辆标志"},{"en":"Reflective tape along both sides","zh":"两侧粘贴反光带"},{"en":"A second set of brake lights on the roof","zh":"车顶加装第二组刹车灯"}],"answer_index":0,"explanation_zh":"挂车必须装有挡泥板、翼子板和挡泥皮，或其设计本身不会向后方车辆溅射泥水。橙红色慢行车辆标志是给时速不超过40公里的农用机械、马车等车辆用的。","explanation_en":"A trailer must have mud guards, fenders and flaps, or be designed so it does not spray or splash traffic behind.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/towing","source_title":"MTO 手册 · Towing","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-72","group":"RE","section":"rules","topic_zh":"轮胎","question_en":"Which tire condition means the tire should be replaced?","question_zh":"轮胎出现下列哪种情况时应该更换？","options":[{"en":"Tread 3 mm deep on an ordinary passenger car","zh":"普通小汽车的胎纹深度为3毫米"},{"en":"The tires are five years old","zh":"轮胎已使用五年"},{"en":"The tires are a different brand from the spare","zh":"轮胎与备胎品牌不同"},{"en":"A cut in the sidewall deep enough to expose the cords","zh":"胎侧有深至露出帘线的割伤"}],"answer_index":3,"explanation_zh":"轮胎出现鼓包、凸起、结节、帘线外露，或胎面、胎侧割伤深至露出帘线时应更换。普通车胎纹浅于1.5毫米才需更换，轮胎不应超过10年。","explanation_en":"Replace tires with bumps, bulges, knots, exposed cords or cuts deep enough to expose the cords.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/maintaining-your-vehicle","source_title":"MTO 手册 · Maintaining your vehicle","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"RE-73","group":"RE","section":"rules","topic_zh":"节能驾驶","question_en":"When driving on a freeway, what does the handbook suggest for better fuel efficiency?","question_zh":"在高速公路上行驶时，手册建议怎样提高燃油效率？","options":[{"en":"Drive in a lower gear to keep engine speed up","zh":"用较低挡位行驶，保持较高转速"},{"en":"Use your overdrive gear and cruise control","zh":"使用超速挡（overdrive）和定速巡航"},{"en":"Open the windows instead of using the vents","zh":"开窗代替使用通风口"},{"en":"Alternate between speeding up and coasting","zh":"加速和滑行交替进行"}],"answer_index":1,"explanation_zh":"在高速公路上使用超速挡和定速巡航可提高燃油效率；高速行驶时用通风口或空调比开窗更省油。注意雨雪等恶劣天气不要用定速巡航。","explanation_en":"On the freeway, using overdrive and cruise control improves fuel efficiency.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-efficiently","source_title":"MTO 手册 · Driving efficiently","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"RE-74","group":"RE","section":"rules","topic_zh":"节能驾驶","question_en":"Why should you avoid starting your vehicle unnecessarily?","question_zh":"为什么应避免不必要地启动车辆？","options":[{"en":"Starting an engine more often than needed is illegal in Ontario","zh":"在安省，不必要地启动发动机是违法的"},{"en":"Restarting uses more fuel than idling for several minutes","zh":"重新启动比怠速几分钟更耗油"},{"en":"A cold engine gives off a burst of pollutants when started","zh":"冷发动机启动时会排放大量污染物"},{"en":"Each start resets the vehicle's emissions-control system","zh":"每次启动都会重置车辆的排放控制系统"}],"answer_index":2,"explanation_zh":"冷发动机启动时会排放大量污染物，所以应避免不必要的启动；但停车超过10秒就应熄火，因为即使天冷，发动机30秒内也能暖好。","explanation_en":"A cold engine releases a large burst of pollutants when started, so avoid unnecessary starts.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/driving-efficiently","source_title":"MTO 手册 · Driving efficiently","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SA-01","group":"SA","section":"signs","topic_zh":"停车标志","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"Come to a complete stop, then go only when the way is clear","zh":"必须完全停车，确认道路畅通后才能通行"},{"en":"Slow down and continue if no cross traffic is visible","zh":"减速，若看不到横向来车即可直接通过"},{"en":"Let traffic near the intersection go first, stopping only if needed","zh":"让路口附近的车辆先行，必要时才停车"},{"en":"Stop only when pedestrians are waiting to cross","zh":"只有在有行人等待过街时才需要停车"}],"answer_index":0,"explanation_zh":"这是停车标志（stop sign）：八边形、红底白字，要求完全停车，等道路畅通后再进入路口。「必要时才停车」是让行标志的要求。","explanation_en":"A stop sign requires a complete stop and waiting until the way is clear.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-1.jpg","sign_desc_en":"Eight-sided sign with a red background and white letters.","sign_desc_zh":"八边形标志，红底白字。","difficulty":"easy"},{"id":"SA-02","group":"SA","section":"signs","topic_zh":"停车标志","question_en":"Which description matches an Ontario stop sign?","question_zh":"下列哪项描述符合安大略省的停车标志（stop sign）？","options":[{"en":"Triangle with a white background and a red border","zh":"三角形，白底红边"},{"en":"Eight-sided with a red background and white letters","zh":"八边形，红底白字"},{"en":"Five-sided with a fluorescent yellow/green background","zh":"五边形，荧光黄绿色底"},{"en":"X-shaped with a white background and a red outline","zh":"X 形，白底红色轮廓"}],"answer_index":1,"explanation_zh":"停车标志为八边形、红底白字。三角形白底红边是让行标志，五边形荧光黄绿色是学校区域标志，X 形白底红色轮廓是铁路道口标志。","explanation_en":"A stop sign is eight-sided with a red background and white letters.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"SA-03","group":"SA","section":"signs","topic_zh":"停车位置","question_en":"Where you stop at a stop sign depends on what is marked there. Which list gives the correct order of preference, from first choice to last?","question_zh":"在停车标志前停车时，停车位置取决于现场有哪些标线和设施。下列哪项按优先顺序（从首选到末选）排列正确？","options":[{"en":"Crosswalk, stop line, edge of intersection, edge of sidewalk","zh":"人行横道、停止线、路口边缘、人行道边缘"},{"en":"Stop line, crosswalk, edge of sidewalk, edge of intersection","zh":"停止线、人行横道、人行道边缘、路口边缘"},{"en":"Stop line, edge of sidewalk, crosswalk, edge of intersection","zh":"停止线、人行道边缘、人行横道、路口边缘"},{"en":"Edge of intersection, crosswalk, stop line, edge of sidewalk","zh":"路口边缘、人行横道、停止线、人行道边缘"}],"answer_index":1,"explanation_zh":"停车标志处按顺序选择停车位置：有停止线就停在停止线；没有停止线停在人行横道前；没有人行横道停在人行道边缘；没有人行道停在路口边缘。","explanation_en":"Stop at the stop line; if none, the crosswalk; if none, the sidewalk edge; if none, the intersection edge.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SA-04","group":"SA","section":"signs","topic_zh":"学校区域标志","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"School bus stop ahead; stop only when the bus's red lights are flashing","zh":"前方校车停靠点，只有校车红灯闪烁时才需停车"},{"en":"Playground area; motor vehicles are not allowed","zh":"儿童游乐区，禁止机动车进入"},{"en":"You are coming to a school zone; slow down and watch for children","zh":"前方是学校区域，应减速并注意儿童"},{"en":"Pedestrian-only street ahead; turn around","zh":"前方是步行街，须掉头"}],"answer_index":2,"explanation_zh":"五边形、荧光黄绿色底、黑色图案的是学校区域标志，提醒前方是学校区域，应减速、格外小心并注意儿童。","explanation_en":"The school zone sign warns of a school zone: slow down and watch for children.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-2.jpg","sign_desc_en":"Five-sided sign with a fluorescent yellow/green background and black symbols.","sign_desc_zh":"五边形标志，荧光黄绿色底，黑色图案。","difficulty":"easy"},{"id":"SA-05","group":"SA","section":"signs","topic_zh":"学校区域标志","question_en":"Which sign is five-sided with a fluorescent yellow/green background and black symbols?","question_zh":"哪种标志为五边形、荧光黄绿色底、黑色图案？","options":[{"en":"Railway crossing sign","zh":"铁路道口标志"},{"en":"Yield sign","zh":"让行标志"},{"en":"Stop sign","zh":"停车标志"},{"en":"School zone sign","zh":"学校区域标志"}],"answer_index":3,"explanation_zh":"学校区域标志为五边形，荧光黄绿色底，黑色图案。","explanation_en":"The school zone sign is five-sided, fluorescent yellow/green with black symbols.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SA-06","group":"SA","section":"signs","topic_zh":"让行标志","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"Let traffic in or near the intersection go first; stop if necessary","zh":"让路口内或接近路口的车辆先行，必要时停车"},{"en":"Come to a full stop every time, even if no other traffic is anywhere near","zh":"无论附近有没有车，每次都必须完全停车"},{"en":"You have the right-of-way over cross traffic","zh":"相对横向来车，你享有先行权"},{"en":"Merge quickly; other drivers must make room for you","zh":"快速并入，其他司机必须给你让位"}],"answer_index":0,"explanation_zh":"这是让行标志（三角形、白底红边）：必须让路口内或接近路口的车辆先行，必要时停车，道路畅通后才通行。","explanation_en":"A yield sign means let traffic in or near the intersection go first, stopping if necessary.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-3.jpg","sign_desc_en":"Triangle with a white background and a red border.","sign_desc_zh":"三角形标志，白底红边。","difficulty":"easy"},{"id":"SA-07","group":"SA","section":"signs","topic_zh":"让行标志","question_en":"You approach a yield sign. There is no traffic in or near the intersection. What should you do?","question_zh":"你驶近一个让行标志，路口内及附近都没有车辆。你应该怎么做？","options":[{"en":"Come to a complete stop anyway, exactly as you would at a stop sign","zh":"照样完全停车，和在停车标志前一样"},{"en":"Wait at least three seconds before moving on","zh":"至少等待三秒再继续行驶"},{"en":"Proceed with caution; you need to stop only if necessary","zh":"谨慎通行；只有必要时才需要停车"},{"en":"Speed up to get through the intersection quickly","zh":"加速尽快通过路口"}],"answer_index":2,"explanation_zh":"让行标志要求让路口内或接近路口的车辆先行，「必要时」才停车。路口及附近没有车辆时，可谨慎通行，不必像停车标志那样一定要完全停车。","explanation_en":"At a yield sign you stop only if necessary and go when the way is clear.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SA-08","group":"SA","section":"signs","topic_zh":"让行标志","question_en":"Which sign is a triangle with a white background and a red border?","question_zh":"哪种标志是三角形、白底红边？","options":[{"en":"Stop sign","zh":"停车标志"},{"en":"Yield sign","zh":"让行标志"},{"en":"School zone sign","zh":"学校区域标志"},{"en":"Railway crossing sign","zh":"铁路道口标志"}],"answer_index":1,"explanation_zh":"三角形、白底红边的是让行标志；停车标志是八边形，学校区域标志是五边形，铁路道口标志是 X 形。","explanation_en":"The yield sign is a white triangle with a red border.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"SA-09","group":"SA","section":"signs","topic_zh":"铁路道口标志","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"Four-way intersection ahead; cross traffic has the right-of-way","zh":"前方十字路口，横向来车享有先行权"},{"en":"Railway tracks cross the road; slow down, look both ways, be ready to stop","zh":"铁路与道路交叉，应减速、向两侧察看并准备停车"},{"en":"Road closed ahead; do not drive past this sign","zh":"前方道路封闭，不得驶过此标志"},{"en":"Railway tracks run alongside the road here, so there is no need to slow down or stop","zh":"铁轨在此与道路平行延伸，因此无需减速或停车"}],"answer_index":1,"explanation_zh":"X 形、白底红色轮廓的是铁路道口标志，表示铁路与道路交叉。应减速，向两侧察看火车，并准备停车。","explanation_en":"The railway crossing sign warns that tracks cross the road: slow down, look both ways and be prepared to stop.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-4.jpg","sign_desc_en":"X-shaped sign with a white background and a red outline.","sign_desc_zh":"X 形标志，白底红色轮廓。","difficulty":"easy"},{"id":"SA-10","group":"SA","section":"signs","topic_zh":"铁路道口标志","question_en":"What does a railway crossing sign look like?","question_zh":"铁路道口标志是什么样的？","options":[{"en":"Eight-sided, red background with white letters","zh":"八边形，红底白字"},{"en":"Triangle, white background with a red border","zh":"三角形，白底红边"},{"en":"X-shaped, white background with a red outline","zh":"X 形，白底红色轮廓"},{"en":"Five-sided, fluorescent yellow/green background","zh":"五边形，荧光黄绿色底"}],"answer_index":2,"explanation_zh":"铁路道口标志为 X 形，白底红色轮廓。","explanation_en":"The railway crossing sign is X-shaped, white with a red outline.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SA-11","group":"SA","section":"signs","topic_zh":"标志分类","question_en":"Apart from the stop, school zone, yield and railway crossing signs, the handbook names four other kinds of signs. Which list is correct?","question_zh":"除停车、学校区域、让行和铁路道口标志外，驾驶手册还列出另外四类标志。下列哪项正确？","options":[{"en":"Regulatory, advisory, emergency, and parking and stopping","zh":"管制、建议、紧急、泊车与停车"},{"en":"Mandatory, cautionary, construction and road work, and tourism and services","zh":"强制、提醒、施工与道路作业、旅游与服务"},{"en":"Prohibitory, warning, school and railway, and route and distance","zh":"禁止、警告、学校与铁路、路线与距离"},{"en":"Regulatory, warning, temporary conditions, and information and direction","zh":"管制、警告、临时状况、信息与指路"}],"answer_index":3,"explanation_zh":"驾驶手册列出的另外四类标志是：管制标志（regulatory）、警告标志（warning）、临时状况标志（temporary conditions）、信息与指路标志（information and direction）。","explanation_en":"The four other kinds are regulatory, warning, temporary conditions, and information and direction signs.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SA-12","group":"SA","section":"signs","topic_zh":"标志分类","question_en":"According to the handbook, which kind of sign gives a direction that must be obeyed?","question_zh":"根据驾驶手册，哪一类标志给出必须遵守的指令？","options":[{"en":"Warning signs","zh":"警告标志"},{"en":"Regulatory signs","zh":"管制标志"},{"en":"Information and direction signs","zh":"信息与指路标志"},{"en":"Temporary conditions signs","zh":"临时状况标志"}],"answer_index":1,"explanation_zh":"驾驶手册说明，管制标志（regulatory signs）给出的是必须遵守的指令。","explanation_en":"Regulatory signs give a direction that must be obeyed.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"SA-13","group":"SA","section":"signs","topic_zh":"管制标志","question_en":"What shape and colours do regulatory signs usually have?","question_zh":"管制标志通常是什么形状和颜色？","options":[{"en":"Diamond-shaped with a yellow background and black symbols","zh":"菱形，黄底黑色图案"},{"en":"Triangular with a white background and a red border","zh":"三角形，白底红边"},{"en":"Rectangular or square with a white or black background","zh":"长方形或正方形，白底或黑底"},{"en":"Round with a fluorescent yellow/green background","zh":"圆形，荧光黄绿色底"}],"answer_index":2,"explanation_zh":"管制标志通常为长方形或正方形，白底或黑底，文字为黑色、白色或彩色。","explanation_en":"Regulatory signs are usually rectangular or square with a white or black background.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SA-14","group":"SA","section":"signs","topic_zh":"管制标志","question_en":"On a sign, what does a green circle around a symbol mean?","question_zh":"标志上图案外的绿色圆圈表示什么？","options":[{"en":"The activity shown is not allowed","zh":"所示行为不被允许"},{"en":"The activity shown is coming up ahead, so watch for it","zh":"前方将出现图中所示的情况，需留意"},{"en":"The activity is allowed only for emergency vehicles","zh":"只有应急车辆可进行所示行为"},{"en":"You may or must do the activity shown","zh":"你可以或必须进行所示行为"}],"answer_index":3,"explanation_zh":"绿色圆圈表示你可以或必须进行圈内所示的行为；带斜线的红圈才表示禁止。","explanation_en":"A green circle means you may or must do the activity shown.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"SA-15","group":"SA","section":"signs","topic_zh":"管制标志","question_en":"On a sign, what does a red circle with a line through it mean?","question_zh":"标志上带斜线的红色圆圈表示什么？","options":[{"en":"The activity shown is not allowed","zh":"所示行为不被允许"},{"en":"The activity shown is allowed with caution","zh":"所示行为可以进行，但需谨慎"},{"en":"The restriction on that activity ends here","zh":"对该行为的限制到此结束"},{"en":"The activity is permitted only at night","zh":"所示行为仅在夜间允许"}],"answer_index":0,"explanation_zh":"带斜线的红色圆圈表示圈内所示的行为不被允许。","explanation_en":"A red circle with a line through it means the activity is not allowed.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"SA-16","group":"SA","section":"signs","topic_zh":"交通法规构成","question_en":"The handbook says traffic laws tell drivers and other road users what they must do. What do these laws include?","question_zh":"驾驶手册指出，交通法规告诉驾驶者和其他道路使用者必须怎么做。这些法规包括哪些内容？","options":[{"en":"Only signs that police officers put up at collision scenes","zh":"只有警察在事故现场设置的标志"},{"en":"Traffic signs and lights, but not pedestrian signals or pavement markings","zh":"交通标志和信号灯，但不包括行人信号和路面标线"},{"en":"Traffic signs, traffic lights, pedestrian signals and pavement markings","zh":"交通标志、交通信号灯、行人信号和路面标线"},{"en":"Traffic lights only, since signs are just advice","zh":"只有交通信号灯，标志仅属建议"}],"answer_index":2,"explanation_zh":"交通法规包括交通标志、交通信号灯、行人信号和路面标线，它们告诉驾驶者和其他道路使用者在特定情况下必须怎么做。","explanation_en":"Traffic laws include signs, lights, pedestrian signals and pavement markings.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/traffic-signs-and-lights","source_title":"MTO 手册 · Traffic Signs and Lights","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"SA-17","group":"SA","section":"signs","topic_zh":"管制标志","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"No bicycles are allowed on this road","zh":"此路禁止自行车通行"},{"en":"Bicycles only; motor vehicles may not use this road","zh":"仅限自行车，机动车不得使用此路"},{"en":"Bicycle parking is available ahead, on the right side of the road","zh":"前方道路右侧有自行车停放处"},{"en":"Official bicycle route; watch for cyclists and share the road","zh":"正式自行车路线，注意骑车人并与其共用道路"}],"answer_index":3,"explanation_zh":"这个标志表示该道路是正式自行车路线，驾驶者应注意骑车人，并准备与其共用道路。","explanation_en":"This sign marks an official bicycle route; watch for and share the road with cyclists.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-5.jpg","sign_desc_en":"Regulatory sign; such signs are usually rectangular or square with a white or black background (see official image).","sign_desc_zh":"管制标志，通常为长方形或正方形，白底或黑底（以官方图片为准）。","difficulty":"easy"},{"id":"SA-18","group":"SA","section":"signs","topic_zh":"停车限制标志","question_en":"This sign is used in pairs or groups. What does it mean?","question_zh":"这种标志成对或成组使用。它是什么意思？","options":[{"en":"You may park between the signs during the times posted","zh":"在标志之间的区域，可在所示时段内泊车"},{"en":"You may not park between the signs during the times posted","zh":"在标志之间的区域，所示时段内禁止泊车"},{"en":"You may stop only to unload merchandise during the times posted","zh":"所示时段内只能停车卸货"},{"en":"You may park beyond the signs, but not between them","zh":"可在标志以外泊车，但不能在标志之间"}],"answer_index":0,"explanation_zh":"这种标志成对或成组使用，表示在标志之间的区域，可以在所示时段内泊车。","explanation_en":"This sign allows parking between the signs during the posted times.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-6.jpg","sign_desc_en":"Regulatory sign; such signs are usually rectangular or square with a white or black background (see official image).","sign_desc_zh":"管制标志，通常为长方形或正方形，白底或黑底（以官方图片为准）。","difficulty":"medium"},{"id":"SA-19","group":"SA","section":"signs","topic_zh":"管制标志","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"Snowmobiles are prohibited on this road","zh":"此路禁止雪地摩托通行"},{"en":"Snowmobiles may use this road","zh":"雪地摩托可以使用此路"},{"en":"The road is closed to all vehicles in winter","zh":"此路冬季对所有车辆封闭"},{"en":"Only snowmobiles may use this road; cars are banned","zh":"此路仅限雪地摩托，禁止汽车"}],"answer_index":1,"explanation_zh":"该标志表示雪地摩托可以使用此路。","explanation_en":"This sign means snowmobiles may use this road.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-7.jpg","sign_desc_en":"Regulatory sign; such signs are usually rectangular or square with a white or black background (see official image).","sign_desc_zh":"管制标志，通常为长方形或正方形，白底或黑底（以官方图片为准）。","difficulty":"easy"},{"id":"SA-20","group":"SA","section":"signs","topic_zh":"禁令标志","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"Do not stop on this road","zh":"此路禁止停车"},{"en":"One-way road; you may enter with caution","zh":"单行道，可谨慎驶入"},{"en":"Do not enter this road","zh":"禁止驶入此路"},{"en":"This road is closed to trucks only","zh":"此路仅禁止货车驶入"}],"answer_index":2,"explanation_zh":"该标志表示禁止驶入此路。","explanation_en":"This sign means do not enter this road.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-8.jpg","sign_desc_en":"Regulatory sign; such signs are usually rectangular or square with a white or black background (see official image).","sign_desc_zh":"管制标志，通常为长方形或正方形，白底或黑底（以官方图片为准）。","difficulty":"easy"},{"id":"SA-21","group":"SA","section":"signs","topic_zh":"停车限制标志","question_en":"This sign is used in pairs or groups. What does it mean for the area between the signs?","question_zh":"这种标志成对或成组使用。它对标志之间的区域有什么规定？","options":[{"en":"You may stop only while loading or unloading passengers","zh":"只有上下乘客时才可停车"},{"en":"You may stop only to load or unload passengers or merchandise","zh":"只有上下乘客或装卸货物时才可停车"},{"en":"You may park only during the times posted","zh":"只可在所示时段内泊车"},{"en":"You may not stop your vehicle there, even for a moment","zh":"不得在此停车，即使片刻也不行"}],"answer_index":3,"explanation_zh":"这是禁止停车（No Stopping）标志：在标志之间的区域不得停车，即使片刻也不行。只能上下乘客的是禁止停留（No Standing），可上下乘客或装卸货物的是禁止泊车（No Parking）。","explanation_en":"No Stopping means you may not stop in the area, even for a moment.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-9.jpg","sign_desc_en":"Regulatory sign; such signs are usually rectangular or square with a white or black background (see official image).","sign_desc_zh":"管制标志，通常为长方形或正方形，白底或黑底（以官方图片为准）。","difficulty":"medium"},{"id":"SA-22","group":"SA","section":"signs","topic_zh":"停车限制标志","question_en":"This sign is used in pairs or groups. What does it mean for the area between the signs?","question_zh":"这种标志成对或成组使用。它对标志之间的区域有什么规定？","options":[{"en":"You may not stop your vehicle there, even for a moment","zh":"不得在此停车，即使片刻也不行"},{"en":"You may stop only while loading or unloading passengers","zh":"只有上下乘客时才可停车"},{"en":"You may stop only to load or unload passengers or merchandise","zh":"只有上下乘客或装卸货物时才可停车"},{"en":"You may park there as long as you stay in the vehicle","zh":"只要人留在车内就可以泊车"}],"answer_index":1,"explanation_zh":"这是禁止停留（No Standing）标志：在标志之间的区域不能停车，只有上下乘客时除外；装卸货物不属于例外。","explanation_en":"No Standing means you may stop only while loading or unloading passengers.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-10.jpg","sign_desc_en":"Regulatory sign; such signs are usually rectangular or square with a white or black background (see official image).","sign_desc_zh":"管制标志，通常为长方形或正方形，白底或黑底（以官方图片为准）。","difficulty":"hard"},{"id":"SA-23","group":"SA","section":"signs","topic_zh":"停车限制标志","question_en":"This sign is used in pairs or groups. What does it mean for the area between the signs?","question_zh":"这种标志成对或成组使用。它对标志之间的区域有什么规定？","options":[{"en":"You may stop only to load or unload passengers or merchandise","zh":"只有上下乘客或装卸货物时才可停车"},{"en":"You may not stop your vehicle there, even for a moment","zh":"不得在此停车，即使片刻也不行"},{"en":"You may stop for passengers only, never for merchandise","zh":"只能为上下乘客停车，不能为装卸货物停车"},{"en":"You may park briefly as long as your hazard lights are flashing","zh":"只要双闪灯开着，就可以短时间泊车"}],"answer_index":0,"explanation_zh":"这是禁止泊车（No Parking）标志：在标志之间的区域不能停车，但上下乘客或装卸货物时除外。","explanation_en":"No Parking means you may stop only to load or unload passengers or merchandise.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-11.jpg","sign_desc_en":"Regulatory sign; such signs are usually rectangular or square with a white or black background (see official image).","sign_desc_zh":"管制标志，通常为长方形或正方形，白底或黑底（以官方图片为准）。","difficulty":"medium"},{"id":"SA-24","group":"SA","section":"signs","topic_zh":"停车限制标志","question_en":"Where do the restrictions on No Stopping, No Standing and No Parking signs apply?","question_zh":"禁止停车（No Stopping）、禁止停留（No Standing）、禁止泊车（No Parking）标志的限制适用于哪里？","options":[{"en":"Only within a few metres of each sign","zh":"只在每块标志周围几米之内"},{"en":"In the area between the signs","zh":"在标志之间的区域"},{"en":"Along the whole street, in both directions","zh":"整条街道，两个方向都适用"},{"en":"For one city block past each sign","zh":"每块标志之后的一个街区之内"}],"answer_index":1,"explanation_zh":"禁止停车、禁止停留、禁止泊车标志都成对或成组使用，限制适用于标志之间的区域。","explanation_en":"These signs are used in pairs or groups and apply to the area between the signs.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SA-25","group":"SA","section":"signs","topic_zh":"停车限制标志","question_en":"You need to stop briefly at the curb to unload a delivery of merchandise. In which signed area does the handbook allow this?","question_zh":"你需要在路边短暂停车卸下一批货物。根据驾驶手册，在哪种标志之间的区域可以这样做？","options":[{"en":"Between No Standing signs","zh":"禁止停留（No Standing）标志之间"},{"en":"Between No Stopping signs, if you keep the engine running","zh":"禁止停车（No Stopping）标志之间，只要不熄火"},{"en":"Between No Parking signs","zh":"禁止泊车（No Parking）标志之间"},{"en":"Between No Standing signs, if your hazard lights are on","zh":"禁止停留（No Standing）标志之间，只要打开双闪灯"}],"answer_index":2,"explanation_zh":"只有禁止泊车（No Parking）标志允许为上下乘客或装卸货物而停车。禁止停留只允许上下乘客，禁止停车连片刻也不行，不熄火或打开双闪灯都不能例外。","explanation_en":"Only No Parking allows stopping to load or unload merchandise.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"SA-26","group":"SA","section":"signs","topic_zh":"转弯限制","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"Do not turn left at the intersection","zh":"在路口禁止左转"},{"en":"The left lane ends ahead","zh":"前方左侧车道结束"},{"en":"Do not turn to go in the opposite direction","zh":"禁止掉头"},{"en":"Left turn only from this lane","zh":"此车道只能左转"}],"answer_index":0,"explanation_zh":"该标志表示在路口禁止左转。","explanation_en":"This sign means no left turn at the intersection.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-12.jpg","sign_desc_en":"Regulatory sign; such signs are usually rectangular or square with a white or black background (see official image).","sign_desc_zh":"管制标志，通常为长方形或正方形，白底或黑底（以官方图片为准）。","difficulty":"easy"},{"id":"SA-27"," /www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-24.jpg","sign_desc_en":"Regulatory sign; such signs are usually rectangular or square with a white or black background (see official image).","sign_desc_zh":"管制标志，通常为长方形或正方形，白底或黑底（以官方图片为准）。","difficulty":"medium"},{"id":"SA-40","group":"SA","section":"signs","topic_zh":"学校区域限速","question_en":"This sign is posted in a school zone. When must you observe the speed limit it shows?","question_zh":"这个标志设在学校区域。什么时候必须遵守标志上显示的限速？","options":[{"en":"Only when children can be seen near the road","zh":"只有能看到路边有儿童时"},{"en":"When the yellow lights are flashing","zh":"黄灯闪烁时"},{"en":"At all times, day and night, all year","zh":"全年全天任何时候"},{"en":"Only when a crossing guard is on duty","zh":"只有学校交通协管员在岗时"}],"answer_index":1,"explanation_zh":"学校区域限速标志：上学时段限速较低，黄灯闪烁时必须遵守标志上的限速。","explanation_en":"Obey the posted school-zone limit when the yellow lights are flashing.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-25.jpg","sign_desc_en":"Regulatory sign; such signs are usually rectangular or square with a white or black background (see official image).","sign_desc_zh":"管制标志，通常为长方形或正方形，白底或黑底（以官方图片为准）。","difficulty":"medium"},{"id":"SA-41","group":"SA","section":"signs","topic_zh":"校车","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"Stop for a school bus when its overhead red lights are flashing or its stop arm is activated","zh":"校车车顶红灯闪烁或停车臂伸出时，必须按规定停车"},{"en":"School bus route; buses are slow, so pass with care","zh":"校车路线，校车行驶缓慢，可小心超越"},{"en":"Slow down near school buses; pass if no children are visible","zh":"靠近校车时减速，看不到儿童即可超越"},{"en":"This lane is reserved for school buses during school hours","zh":"上学时段该车道仅供校车使用"}],"answer_index":0,"explanation_zh":"该标志提醒你为校车停车：校车车顶红灯闪烁或停车臂伸出时，必须按规定停车。黄灯闪烁表示校车即将停车，应减速并准备停车，不能把两种颜色混为一谈。","explanation_en":"Stop for a school bus with flashing overhead red lights or an activated stop arm. Flashing amber lights mean slow down and prepare to stop; they do not have the same meaning as red lights.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-25b.jpg","sign_desc_en":"Regulatory sign; such signs are usually rectangular or square with a white or black background (see official image).","sign_desc_zh":"管制标志，通常为长方形或正方形，白底或黑底（以官方图片为准）。","difficulty":"easy"},{"id":"SA-42","group":"SA","section":"signs","topic_zh":"校车","question_en":"This sign is installed on multi-lane highways that have no centre median divider. What does it tell drivers?","question_zh":"这个标志设在没有中央分隔带的多车道公路上。它告诉驾驶者什么？","options":[{"en":"Only drivers behind the bus must stop; oncoming traffic may continue at a slow speed","zh":"只有校车后方的车辆须停车，对向车辆可减速继续行驶"},{"en":"Drivers from both directions must stop for a school bus with flashing overhead red lights or an activated stop arm","zh":"校车车顶红灯闪烁或停车臂伸出时，两个方向的车辆都必须停车"},{"en":"Only drivers in the right lane must stop for a school bus","zh":"只有右侧车道的车辆须为校车停车"},{"en":"School buses are not allowed to stop on this highway","zh":"校车不得在此公路上停车"}],"answer_index":1,"explanation_zh":"该标志设在没有中央分隔带的多车道公路上：校车车顶红灯闪烁或停车臂伸出时，两个方向的车辆都必须停车；黄灯闪烁则表示减速并准备停车。","explanation_en":"On a road with no centre median divider, drivers approaching from both directions must stop for a school bus with flashing overhead red lights or an activated stop arm. Flashing amber lights mean slow down and prepare to stop.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-26.jpg","sign_desc_en":"Regulatory sign; such signs are usually rectangular or square with a white or black background (see official image).","sign_desc_zh":"管制标志，通常为长方形或正方形，白底或黑底（以官方图片为准）。","diffi tion_zh":"这个标志是什么意思？","options":[{"en":"Traffic may travel in one direction only","zh":"车辆只能单向行驶"},{"en":"Turn right only at the next intersection","zh":"下个路口只能右转"},{"en":"Two-way traffic ahead","zh":"前方双向通行"},{"en":"Detour; follow the arrow around a closed road","zh":"绕行，按箭头绕过封闭道路"}],"answer_index":0,"explanation_zh":"该标志表示车辆只能沿一个方向行驶（单行道）。","explanation_en":"This sign means traffic may travel in one direction only.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-28.jpg","sign_desc_en":"Regulatory sign; such signs are usually rectangular or square with a white or black background (see official image).","sign_desc_zh":"管制标志，通常为长方形或正方形，白底或黑底（以官方图片为准）。","difficulty":"easy"},{"id":"SA-46","group":"SA","section":"signs","topic_zh":"行人过街设施","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"School crossing; stop only when a crossing guard is present","zh":"学校过街处，仅在有协管员时停车"},{"en":"Pedestrians must wait for vehicles to pass before crossing","zh":"行人须等车辆通过后再过街"},{"en":"Pedestrian crossover; be prepared to stop and yield to pedestrians","zh":"行人过街设施，应准备停车并让行人先行"},{"en":"Walkway beside the road; drivers never need to stop or slow down for it","zh":"路旁步道，驾驶者无需为此停车或减速"}],"answer_index":2,"explanation_zh":"这是行人过街设施（pedestrian crossover）标志，驾驶者应准备停车，并把先行权让给行人。","explanation_en":"At a pedestrian crossover, be prepared to stop and yield to pedestrians.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-29.jpg","sign_desc_en":"Regulatory sign; such signs are usually rectangular or square with a white or black background (see official image).","sign_desc_zh":"管制标志，通常为长方形或正方形，白底或黑底（以官方图片为准）。","difficulty":"easy"},{"id":"SA-47","group":"SA","section":"signs","topic_zh":"双向左转车道","question_en":"This sign may appear above the road or on the ground. What does it mean?","question_zh":"这个标志可能设在道路上方或地面上。它是什么意思？","options":[{"en":"The lane is for passing slower traffic in either direction","zh":"该车道供两个方向超越慢车使用"},{"en":"Vehicles in this lane must make a U-turn","zh":"该车道车辆必须掉头"},{"en":"Left turns are prohibited from this lane at all times","zh":"该车道任何时候都禁止左转"},{"en":"The lane is only for two-way left turns","zh":"该车道仅供双向左转使用"}],"answer_index":3,"explanation_zh":"该标志设在道路上方或地面上，表示该车道只供两个方向的左转车辆使用（双向左转车道）。","explanation_en":"The lane is only for two-way left turns.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-30.jpg","sign_desc_en":"Regulatory sign; such signs are usually rectangular or square with a white or black background (see official image).","sign_desc_zh":"管制标志，通常为长方形或正方形，白底或黑底（以官方图片为准）。","difficulty":"medium"},{"id":"SA-48","group":"SA","section":"signs","topic_zh":"无障碍停车","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"Curb area where vehicles displaying a valid permit pick up or drop off passengers with disabilities","zh":"供展示有效许可证的车辆接送残障乘客的路边区域"},{"en":"Taxi stand; only licensed taxis may stop at this curb to pick up or drop off passengers","zh":"出租车候客站，只有持牌出租车可在此路边停车上下客"},{"en":"Loading zone where any vehicle may stop briefly at the curb to load or unload merchandise","zh":"装卸区，任何车辆都可在此路边短暂停车装卸货物"},{"en":"Bus stop; other vehicles must keep this curb clear so buses can pick up passengers","zh":"公交车站，其他车辆须让出此段路边供公交车上下客"}],"answer_index":0,"explanation_zh":"该标志把路边区域保留给展示有效无障碍停车许可证（Accessible Person Parking Permit）、接送残障乘客的车辆。","explanation_en":"The curb is reserved for permit-displaying vehicles picking up or dropping off passengers with disabilities.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-31.jpg","sign_desc_en":"Regulatory sign; such signs are usually rectangular or square with a white or black background (see official image).","sign_desc_zh":"管制标志，通常为长方形或正方形，白底或黑底（以官方图片为准）。","difficulty":"medium"},{"id":"SA-49","group":"SA","section":"signs","topic_zh":"专用车道","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"The lane is closed ahead, so merge into the next lane when it is safe to do so","zh":"前方车道关闭，安全时并入相邻车道"},{"en":"The lane is for slow vehicles climbing a hill; faster traffic should pass on the left","zh":"该车道供爬坡的慢速车辆使用，快车应从左侧超越"},{"en":"The lane is only for two-way left turns, from either direction of travel","zh":"该车道仅供双向左转使用，两个方向的车辆都可使用"},{"en":"Only certain types of vehicles may use this lane, at all times or at set hours","zh":"该车道全天或在特定时段只供特定类型车辆使用"}],"answer_index":3,"explanation_zh":"专用车道标志表示该车道全天或在特定时段只供特定类型车辆使用，例如公交车、出租车、载有三人或以上的车辆和自行车。","explanation_en":"Reserved-lane signs limit a lane to specific vehicle types, all the time or at certain hours.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-32.jpg","sign_desc_en":"Regulatory sign; such signs are usually rectangular or square with a white or black background (see official image).","sign_desc_zh":"管制标志，通常为长方形或正方形，白底或黑底（以官方图片为准）。","difficulty":"medium"},{"id":"SA-50","group":"SA","section":"signs","topic_zh":"专用车道","question_en":"Reserved-lane signs use different symbols for different types of vehicles. Which of these is one of the types the handbook lists?","question_zh":"专用车道标志用不同图案表示不同车型。下列哪一种是驾驶手册列出的类型之一？","options":[{"en":"Transport trucks","zh":"大型货运卡车"},{"en":"Taxis","zh":"出租车"},{"en":"Snowmobiles","zh":"雪地摩托"},{"en":"Vehicles towing trailers","zh":"牵引挂车的车辆"}],"answer_index":1,"explanation_zh":"驾驶手册列出的专用车道车型包括公交车、出租车、载有三人或以上的车辆和自行车。","explanation_en":"Reserved-lane symbols include buses, taxis, vehicles with three or more people and bicycles.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SA-51","group":"SA","section":"signs","topic_zh":"车道使用","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"Keep in the right lane except when passing where climbing or passing lanes are provided","zh":"靠右车道行驶，只有在设有爬坡车道或超车道的路段超车时除外"},{"en":"The right lane is closed ahead, so move into the left lane before the hill","zh":"前方右侧车道关闭，须在上坡前驶入左侧车道"},{"en":"Passing is not allowed anywhere on this two-lane road, even on hills","zh":"这段双车道道路全程禁止超车，上坡路段也不例外"},{"en":"Trucks and slow vehicles must use the left lane when climbing hills","zh":"货车和慢速车辆上坡时须使用左侧车道"}],"answer_index":0,"explanation_zh":"该标志要求靠右车道行驶，只有在设有爬坡车道或超车道的双车道路段超车时除外。","explanation_en":"Keep right except when passing on two-lane sections with climbing or passing lanes.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-33.jpg","sign_desc_en":"Regulatory sign; such signs are usually rectangular or square with a white or black background (see official image).","sign_desc_zh":"管制标志，通常为长方形或正方形，白底或黑底（以官方图片为准）。","difficulty":"medium"},{"id":"SA-52","group":"SA","section":"signs","topic_zh":"公交车让行","question_en":"This sign is displayed on the back of transit buses. What does it remind drivers to do?","question_zh":"这个标志贴在公交车尾部。它提醒驾驶者做什么？","options":[{"en":"Stop whenever the bus's red lights flash, just as you would for a school bus","zh":"公交车红灯闪烁时，要像对待校车一样停车"},{"en":"Never pass a transit bus on a multi-lane road, even after it has stopped","zh":"多车道道路上不得超越公交车，即使它已经停下"},{"en":"Yield to a bus at a dedicated bus stop once it signals to return to the lane","zh":"公交车停在专用公交站并打灯示意驶回车道时，应给其让行"},{"en":"Stay out of the bus-only lane at all times while buses are in service","zh":"公交车运营期间，任何时候都不得驶入公交专用道"}],"answer_index":2,"explanation_zh":"公交车尾部的这个标志提醒驾驶者：法律要求，公交车停靠专用公交站后打灯示意驶回车道时，驶近的车辆必须让行。","explanation_en":"It reminds drivers to yield to a bus signalling to leave a dedicated bus stop.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-33a.jpg","sign_desc_en":"Sign displayed on the back of a transit bus (see official image).","sign_desc_zh":"贴在公交车尾部的标志（以官方图片为准）。","difficulty":"medium"},{"id":"SA-53","group":"SA","section":"signs","topic_zh":"管制标志","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"Do not turn right at the intersection","zh":"路口禁止右转"},{"en":"Detour to the right; the road ahead is closed","zh":"向右绕行，前方道路封闭"},{"en":"The road forks to the right","zh":"道路向右分岔"},{"en":"Vehicles in the right lane must turn right","zh":"右侧车道车辆必须右转"}],"answer_index":2,"explanation_zh":"该标志表示道路向右分岔。","explanation_en":"This sign means the road forks to the right.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-33b.jpg","sign_desc_en":"Regulatory sign; such signs are usually rectangular or square with a white or black background (see official image).","sign_desc_zh":"管制标志，通常为长方形或正方形，白底或黑底（以官方图片为准）。","difficulty":"medium"},{"id":"SA-54","group":"SA","section":"signs","topic_zh":"校车","question_en":"What does this sign mark?","question_zh":"这个标志标示的是什么？","options":[{"en":"A zone where school buses load and unload without using the red alternating lights or stop arm","zh":"校车上下客时不使用红色交替闪光灯和停车臂的区域"},{"en":"A lane reserved for school buses only during the morning and afternoon school hours","zh":"只在早晚上学时段供校车使用的专用车道"},{"en":"A zone where every vehicle must stop whenever a school bus is present, lights or not","zh":"只要有校车在场，无论是否亮灯，所有车辆都须停车的区域"},{"en":"A school bus parking yard where buses are stored overnight and the public may not enter","zh":"夜间存放校车、公众不得进入的停车场"}],"answer_index":0,"explanation_zh":"该标志标示校车上下学生的区域，校车在此区域内上下客时不使用红色交替闪光灯和停车臂。","explanation_en":"It marks a zone where school buses load or unload without red alternating lights and stop arm.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-33c.jpg","sign_desc_en":"Regulatory sign; such signs are usually rectangular or square with a white or black background (see official image).","sign_desc_zh":"管制标志，通常为长方形或正方形，白底或黑底（以官方图片为准）。","difficulty":"hard"},{"id":"SA-55","group":"SA","section":"signs","topic_zh":"高乘载车道HOV","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"This lane is reserved for heavy trucks, which must stay in it until the next highway exit","zh":"该车道专供重型卡车使用，卡车须一直行驶到下一个出口"},{"en":"This lane is for emergency vehicles only, so all other vehicles must keep out of it at all times","zh":"该车道仅供应急车辆使用，其他车辆任何时候都不得驶入"},{"en":"Any vehicle may use this lane to pass slower traffic, then must move back to the right","zh":"任何车辆都可用该车道超越慢车，之后须驶回右侧车道"},{"en":"HOV lane: eligible vehicles with at least two people, including the driver, and vehicles exempt from the occupancy requirement may use it","zh":"高乘载车道：符合资格且车内至少两人（包括司机）的车辆，以及不受人数限制的豁免车辆可使用"}],"answer_index":3,"explanation_zh":"这是高乘载车道（HOV）标志，图中要求车内至少两人，司机也计入人数。省级公路 HOV 车道还允许各类巴士、持牌出租车及机场豪华轿车、应急车辆、安省绿色牌照车辆和摩托车使用，不受乘员人数限制；有效 HOT 通行证仅在允许的路段适用。","explanation_en":"The sign marks an HOV lane. Ordinary eligible cars need at least two people, including the driver. Buses, licensed taxis and airport limousines, emergency vehicles, Ontario green-plate vehicles and motorcycles may use provincial HOV lanes regardless of the number of occupants. Valid HOT permits apply only where permitted.","source_url":"https://www.ontario.ca/page/high-occupancy-vehicle-hov-lanes","source_title":"ontario.ca · High-occupancy vehicle (HOV) lanes","image_url":"https://files.ontario.ca/3-1-34.jpg","sign_desc_en":"Lane-use sign (see official image).","sign_desc_zh":"车道使用标志（以官方图片为准）。","difficulty":"easy"},{"id":"SA-56","group":"SA","section":"signs","topic_zh":"高乘载车道HOV","question_en":"What does this sign mean?","question_zh":"这个标志是什么意思？","options":[{"en":"You may enter the HOV lane in this area, but you may not leave it here","zh":"可在此区域驶入 HOV 车道，但不能在此驶出"},{"en":"The HOV lane ends here, so vehicles of any kind may now use it freely","zh":"HOV 车道到此结束，任何车辆都可自由使用"},{"en":"Vehicles may not change lanes into or out of the HOV lane in this area","zh":"在此区域内，车辆不得变道驶入或驶出 HOV 车道"},{"en":"All vehicles must merge into the HOV lane now, whatever their passenger count","zh":"无论载客多少，所有车辆都须立即并入 HOV 车道"}],"answer_index":2,"explanation_zh":"在该标志所示区域内，车辆不得变道驶入或驶出高乘载车道（HOV）。","explanation_en":"In this area, vehicles cannot change lanes into or out of the HOV lane.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-35.jpg","sign_desc_en":"High-occupancy vehicle (HOV) lane sign (see official image).","sign_desc_zh":"高乘载车道（HOV）标志（以官方图片为准）。","difficulty":"medium"},{"id":"SA-57","group":"SA","section":"signs","topic_zh":"专用车道标志","question_en":"Reserved-lane signs keep a lane for specific types of vehicles, either all the time or during certain hours. According to the handbook, one of these types is vehicles carrying how many people?","question_zh":"专用车道标志规定某条车道全天或在特定时段只供特定类型的车辆使用。根据手册，其中一类是载有多少人的车辆？","options":[{"en":"Two or more people","zh":"两人或以上"},{"en":"Four or more people","zh":"四人或以上"},{"en":"Five or more people","zh":"五人或以上"},{"en":"Three or more people","zh":"三人或以上"}],"answer_index":3,"explanation_zh":"手册说明，专用车道可供公交车、出租车、载有三人或以上的车辆和自行车使用。不要与省级公路的HOV车道混淆，普通乘用车至少载两人即可使用HOV车道。","explanation_en":"The handbook lists buses, taxis, vehicles with three or more people and bicycles for reserved lanes, unlike provincial highway HOV lanes, which need at least two people.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"SA-58","group":"SA","section":"signs","topic_zh":"车道方向标志","question_en":"Signs like these, above the road or on the pavement before an intersection, show the direction each lane must travel. The sign for your lane shows only a right-turn arrow. What may you do from this lane?","question_zh":"这类标志设在路口前的道路上方或路面上，标明每条车道必须行驶的方向。你所在车道的标志只有一个右转箭头。你在这条车道上可以怎么走？","options":[{"en":"Turn right or go straight ahead","zh":"右转或直行"},{"en":"Go straight only if the lane beside you is blocked","zh":"只有旁边车道被堵住时才可以直行"},{"en":"Turn right, or turn left once the way is clear","zh":"右转，或在安全时左转"},{"en":"Turn right only","zh":"只能右转"}],"answer_index":3,"explanation_zh":"车道方向标志规定各车道必须行驶的方向：只有右转箭头的车道必须右转，只有左转箭头的车道必须左转，不能从这些车道直行。","explanation_en":"A lane whose sign shows only a right-turn arrow must turn right, so you may not go straight from it.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-27.jpg","sign_desc_en":"Regulatory lane-direction signs for lanes approaching an intersection","sign_desc_zh":"路口前各车道的车道方向指示标志（规定标志）","difficulty":"easy"},{"id":"SB-01","group":"SB","section":"signs","topic_zh":"警告标志类别","question_en":"In Ontario, what do warning signs usually look like?","question_zh":"在安大略省，警告标志通常是什么样的？","options":[{"en":"Rectangular, with black letters on a white background","zh":"长方形，白底黑字"},{"en":"Eight-sided, with white letters on a red background","zh":"八边形，红底白字"},{"en":"Diamond-shaped, with black letters or symbols on yellow","zh":"菱形，黄底配黑色文字或符号"},{"en":"Triangular, with a red border and a white centre","zh":"三角形，红色边框、白色底"}],"answer_index":2,"explanation_zh":"手册说明，警告标志通常为菱形，黄色底色配黑色文字或符号，用来提醒前方有危险或不寻常的路况。","explanation_en":"Warning signs are usually diamond-shaped with a yellow background and black letters or symbols.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"SB-02","group":"SB","section":"signs","topic_zh":"警告标志类别","question_en":"What is the purpose of warning signs?","question_zh":"警告标志的作用是什么？","options":[{"en":"To tell you which laws you must obey, such as speed limits","zh":"告诉你必须遵守的法规，例如限速"},{"en":"To warn you of dangerous or unusual conditions ahead","zh":"提醒你前方有危险或不寻常的路况"},{"en":"To give directions and distances to nearby places","zh":"提供前往附近地点的方向和距离"},{"en":"To mark temporary road construction zones only","zh":"仅用于标示临时道路施工区"}],"answer_index":1,"explanation_zh":"警告标志用来提醒驾驶者前方有危险或不寻常的路况，例如弯道、转弯、低洼路段或支路；告知必须遵守的法规（如限速）是禁令标志的作用。","explanation_en":"Warning signs alert you to dangerous or unusual conditions ahead.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"SB-03","group":"SB","section":"signs","topic_zh":"警告标志类别","question_en":"Which of these is a condition that a warning sign would alert you to?","question_zh":"下列哪一项属于警告标志会提醒你注意的路况？","options":[{"en":"Where parking is not allowed on a street","zh":"某条街道上禁止停车的路段"},{"en":"The route to the nearest hospital","zh":"前往最近医院的路线"},{"en":"Which lane is reserved for buses","zh":"哪条车道是公交专用道"},{"en":"A dip, curve or sideroad ahead","zh":"前方有低洼路段、弯道或支路"}],"answer_index":3,"explanation_zh":"手册举例说明，警告标志提醒的是前方的弯道、转弯、低洼路段（dip）或支路等危险或不寻常的状况；禁止停车和公交专用道属于法规内容，医院路线属于指路信息。","explanation_en":"Warning signs cover conditions such as a curve, turn, dip or sideroad ahead.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"easy"},{"id":"SB-04","group":"SB","section":"signs","topic_zh":"桥梁警告","question_en":"What does this warning sign mean?","question_zh":"这个警告标志是什么意思？","options":[{"en":"Pavement narrows ahead","zh":"前方路面变窄"},{"en":"Narrow bridge ahead","zh":"前方有窄桥"},{"en":"Underpass ahead","zh":"前方有下穿通道"},{"en":"Right lane ends ahead","zh":"前方右侧车道终止"}],"answer_index":1,"explanation_zh":"该标志表示前方有窄桥。注意与“前方路面变窄”标志区分，后者指的是道路本身变窄。","explanation_en":"This sign warns of a narrow bridge ahead.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-36a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"medium"},{"id":"SB-05","group":"SB","section":"signs","topic_zh":"交叉口与岔路","question_en":"What does this warning sign mean?","question_zh":"这个警告标志是什么意思？","options":[{"en":"Right lane ends ahead","zh":"前方右侧车道终止"},{"en":"Winding road ahead","zh":"前方连续弯路"},{"en":"Divided highway ends ahead","zh":"前方分隔式公路结束"},{"en":"A road branches off ahead","zh":"前方有道路分岔"}],"answer_index":3,"explanation_zh":"该标志表示前方有一条道路从你所在的道路分出（岔路）。","explanation_en":"This sign warns that a road branches off ahead.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-37a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"medium"},{"id":"SB-06","group":"SB","section":"signs","topic_zh":"交叉口与岔路","question_en":"This sign warns of an intersection ahead. What does the arrow on it show?","question_zh":"这个标志提示前方有交叉路口。标志上的箭头表示什么？","options":[{"en":"Which direction of traffic has the right-of-way","zh":"哪个方向的车流拥有先行权"},{"en":"The only direction you are allowed to turn","zh":"你唯一允许转弯的方向"},{"en":"The direction of a one-way street ahead","zh":"前方单行道的行驶方向"},{"en":"Which of the two roads ends at the intersection","zh":"两条路中哪一条在路口终止"}],"answer_index":0,"explanation_zh":"手册说明，交叉路口警告标志上的箭头表示哪个方向的车流拥有先行权（right-of-way），它并不是转弯指示。","explanation_en":"The arrow shows which direction of traffic has the right-of-way.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-38a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"medium"},{"id":"SB-07","group":"SB","section":"signs","topic_zh":"环岛","question_en":"What does this sign tell you?","question_zh":"这个标志告诉你什么？","options":[{"en":"Roundabout ahead; slow down — traffic in it moves clockwise","zh":"前方环岛，减速——环岛内车辆顺时针行驶"},{"en":"Roundabout ahead; slow down — traffic in it moves counter-clockwise","zh":"前方环岛，减速——环岛内车辆逆时针行驶"},{"en":"U-turns allowed ahead; the arrows show the turning path","zh":"前方允许掉头，箭头表示掉头路线"},{"en":"Detour ahead; follow the arrows around the closed road","zh":"前方绕行，按箭头绕过封闭路段"}],"answer_index":1,"explanation_zh":"这是“前方环岛，减速”标志。标志上的逆时针箭头表示环岛内车辆的行驶方向，即环岛内车辆按逆时针方向行驶。","explanation_en":"It warns of a roundabout ahead; traffic inside travels counter-clockwise.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-39a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"medium"},{"id":"SB-08","group":"SB","section":"signs","topic_zh":"交叉口与岔路","question_en":"What does this warning sign mean?","question_zh":"这个警告标志是什么意思？","options":[{"en":"The sideroad ahead is a dead end with no through traffic","zh":"前方支路是断头路，无法穿行"},{"en":"Traffic on the sideroad ahead has the right-of-way","zh":"前方支路上的车辆拥有先行权"},{"en":"Drivers on the sideroad ahead cannot see traffic clearly","zh":"前方路口支路上的驾驶者看不清来往车辆"},{"en":"A one-way sideroad joins your road from the right ahead","zh":"前方右侧有一条单行支路汇入你的道路"}],"answer_index":2,"explanation_zh":"该标志表示前方路口支路上的驾驶者视线受阻，看不清来往车辆，经过该路口时要格外留意。","explanation_en":"Drivers on the sideroad at the intersection ahead do not have a clear view of traffic.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-40a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"hard"},{"id":"SB-09","group":"SB","section":"signs","topic_zh":"路面状况警告","question_en":"What does this warning sign mean?","question_zh":"这个警告标志是什么意思？","options":[{"en":"Pavement narrows ahead","zh":"前方路面变窄"},{"en":"Narrow bridge ahead","zh":"前方有窄桥"},{"en":"Paved surface ends ahead","zh":"前方铺装路面结束"},{"en":"Divided highway ends ahead","zh":"前方分隔式公路结束"}],"answer_index":0,"explanation_zh":"该标志表示前方路面变窄。注意不要与“窄桥”或“铺装路面结束”标志混淆。","explanation_en":"This sign means the pavement narrows ahead.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-41a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"medium"},{"id":"SB-10","group":"SB","section":"signs","topic_zh":"弯道警告","question_en":"What does this warning sign mean?","question_zh":"这个警告标志是什么意思？","options":[{"en":"Sharp turn ahead","zh":"前方急转弯"},{"en":"Winding road ahead","zh":"前方连续弯路"},{"en":"Slight bend or curve ahead","zh":"前方缓弯"},{"en":"A road branches off ahead","zh":"前方有道路分岔"}],"answer_index":2,"explanation_zh":"该标志表示前方道路有轻微弯曲（缓弯）。急弯和连续弯路各有不同的警告标志。","explanation_en":"It warns of a slight bend or curve ahead.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-42a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"easy"},{"id":"SB-11","group":"SB","section":"signs","topic_zh":"最高安全车速","question_en":"This sign is posted under a curve warning sign. What does it show?","question_zh":"这个标志安装在弯道警告标志下方。它表示什么？","options":[{"en":"The minimum speed allowed on the curve","zh":"弯道上允许的最低车速"},{"en":"The speed limit that applies to trucks only","zh":"仅适用于货车的限速"},{"en":"The posted speed limit for the rest of the road","zh":"此后整段道路的法定限速"},{"en":"The maximum safe speed for the curve","zh":"通过该弯道的最高安全车速"}],"answer_index":3,"explanation_zh":"安装在弯道警告标志下方、标有车速的标志表示安全通过该弯道的最高车速，而不是最低车速，也不是整段道路的限速。","explanation_en":"Posted under a curve warning, this sign shows the maximum safe speed for the curve.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-43a.jpg","sign_desc_en":"Warning sign showing a speed, posted under a curve warning sign (see official image).","sign_desc_zh":"安装在弯道警告标志下方、标有车速的警告标志（见官方图片）。","difficulty":"medium"},{"id":"SB-12","group":"SB","section":"signs","topic_zh":"弯道警告","question_en":"What does this warning sign mean?","question_zh":"这个警告标志是什么意思？","options":[{"en":"Slight bend ahead","zh":"前方缓弯"},{"en":"Sharp bend or turn ahead","zh":"前方急弯或急转弯"},{"en":"Truck entrance on the right ahead","zh":"前方右侧有货车出入口"},{"en":"Right lane ends ahead","zh":"前方右侧车道终止"}],"answer_index":1,"explanation_zh":"该标志表示前方道路有急弯或急转弯，与表示缓弯的标志不同。","explanation_en":"It warns of a sharp bend or turn ahead.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-44a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"easy"},{"id":"SB-13","group":"SB","section":"signs","topic_zh":"弯道警告","question_en":"Signs like this one are posted in groups along the road. What are they for?","question_zh":"这类标志会成组设置在路边。它们的作用是什么？","options":[{"en":"To mark a zone where passing is not allowed","zh":"标示禁止超车的路段"},{"en":"To show the direction of a one-way road","zh":"指示单行道的行驶方向"},{"en":"To show the side on which you may pass a hazard","zh":"指示可以从哪一侧绕过障碍物"},{"en":"To guide drivers around a sharp curve","zh":"引导驾驶者通过急弯"}],"answer_index":3,"explanation_zh":"箭头形（chevron）标志成组设置，用来引导驾驶者通过急弯。指示从哪一侧绕过路边障碍物的是危险标记（hazard marker）。","explanation_en":"Chevron signs are posted in groups to guide drivers around sharp curves.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-45a.jpg","sign_desc_en":"Yellow-and-black warning sign (see official image).","sign_desc_zh":"黄黑配色的警告标志（见官方图片）。","difficulty":"medium"},{"id":"SB-14","group":"SB","section":"signs","topic_zh":"弯道警告","question_en":"What does this warning sign mean?","question_zh":"这个警告标志是什么意思？","options":[{"en":"Winding road ahead","zh":"前方连续弯路"},{"en":"Steep hill ahead","zh":"前方陡坡"},{"en":"Pavement is slippery when wet","zh":"路面湿时易滑"},{"en":"Slight bend ahead","zh":"前方缓弯"}],"answer_index":0,"explanation_zh":"该标志表示前方道路蜿蜒，有一连串弯道（连续弯路）。","explanation_en":"It warns of a winding road ahead.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-46a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"easy"},{"id":"SB-15","group":"SB","section":"signs","topic_zh":"桥梁警告","question_en":"What does this warning sign mean?","question_zh":"这个警告标志是什么意思？","options":[{"en":"The bridge ahead lifts or swings to let boats pass","zh":"前方桥梁会升起或旋转，让船只通过"},{"en":"Narrow bridge ahead","zh":"前方有窄桥"},{"en":"Water may flow over the road ahead","zh":"前方路面可能有水流漫过"},{"en":"Underpass ahead; take care if your vehicle is tall","zh":"前方有下穿通道，车辆较高时要小心"}],"answer_index":0,"explanation_zh":"该标志表示前方是活动桥（开启桥），桥面会升起或旋转，让船只通过。","explanation_en":"The bridge ahead can lift or swing to let boats through.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-47a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"medium"},{"id":"SB-16","group":"SB","section":"signs","topic_zh":"路面状况警告","question_en":"What does this warning sign mean?","question_zh":"这个警告标志是什么意思？","options":[{"en":"Pavement narrows ahead","zh":"前方路面变窄"},{"en":"Bump or uneven pavement ahead","zh":"前方路面有凸起或不平"},{"en":"Paved surface ends ahead","zh":"前方铺装路面结束"},{"en":"Construction zone begins ahead","zh":"前方施工区开始"}],"answer_index":2,"explanation_zh":"该标志表示前方铺装路面到此结束。注意与“路面变窄”“路面凸起或不平”等标志区分。","explanation_en":"It means the paved surface ends ahead.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-48a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"medium"},{"id":"SB-17","group":"SB","section":"signs","topic_zh":"行人与自行车","question_en":"What does this warning sign mean?","question_zh":"这个警告标志是什么意思？","options":[{"en":"Bicycle crossing ahead","zh":"前方有自行车过路处"},{"en":"Bicycles are not allowed on this road","zh":"此路禁止自行车通行"},{"en":"This lane is reserved for bicycles only","zh":"此车道为自行车专用道"},{"en":"Bicycle route; motor vehicles prohibited","zh":"自行车路线，禁止机动车通行"}],"answer_index":0,"explanation_zh":"该警告标志表示前方有自行车过路处，要留意横穿道路的骑车人。它不是禁止或限定自行车通行的标志。","explanation_en":"It warns of a bicycle crossing ahead.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-49a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"easy"},{"id":"SB-18","group":"SB","section":"signs","topic_zh":"前方管制警告","question_en":"What does this warning sign tell you?","question_zh":"这个警告标志告诉你什么？","options":[{"en":"Stop right here at this sign","zh":"在此标志处立即停车"},{"en":"Traffic signals ahead; slow down","zh":"前方有交通信号灯，减速"},{"en":"Stop sign ahead; slow down","zh":"前方有停车标志，减速"},{"en":"Stop only if pedestrians are waiting","zh":"仅在有行人等候时停车"}],"answer_index":2,"explanation_zh":"该警告标志提示前方有停车标志，应提前减速，并在前方的停车标志处停车。","explanation_en":"It warns that a stop sign is ahead, so slow down.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-50a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"easy"},{"id":"SB-19","group":"SB","section":"signs","topic_zh":"双向通行","question_en":"What does this warning sign mean?","question_zh":"这个警告标志是什么意思？","options":[{"en":"Divided highway begins; keep right","zh":"分隔式公路开始，靠右行驶"},{"en":"Share the road with oncoming traffic","zh":"与对向来车共用道路"},{"en":"One-way traffic only ahead","zh":"前方仅限单向通行"},{"en":"Right lane ends; merge left","zh":"右侧车道终止，向左并道"}],"answer_index":1,"explanation_zh":"该标志提醒你前方要与对向来车共用道路，需留意迎面驶来的车辆。","explanation_en":"It means you must share the road with oncoming traffic.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-51a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"medium"},{"id":"SB-20","group":"SB","section":"signs","topic_zh":"行人与自行车","question_en":"What does this sign tell drivers?","question_zh":"这个标志提醒驾驶者什么？ et you in","zh":"继续行驶，左侧车道的驾驶者必须让你并入"},{"en":"Stop at the end of your lane and wait for a gap","zh":"在车道尽头停车等待空档"},{"en":"Merge safely with traffic in the lane to your left","zh":"安全地并入左侧车道的车流"},{"en":"Move onto the right shoulder and keep going","zh":"驶上右侧路肩继续前进"}],"answer_index":2,"explanation_zh":"这是“右侧车道终止”标志。在右侧车道行驶的驾驶者必须安全地并入左侧车道的车流。","explanation_en":"If you are in the right lane, you must merge safely into the lane on your left.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-55a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"medium"},{"id":"SB-25","group":"SB","section":"signs","topic_zh":"前方管制警告","question_en":"What does this warning sign mean?","question_zh":"这个警告标志是什么意思？","options":[{"en":"Traffic lights ahead; slow down","zh":"前方有交通信号灯，减速"},{"en":"Railway crossing with signal lights ahead","zh":"前方有带信号灯的铁路道口"},{"en":"Pedestrian crossover ahead","zh":"前方有行人过街设施（pedestrian crossover）"},{"en":"Construction traffic-control person ahead","zh":"前方有施工交通指挥人员"}],"answer_index":0,"explanation_zh":"该标志提示前方有交通信号灯，应减速。","explanation_en":"It warns of traffic lights ahead; slow down.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-56a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"easy"},{"id":"SB-26","group":"SB","section":"signs","topic_zh":"坡道警告","question_en":"What does this sign warn you about, and what may you need to do?","question_zh":"这个标志警告什么？你可能需要怎么做？","options":[{"en":"Truck entrance ahead; watch for slow trucks","zh":"前方有货车出入口，注意慢行的货车"},{"en":"Steep hill ahead; shift to neutral and coast down","zh":"前方陡坡，挂空挡滑行下坡"},{"en":"Bump in the road ahead; slow down","zh":"前方路面有凸起，减速"},{"en":"Steep hill ahead; you may need to use a lower gear","zh":"前方陡坡，可能需要换用低速挡"}],"answer_index":3,"explanation_zh":"该标志表示前方有陡坡，手册提示可能需要换用较低的挡位。","explanation_en":"A steep hill is ahead; you may need a lower gear.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-57a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"medium"},{"id":"SB-27","group":"SB","section":"signs","topic_zh":"合流","question_en":"What does this warning sign mean?","question_zh":"这个警告标志是什么意思？","options":[{"en":"Two roads going the same way join into one","zh":"两条同向道路合并为一条"},{"en":"A road branches off to the right ahead","zh":"前方右侧有道路分岔"},{"en":"Divided highway ends; two-way traffic ahead","zh":"分隔式公路结束，前方双向通行"},{"en":"Right lane ends; merge into the left lane","zh":"右侧车道终止，并入左侧车道"}],"answer_index":0,"explanation_zh":"该标志表示两条同向行驶的道路即将合并为一条（合流），两条道路上的驾驶者都要确保车流顺畅、安全地合流。","explanation_en":"Two roads going the same way are about to join into one.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-58a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"medium"},{"id":"SB-28","group":"SB","section":"signs","topic_zh":"合流","question_en":"A warning sign shows that two roads going in the same direction are about to join into one. Who is responsible for seeing that traffic merges smoothly and safely?","question_zh":"警告标志显示两条同向道路即将合并为一条。谁有责任确保车流顺畅、安全地合流？","options":[{"en":"Only drivers on the joining road; main-road traffic has the right-of-way","zh":"只有汇入道路上的驾驶者；主路车辆拥有先行权"},{"en":"Only drivers on the main road, who must move over","zh":"只有主路上的驾驶者，他们必须变道让出空间"},{"en":"Drivers on both roads, equally","zh":"两条道路上的驾驶者，责任相同"},{"en":"Whichever driver is travelling faster","zh":"车速较快的那位驾驶者"}],"answer_index":2,"explanation_zh":"在两路合流处，两条道路上的驾驶者对顺畅、安全地合流负有同等责任，并非只由一方负责。","explanation_en":"Drivers on both roads share equal responsibility for a safe merge.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"hard"},{"id":"SB-29","group":"SB","section":"signs","topic_zh":"横穿警告","question_en":"What does this warning sign mean?","question_zh":"这个警告标志是什么意思？","options":[{"en":"Snowplows working ahead","zh":"前方有扫雪车作业"},{"en":"Snowmobiles cross this road","zh":"此处有雪地摩托横穿道路"},{"en":"Road closed to all traffic in winter","zh":"冬季道路封闭，禁止一切车辆通行"},{"en":"Snowmobiles are not allowed on this road","zh":"此路禁止雪地摩托通行"}],"answer_index":1,"explanation_zh":"该标志表示此处有雪地摩托（snowmobile）横穿道路，应注意观察。","explanation_en":"Snowmobiles cross the road here.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-59a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"easy"},{"id":"SB-30","group":"SB","section":"signs","topic_zh":"分隔式公路","question_en":"What does this warning sign mean?","question_zh":"这个警告标志是什么意思？","options":[{"en":"Divided highway begins; each road carries one-way traffic","zh":"分隔式公路开始，每条道路单向通行"},{"en":"Two roads going the same way join into one","zh":"两条同向道路合并为一条"},{"en":"Pavement narrows; single-lane bridge ahead","zh":"路面变窄，前方为单车道桥"},{"en":"Divided highway ends; both directions share one road","zh":"分隔式公路结束，双向车流共用同一道路"}],"answer_index":3,"explanation_zh":"该标志表示分隔式公路结束：前方两个方向的车流在同一条道路上行驶，应靠右侧行驶。","explanation_en":"The divided highway ends; two-way traffic shares one road, so keep right.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-60a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案（见官方图片）。","difficulty":"medium"},{"id":"SB-31","group":"SB","section":"signs","topic_zh":"净空警告","question_en":"What does this warning sign tell you?","question_zh":"这个警告标志告诉你什么？","options":[{"en":"Bridge ahead; it shows the maximum weight allowed","zh":"前方桥梁，标示最大允许重量"},{"en":"Underpass ahead; it shows how much overhead room there is","zh":"前方下穿通道，标示可通行的净空高度"},{"en":"Tunnel ahead; it shows the minimum speed allowed","zh":"前方隧道，标示最低车速"},{"en":"Steep hill ahead; it shows how steep the slope is","zh":"前方陡坡，标示坡度"}],"answer_index":1,"explanation_zh":"该标志提示前方有下穿通道（underpass），并标出可用的空间（净空高度）；驾驶高大车辆时要格外小心。","explanation_en":"It warns of an underpass and shows how much room there is for tall vehicles.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-61a.jpg","sign_desc_en":"Yellow diamond-shaped warning sign with a symbol and a measurement (see official image).","sign_desc_zh":"黄色菱形警告标志，带图案和数值（见官方图片）。","difficulty":"medium"},{"id":"SB-32","group":"SB","section":"signs","topic_zh":"路面状况警告","question_en":"What does this warning sign mean?","question_zh":"这个警告标志是什么意思？","options":[{"en":"Steep hill ahead; use a lower gear","zh":"前方陡坡，换用低速挡"},{"en":"Paved surface ends ahead","zh":"前方铺装路面结束"},{"en":"Bump or uneven pavement ahead; slow down","zh":"前方路面有凸起或不平，减速"},{"en":"Fallen rock zone ahead","zh":"前方落石区"}],"answer_index":2,"explanation_zh":"该标志表示前方路面有凸起或不平，应减速并控制好车辆。","explanation_en":"There is a bump or uneven pavement ahead; slow down and keep control.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-62a.jpg","sign_desc_en":"Yellow diamond-shaped warning 上，货车图案显示在左侧。这表示什么？","options":[{"en":"Trucks must pass other vehicles on the left","zh":"货车必须从左侧超车"},{"en":"Trucks are entering from both sides of the road","zh":"货车会从道路两侧驶入"},{"en":"Only trucks may turn left at this point","zh":"此处只允许货车左转"},{"en":"The truck entrance is on the left side of the road","zh":"货车出入口在道路左侧"}],"answer_index":3,"explanation_zh":"货车出入口标志上的货车图案在哪一侧，出入口就在道路的哪一侧；图案在左侧，表示出入口在道路左侧。","explanation_en":"The truck's position on the sign shows which side of the road the entrance is on.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"","sign_desc_en":"","sign_desc_zh":"","difficulty":"medium"},{"id":"SB-38","group":"SB","section":"signs","topic_zh":"最高安全车速","question_en":"What does this sign show?","question_zh":"这个标志表示什么？","options":[{"en":"The minimum speed on the freeway you are joining","zh":"你将驶入的高速公路的最低车速"},{"en":"The maximum safe speed on the ramp","zh":"匝道上的最高安全车速"},{"en":"The speed limit on the next highway","zh":"下一条公路的限速"},{"en":"The distance to the next exit ramp","zh":"距下一个出口匝道的距离"}],"answer_index":1,"explanation_zh":"该标志显示在匝道上行驶的最高安全车速。","explanation_en":"It shows the maximum safe speed on the ramp.","source_url":"https://www.ontario.ca/document/official-mto-drivers-handbook/signs","source_title":"MTO 手册 · Signs","image_url":"https://files.ontario.ca/3-1-67a.jpg","sign_desc_en":"Yellow warning sign that includes a number (see official image).","sign_desc_zh":"带有数字的黄色警告标志（见官方图片）。","difficulty":"medium"},{"id":"SB-39","group":"SB","section":"signs","topic_zh":"行人与自行车","question_en":"What does this warning sign mean?","question_zh":"这个警告标志是什么意思？","options":[{"en":"Pedestrians are not allowed to walk on this road","zh":"此路禁止行人通行"},{"en":"Pedestrian-only street ahead; vehicles must turn off","zh":"前方为步行街，车辆必须驶离"},{"en":"Watch for pedestrians; be ready to share the road with them","zh":"注意行人，准备与行人共用道路"},{"en":"School zone ahead; a reduced speed limit applies","zh":"
